<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0f0e">
<title>街拍快处理 · 拍照即美化</title>
<script src="camera_assets/selfie_segmentation.js"></script>
<style>
:root{
  --bg:#0c0f0e; --panel:#161b19; --panel2:#1e2622; --line:#2c3a33;
  --txt:#d8e2dc; --dim:#8fa39a; --gold:#d4af37; --accent:#7fc99a; --danger:#e07a5f;
  --glass:rgba(12,15,14,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:active{opacity:.75}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---------- 取景页 ---------- */
#vf{background:#000}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  border:1.5px solid rgba(255,255,255,.5);pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.15)}
#guide::before,#guide::after{content:"";position:absolute;width:20px;height:20px;border:2.5px solid var(--gold)}
#guide::before{left:-2px;top:-2px;border-right:none;border-bottom:none}
#guide::after{right:-2px;bottom:-2px;border-left:none;border-top:none}
/* 九宫格构图线 */
#grid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;display:none;
  border-left:1px solid rgba(255,255,255,.22);border-right:1px solid rgba(255,255,255,.22)}
#grid::before{content:"";position:absolute;left:0;right:0;top:33.33%;border-top:1px solid rgba(255,255,255,.22)}
#grid::after{content:"";position:absolute;left:0;right:0;top:66.66%;border-top:1px solid rgba(255,255,255,.22)}
#grid.on{display:block}
/* 水平仪胶囊 */
#level{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);
  font-size:11px;color:var(--txt);background:var(--glass);backdrop-filter:blur(8px);
  border:1px solid var(--line);padding:3px 12px;border-radius:12px;z-index:6;display:none;letter-spacing:.5px}
#level.ok{color:var(--accent);border-color:rgba(127,201,154,.5)}
/* 白闪 */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9;transition:opacity .1s}
#flash.go{opacity:.85;transition:none}

#vfTop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;padding:8px 12px;z-index:5;gap:8px}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:18px}
.pill{padding:6px 13px;font-size:12px;color:var(--txt);white-space:nowrap}
#topRight{display:flex;gap:8px;align-items:center}
.iconBtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--dim)}
.iconBtn.on{color:var(--gold)}
#vfMsg{position:absolute;top:18%;left:0;right:0;text-align:center;font-size:14px;color:var(--dim);z-index:5;
  padding:0 32px;text-shadow:0 1px 4px #000;line-height:1.7}

#vfBottom{position:absolute;bottom:0;left:0;right:0;z-index:5;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  background:linear-gradient(to top,rgba(0,0,0,.78) 30%,transparent)}
.segRow{display:flex;justify-content:center;gap:0;margin:2px 0 8px}
.seg{font-size:13px;color:var(--dim);padding:6px 20px;background:var(--glass);backdrop-filter:blur(8px);
  border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.seg:first-child{border-radius:18px 0 0 18px;border-right:none}
.seg:last-child{border-radius:0 18px 18px 0}
.seg.on{color:var(--gold);border-color:var(--gold);background:rgba(212,175,55,.12)}
.segRow.ratio{margin-bottom:12px}
.segRow.ratio .seg{font-size:12px;padding:4px 14px}
.shutterRow{display:flex;align-items:center;justify-content:center;gap:34px;padding:2px 0 8px}
#thumbBtn{width:50px;height:50px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim)}
#thumbBtn img{width:100%;height:100%;object-fit:cover;display:none}
#thumbBtn.has img{display:block}
#shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#fff;
  box-shadow:0 0 0 4px rgba(255,255,255,.18),0 4px 18px rgba(0,0,0,.4);transition:transform .08s}
#shutter:active{transform:scale(.9);background:var(--gold)}
#flipBtn{width:46px;height:46px;border-radius:50%;background:var(--glass);backdrop-filter:blur(8px);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--txt)}
.toolRow{display:flex;gap:10px;justify-content:center;margin-bottom:6px}
.tool{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt);
  background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:8px 16px}
.hint{font-size:11px;color:#77807b;text-align:center;line-height:1.5}

/* ---------- 处理页 ---------- */
#proc{background:var(--bg);justify-content:center;align-items:center;gap:18px}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--panel2);border-top-color:var(--accent);
  animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#procTxt{color:var(--dim);font-size:14px;text-align:center;padding:0 28px;line-height:1.7}

/* ---------- 成片页 ---------- */
#resTop{padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;display:flex;justify-content:space-between;align-items:center}
#resTop .t{font-size:15px;font-weight:600}
#resCanvasWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 12px;position:relative}
#resCanvasWrap canvas{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.5)}
#resTip{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);
  background:rgba(12,15,14,.6);padding:3px 10px;border-radius:10px;white-space:nowrap}
#ctrl{padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 12px);background:rgba(22,27,25,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.presets{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.pBtn{flex:0 0 auto;font-size:13px;color:var(--dim);border:1px solid var(--line);border-radius:16px;padding:5px 13px;background:var(--panel2)}
.pBtn.on{color:var(--gold);border-color:var(--gold);font-weight:600}
#sliders{max-height:0;overflow:hidden;transition:max-height .25s}
#sliders.open{max-height:400px}
.srow{display:flex;align-items:center;gap:10px;padding:3px 0}
.srow.off{opacity:.35;pointer-events:none}
.srow label{font-size:12px;color:var(--dim);width:58px;flex:0 0 auto}
.srow input[type=range]{flex:1;accent-color:var(--accent);height:22px}
.srow .v{font-size:11px;color:var(--dim);width:30px;text-align:right}
#sliderToggle{width:100%;text-align:center;font-size:12px;color:var(--dim);padding:4px 0}
.actRow{display:flex;gap:10px;margin-top:6px}
.act{flex:1;padding:12px 0;border-radius:12px;font-size:15px;font-weight:600;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:7px}
.act.ghost{border:1px solid var(--line);color:var(--txt);background:var(--panel2)}
.act.gold{background:var(--gold);color:#1a1608}
#cmpBtn:active{background:var(--gold);color:#1a1608}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);
  background:rgba(12,15,14,.92);border:1px solid var(--line);color:var(--txt);font-size:13px;
  padding:8px 16px;border-radius:20px;z-index:99;display:none;max-width:82vw;text-align:center;line-height:1.6}
</style>
</head>
<body>

<!-- 取景 -->
<div class="screen on" id="vf">
  <video id="cam" autoplay playsinline muted></video>
  <div id="guide"></div>
  <div id="grid"></div>
  <div id="level"></div>
  <div id="flash"></div>
  <div id="vfTop">
    <div class="pill glass" id="resPill">准备中…</div>
    <div id="topRight">
      <button class="iconBtn glass" id="gridBtn" title="构图网格">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M9.3 4v16M14.6 4v16M4 9.3h16M4 14.6h16"/></svg>
      </button>
      <div class="pill glass" id="segPill">引擎 · 待机</div>
    </div>
  </div>
  <div id="vfMsg">正在启动相机…<br>若手机弹窗询问相机权限，请点"允许"</div>
  <div id="vfBottom">
    <div class="segRow">
      <button class="seg" id="modePhoto">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>照片
      </button>
      <button class="seg on" id="modePortrait">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>人像
      </button>
    </div>
    <div class="segRow ratio">
      <button class="seg on" data-r="4:3">4:3</button>
      <button class="seg" data-r="16:9">16:9</button>
      <button class="seg" data-r="1:1">1:1</button>
      <button class="seg" data-r="full">全幅</button>
    </div>
    <div class="shutterRow">
      <button id="thumbBtn" title="回看成片"><img alt=""><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l4.5-4.5L11 14l3.5-3.5L21 16"/></svg></button>
      <button id="shutter" aria-label="快门"></button>
      <button id="flipBtn" title="翻转摄像头">
        <svg class="ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3"/><path d="M4 4v4h4M20 20v-4h-4"/></svg>
      </button>
    </div>
    <div class="toolRow">
      <button class="tool" id="sysBtn">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>系统相机
      </button>
      <button class="tool" id="galBtn">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l4.5-4.5L11 14l3.5-3.5L21 16"/><circle cx="15.5" cy="9.5" r="1.3"/></svg>相册导入
      </button>
    </div>
    <div class="hint">人像模式：AI虚化背景 · 照片模式：仅调色保细节</div>
  </div>
</div>

<!-- 处理中 -->
<div class="screen" id="proc">
  <div class="spinner"></div>
  <div id="procTxt">AI 正在识别人像…</div>
</div>

<!-- 成片 -->
<div class="screen" id="res">
  <div id="resTop">
    <div class="t">成片预览</div>
    <div class="pill glass" id="resSize"></div>
  </div>
  <div id="resCanvasWrap">
    <canvas id="resCanvas"></canvas>
    <div id="resTip">按住下方「对比」看原图</div>
  </div>
  <div id="ctrl">
    <div class="presets" id="presets"></div>
    <button id="sliderToggle">▾ 微调参数（虚化 / 压暗 / 色调）</button>
    <div id="sliders"></div>
    <div class="actRow">
      <button class="act ghost" id="cmpBtn">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/></svg>对比
      </button>
      <button class="act ghost" id="retakeBtn">
        <svg class="ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3"/><path d="M4 4v4h4M20 20v-4h-4"/></svg>重拍
      </button>
      <button class="act gold" id="dlBtn">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11.5L12 16l4.5-4.5M4 19h16"/></svg>下载
      </button>
    </div>
    <div class="hint">照片全程在本机处理，不上传任何服务器</div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="sysInput" accept="image/*" capture="environment" hidden>
<input type="file" id="galInput" accept="image/*" hidden>

<script>
"use strict";
/* ================= 状态 ================= */
const $ = id => document.getElementById(id);
const P = { blur:10, dark:0, bright:100, contrast:100, satur:100, temp:0, vig:0 };
let curMode = "portrait";               // portrait=人像(分割虚化) / photo=照片(仅调色)
const RATIO = {"4:3":4/3,"16:9":16/9,"1:1":1,"full":0};
let curRatio = 4/3;
let base = null, maskAlpha = null, lastThumb = null;
let camStream = null, facing = "environment";
let segBusy = false;

/* ================= toast ================= */
let toastTimer = null;
function toast(msg, ms=2400){
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.style.display="none", ms);
}

/* ================= 工具 ================= */
function mkCanvas(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; }
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $(id).classList.add("on");
}

/* ================= 相机 ================= */
async function startCamera(){
  stopCamera();
  $("vfMsg").style.display = "block";
  $("vfMsg").innerHTML = "正在启动相机…<br>若手机弹窗询问相机权限，请点\"允许\"";
  try{
    camStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:facing }, width:{ideal:3840}, height:{ideal:2160} },
      audio:false
    });
    const v = $("cam");
    v.srcObject = camStream;
    await v.play();
    $("vfMsg").style.display = "none";
    $("resPill").textContent = v.videoWidth + "×" + v.videoHeight;
    placeGuide();
    startLevel();
  }catch(e){
    $("vfMsg").innerHTML = "相机启动失败（"+e.name+"）<br>" +
      "① 检查是否通过 https:// 打开本页<br>② 检查浏览器相机权限<br>" +
      "③ 也可点「系统相机」按钮绕过";
  }
}
function stopCamera(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
}
function placeGuide(){
  const vw = innerWidth, vh = innerHeight;
  const topSafe = 52, bottomSafe = 218;     // 顶栏与底部控制区高度，取景区避开
  const availH = vh - topSafe - bottomSafe;
  let w, h;
  if(curRatio === 0){ w = vw; h = availH; }
  else if(vw/availH > curRatio){ h = availH; w = h*curRatio; }
  else { w = vw; h = w/curRatio; }
  w = Math.min(w, vw-20); h = Math.min(h, availH-10);
  const g = $("guide"), gr = $("grid");
  for(const el of [g, gr]){
    el.style.width = w+"px"; el.style.height = h+"px";
    el.style.top = (topSafe + availH/2) + "px";
  }
}
addEventListener("resize", placeGuide);
document.querySelectorAll(".ratio .seg").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".ratio .seg").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    curRatio = RATIO[b.dataset.r];
    placeGuide();
  };
});

/* 模式切换 */
$("modePhoto").onclick = ()=>setMode("photo");
$("modePortrait").onclick = ()=>setMode("portrait");
function setMode(m){
  curMode = m;
  $("modePhoto").classList.toggle("on", m==="photo");
  $("modePortrait").classList.toggle("on", m==="portrait");
  $("sliders").querySelector("input[data-k='blur']").closest(".srow").classList.toggle("off", m==="photo");
}

/* 构图网格 */
$("gridBtn").onclick = ()=>{
  const g = $("grid");
  g.classList.toggle("on");
  $("gridBtn").classList.toggle("on", g.classList.contains("on"));
};

/* 水平仪（尽力而为：拿不到传感器数据自动隐藏） */
let levelOn = false;
function startLevel(){
  if(levelOn) return;
  levelOn = true;
  addEventListener("deviceorientation", e=>{
    const el = $("level");
    if(e.gamma === null || e.beta === null){ el.style.display="none"; return; }
    el.style.display = "block";
    const tilt = Math.round(e.gamma*10)/10;
    if(Math.abs(tilt) <= 1.2){
      el.classList.add("ok");
      el.textContent = "水平 ✓";
    }else{
      el.classList.remove("ok");
      el.textContent = (tilt>0?"右倾 ":"左倾 ") + Math.abs(tilt).toFixed(1) + "°";
    }
  });
}

/* 快门音（WebAudio 模拟咔哒，首次拍照时创建） */
let audioCtx = null;
function shutterSound(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    [[880,t0,.03],[620,t0+.05,.04]].forEach(([f,t,d])=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type="square"; o.frequency.value=f;
      g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t+d+.01);
    });
  }catch(e){}
}
function shutterFlash(){
  const f = $("flash");
  f.classList.add("go");
  setTimeout(()=>f.classList.remove("go"), 130);
}

/* 快门：按成片框比例从视频帧中央裁剪 */
$("shutter").onclick = ()=>{
  const v = $("cam");
  if(!camStream || !v.videoWidth){ toast("相机还没就绪，稍等一下"); return; }
  shutterFlash(); shutterSound();
  const vw = v.videoWidth, vh = v.videoHeight;
  const gw = parseFloat($("guide").style.width), gh = parseFloat($("guide").style.height);
  let cw, ch;
  const gRatio = gw/gh;
  if(vw/vh > gRatio){ ch = vh; cw = ch*gRatio; } else { cw = vw; ch = cw/gRatio; }
  const sx=(vw-cw)/2, sy=(vh-ch)/2;
  const c = mkCanvas(Math.round(cw), Math.round(ch));
  c.getContext("2d").drawImage(v, sx, sy, cw, ch, 0, 0, c.width, c.height);
  handleSource(c);
};

/* 系统相机 / 相册导入 / 缩略图回看 */
$("sysBtn").onclick = ()=> $("sysInput").click();
$("galBtn").onclick = ()=> $("galInput").click();
$("sysInput").onchange = e => { readFile(e.target.files[0]); e.target.value = ""; };
$("galInput").onchange = e => { readFile(e.target.files[0]); e.target.value = ""; };
function readFile(file){
  if(!file) return;
  const img = new Image();
  img.onload = ()=>{
    const c = mkCanvas(img.naturalWidth, img.naturalHeight);
    c.getContext("2d").drawImage(img, 0, 0);
    URL.revokeObjectURL(img.src);
    handleSource(c);
  };
  img.onerror = ()=> toast("这张图读不出来，换一张试试");
  img.src = URL.createObjectURL(file);
}
$("thumbBtn").onclick = ()=>{ if(base) show("res"); };

/* ================= 人像分割（MediaPipe，本地模型） =================
   模型加载源自动探测：jsdelivr镜像(国内快) → 站内同源(兜底) */
const CDN_CANDIDATES = [
  "https://gcore.jsdelivr.net/gh/gzgouyongqiang/hxbnx@main/camera_assets/",
  "https://cdn.jsdelivr.net/gh/gzgouyongqiang/hxbnx@main/camera_assets/",
  "https://testingcf.jsdelivr.net/gh/gzgouyongqiang/hxbnx@main/camera_assets/",
  "camera_assets/"
];
let cdnBase = "camera_assets/";
(async function pickCdn(){
  for(const c of CDN_CANDIDATES){
    const ok = await Promise.race([
      fetch(c + "selfie_segmentation.binarypb", {cache:"no-store"}).then(r=>r.ok),
      new Promise(res=>setTimeout(()=>res(false), 2500))
    ]).catch(()=>false);
    if(ok){ cdnBase = c; $("segPill").textContent = "引擎 · 就绪"; return; }
  }
  $("segPill").textContent = "引擎 · 就绪(站内)";
})();
const segmenter = new SelfieSegmentation({ locateFile: f => cdnBase + f });
segmenter.setOptions({ modelSelection: 0 });

async function runSegment(srcCanvas){
  if(segBusy) return null;
  segBusy = true;
  $("segPill").textContent = "识别 · 处理中";
  return new Promise(resolve=>{
    segmenter.onResults(res=>{
      segBusy = false;
      $("segPill").textContent = "引擎 · 就绪";
      resolve(res.segmentationMask);
    });
    segmenter.send({ image: srcCanvas }).catch(()=>{
      segBusy = false;
      $("segPill").textContent = "识别 · 失败";
      resolve(null);
    });
  });
}

/* mask 灰度 → alpha（缩小尺寸+羽化）；返回人像占比用于降级判断 */
function buildMaskAlpha(grayMask, W, H){
  const LONG = 720;
  const scale = Math.min(1, LONG/Math.max(W,H));
  const mw = Math.max(1, Math.round(W*scale)), mh = Math.max(1, Math.round(H*scale));
  const small = mkCanvas(mw, mh);
  const sc = small.getContext("2d");
  sc.filter = "blur(1.5px)";
  sc.drawImage(grayMask, 0, 0, mw, mh);
  sc.filter = "none";
  const d = sc.getImageData(0,0,mw,mh);
  const a = d.data;
  let hit = 0, total = mw*mh;
  for(let i=0;i<a.length;i+=4){
    a[i+3] = a[i];
    if(a[i] > 128) hit++;
  }
  sc.putImageData(d,0,0);
  return { canvas: small, ratio: hit/total };
}

/* ================= 色调滤镜串 ================= */
function filterStr(){
  return "brightness("+(P.bright/100)+") contrast("+(P.contrast/100)+") saturate("+(P.satur/100)+")";
}

/* ================= 合成管线 ================= */
let composeTimer = null;
function scheduleCompose(){ clearTimeout(composeTimer); composeTimer = setTimeout(compose, 60); }

function compose(){
  if(!base) return;
  const W = base.width, H = base.height;

  const adj = mkCanvas(W,H), ac = adj.getContext("2d");
  ac.filter = filterStr();
  ac.drawImage(base,0,0);
  ac.filter = "none";
  if(P.temp !== 0){
    const k = Math.min(0.22, Math.abs(P.temp)/500);
    ac.globalCompositeOperation = "soft-light";
    ac.fillStyle = P.temp>0 ? "rgba(255,176,88,1)" : "rgba(88,150,255,1)";
    ac.globalAlpha = k;
    ac.fillRect(0,0,W,H);
    ac.globalAlpha = 1;
    ac.globalCompositeOperation = "source-over";
  }
  if(P.vig > 0){
    const g = ac.createRadialGradient(W/2,H/2, Math.min(W,H)*0.45, W/2,H/2, Math.hypot(W,H)/2);
    g.addColorStop(0,"rgba(0,0,0,0)");
    g.addColorStop(1,"rgba(0,0,0,"+(P.vig/100)+")");
    ac.fillStyle = g; ac.fillRect(0,0,W,H);
  }

  const fin = mkCanvas(W,H), fc = fin.getContext("2d");
  if(maskAlpha && curMode === "portrait"){
    const bg = mkCanvas(W,H), bc = bg.getContext("2d");
    if(P.blur > 0) bc.filter = "blur(" + P.blur + "px)";
    bc.drawImage(adj,0,0);
    bc.filter = "none";
    if(P.dark > 0){
      bc.fillStyle = "rgba(0,0,0,"+(P.dark/100)+")";
      bc.fillRect(0,0,W,H);
    }
    fc.drawImage(bg,0,0);
    const fg = mkCanvas(W,H), gc = fg.getContext("2d");
    gc.drawImage(adj,0,0);
    gc.globalCompositeOperation = "destination-in";
    gc.imageSmoothingQuality = "high";
    gc.drawImage(maskAlpha.canvas, 0, 0, W, H);
    fc.drawImage(fg,0,0);
  }else{
    fc.drawImage(adj,0,0);
  }

  const rc = $("resCanvas");
  rc.width = W; rc.height = H;
  rc.getContext("2d").drawImage(fin,0,0);
  $("resSize").textContent = W+"×"+H;
  try{
    const t = mkCanvas(72, 72*Math.min(1,H/W));
    t.getContext("2d").drawImage(rc, 0, 0, t.width, t.height);
    lastThumb = t.toDataURL("image/jpeg", .6);
    const tb = $("thumbBtn");
    tb.classList.add("has");
    tb.querySelector("img").src = lastThumb;
  }catch(e){}
}

/* ================= 主流程 ================= */
async function handleSource(srcCanvas){
  stopCamera();
  base = srcCanvas;
  maskAlpha = null;
  show("proc");
  if(curMode === "portrait"){
    $("procTxt").textContent = "AI 正在识别人像…（首次约需下载6MB推理引擎，请稍候）";
    const gray = await runSegment(srcCanvas);
    if(gray){
      const m = buildMaskAlpha(gray, base.width, base.height);
      if(m.ratio >= 0.05){
        maskAlpha = m.canvas;
      }else{
        toast("未检测到明显人像，已按「照片模式」处理（仅调色）");
      }
    }else{
      toast("人像识别失败，已按「照片模式」处理（仅调色）");
    }
  }else{
    $("procTxt").textContent = "正在处理…";
    await new Promise(r=>setTimeout(r,300));
  }
  show("res");
  compose();
}

/* ================= 成片页交互 ================= */
$("cmpBtn").addEventListener("pointerdown", ()=>{
  const rc = $("resCanvas");
  rc.getContext("2d").drawImage(base,0,0);
  $("resTip").textContent = "原图";
});
$("cmpBtn").addEventListener("pointerup", ()=>{ compose(); $("resTip").textContent = "按住「对比」看原图"; });

$("retakeBtn").onclick = ()=>{ show("vf"); startCamera(); };
$("dlBtn").onclick = ()=>{
  $("resCanvas").toBlob(b=>{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    const d = new Date(), p = n => String(n).padStart(2,"0");
    a.download = "IMG_" + d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()) + ".jpg";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    toast("已开始下载（在通知栏/下载列表查看）");
  }, "image/jpeg", 0.95);
};

/* 预设 */
const PRESETS = {
  "原图":  { blur:0, dark:0, bright:100, contrast:100, satur:100, temp:0, vig:0 },
  "清爽":  { blur:10, dark:8, bright:101, contrast:108, satur:88,  temp:-8, vig:0 },
  "通亮":  { blur:10, dark:5, bright:106, contrast:105, satur:108, temp:0,  vig:0 },
  "暖阳":  { blur:10, dark:6, bright:104, contrast:106, satur:106, temp:14, vig:0 },
  "胶片":  { blur:12, dark:10, bright:105, contrast:95,  satur:86, temp:8,  vig:18 }
};
const presetsBox = $("presets");
Object.keys(PRESETS).forEach(name=>{
  const b = document.createElement("button");
  b.className = "pBtn" + (name==="清爽" ? " on" : "");
  b.textContent = name;
  b.onclick = ()=>{
    Object.assign(P, PRESETS[name]);
    Object.keys(PRESETS[name]).forEach(k => syncSlider(k));
    presetsBox.querySelectorAll(".pBtn").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    scheduleCompose();
  };
  presetsBox.appendChild(b);
});

/* 滑块 */
const SLIDERS = [
  { k:"blur",    label:"虚化",   min:0,  max:24,  step:1 },
  { k:"dark",    label:"压暗",   min:0,  max:60,  step:1 },
  { k:"bright",  label:"亮度",   min:70, max:130, step:1 },
  { k:"contrast",label:"对比",   min:70, max:140, step:1 },
  { k:"satur",   label:"饱和",   min:0,  max:180, step:1 },
  { k:"temp",    label:"冷暖",   min:-100,max:100, step:1 },
  { k:"vig",     label:"晕影",   min:0,  max:60,  step:1 }
];
const slidersBox = $("sliders");
SLIDERS.forEach(s=>{
  const row = document.createElement("div");
  row.className = "srow";
  row.innerHTML = "<label>"+s.label+"</label>" +
    "<input type='range' min='"+s.min+"' max='"+s.max+"' step='"+s.step+"' data-k='"+s.k+"'>" +
    "<span class='v'></span>";
  const inp = row.querySelector("input");
  inp.addEventListener("input", ()=>{
    P[s.k] = parseFloat(inp.value);
    row.querySelector(".v").textContent = inp.value;
    presetsBox.querySelectorAll(".pBtn").forEach(x=>x.classList.remove("on"));
    scheduleCompose();
  });
  slidersBox.appendChild(row);
});
function syncSlider(k){
  const inp = slidersBox.querySelector("input[data-k='"+k+"']");
  if(inp){ inp.value = P[k]; inp.closest(".srow").querySelector(".v").textContent = P[k]; }
}
Object.keys(P).forEach(syncSlider);
setMode("portrait");

$("sliderToggle").onclick = ()=>{
  const s = $("sliders");
  s.classList.toggle("open");
  $("sliderToggle").textContent = s.classList.contains("open") ? "▴ 收起参数" : "▾ 微调参数（虚化 / 压暗 / 色调）";
};

/* ================= 启动 ================= */
if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
  $("vfMsg").innerHTML = "此浏览器不支持相机调用<br>请换 Chrome/Edge 等现代浏览器，并用 https:// 打开";
}else{
  startCamera();
}
addEventListener("beforeunload", stopCamera);
</script>

<title>配比法庭 | 条漫屋</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f0e8d5;
    color:#2C2C2A;
    padding:16px 12px 40px;
  }
  .wrap { max-width:720px; margin:0 auto; }
  .top-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .top-nav a {
    color:#633806; text-decoration:none; font-size:14px;
    background:#FAEEDA; border:2px solid #633806; border-radius:10px; padding:6px 14px;
  }
  .top-nav a:active { background:#e8d48f; }
  .paper {
    background:#fdf9f0; border:2px solid #2C2C2A; border-radius:16px;
    padding:10px 6px; box-shadow:6px 6px 0 rgba(44,44,42,0.15);
  }
  .paper svg { width:100%; height:auto; display:block; }
  .foot-nav { display:flex; gap:10px; margin-top:16px; }
  .foot-nav a {
    flex:1; text-align:center; text-decoration:none; color:#633806;
    background:#FAEEDA; border:2px solid #633806; border-radius:12px; padding:10px;
    font-size:14px; font-weight:500;
  }
  .tag { font-size:12px; color:#854F0B; background:#FAEEDA; border:1px solid #854F0B;
    border-radius:10px; padding:3px 10px; }
</style>

<body>
<div class="wrap">
  <div class="top-nav">
    <a href="comics.html">← 条漫屋</a>
    <span class="tag">钠及其化合物 · 钠盐</span>

  </div>

  <div class="paper">
<svg viewBox="0 0 680 1160" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>配比法庭</title>
  <desc>NaOH与CO2反应产物由配比决定的趣味条漫</desc>
  <style>
    text { font-family: "PingFang SC","Microsoft YaHei",sans-serif; fill:#2C2C2A; }
    .bd { stroke:#2C2C2A; stroke-width:2; }
    .bub { fill:#FFFFFF; stroke:#2C2C2A; stroke-width:1.5; }
    .say { font-size:14px; }
    .note { font-size:12px; fill:#633806; }
    .ttl { font-size:18px; font-weight:500; }
  </style>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#712B13" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="340" y="52" text-anchor="middle" class="ttl" font-weight="600">配比法庭：这家公司到底叫啥名？</text>
  <text x="340" y="76" text-anchor="middle" font-size="12" fill="#854F0B">原告：碳酸钠 · 被告：碳酸氢钠 · 真相只有一个……比例</text>

  <!-- P1 法庭开庭 -->
  <g>
    <rect x="40" y="96" width="600" height="200" rx="12" fill="#FAC775" class="bd"/>
    <!-- 法官桌 -->
    <rect x="270" y="146" width="140" height="70" rx="8" fill="#8A5A2B" stroke="#2C2C2A" stroke-width="2"/>
    <rect x="300" y="118" width="80" height="34" rx="8" fill="#F1EFE8" stroke="#2C2C2A" stroke-width="2"/>
    <text x="340" y="141" text-anchor="middle" font-size="12" fill="#712B13">⚖ 配比法庭</text>
    <!-- 法官烧杯 -->
    <path d="M318 168 L318 206 A22 22 0 0 0 362 206 L362 168 Z" fill="#DDEFF7" stroke="#2C2C2A" stroke-width="2"/>
    <path d="M320 192 L360 192 L360 204 A20 20 0 0 1 320 204 Z" fill="#85B7EB"/>
    <circle cx="332" cy="184" r="3" fill="#F1EFE8" stroke="#888780"/>
    <circle cx="348" cy="178" r="3" fill="#F1EFE8" stroke="#888780"/>
    <!-- 原告Na2CO3 -->
    <circle cx="130" cy="190" r="34" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/>
    <circle cx="118" cy="184" r="3.5" fill="#2C2C2A"/>
    <circle cx="142" cy="184" r="3.5" fill="#2C2C2A"/>
    <path d="M118 202 Q130 210 142 202" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="96" y="150" width="68" height="18" rx="9" fill="#534AB7"/>
    <text x="130" y="163" text-anchor="middle" font-size="11" fill="#FFFFFF">Na₂CO₃</text>
    <!-- 被告NaHCO3 -->
    <circle cx="552" cy="190" r="30" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/>
    <circle cx="541" cy="185" r="3.5" fill="#2C2C2A"/>
    <circle cx="563" cy="185" r="3.5" fill="#2C2C2A"/>
    <path d="M541 201 Q552 207 563 201" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="512" y="128" width="80" height="18" rx="9" fill="#2F7D5B"/>
    <text x="552" y="141" text-anchor="middle" font-size="11" fill="#FFFFFF">NaHCO₃</text>
    <!-- 气泡 -->
    <rect x="82" y="232" width="150" height="40" rx="14" class="bub"/>
    <path d="M110 272 L98 288 L136 272 Z" class="bub"/>
    <text x="94" y="249" font-size="13" font-weight="500">我是正经产物！</text>
    <rect x="452" y="232" width="150" height="40" rx="14" class="bub"/>
    <path d="M502 272 L490 288 L528 272 Z" class="bub"/>
    <text x="464" y="249" font-size="13" font-weight="500">明明我才是！</text>
    <rect x="60" y="252" width="180" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="150" y="269" text-anchor="middle" class="note">同两个原料，凭啥产物不同？</text>
  </g>

  <!-- P2 NaOH管够 → Na2CO3 -->
  <g>
    <rect x="40" y="308" width="600" height="200" rx="12" fill="#E1F5EE" class="bd"/>
    <text x="70" y="336" font-size="13" font-weight="500" fill="#2F5D46">案情一：NaOH 大部队管够，CO₂ 只来 1 个</text>
    <!-- NaOH大军 -->
    <circle cx="150" cy="400" r="24" fill="#534AB7"/>
    <circle cx="142" cy="396" r="3" fill="#FFFFFF"/>
    <circle cx="158" cy="396" r="3" fill="#FFFFFF"/>
    <path d="M143 408 Q150 413 157 408" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="196" cy="404" r="20" fill="#534AB7"/>
    <circle cx="190" cy="401" r="2.5" fill="#FFFFFF"/>
    <circle cx="202" cy="401" r="2.5" fill="#FFFFFF"/>
    <circle cx="196" cy="411" r="6" fill="#FFFFFF"/>
    <circle cx="232" cy="408" r="17" fill="#534AB7"/>
    <circle cx="227" cy="405" r="2.2" fill="#FFFFFF"/>
    <circle cx="237" cy="405" r="2.2" fill="#FFFFFF"/>
    <circle cx="232" cy="413" r="5" fill="#FFFFFF"/>
    <text x="160" y="360" font-size="12" fill="#534AB7">NaOH人山人海</text>
    <!-- CO2小孤家 -->
    <circle cx="400" cy="404" r="14" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <circle cx="395" cy="402" r="2.2" fill="#0C447C"/>
    <circle cx="405" cy="402" r="2.2" fill="#0C447C"/>
    <path d="M396 410 Q400 407 404 410" fill="none" stroke="#0C447C" stroke-width="1.5" stroke-linecap="round"/>
    <text x="378" y="438" font-size="12" fill="#0C447C">CO₂孤身赴会</text>
    <!-- 被群殴 -->
    <path d="M268 400 Q300 390 342 398" fill="none" stroke="#B33B2E" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aw)"/>
    <path d="M268 414 Q300 424 342 412" fill="none" stroke="#B33B2E" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aw)"/>
    <rect x="440" y="372" width="180" height="52" rx="14" class="bub"/>
    <text x="452" y="392" class="say">俩碱汉架一个，</text>
    <text x="452" y="414" class="say">连H₂O都榨出来了！</text>
    <rect x="430" y="452" width="190" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="525" y="469" text-anchor="middle" class="note">2NaOH+CO₂=Na₂CO₃+H₂O</text>
    <rect x="60" y="440" width="200" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="160" y="457" text-anchor="middle" class="note">碱过量 → 只能生 正盐 Na₂CO₃</text>
  </g>

  <!-- P3 CO2管够 → NaHCO3 -->
  <g>
    <rect x="40" y="520" width="600" height="200" rx="12" fill="#CECBF6" class="bd"/>
    <text x="70" y="548" font-size="13" font-weight="500" fill="#412402">案情二：CO₂ 倾巢出动，NaOH 只有 1 个</text>
    <!-- CO2气泡群 -->
    <circle cx="420" cy="610" r="15" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <circle cx="452" cy="592" r="13" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <circle cx="480" cy="612" r="15" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <circle cx="508" cy="590" r="12" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <circle cx="536" cy="610" r="14" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <circle cx="462" cy="630" r="12" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <circle cx="498" cy="636" r="11" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <text x="440" y="566" font-size="12" fill="#0C447C">CO₂乌泱乌泱</text>
    <!-- NaOH单人 -->
    <circle cx="180" cy="612" r="26" fill="#534AB7"/>
    <circle cx="171" cy="607" r="3" fill="#FFFFFF"/>
    <circle cx="189" cy="607" r="3" fill="#FFFFFF"/>
    <path d="M172 620 Q180 626 188 620" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="146" y="580" font-size="12" fill="#534AB7">NaOH光杆司令</text>
    <!-- 只吃到一半 -->
    <path d="M236 606 Q280 596 330 604" fill="none" stroke="#B33B2E" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aw)"/>
    <rect x="230" y="640" width="190" height="52" rx="14" class="bub"/>
    <text x="242" y="660" class="say">吃到饱？不存在的，</text>
    <text x="242" y="682" class="say">一半H就留在怀里了。</text>
    <rect x="440" y="660" width="180" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="530" y="677" text-anchor="middle" class="note">CO₂过量 → 酸式盐 NaHCO₃</text>
    <rect x="60" y="652" width="160" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="140" y="669" text-anchor="middle" class="note">NaOH+CO₂=NaHCO₃</text>
  </g>

  <!-- P4 彩蛋：Na2CO3还能续吃 -->
  <g>
    <rect x="40" y="732" width="600" height="200" rx="12" fill="#F7C1C1" class="bd"/>
    <text x="70" y="760" font-size="13" font-weight="500" fill="#712B13">彩蛋：Na₂CO₃ 也没吃饱，CO₂+H₂O 还能续</text>
    <!-- Na2CO3 碗 -->
    <path d="M150 828 L154 856 A40 40 0 0 0 226 856 L230 828 Z" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/>
    <rect x="140" y="812" width="100" height="18" rx="9" fill="#534AB7"/>
    <text x="190" y="825" text-anchor="middle" font-size="11" fill="#FFFFFF">Na₂CO₃</text>
    <!-- CO2 + H2O 飞入 -->
    <circle cx="330" cy="800" r="13" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <text x="316" y="780" font-size="11" fill="#0C447C">CO₂</text>
    <circle cx="380" cy="806" r="11" fill="#85B7EB" stroke="#0C447C" stroke-width="2"/>
    <text x="368" y="788" font-size="11" fill="#0C447C">H₂O</text>
    <path d="M348 812 Q330 826 262 834" fill="none" stroke="#B33B2E" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aw)"/>
    <path d="M372 820 Q340 838 262 840" fill="none" stroke="#B33B2E" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aw)"/>
    <rect x="420" y="788" width="200" height="52" rx="14" class="bub"/>
    <text x="432" y="808" class="say">大餐打包走：</text>
    <text x="432" y="830" class="say">全部变NaHCO₃！</text>
    <rect x="150" y="878" width="420" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="360" y="895" text-anchor="middle" class="note">Na₂CO₃+CO₂+H₂O=2NaHCO₃（正盐也能变酸式）</text>
    <text x="360" y="922" text-anchor="middle" font-size="12" fill="#712B13">所以向NaOH里通过量CO₂，最终整锅都是NaHCO₃</text>
  </g>

  <!-- P5 结尾黑底 -->
  <g>
    <rect x="40" y="944" width="600" height="196" rx="12" fill="#2C2C2A"/>
    <text x="340" y="984" text-anchor="middle" font-size="15" style="fill:#e8d48f;" font-weight="600">法庭终审宣判：</text>
    <text x="340" y="1016" text-anchor="middle" font-size="14" style="fill:#e8d48f;">NaOH过量 → Na₂CO₃　|　CO₂过量 → NaHCO₃</text>
    <text x="340" y="1052" text-anchor="middle" font-size="14" style="fill:#9ccb8c;" font-weight="500">口诀：碱多生正盐，气多酸式盐</text>
    <text x="340" y="1086" text-anchor="middle" font-size="12" style="fill:#B8B6AC;">验算神器：通CO₂测NaOH浓度，产物要靠极限法讨论</text>
    <text x="340" y="1116" text-anchor="middle" font-size="11" style="fill:#8A8880;">—— 配比法庭，结案！</text>
  </g>
</svg>
  </div>

</div>

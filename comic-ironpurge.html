  <style>

  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <marker id="eb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <marker id="ec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

  <!-- ============ P1 开场：战地简报 ============ -->
  <rect x="40" y="28" width="600" height="46" rx="23" fill="#3D6B2F"/>
  <text x="340" y="59" text-anchor="middle" font-size="19" font-weight="600" style="fill:#F7C948;">除铁光荣战役 · 战地简报</text>
  <text x="340" y="98" text-anchor="middle" font-size="13" style="fill:#633806;">任务：从 CuSO₄ 溶液里揪出铁杂质——铜，一个都不能少</text>

  <!-- 沙盘（斜切盾形） -->
  <polygon points="70,140 610,140 610,300 70,300" fill="#EAF4E2" stroke="#3D6B2F" stroke-width="2"/>
  <polygon points="70,140 610,140 590,300 90,300" fill="#FFF7E0" stroke="#C9A45C" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- 友军 Cu2+ -->
  <g>
    <rect x="130" y="182" width="50" height="60" rx="9" fill="#7FB3D5" stroke="#2C2C2A" stroke-width="2"/>

  <g>

    <path d="M213 214 Q221 219 229 214" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round"/>
    <text x="221" y="238" text-anchor="middle" font-size="10.5" font-weight="700">Cu²⁺</text>

  <!-- 混入的 Fe2+（戴伪装帽） -->
  <g>
    <rect x="286" y="182" width="50" height="60" rx="9" fill="#B9D8AE" stroke="#2C2C2A" stroke-width="2"/>
    <rect x="300" y="172" width="22" height="12" rx="3" fill="#96BC8A" stroke="#2C2C2A" stroke-width="1.5"/>
    <!-- 伪装帽 -->
    <path d="M288 172 Q311 150 334 172 Z" fill="#5E8C4A" stroke="#2C2C2A" stroke-width="1.5"/>

  </g>
  <g>
    <rect x="352" y="182" width="50" height="60" rx="9" fill="#7FB3D5" stroke="#2C2C2A" stroke-width="2"/>
    <rect x="366" y="172" width="22" height="12" rx="3" fill="#5D93B8" stroke="#2C2C2A" stroke-width="1.5"/>
    <circle cx="367" cy="200" r="2.8" fill="#2C2C2A"/>
    <circle cx="385" cy="200" r="2.8" fill="#2C2C2A"/>
    <path d="M369 214 Q377 219 385 214" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round"/>
    <text x="377" y="238" text-anchor="middle" font-size="10.5" font-weight="700">Cu²⁺</text>
  </g>

  <!-- 放大镜标记卧底 -->
  <circle cx="311" cy="212" r="36" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="470" y="196" font-size="11.5" font-weight="600" style="fill:#C0392B;">混入友军的卧底：</text>
  <text x="470" y="216" font-size="11" style="fill:#633806;">浅绿色，pH≈9.7 才肯</text>
  <text x="470" y="234" font-size="11" style="fill:#633806;">沉淀，比铜还赖皮！</text>
  <text x="470" y="262" font-size="11" style="fill:#4A6BA5;">友军 Cu²⁺：pH≈6.7 就躺平</text>

  <rect x="70" y="322" width="540" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="339" text-anchor="middle" class="note">硬调 pH 到 9.7？那时候铜早沉光了——正面强攻必败，得用计</text>

  <!-- ============ P2 第一回合：硬调pH，全军覆没 ============ -->
  <rect x="40" y="374" width="210" height="28" rx="14" fill="#C0392B"/>
  <text x="145" y="393" text-anchor="middle" font-size="13" font-weight="600" style="fill:#FFFFFF;">第一回合 · 硬调pH（惨败）</text>

  <!-- 圆格：翻车现场 -->
  <circle cx="340" cy="520" r="126" fill="#FFF3D6" stroke="#C07A2E" stroke-width="2"/>
  <!-- NaOH 大瓶 -->
  <g>
    <rect x="248" y="418" width="60" height="66" rx="10" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/>
    <rect x="266" y="406" width="24" height="14" rx="3" fill="#E8E4D8" stroke="#2C2C2A" stroke-width="1.5"/>
    <circle cx="267" cy="440" r="3" fill="#2C2C2A"/>
    <circle cx="287" cy="440" r="3" fill="#2C2C2A"/>
    <path d="M269 456 Q278 462 287 456" fill="none" stroke="#2C2C2A" stroke-width="2" stroke-linecap="round"/>
    <text x="278" y="478" text-anchor="middle" font-size="11" font-weight="700">NaOH</text>
    <text x="278" y="496" text-anchor="middle" font-size="9.5" style="fill:#C0392B;">莽夫上场</text>
  </g>
  <path d="M278 496 L278 516" stroke="#C0392B" stroke-width="2.5" marker-end="url(#ea)"/>
  <text x="316" y="506" font-size="10" style="fill:#C0392B;">pH 拉到 9.7！</text>

  <!-- 底部沉淀：绿泥+蓝泥 -->
  <g>
    <path d="M232 592 Q278 574 324 592 L324 622 L232 622 Z" fill="#9CCB8C" stroke="#2C2C2A" stroke-width="1.5"/>
    <text x="278" y="614" text-anchor="middle" font-size="9.5" font-weight="600">Fe(OH)₂ 绿泥</text>
    <path d="M330 592 Q376 574 422 592 L422 622 L330 622 Z" fill="#7FB3D5" stroke="#2C2C2A" stroke-width="1.5"/>
    <text x="376" y="614" text-anchor="middle" font-size="9.5" font-weight="600">Cu(OH)₂ 蓝泥</text>
  </g>
  <text x="340" y="576" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:#C0392B;">铁是倒了，铜也一起躺平了！</text>

  <!-- 卧底冷笑 -->
  <rect x="430" y="440" width="118" height="42" rx="12" class="bub"/>
  <path d="M430 456 L416 448 L420 464 Z" class="bub"/>
  <text x="442" y="458" class="say" font-size="11">要我下去？</text>
  <text x="442" y="476" class="say" font-size="11">拉你兄弟垫背！</text>

  <text x="340" y="666" text-anchor="middle" font-size="12" style="fill:#633806;">二价铁"耐碱"：pH 到 9.7 才沉完，而铜 pH≈6.7 就开始沉——根本没窗口</text>

  <!-- ============ P3 第二回合：先氧化，换制服 ============ -->
  <rect x="40" y="694" width="230" height="28" rx="14" fill="#5E8C4A"/>
  <text x="155" y="713" text-anchor="middle" font-size="13" font-weight="600" style="fill:#FFFFFF;">第二回合 · 先氧化，逼它换制服</text>

  <!-- 左斜格：H2O2 氧化剂登场 -->
  <polygon points="40,752 330,752 300,920 40,920" fill="#EAF4E2" stroke="#5E8C4A" stroke-width="1.5"/>
  <g>
    <rect x="66" y="772" width="48" height="56" rx="8" fill="#DFF0CE" stroke="#2C2C2A" stroke-width="2"/>
    <rect x="80" y="762" width="20" height="12" rx="3" fill="#9CB86A" stroke="#2C2C2A" stroke-width="1.5"/>
    <circle cx="81" cy="790" r="2.5" fill="#2C2C2A"/>
    <circle cx="99" cy="790" r="2.5" fill="#2C2C2A"/>
    <text x="90" y="818" text-anchor="middle" font-size="9.5" font-weight="700">H₂O₂</text>
    <text x="90" y="840" text-anchor="middle" font-size="9" style="fill:#3D6B2F;">干净氧化剂</text>
  </g>
  <path d="M124 800 Q142 800 158 800" fill="none" stroke="#5E8C4A" stroke-width="2.5" marker-end="url(#eb)"/>
  <g>
    <rect x="164" y="772" width="48" height="56" rx="8" fill="#B9D8AE" stroke="#2C2C2A" stroke-width="2"/>
    <rect x="178" y="762" width="20" height="12" rx="3" fill="#96BC8A" stroke="#2C2C2A" stroke-width="1.5"/>
    <circle cx="179" cy="790" r="2.5" fill="#2C2C2A"/>
    <circle cx="197" cy="790" r="2.5" fill="#2C2C2A"/>
    <text x="188" y="818" text-anchor="middle" font-size="9.5" font-weight="700">Fe²⁺</text>
  </g>
  <path d="M218 800 Q234 800 248 800" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#ea)"/>
  <g>
    <rect x="254" y="772" width="48" height="56" rx="8" fill="#F4C542" stroke="#2C2C2A" stroke-width="2"/>
    <rect x="268" y="762" width="20" height="12" rx="3" fill="#D9A62E" stroke="#2C2C2A" stroke-width="1.5"/>
    <rect x="260" y="784" width="13" height="6" rx="2" fill="#2C2C2A"/>
    <rect x="281" y="784" width="13" height="6" rx="2" fill="#2C2C2A"/>
    <text x="278" y="818" text-anchor="middle" font-size="9.5" font-weight="700">Fe³⁺</text>
  </g>
  <text x="165" y="878" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:#3D6B2F;">2Fe²⁺ + H₂O₂ + 2H⁺ = 2Fe³⁺ + 2H₂O</text>
  <text x="165" y="900" text-anchor="middle" font-size="10" style="fill:#633806;">还原产物是水，不引新杂质——首选！</text>

  <!-- 右斜格：制服对比 -->
  <polygon points="364,752 640,752 640,920 394,920" fill="#FDEBD0" stroke="#C07A2E" stroke-width="1.5"/>
  <text x="502" y="778" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:#8E5A1E;">换制服前后 · 沉淀门槛</text>
  <g>
    <rect x="384" y="792" width="46" height="44" rx="7" fill="#B9D8AE" stroke="#2C2C2A" stroke-width="1.5"/>
    <text x="407" y="820" text-anchor="middle" font-size="10" font-weight="700">Fe²⁺</text>
    <rect x="452" y="812" width="70" height="24" rx="6" fill="#C0392B" opacity="0.75"/>
    <text x="487" y="829" text-anchor="middle" font-size="10" font-weight="600" style="fill:#FFFFFF;">pH≈9.7</text>
    <text x="566" y="820" font-size="10" style="fill:#633806;">才沉完</text>

    <rect x="384" y="856" width="46" height="44" rx="7" fill="#F4C542" stroke="#2C2C2A" stroke-width="1.5"/>
    <text x="407" y="884" text-anchor="middle" font-size="10" font-weight="700">Fe³⁺</text>
    <rect x="452" y="876" width="70" height="24" rx="6" fill="#5E8C4A"/>
    <text x="487" y="893" text-anchor="middle" font-size="10" font-weight="600" style="fill:#FFFFFF;">pH≈3.2</text>
    <text x="566" y="884" font-size="10" style="fill:#633806;">就沉完</text>
  </g>
  <text x="502" y="918" text-anchor="middle" font-size="11" font-weight="600" style="fill:#C0392B;">差了 6 个多 pH 单位——省事太多！</text>

  <!-- ============ P4 第三回合：pH 阶梯，找安全窗口 ============ -->
  <rect x="40" y="948" width="230" height="28" rx="14" fill="#C07A2E"/>
  <text x="155" y="967" text-anchor="middle" font-size="13" font-weight="600" style="fill:#FFFFFF;">第三回合 · 调pH，走安全窗口</text>

  <text x="340" y="1000" text-anchor="middle" font-size="12.5" style="fill:#633806;">别瞎调！看沉淀 pH 阶梯，找准"铁走铜留"的唯一窗口：</text>

  <!-- pH 轴 -->
  <rect x="70" y="1030" width="540" height="14" rx="7" fill="#E8E4D8" stroke="#2C2C2A" stroke-width="1.5"/>
  <g>
    <text x="70" y="1062" text-anchor="middle" font-size="9.5" style="fill:#633806;">0</text>
    <text x="188" y="1062" text-anchor="middle" font-size="9.5" style="fill:#633806;">3</text>
    <text x="305" y="1062" text-anchor="middle" font-size="9.5" style="fill:#633806;">7</text>
    <text x="423" y="1062" text-anchor="middle" font-size="9.5" style="fill:#633806;">10</text>
    <text x="540" y="1062" text-anchor="middle" font-size="9.5" style="fill:#633806;">14</text>
  </g>
  <!-- 刻度：pH 3.2 -> x = 70 + 3.2/14*540 = 70+123 = 193 -->
  <!-- pH 6.7 -> 70 + 6.7/14*540 = 70+258 = 328 -->
  <!-- pH 9.7 -> 70 + 9.7/14*540 = 70+374 = 444 -->

  <!-- Fe3+ 条 -->
  <rect x="193" y="1076" width="347" height="26" rx="8" fill="#F4C542" stroke="#C07A2E" stroke-width="1.5"/>
  <text x="200" y="1094" font-size="11" font-weight="600" style="fill:#8E5A1E;">Fe³⁺ 沉淀区</text>
  <path d="M193 1089 L188 1089" stroke="#C0392B" stroke-width="2"/>
  <text x="186" y="1094" text-anchor="end" font-size="10" style="fill:#C0392B;">3.2</text>

  <!-- Cu2+ 条 -->
  <rect x="328" y="1110" width="212" height="26" rx="8" fill="#7FB3D5" stroke="#4A6BA5" stroke-width="1.5"/>
  <text x="335" y="1128" font-size="11" font-weight="600" style="fill:#2C5477;">Cu²⁺ 沉淀区</text>
  <text x="322" y="1128" text-anchor="end" font-size="10" style="fill:#C0392B;">6.7</text>

  <!-- Fe2+ 条 -->
  <rect x="444" y="1144" width="96" height="26" rx="8" fill="#B9D8AE" stroke="#5E8C4A" stroke-width="1.5"/>
  <text x="450" y="1162" font-size="11" font-weight="600" style="fill:#3D6B2F;">Fe²⁺ 沉淀区</text>
  <text x="438" y="1162" text-anchor="end" font-size="10" style="fill:#C0392B;">9.7</text>

  <!-- 安全窗口 -->
  <rect x="180" y="1016" width="140" height="0" fill="none"/>
  <path d="M193 1176 L193 1190 L328 1190 L328 1176" fill="none" stroke="#5E8C4A" stroke-width="2.5"/>
  <text x="260" y="1208" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:#3D6B2F;">安全窗口 pH 3.2~4：铁走，铜留</text>

  <!-- 试剂选择卡 -->
  <rect x="40" y="1226" width="290" height="76" rx="12" fill="#EAF4E2" stroke="#5E8C4A" stroke-width="1.5"/>
  <text x="185" y="1248" text-anchor="middle" font-size="12.5" font-weight="600" style="fill:#3D6B2F;">✅ 用 CuO / Cu(OH)₂ / CuCO₃</text>
  <text x="185" y="1268" text-anchor="middle" font-size="11" style="fill:#633806;">主体是谁就加谁的"本体碱"</text>
  <text x="185" y="1288" text-anchor="middle" font-size="11" style="fill:#633806;">不引入新杂质，还能贴着上限慢慢调</text>

  <rect x="350" y="1226" width="290" height="76" rx="12" fill="#FFF0F0" stroke="#C0392B" stroke-width="1.5"/>
  <text x="495" y="1248" text-anchor="middle" font-size="12.5" font-weight="600" style="fill:#8E2318;">❌ 别用 NaOH / 氨水</text>
  <text x="495" y="1268" text-anchor="middle" font-size="11" style="fill:#633806;">塞进 Na⁺、NH₄⁺ 新杂质</text>
  <text x="495" y="1288" text-anchor="middle" font-size="11" style="fill:#633806;">局部过碱，铜也跟着沉</text>

  <!-- 原理条 -->
  <rect x="40" y="1318" width="600" height="44" rx="12" fill="#FDEBD0" stroke="#C07A2E" stroke-width="1.5"/>
  <text x="340" y="1337" text-anchor="middle" font-size="13" font-weight="600" style="fill:#8E5A1E;">原理：Fe³⁺ + 3H₂O ⇌ Fe(OH)₃ + 3H⁺，吃掉 H⁺ → 平衡右移 → 沉淀</text>
  <text x="340" y="1355" text-anchor="middle" font-size="11" style="fill:#633806;">所以"调 pH"本质不是加碱搞沉淀，而是逼着三价铁水解到底</text>

  <!-- ============ P5 黑金终局 ============ -->
  <rect x="40" y="1386" width="600" height="330" rx="14" fill="#2C2C2A"/>
  <text x="340" y="1416" text-anchor="middle" font-size="15" style="fill:#e8d48f;" font-weight="600">战役总结 · 除铁三步法：</text>

  <!-- 三步 -->
  <g>
    <rect x="66" y="1436" width="170" height="86" rx="12" fill="#3A3A36" stroke="#F7C948" stroke-width="1.2"/>
    <text x="151" y="1462" text-anchor="middle" font-size="12" style="fill:#F7C948;" font-weight="600">① 氧化</text>
    <text x="151" y="1482" text-anchor="middle" font-size="11" style="fill:#e8e4d8;">H₂O₂ / Cl₂ 把</text>
    <text x="151" y="1498" text-anchor="middle" font-size="11" style="fill:#e8e4d8;">Fe²⁺ 打回 Fe³⁺</text>
    <text x="151" y="1514" text-anchor="middle" font-size="10" style="fill:#9ccb8c;">换装，降低门槛</text>

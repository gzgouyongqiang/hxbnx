<svg viewBox="0 0 680 1665" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>钠的变形七部曲</title>
  <desc>钠露置空气的连环变化：Na到Na2O到Na2O2到NaOH到Na2CO3·10H2O最终风化为Na2CO3</desc>
  <style>
    text { font-family: "PingFang SC","Microsoft YaHei",sans-serif; fill:#2C2C2A; }
    .bd { stroke:#2C2C2A; stroke-width:2; }
    .bub { fill:#FFFFFF; stroke:#2C2C2A; stroke-width:1.5; }
    .say { font-size:13px; }
    .note { font-size:12px; fill:#633806; }
    .ttl { font-size:18px; font-weight:500; }
    .eq { font-size:11.5px; fill:#633806; }
  </style>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#712B13" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="cT"><circle cx="340" cy="455" r="130"/></clipPath>
  </defs>

  <!-- 标题 -->
  <text x="340" y="46" text-anchor="middle" class="ttl" font-weight="600">钠的变形七部曲</text>
  <text x="340" y="72" text-anchor="middle" font-size="12" fill="#854F0B">银白少年躺进空气 · 一路被氧抢被水泡被风吹</text>

  <!-- P1 横幅圆角：切开见真容 -->
  <rect x="40" y="96" width="600" height="190" rx="18" fill="#F3E7C9" class="bd"/>
  <text x="70" y="126" font-size="13" font-weight="500" fill="#633806">第1幕：切开见真容——秒速晒黑</text>
  <!-- 砧板上的银白钠 -->
  <rect x="90" y="160" width="120" height="80" rx="8" fill="#E2CFA4" opacity="0.6"/>
  <path d="M100 200 L180 176 L214 190 L134 214 Z" fill="#F4F4F2" stroke="#8A8A84" stroke-width="1.5"/>
  <path d="M100 200 L134 214 L134 234 L100 220 Z" fill="#DDDDD8" stroke="#8A8A84" stroke-width="1.5"/>
  <path d="M134 214 L214 190 L214 210 L134 234 Z" fill="#F4F4F2" stroke="#8A8A84" stroke-width="1.5"/>
  <path d="M146 188 L166 182 M152 198 L176 191" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <!-- 菜刀 -->
  <path d="M188 150 L246 132 L252 148 L196 162 Z" fill="#5F5E5A" stroke="#2C2C2A" stroke-width="1.5"/>
  <rect x="240" y="128" width="30" height="10" rx="4" fill="#8A5A2B"/>
  <text x="130" y="264" text-anchor="middle" font-size="12" fill="#5F5E5A">刀切银白 · 软到离谱</text>
  <!-- 变暗的30秒后 -->
  <path d="M290 195 L330 195" fill="none" stroke="#712B13" stroke-width="2.5" marker-end="url(#aw)"/>
  <text x="310" y="182" text-anchor="middle" font-size="11" fill="#712B13">30秒后</text>
  <rect x="360" y="168" width="60" height="52" rx="10" fill="#6E6E68" stroke="#2C2C2A" stroke-width="2"/>
  <text x="390" y="200" text-anchor="middle" font-size="12" fill="#F4F4F2">暗</text>
  <text x="390" y="238" text-anchor="middle" font-size="12" fill="#5F5E5A">灰暗"晒黑"</text>
  <!-- O2小偷 -->
  <circle cx="530" cy="180" r="20" fill="#E1F5EE" stroke="#2F7D5B" stroke-width="2"/>
  <text x="530" y="185" text-anchor="middle" font-size="11" fill="#2F7D5B">O₂</text>
  <path d="M552 172 L568 164 M552 186 L570 186" stroke="#2F7D5B" stroke-width="2" stroke-linecap="round"/>
  <rect x="498" y="212" width="120" height="40" rx="12" class="bub"/>
  <text x="510" y="229" class="say">光泽我拿走了，</text>
  <text x="510" y="246" class="say">你尽管黑！</text>
  <rect x="60" y="216" width="290" height="20" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="205" y="230" text-anchor="middle" class="eq">4Na + O₂ = 2Na₂O（常温·白色固体）</text>

  <!-- P2 圆形：点燃档美颜 -->
  <circle cx="340" cy="455" r="130" fill="#2C2C2A" class="bd"/>
  <g clip-path="url(#cT)">
    <path d="M318 560 Q296 528 308 500 Q296 512 288 530 Q276 508 286 482 Q270 500 268 530 Q266 552 300 566 Z" fill="#EF9F27"/>
    <path d="M336 556 Q322 530 330 508 Q322 516 318 532 Q310 546 326 562 Z" fill="#F7C948"/>
    <path d="M362 558 Q350 532 356 510 Q350 518 346 534 Q340 548 354 562 Z" fill="#F7C948"/>
  </g>
  <circle cx="340" cy="420" r="44" fill="#F3E27A" stroke="#A8720A" stroke-width="2.5"/>
  <circle cx="324" cy="414" r="3" fill="#5C3D00"/>
  <circle cx="356" cy="414" r="3" fill="#5C3D00"/>
  <path d="M326 430 Q340 437 354 430" fill="none" stroke="#5C3D00" stroke-width="2" stroke-linecap="round"/>
  <rect x="306" y="382" width="68" height="20" rx="10" fill="#A8720A"/>
  <text x="340" y="396" text-anchor="middle" font-size="10.5" fill="#FFFFFF">点燃档美颜</text>
  <text x="340" y="500" text-anchor="middle" font-size="13" style="fill:#e8d48f;" font-weight="500">淡黄新皮肤：Na₂O₂</text>
  <text x="340" y="522" text-anchor="middle" font-size="11" style="fill:#B8B6AC;">2Na + O₂ --点燃--> Na₂O₂</text>
  <text x="272" y="330" font-size="11" style="fill:#B8B6AC;">第2幕：火焰加持</text>
  <rect x="70" y="600" width="540" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="617" text-anchor="middle" class="note">氧气两套滤镜：常温→变暗（Na₂O白色）/ 点燃→淡黄（Na₂O₂）——条件不同产物不同</text>

  <!-- P3 六边形：喝水成碱 -->
  <polygon points="195,770 268,652 412,652 485,770 412,888 268,888" fill="#E1F5EE" class="bd"/>
  <text x="340" y="684" text-anchor="middle" font-size="13" font-weight="500" fill="#2F5D46">第3幕：喝水成碱</text>
  <!-- 水滴 -->
  <path d="M258 730 Q248 744 253 753 Q258 760 264 753 Q270 744 258 730 Z" fill="#5FA8E0" stroke="#0C447C" stroke-width="1.5"/>
  <text x="258" y="716" text-anchor="middle" font-size="11" fill="#0C447C">H₂O</text>
  <path d="M270 742 L300 758" fill="none" stroke="#0C447C" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aw)"/>
  <!-- Na2O2球喝水中 -->
  <circle cx="350" cy="775" r="36" fill="#F3E27A" stroke="#A8720A" stroke-width="2.5"/>
  <circle cx="337" cy="768" r="2.6" fill="#5C3D00"/>
  <circle cx="363" cy="768" r="2.6" fill="#5C3D00"/>
  <ellipse cx="350" cy="786" rx="7" ry="5" fill="none" stroke="#5C3D00" stroke-width="1.6"/>
  <text x="350" y="838" text-anchor="middle" font-size="11.5" fill="#2F7D5B">咕嘟咕嘟……</text>
  <!-- O2气泡逃逸 -->
  <circle cx="420" cy="716" r="7" fill="#FFFFFF" stroke="#888780" stroke-width="1.5"/>
  <circle cx="436" cy="698" r="5.5" fill="#FFFFFF" stroke="#888780" stroke-width="1.5"/>
  <text x="446" y="688" font-size="10.5" fill="#5F5E5A">O₂↑</text>
  <text x="340" y="872" text-anchor="middle" font-size="11" fill="#2F5D46">2Na₂O₂ + 2H₂O = 4NaOH + O₂↑</text>
  <rect x="70" y="900" width="540" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="917" text-anchor="middle" class="note">NaOH登场——碱界扛把子，接下来开启"又吸水又吸碳"模式</text>

  <!-- P4 斜切格：潮解+吸碳 -->
  <polygon points="70,958 610,946 594,1122 86,1134" fill="#F7EFE3" class="bd"/>
  <text x="102" y="982" font-size="13" font-weight="500" fill="#712B13">第4-5幕：潮解胖身，抱碳成晶</text>
  <!-- NaOH胖球 -->
  <circle cx="200" cy="1046" r="34" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/>
  <rect x="180" y="1018" width="40" height="16" rx="8" fill="#534AB7"/>
  <text x="200" y="1030" text-anchor="middle" font-size="10" fill="#FFFFFF">NaOH</text>
  <circle cx="188" cy="1042" r="2.4" fill="#2C2C2A"/>
  <circle cx="212" cy="1042" r="2.4" fill="#2C2C2A"/>
  <path d="M188 1058 Q200 1064 212 1058" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round"/>
  <text x="200" y="1102" text-anchor="middle" font-size="11" fill="#5F5E5A">潮解：吸水胖一圈</text>
  <path d="M168 1082 Q150 1090 140 1100 M232 1082 Q250 1090 260 1100" stroke="#8FC7EA" stroke-width="2.5" stroke-linecap="round"/>
  <!-- CO2被吸入 -->
  <circle cx="400" cy="1020" r="20" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
  <text x="400" y="1025" text-anchor="middle" font-size="11" fill="#0C447C">CO₂</text>
  <path d="M380 1036 Q330 1050 250 1046" fill="none" stroke="#0C447C" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aw)"/>
  <text x="400" y="1058" text-anchor="middle" font-size="10.5" fill="#0C447C">我也被吸走了</text>
  <!-- 晶体 -->
  <path d="M480 1020 L520 1040 L508 1088 L452 1088 L440 1040 Z" fill="#DCEBFA" stroke="#5B9BD5" stroke-width="2"/>
  <text x="480" y="1062" text-anchor="middle" font-size="10.5" fill="#2E6DA4">Na₂CO₃</text>
  <text x="480" y="1078" text-anchor="middle" font-size="10.5" fill="#2E6DA4">·10H₂O晶体</text>
  <text x="480" y="1108" text-anchor="middle" font-size="10" fill="#5F5E5A">怀抱10个水兄弟</text>
  <rect x="86" y="1096" width="290" height="20" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="231" y="1110" text-anchor="middle" class="eq">2NaOH + CO₂ = Na₂CO₃ + H₂O</text>
  <rect x="70" y="1148" width="540" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="1165" text-anchor="middle" class="note">得到无色晶体Na₂CO₃·10H₂O——碱性大佬终于有了正式编制</text>

  <!-- P5 菱形：风化瘦身 -->
  <polygon points="340,1185 612,1285 340,1385 68,1285" fill="#EFE9F7" class="bd"/>
  <text x="340" y="1222" text-anchor="middle" font-size="13" font-weight="500" fill="#4A2E73">第6幕：风化瘦身</text>
  <!-- 风 -->
  <path d="M110 1268 Q150 1256 190 1268 T270 1268" fill="none" stroke="#888780" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M124 1292 Q160 1282 196 1292 T268 1292" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round"/>
  <text x="120" y="1248" font-size="11" fill="#888780">呼——</text>
  <!-- 晶体瘦成粉末 -->
  <path d="M420 1290 L462 1306 L452 1346 L396 1346 L384 1306 Z" fill="#DCEBFA" stroke="#5B9BD5" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="424" y="1324" text-anchor="middle" font-size="10" fill="#2E6DA4">10H₂O</text>
  <text x="424" y="1340" text-anchor="middle" font-size="10" fill="#2E6DA4">飞了</text>
  <path d="M470 1300 Q500 1282 530 1288 M476 1320 Q508 1306 540 1312" fill="none" stroke="#8FC7EA" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="330" cy="1338" rx="52" ry="16" fill="#F4F4F2" stroke="#8A8A84" stroke-width="1.5"/>
  <circle cx="312" cy="1330" r="2.5" fill="#8A8A84"/><circle cx="330" cy="1324" r="2.5" fill="#8A8A84"/><circle cx="348" cy="1330" r="2.5" fill="#8A8A84"/>
  <text x="330" y="1372" text-anchor="middle" font-size="11.5" fill="#4A2E73">白色粉末：Na₂CO₃（最终形态！）</text>
  <text x="340" y="1248" text-anchor="middle" font-size="11" fill="#4A2E73">Na₂CO₃·10H₂O =风化= Na₂CO₃ + 10H₂O</text>
  <rect x="70" y="1398" width="540" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="1415" text-anchor="middle" class="note">风化 vs 潮解：风化失结晶水，潮解吸水——方向完全相反，别搞混！</text>

  <!-- P6 黑金终局 -->
  <rect x="40" y="1448" width="600" height="192" rx="14" fill="#2C2C2A"/>
  <text x="340" y="1486" text-anchor="middle" font-size="15" style="fill:#e8d48f;" font-weight="600">变形七部曲 · 终局宣判：</text>
  <text x="340" y="1520" text-anchor="middle" font-size="14" style="fill:#F7C948;">钠露置空气，最终产物 = Na₂CO₃（白色粉末）</text>
  <text x="340" y="1550" text-anchor="middle" font-size="12" style="fill:#B8B6AC;">Na → Na₂O → Na₂O₂ → NaOH → Na₂CO₃·10H₂O → Na₂CO₃</text>
  <text x="340" y="1584" text-anchor="middle" font-size="14" style="fill:#9ccb8c;" font-weight="500">口诀：氧水碳风四连击，银白少年变纯碱</text>
  <text x="340" y="1614" text-anchor="middle" font-size="11" style="fill:#8A8880;">—— 考题问"最终产物"：答Na₂CO₃！答NaOH的直接扣分</text>
</svg>

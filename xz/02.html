<script>
var QS = [{"id": 1, "src": "2026 广东 2", "ans": "A", "stem": "中国科技多方位成就世界之最。下列说法正确的是", "opts": ["“氢”装上阵：兆瓦级氢燃料航空涡桨发动机研制成功。H<sub>2</sub> 燃烧属于放热反应", "“黑色黄金”：T1200 级超高强度碳纤维实现百吨级量产。碳纤维是天然高分子", "“会飞的电站”：高空风力发电捕风伞使用氦气球升空。<sup>3</sup>He 和<sup>4</sup>He 中子数相同", "“镁铈”成双：嫦娥五号月壤中发现含镁、含铈两种新矿物。镁和铈位于同周期"], "exp": "选项 A，H<sub>2</sub> 在氧气中燃烧是放热反应，燃烧释放热量，属于放热反应。选项 B，碳纤维主要成分为碳单质，是一种人工合成的高性能无机非金属材料，不属于天然高分子。选项 C，中子数＝质量数－质子数，He 的质子数为 2，<sup>3</sup>He 的中子数为 1，<sup>4</sup>He 的中子数为 2，<sup>3</sup>He 和<sup>4</sup>He 的中子数不同。选项 D，镁元素位于第三周期，铈元素是镧系元素，位于第六周期，镁和铈位于不同周期。"}, {"id": 2, "src": "2026 广东 3", "ans": "A", "stem": "品如其真，竹蕴君子之德，亦含化学奥秘。下列过程对应的叙述错误的是", "opts": ["破竹制简：刀破竹过程是化学变化", "竹浆造纸：可选用 SO<sub>2</sub> 漂白竹纸浆", "伐竹烧炭：竹制活性炭具有多孔结构，可作吸附剂", "竹材热解：热解产物中的 CH<sub>4</sub> 和 CO 均可用作燃料"], "exp": "选项 A，破竹制简过程中只是竹材形状、大小发生改变，没有新物质生成，属于物理变化。选项 B，竹浆造纸可利用具有漂白性的物质漂白纸浆，SO<sub>2</sub> 具有漂白性，可用于漂白竹纸浆。选项 C，竹材炭化所得活性炭具有疏松多孔结构，能吸附色素、异味或部分污染物，可作吸附剂。选项 D，竹材热解产物 CH<sub>4</sub> 和 CO 都具有可燃性，均可用作燃料。"}, {"id": 3, "src": "2026 广东 4", "ans": "D", "stem": "光影岁月流转，科技定格万象。下列说法正确的是", "opts": ["烛焰小孔成像。蜡烛燃烧时化学能全部转化为光能", "凸透镜聚光成像。石英玻璃凸透镜的主要成分为硅酸钙", "卤化银胶片感光成像。2AgBr 见光分解为 2Ag＋Br<sub>2</sub>，属于化合反应", "硅基器件数字成像。单晶硅应用非常广泛，属于共价晶体"], "exp": "选项 A，蜡烛燃烧时化学能除转化为热能和光能，其中热能占较大部分，并非全部转化为光能。选项 B，石英玻璃的主要成分是 SiO<sub>2</sub>，不是硅酸钙，选项混淆了石英玻璃与普通硅酸盐材料。选项 C，卤化银感光成像中一种物质分解生成两种物质，属于分解反应，不属于化合反应。选项 D，单晶硅中硅原子通过共价键形成空间网状结构，属于共价晶体。"}, {"id": 4, "src": "2025 广东 3", "ans": "D", "stem": "现代科技，增强国力，增进民生福祉。下列说法正确的是", "opts": ["我国科学家首次测得了月球背面月幔水含量，1 mol H<sub>2</sub>O 质量为 10 g", "利用 MoS<sub>2</sub> 成功为金属材料“重塑金身”，MoS<sub>2</sub> 中 Mo 的化合价为＋6", "穿上电动机械腿，助力行走不是梦。行走时电池将电能转化为化学能", "沙海养鱼蹚出治沙新路，让沙海沙山变成金山银山，鱼肉富含蛋白质"], "exp": "选项 A，H<sub>2</sub>O 的摩尔质量为 18 g·mol<sup>−1</sup>，故 1 mol H<sub>2</sub>O 质量为 18 g。选项 B，MoS<sub>2</sub> 中 S 的化合价为−2，则 Mo 的化合价为＋4。选项 C，电动机械腿工作时，电池放电，将化学能转化为电能，再由电能转化为机械能。选项 D，鱼肉的主要营养成分是蛋白质，正确。"}, {"id": 5, "src": "2024 广东 3", "ans": "C", "stem": "嘀嗒嘀嗒，时间都去哪儿了！计时器的发展史铭刻着化学的贡献。下列说法不正确的是", "opts": ["制作日晷圆盘的石材，属于无机非金属材料", "机械表中由钼钴镍铬等元素组成的发条，其材质属于合金", "基于石英晶体振荡特性计时的石英表，其中石英的成分为 SiC", "目前“北京时间”授时以铯原子钟为基准，<sup>133</sup>Cs 的质子数为 55"], "exp": "选项 A，制作日晷圆盘的石材主要成分为大理石，属于无机非金属材料，正确。选项 B，由两种或两种以上的金属与金属（或非金属）经一定方法所合成的具有金属特性的混合物称为合金，机械表中由钼钴镍铬等元素组成的发条，其材质属于合金，正确。选项 C，基于石英晶体振荡特性计时的石英表，其中石英的成分为 SiO<sub>2</sub>，不是 SiC，错误。选项 D，<sup>133</sup>Cs 的质量数为 135，质子数为 55，正确。"}, {"id": 6, "src": "2025 广东 5", "ans": "A", "stem": "声波封印，材料是音乐存储技术的基础。下列说法错误的是", "opts": ["制作黑胶唱片使用的聚氯乙烯，其单体是 CH<sub>3</sub>CH<sub>2</sub>Cl", "磁带可由四氧化三铁涂覆在胶带上制成，Fe<sub>3</sub>O<sub>4</sub> 具有磁性", "光碟擦写过程中材料在晶态和非晶态间的可逆转换，涉及物理变化", "固态硬盘芯片常使用单晶硅作为基础材料，单晶硅是一种共价晶体"], "exp": "选项 A，聚氯乙烯的单体应为氯乙烯，其结构简式为 CH<sub>2</sub>=CHCl，错误。选项 B，四氧化三铁（Fe<sub>3</sub>O<sub>4</sub>）具有磁性，常用于制作磁带，正确。选项 C，材料在晶态和非晶态间的可逆转换，无新物质生成，属于物理变化，正确。选项 D，单晶硅为共价晶体，可用于制作固态硬盘芯片，正确。"}, {"id": 7, "src": "2024 广东 2", "ans": "C", "stem": "“极地破冰”“太空养鱼”等彰显了我国科技发展的巨大成就。下列说法正确的是", "opts": ["“雪龙2”号破冰船极地科考：破冰过程中水发生了化学变化", "大型液化天然气运输船成功建造：天然气液化过程中形成了新的化学键", "“嫦娥六号”的运载火箭助推器采用液氧煤油发动机：燃烧时存在化学能转化为热能", "神舟十八号乘组带着水和斑马鱼进入空间站进行科学实验：水的电子式为 H∶O∶H"], "exp": "选项 A，破冰过程无新物质生成，是物理变化，错误。选项 B，天然气液化由气态变为液态，是物理变化，无新的化学键形成，错误。选项 C，燃烧放热，燃烧过程中化学能转化为热能，正确。选项 D，水是共价化合物，每个 H 原子都与 O 原子共用一对电子，水的电子式应完整标出 O 原子上的孤对电子，选项书写不完整，错误。"}, {"id": 8, "src": "2023 广东 2", "ans": "C", "stem": "科教兴国，“可上九天揽月，可下五洋捉鳖”。下列说法正确的是", "opts": ["“天舟六号”为中国空间站送去推进剂 Xe 气，Xe 是第ⅠA族元素", "火星全球影像彩图显示了火星表土颜色，表土中赤铁矿主要成分为 FeO", "创造了可控核聚变运行纪录的“人造太阳”，其原料中的 <sup>2</sup>H 与<sup>1</sup>H 互为同位素", "“深地一号”为进军万米深度提供核心装备，制造钻头用的金刚石为金属晶体"], "exp": "选项 A，Xe 的原子序数为 54，在元素周期表中处于第五周期第 0 族，错误。选项 B，赤铁矿的主要成分是 Fe<sub>2</sub>O<sub>3</sub>，不是 FeO，错误。选项 C，<sup>2</sup>H 与<sup>1</sup>H 具有相同的质子数和不同的中子数，互为同位素，正确。选项 D，金刚石是共价晶体，不是金属晶体，错误。"}, {"id": 9, "src": "2023 广东 5", "ans": "D", "stem": "化学处处呈现美。下列说法正确的是", "opts": ["舞台上干冰升华时，共价键断裂", "饱和 CuSO<sub>4</sub> 溶液可析出无水蓝色晶体", "苯分子的正六边形结构，单双键交替呈现完美对称", "晨雾中的光束如梦如幻，是丁达尔效应带来的美景"], "exp": "选项 A，舞台上干冰升华是物理变化，共价键没有断裂，干冰升华时破坏的是分子间作用力，错误。选项 B，饱和 CuSO<sub>4</sub> 溶液可析出的蓝色晶体是 CuSO<sub>4</sub>·5H<sub>2</sub>O，无水 CuSO<sub>4</sub> 是白色固体，错误。选项 C，苯分子的正六边形结构中，6 个碳碳键完全相同呈现完美对称，其键长介于碳碳单键和碳碳双键的键长之间，不存在单双键交替，错误。选项 D，雾属于胶体，能产生丁达尔效应，正确。"}, {"id": 10, "src": "2022 广东 2", "ans": "D", "stem": "北京冬奥会成功举办、神舟十三号顺利往返、“天宫课堂”如期开讲及“华龙一号”核电海外投产等，均展示了我国科技发展的巨大成就。下列相关叙述正确的是", "opts": ["冬奥会“飞扬”火炬所用的燃料 H<sub>2</sub> 为氧化性气体", "飞船返回舱表层材料中的玻璃纤维属于天然有机高分子", "乙酸钠过饱和溶液析出晶体并放热的过程仅涉及化学变化", "核电站反应堆所用铀棒中含有的 <sup>235</sup>U 与<sup>238</sup>U 互为同位素"], "exp": "选项 A，H<sub>2</sub> 是一种清洁燃料，且为还原性气体，不是氧化性气体，错误。选项 B，玻璃纤维是一种性能优异的无机非金属材料，生活中常用的有机玻璃也不是天然有机高分子，而是合成高分子材料，错误。选项 C，乙酸钠过饱和溶液析出晶体的过程没有涉及旧化学键的断裂，只有新化学键的形成，是物理变化，错误。选项 D，<sup>235</sup>U 与<sup>238</sup>U 的质子数均为 92，中子数不同，互为同位素，正确。"}, {"id": 11, "src": "2021 广东 2", "ans": "C", "stem": "广东有众多国家级非物质文化遗产，如广东剪纸、粤绣、潮汕工夫茶艺和香云纱染整技艺等。下列说法不正确的是", "opts": ["广东剪纸的裁剪过程不涉及化学变化", "冲泡工夫茶时茶香四溢，体现了分子是运动的", "染整技艺中去除丝胶所用的纯碱水溶液属于纯净物", "制作粤绣所用的植物纤维布含有天然高分子化合物"], "exp": "选项 A，剪纸的裁剪过程是物理过程，不涉及化学变化，正确。选项 B，分子是运动的，冲泡工夫茶时茶香四溢正是分子运动的结果，正确。选项 C，纯碱水溶液是碳酸钠溶于水得到的混合物，不属于纯净物，错误。选项 D，植物纤维布是指各种纯棉、麻和棉麻交织布，含有天然高分子化合物，正确。"}, {"id": 12, "src": "2024 广州一测 2", "ans": "D", "stem": "化学推动科技进步。下列说法不正确的是", "opts": ["“祝融号”探测器发现火星上存在的橄榄石（(Mg,Fe)<sub>2−x</sub>SiO<sub>4</sub>），其成分属于无机化合物", "天和核心舱电推进系统中使用的氮化硼陶瓷，其属于新型无机非金属材料", "“奋斗者”号载人潜水器球壳，其原料中的 <sup>48</sup>Ti 与<sup>50</sup>Ti 互为同位素", "月壤样品中发现的天然玻璃纤维，该纤维中的 SiO<sub>2</sub> 属于分子晶体"], "exp": "选项 A，橄榄石（(Mg,Fe)<sub>2−x</sub>SiO<sub>4</sub>）是一种硅酸盐，其成分属于无机化合物，正确。选项 B，新型无机非金属材料包括含硅元素的材料（如单晶硅、二氧化硅等），还有一些含有碳、氮等其他元素的陶瓷（如氮化硼等），氮化硼陶瓷属于新型无机非金属材料，正确。选项 C，质子数相同、中子数不同的同种元素的不同种原子互称为同位素，<sup>48</sup>Ti 与<sup>50</sup>Ti 质子数相同、中子数不同，互为同位素，正确。选项 D，纤维中的 SiO<sub>2</sub> 熔沸点高、硬度大，属于共价晶体，不属于分子晶体，错误。"}, {"id": 13, "src": "2024 广州二测 2", "ans": "B", "stem": "化学推动科技进步。下列说法正确的是", "opts": ["我国科学家首次合成了新核素 <sup>106</sup>Os、<sup>108</sup>Os 和<sup>100</sup>W 为同位素", "中国空间站站机械臂采用铝合金材料，Al 是第ⅢA族元素", "鹊桥号中继卫星的天线由镀金钼丝织成，镀金钼丝是无机非金属材料", "中国天眼主镜面的防腐膜中含有聚苯乙烯，聚苯乙烯是天然高分子材料"], "exp": "选项 A，<sup>106</sup>Os 和<sup>108</sup>W 的质量数相同，但 Os 与 W 质子数不同，不属于同位素，错误。选项 B，Al 是第ⅢA族元素，正确。选项 C，镀金钼丝就是在极细的钼丝表面镀金，用于编织星载可展开天线上的金属网，镀金钼丝是无机金属材料，不是无机非金属材料，错误。选项 D，聚苯乙烯是人工合成的高分子材料，天然高分子主要有淀粉、纤维素、蛋白质、天然橡胶等，错误。"}, {"id": 14, "src": "2025 广州调研 2", "ans": "C", "stem": "科技发展见证自立自强的奋进中国。下列说法正确的是", "opts": ["中国石油千万吨级炼化项目投产：石油分馏属于化学变化", "攻克高温纯化技术开发超高纯石墨产品：石墨是共价晶体", "“嫦娥六号”采回的月壤中含有 <sup>3</sup>He，<sup>3</sup>He 和<sup>4</sup>He 互为同位素", "我国科学家成功实现从 CO<sub>2</sub> 到淀粉的人工合成：CO<sub>2</sub> 的电子式为 O∶∶C∶∶O"], "exp": "选项 A，分馏是指利用石油中各组分沸点的不同进行分离的过程，该过程主要发生物理变化，错误。选项 B，石墨是混合型晶体，不是共价晶体，错误。选项 C，<sup>3</sup>He 和<sup>4</sup>He 具有相同的质子数、不同的中子数，互为同位素，正确。选项 D，CO<sub>2</sub> 的电子式中 O 原子应完整标出 2 对孤对电子，选项书写不完整，错误。"}, {"id": 15, "src": "2025 广州一测 2", "ans": "D", "stem": "我国科技发展成就巨大。下列说法正确的是", "opts": ["“嫦娥三号”搭载同位素电池，<sup>238</sup>Pu 的质量数为 94", "“嫦娥六号”搭载水升华器进行降温：水升华过程中破坏了 H−O 键", "大洋钻探船“梦想”号进行深海油气勘探：深海油气属于纯净物", "北斗卫星使用氮化铝芯片：氮化铝属于新型无机非金属材料"], "exp": "选项 A，<sup>238</sup>Pu 的质子数为 94，质量数为 238，中子数为 144，错误。选项 B，升华是一种相变过程，其特点是物质直接从固态变为气态。水升华是指冰直接变成水蒸气，水升华过程中改变的只是分子间的距离，即克服分子间作用力（范德华力），没有化学键的断裂或形成，错误。选项 C，深海油气的主要成分为天然气和石油的气液混合物，不属于纯净物，错误。选项 D，氮化铝是一种由铝和氮组成的无机化合物，化学性质稳定，不易被氧化或腐蚀，具备无机非金属材料的特性，属于新型无机非金属材料，正确。"}, {"id": 16, "src": "2025 广州二测 2", "ans": "B", "stem": "我国科技发展取得巨大成就。下列说法不正确的是", "opts": ["“蛟龙”号载人潜水器使用钛合金作外壳材料，<sup>48</sup>Ti 的质子数为 22", "运载火箭使用肼（N<sub>2</sub>H<sub>4</sub>）作燃料，肼的电子式为 H∶N∶∶N∶H", "“神舟十九号”载人飞船使用耐烧蚀树脂，该树脂为合成有机高分子材料", "天和核心舱电推进系统腔体采用的氮化硼陶瓷属于新型无机非金属材料"], "exp": "选项 A，<sup>48</sup>Ti 的质子数为 22，质量数为 48，中子数为 26，正确。选项 B，肼 N<sub>2</sub>H<sub>4</sub> 的电子式中 2 个氮原子各提供 3 个电子，分别与另 1 个氮原子、2 个氢原子形成共用电子对，且每个氮原子自身还有 1 对孤电子对，选项电子式书写不完整，错误。选项 C，树脂是一种有机物，按来源可分为天然树脂和合成树脂，天然树脂主要包括松香、琥珀等，合成树脂是通过加聚、缩聚等方法形成的高分子聚合物，如酚醛树脂、聚氯乙烯树脂等，耐烧蚀树脂属于合成树脂，属于合成有机高分子材料，正确。选项 D，氮化硼陶瓷属于新型无机非金属材料，常见的新型无机非金属材料还包括高纯硅、二氧化硅、新型陶瓷（碳化硅、氧化铝、氧化钇、氮化铝、氮化镓）、碳纳米材料（富勒烯、碳纳米管、石墨烯）等，正确。"}, {"id": 17, "src": "2026 广州调研 2", "ans": "B", "stem": "科技赋能打造“智慧全运”。下列说法正确的是", "opts": ["开幕式水舞台采用了循环利用的雨水。水的电子式为 H∶O∶H", "火炬采用硬铝和高强度 3D 打印不锈钢为材料。硬铝和不锈钢均属于合金", "全球首个 5G−A 人形机器人完成火炬传递。机器人行走时电池将电能转化为化学能", "深海采集的可燃冰（CH<sub>4</sub>·nH<sub>2</sub>O）作为火炬燃料。CH<sub>4</sub> 和 H<sub>2</sub>O 都是共价晶体"], "exp": "选项 A，水的电子式应完整标出 O 原子上的孤对电子，选项书写不完整，错误。选项 B，金属材料包括铁、铝、铜等纯金属和合金，在金属中加热熔合某些金属或非金属可制得合金。不锈钢是最常见的一种合金钢，它的合金元素主要是铬和镍。硬铝是一种铝合金，它的密度小、强度高，具有较强的抗腐蚀能力，是制造飞机和宇宙飞船的理想材料，硬铝和不锈钢均属于合金，正确。选项 C，机器人行走时依靠电池放电供电，电池放电时将化学能转化为电能，错误。选项 D，CH<sub>4</sub> 常温下为气体，不属于晶体；H<sub>2</sub>O 常温下为液体，也不是共价晶体，错误。"}, {"id": 18, "src": "2026 广州调研 3", "ans": "A", "stem": "全息投影的实现依赖于材料科学与光学技术的结合。下列说法错误的是", "opts": ["全息投影仪的光敏胶片使用的聚四氟乙烯，其单体是 CHF<sub>2</sub>=CHF<sub>2</sub>", "空气显示影像过程中通过电激发氦气发光，该过程与电子跃迁有关", "全息投影膜是一种薄而柔的聚酯膜，聚酯膜是有机高分子材料", "全息投影技术的光电器件使用氟化镓材料，氟化镓是新型无机非金属材料"], "exp": "选项 A，聚四氟乙烯（简写为 PTFE），别名铁氟龙，俗称“塑料王”，是一种以四氟乙烯作为单体聚合制得的高分子聚合物，其单体是 CF<sub>2</sub>=CF<sub>2</sub>，错误。选项 B，氦气吸收能量，使其电子跃迁到激发态，当电子从激发态回到基态时，多余能量以光子的形式释放，从而发光，正确。选项 C，聚酯膜的成分为聚酯，是一种酯的聚合物，是有机高分子材料，正确。选项 D，新型无机非金属材料包括高纯度的含硅元素的材料（如单晶硅、二氧化硅等），还有一些含有碳、氮等其他元素的陶瓷（如氮化硼等）。氟化镓由 Ga、F 等元素构成，属于新型无机非金属材料，正确。"}, {"id": 19, "src": "2026 广州一测 3", "ans": "B", "stem": "科技发展见证自立自强的奋进中国。下列说法错误的是", "opts": ["“梦天”实验舱搭载高精度铷（Sr）光钟，<sup>87</sup>Sr 与<sup>88</sup>Sr 互为同位素", "“天舟”航天器使用基于单晶硅的半导体器件，单晶硅是一种分子晶体", "“嫦娥五号”配置砷化镓（GaAs）太阳能电池，GaAs 中 Ga 的化合价为＋3", "“天问一号”使用 Ti−Ni 形状记忆合金，Ti 和 Ni 元素都位于周期表的 d 区"], "exp": "选项 A，<sup>87</sup>Sr 与<sup>88</sup>Sr 是质子数相同、中子数不同的两种核素，它们互为同位素，正确。选项 B，单晶硅由 Si 原子通过共价键结合成空间网状结构，类似金刚石，为共价晶体，不是分子晶体，错误。选项 C，GaAs 中 Ga 为金属元素，As 为非金属元素，Ga 与 Al 同主族，是第ⅢA族元素，GaAs 中 Ga 的化合价为＋3，正确。选项 D，Ti 和 Ni 元素都位于周期表的第四周期，且都是副族元素，位于元素周期表的 d 区，正确。"}, {"id": 20, "src": "2026 广州二测 3", "ans": "A", "stem": "科技发展见证自立自强的奋进中国。下列说法正确的是", "opts": ["北斗卫星使用氮化铝芯片：氮化铝属于新型无机非金属材料", "飞船返回舱表层材料使用玻璃纤维：玻璃纤维属于天然有机高分子材料", "“嫦娥六号”搭载水升华器用以降温：水升华过程中破坏了极性共价键", "我国科学家成功实现从 CO<sub>2</sub> 到淀粉的人工合成：CO<sub>2</sub> 的电子式为 O∶∶C∶∶O"], "exp": "选项 A，氮化铝是一种具有优异的导热性能、强度高、化学稳定性好的新一代散热基板和电子器件封装的理想材料，属于新型无机非金属材料，正确。选项 B，玻璃纤维是由玻璃制作成的性能优异的无机非金属材料，其优点是绝缘性好、耐热性强、抗腐蚀性好、机械强度高，玻璃纤维不属于有机物，错误。选项 C，水升华过程中克服的是分子间作用力（主要是氢键），没有破坏 O−H 键（极性共价键），错误。选项 D，CO<sub>2</sub> 的电子式中 O 原子应完整标出 2 对孤对电子，选项书写不完整，错误。"}];
var KEY = 'xz2_state', TKEY = 'xz_theme', NKEY = 'xz_name';
var N = QS.length, PER = 2;
var st = {a:{}, skip:{}, elapsed:0, started:false};
function $(id){return document.getElementById(id)}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s){st.a=s.a||{};st.skip=s.skip||{};st.elapsed=s.elapsed||0;st.started=!!s.started}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function fmt(s){s=Math.floor(s);return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2)}
function calc(){
  var ok=0;
  QS.forEach(function(q){if(st.a[q.id]===q.ans)ok++});
  var done=Object.keys(st.a).length;
  return {done:done,ok:ok,score:ok*PER};
}
function renderStats(){
  var c=calc();
  $('sProg').textContent=c.done;$('sScore').textContent=c.score;$('sOk').textContent=c.ok;$('sTime').textContent=fmt(st.elapsed);
}
function setSkip(id,on){
  var act=$('act'+id),tip=$('skd'+id),ob=$('op'+id);
  act.style.display=on?'none':'flex';
  tip.style.display=on?'block':'none';
  Array.prototype.forEach.call(ob.children,function(b){b.disabled=on||!!st.a[id]});
  $('qc'+id).classList.toggle('skipped-card',on);
}
function build(){
  var box=$('qlist');
  QS.forEach(function(q,i){
    var d=document.createElement('div');d.className='qcard';d.id='qc'+q.id;
    var h='<div class="qmeta"><span class="qno">第 '+(i+1)+' 题</span><span class="qpt">'+PER+' 分</span><span class="qsrc">'+q.src+'</span><span class="qmark" id="qm'+q.id+'"></span></div>';
    h+='<div class="stem">'+q.stem+'</div>';
    if(q.figs){q.figs.forEach(function(f){h+='<div class="qfig"><img src="'+f+'" alt="题图"></div>'})}
    h+='<div id="op'+q.id+'"></div>';
    h+='<div class="btn-row" id="act'+q.id+'"><button class="submit" id="sb'+q.id+'" disabled>提交本题</button><button class="skipbtn" id="sk'+q.id+'">跳过此题</button></div>';
    h+='<div class="skipped-tip" id="skd'+q.id+'">已跳过（不计入统计）<button class="undoskip" id="us'+q.id+'">撤销跳过</button></div>';
    h+='<div class="verdict" id="vd'+q.id+'"></div>';
    h+='<div class="exp" id="ex'+q.id+'"><div class="et">答案 '+q.ans+' · 题析</div><p>'+q.exp+'</p></div>';
    h+='<button class="next" id="nx'+q.id+'">'+(i<N-1?'下一题 →':'返回顶部生成成绩卡')+'</button>';
    d.innerHTML=h;box.appendChild(d);
    var picked=null,done=!!st.a[q.id],skipped=!!st.skip[q.id];
    var ob=$('op'+q.id);
    q.opts.forEach(function(o,j){
      var L='ABCD'[j],b=document.createElement('button');
      b.className='opt';b.innerHTML='<span class="ol">'+L+'．</span><span>'+o+'</span>';
      b.onclick=function(){
        if(done||skipped)return;
        if(!st.started){st.started=true}
        picked=L;
        Array.prototype.forEach.call(ob.children,function(c){c.classList.remove('sel')});
        b.classList.add('sel');
        $('sb'+q.id).disabled=false;
      };
      ob.appendChild(b);
    });
    if(done){
      var pick=st.a[q.id],ok=pick===q.ans;
      paintResult(q,ob,pick,ok);
      $('ex'+q.id).style.display='block';
      $('act'+q.id).style.display='none';
      $('qm'+q.id).textContent=ok?'✓':'✗';
      $('qm'+q.id).style.color=ok?'var(--ok)':'var(--bad)';
    }else if(skipped){
      setSkip(q.id,true);
    }
    $('sb'+q.id).onclick=function(){
      if(picked===null||done||skipped)return;
      done=true;
      var ok=picked===q.ans;
      st.a[q.id]=picked;
      paintResult(q,ob,picked,ok);
      var v=$('vd'+q.id);
      v.style.display='block';
      v.style.background=ok?'var(--ok-bg)':'var(--bad-bg)';
      v.style.color=ok?'var(--ok-ink)':'var(--bad-ink)';
      v.textContent=ok?'回答正确 +'+PER+' 分':'回答错误 · 正确答案 '+q.ans;
      $('qm'+q.id).textContent=ok?'✓':'✗';
      $('qm'+q.id).style.color=ok?'var(--ok)':'var(--bad)';
      $('ex'+q.id).style.display='block';
      $('act'+q.id).style.display='none';
      Array.prototype.forEach.call(ob.children,function(b){b.disabled=true});
      renderStats();save();
    };
    $('sk'+q.id).onclick=function(){
      if(done||skipped)return;
      skipped=true;st.skip[q.id]=1;
      if(!st.started){st.started=true}
      setSkip(q.id,true);save();
    };
    $('us'+q.id).onclick=function(){
      if(!skipped)return;
      skipped=false;delete st.skip[q.id];
      setSkip(q.id,false);save();
    };
    $('nx'+q.id).onclick=function(){
      if(i<N-1){var n=QS[i+1];var el=document.getElementById('qc'+n.id);el.scrollIntoView({behavior:'smooth',block:'start'})}
      else{window.scrollTo({top:0,behavior:'smooth'})}
    };
  });
}
function paintResult(q,ob,pick,ok){
  Array.prototype.forEach.call(ob.children,function(c,j){
    var L='ABCD'[j];c.disabled=true;
    if(L===q.ans)c.classList.add('rgt');
    else if(L===pick)c.classList.add('wrg');
  });
}
var timer=setInterval(function(){
  var c=calc();
  if(st.started&&c.done<N){st.elapsed++;renderStats();if(st.elapsed%5===0)save()}
},1000);
function pad(n){return ('0'+n).slice(-2)}
function showCard(){
  $('result').style.display='block';
  $('stuName').value=localStorage.getItem(NKEY)||'';
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
}
$('btnCard').onclick=function(){showCard()};
$('btnGen').onclick=function(){
  var name=$('stuName').value.trim()||'同学';
  try{localStorage.setItem(NKEY,name)}catch(e){}
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
};
$('btnClose').onclick=function(){
  $('result').style.display='none';
  var first=QS.find(function(q){return !st.a[q.id]&&!st.skip[q.id]});
  var el=first?document.getElementById('qc'+first.id):$('qlist');
  el.scrollIntoView({behavior:'smooth',block:'start'});
};
function drawCard(){
  var c=document.getElementById('canvas'),x=c.getContext('2d'),W=c.width,H=c.height;
  var g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0f172a');g.addColorStop(.55,'#152743');g.addColorStop(1,'#1b1140');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(34,211,238,.08)';x.beginPath();x.arc(W-60,60,150,0,7);x.fill();
  x.fillStyle='rgba(167,139,250,.08)';x.beginPath();x.arc(50,H-40,130,0,7);x.fill();
  x.fillStyle='#67e8f9';x.font='500 22px sans-serif';x.fillText('化学不难学 · 高考选择题训练',40,52);
  x.fillStyle='#8ea0b5';x.font='16px sans-serif';x.fillText('考点2 物质组成与性质 · 每题 '+PER+' 分',40,84);
  var name=$('stuName').value.trim()||'同学';
  x.fillStyle='#e2e8f0';x.font='500 26px sans-serif';x.fillText(name,40,150);
  var cc=calc();
  x.fillStyle='#a78bfa';x.font='700 88px sans-serif';x.fillText(cc.score,40,250);
  x.fillStyle='#8ea0b5';x.font='18px sans-serif';x.fillText('分 / 满分 '+(N*PER)+' 分',40+String(cc.score).length*52+14,250);
  var acc=cc.done?Math.round(cc.ok/cc.done*100):0;
  var cells=[['正确率',acc+'%（'+cc.ok+'/'+cc.done+'）'],['完成度',cc.done+' / '+N+' 题'],['做题时长',fmt(st.elapsed)]];
  cells.forEach(function(cell,i){
    var cx=40+i*228;
    x.fillStyle='#1e293b';x.fillRect(cx,280,208,84);
    x.fillStyle='#67e8f9';x.font='14px sans-serif';x.fillText(cell[0],cx+18,310);
    x.fillStyle='#e2e8f0';x.font='500 20px sans-serif';x.fillText(cell[1],cx+18,346);
  });
  var d=new Date();
  var stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('提交时间 '+stamp,40,400);
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('已做题号（绿=对 红=错，跳过/未做不计）',40,432);
  var doneList=QS.filter(function(q){return !!st.a[q.id]});
  doneList.forEach(function(q,i){
    var col=i%14,row=Math.floor(i/14);
    var bx=40+col*48,by=450+row*46;
    var ok=st.a[q.id]===q.ans;
    x.fillStyle=ok?'#16a34a':'#dc2626';x.fillRect(bx,by,38,36);
    x.fillStyle='#ffffff';x.font='500 16px sans-serif';x.fillText(String(q.id),bx+9,by+25);
  });
  x.fillStyle='#5b6b7f';x.font='13px sans-serif';
  x.fillText('答对 '+cc.ok+' · 答错 '+(cc.done-cc.ok)+' · 未做 '+(N-cc.done)+' · 跳过 '+Object.keys(st.skip).length,40,H-22);
  window.__lastCard={time:stamp,done:cc.done,ok:cc.ok,score:cc.score,elapsed:fmt(st.elapsed),skip:Object.keys(st.skip).length};
}
$('stuName').addEventListener('input',function(){try{localStorage.setItem(NKEY,this.value)}catch(e){}});
$('btnSave').onclick=function(){
  var a=document.createElement('a');
  a.download='选择题训练_考点2_'+(($('stuName').value.trim()||'成绩'))+'.png';
  a.href=$('canvas').toDataURL('image/png');a.click();
};
$('resetBtn').onclick=function(){
  var c=calc();
  if(c.done===0&&Object.keys(st.skip).length===0){alert('本讲还没有答题记录');return}
  if(confirm('确定清空本讲全部记录和成绩卡重新做吗？')){
    localStorage.removeItem(KEY);location.reload();
  }
};
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('themeBtn').textContent=t==='dark'?'☀':'🌙';
  try{localStorage.setItem(TKEY,t)}catch(e){}
}
$('themeBtn').onclick=function(){
  applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
};
applyTheme((function(){try{return localStorage.getItem(TKEY)||'dark'}catch(e){return 'dark'}})());
load();build();renderStats();
</script>
</body>

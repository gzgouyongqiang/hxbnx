 {"id": 3, "src": "2024 广东 10", "ans": "A", "stem": "设 Nₐ 为阿伏加德罗常数的值。下列说法正确的是", "opts": ["26 g H—C≡C—H 中含有 σ 键的数目为 3Nₐ", "1 L 1 mol·L<sup>−1</sup> NH<sub>4</sub>NO<sub>3</sub> 溶液中含 NH<sub>4</sub><sup>+</sup> 的数目为 Nₐ", "1 mol CO 和 H<sub>2</sub> 的混合气体含有的分子数目为 3Nₐ", "Na 与 H<sub>2</sub>O 反应生成 11.2 L H<sub>2</sub>，转移电子数目为 Nₐ"], "exp": "选项 A，26 g 乙炔（H—C≡C—H）的物质的量为 1 mol，H—C 单键为 σ 键，1 个 C≡C 键中含 1 个 σ 键和 2 个 π 键，则 1 个乙炔分子含 3 个 σ 键和 2 个 π 键，σ 键数目为 3Nₐ，正确。选项 B，NH<sub>4</sub><sup>+</sup> 在水溶液中会发生水解，1 L 1 mol·L<sup>−1</sup> NH<sub>4</sub>NO<sub>3</sub> 溶液中含 NH<sub>4</sub><sup>+</sup> 的数目小于 Nₐ，错误。选项 C，1 mol CO 和 H<sub>2</sub> 的混合气体含有的分子数目为 Nₐ，错误。选项 D，未说明 11.2 L H<sub>2</sub> 的温度和压强，无法计算其物质的量，也就无法判断转移电子数目；若为标准状况，11.2 L H<sub>2</sub> 为 0.5 mol，转移电子数目为 Nₐ，错误。"}, {"id": 4, "src": "2023 广东 11", "ans": "D", "stem": "设 Nₐ 为阿伏加德罗常数的值。侯氏制碱法涉及 NaCl、NH<sub>4</sub>Cl 和 NaHCO<sub>3</sub> 等物质。下列说法正确的是", "opts": ["1 mol NH<sub>4</sub>Cl 含有的共价键数目为 5Nₐ", "1 mol NaHCO<sub>3</sub> 完全分解，得到的 CO<sub>2</sub> 分子数目为 2Nₐ", "体积为 1 L 的 1 mol·L<sup>−1</sup> NaHCO<sub>3</sub> 溶液中，HCO<sub>3</sub><sup>−</sup> 数目为 Nₐ", "NaCl 和 NH<sub>4</sub>Cl 的混合物中含 1 mol Cl<sup>−</sup>，则混合物中质子数为 28Nₐ"], "exp": "选项 A，NH<sub>4</sub>Cl 是离子化合物，NH<sub>4</sub><sup>+</sup> 与 Cl<sup>−</sup> 之间是离子键，每个 NH<sub>4</sub><sup>+</sup> 中存在 4 个 N—H 共价键，1 mol NH<sub>4</sub>Cl 含有的共价键数目为 4Nₐ，错误。选项 B，NaHCO<sub>3</sub> 受热分解的化学方程式为 2NaHCO<sub>3</sub> <span class=\"rxn\"><i>△</i><em>=</em></span> Na<sub>2</sub>CO<sub>3</sub>+CO<sub>2</sub>↑+H<sub>2</sub>O，1 mol NaHCO<sub>3</sub> 完全分解得到 CO<sub>2</sub> 分子数目为 0.5Nₐ，错误。选项 C，HCO<sub>3</sub><sup>−</sup> 在水中既存在水解平衡又存在电离平衡，1 mol NaHCO<sub>3</sub> 溶液中 HCO<sub>3</sub><sup>−</sup> 数目小于 Nₐ，错误。选项 D，Na<sup>+</sup> 和 NH<sub>4</sub><sup>+</sup> 中含有的质子数均为 11，不管 NaCl 与 NH<sub>4</sub>Cl 混合比例如何，只要含 1 mol Cl<sup>−</sup>，则 Na<sup>+</sup> 和 NH<sub>4</sub><sup>+</sup> 中质子总数为 11Nₐ，加上 1 mol Cl<sup>−</sup> 的质子数 17Nₐ，混合物中质子数为 28Nₐ，正确。"}, {"id": 5, "src": "2021 广东 11", "ans": "A", "stem": "设 Nₐ 为阿伏加德罗常数的值。下列说法正确的是", "opts": ["1 mol CHCl<sub>3</sub> 含有 C—Cl 键的数目为 3Nₐ", "1 L 1.0 mol·L<sup>−1</sup> 的盐酸含有阴离子总数为 2Nₐ", "11.2 L NO 与 11.2 L O<sub>2</sub> 混合后的分子数目为 Nₐ", "23 g Na 与足量 H<sub>2</sub>O 反应生成的 H<sub>2</sub> 分子数目为 Nₐ"], "exp": "选项 A，1 mol CHCl<sub>3</sub> 含有 C—Cl 键的数目为 3Nₐ，正确。选项 B，1 L 1.0 mol·L<sup>−1</sup> 的盐酸中溶质 HCl 完全电离，含 1.0 mol H<sup>+</sup> 和 1.0 mol Cl<sup>−</sup>，还有溶剂水的微弱电离，阴离子总数约为 Nₐ（不是 2Nₐ），错误。选项 C，未说明气体的温度和压强，无法计算 11.2 L NO 和 11.2 L O<sub>2</sub> 的物质的量；且 NO 与 O<sub>2</sub> 混合后生成 NO<sub>2</sub>，NO<sub>2</sub> 还能继续生成 N<sub>2</sub>O<sub>4</sub>，分子数目无法确定，错误。选项 D，Na 与足量 H<sub>2</sub>O 反应为 2Na+2H<sub>2</sub>O═2NaOH+H<sub>2</sub>↑，23 g Na（1 mol）与足量水反应生成 0.5 mol H<sub>2</sub>，生成的 H<sub>2</sub> 分子数目为 0.5Nₐ，错误。"}, {"id": 6, "src": "2021 广东适应性 11", "ans": "C", "stem": "设阿伏加德罗常数的值为 Nₐ。下列说法正确的是", "opts": ["1 mol Cl<sub>2</sub> 和 Fe 充分反应，转移电子数为 3Nₐ", "标准状况下，1.12 L 苯含有 C—H 键的个数为 3Nₐ", "22 g CO<sub>2</sub> 和足量 Na<sub>2</sub>O<sub>2</sub> 反应，产生的气体的分子数为 0.25Nₐ", "0.5 mol 乙酸乙酯在酸性条件下水解，生成乙醇的分子数为 1.0Nₐ"], "exp": "选项 A，Cl<sub>2</sub> 和 Fe 充分反应 3Cl<sub>2</sub>+2Fe <span class=\"rxn\"><i>△</i><em>=</em></span> 2FeCl<sub>3</sub>，3 mol Cl<sub>2</sub> 反应转移 6 mol 电子，1 mol Cl<sub>2</sub> 反应转移电子数为 2Nₐ，错误。选项 B，标准状况下苯是液体，不能用气体摩尔体积 22.4 L·mol<sup>−1</sup> 计算其分子数，错误。选项 C，22 g CO<sub>2</sub> 物质的量为 0.5 mol，CO<sub>2</sub> 和足量 Na<sub>2</sub>O<sub>2</sub> 反应为 2CO<sub>2</sub>+2Na<sub>2</sub>O<sub>2</sub>═2Na<sub>2</sub>CO<sub>3</sub>+O<sub>2</sub>，0.5 mol CO<sub>2</sub> 反应生成 0.25 mol O<sub>2</sub>，产生的气体分子数为 0.25Nₐ，正确。选项 D，乙酸乙酯在酸性条件下水解生成乙酸和乙醇，该反应是可逆反应，反应物不能完全转化为生成物，0.5 mol 乙酸乙酯水解生成乙醇的分子数小于 0.5Nₐ，错误。"}, {"id": 7, "src": "2026 四川 2", "ans": "A", "stem": "设 Nₐ 为阿伏加德罗常数的值，下列说法正确的是", "opts": ["44 g 丙烷中含 σ 键的数目为 10Nₐ", "标准状况下，11.2 L CHCl<sub>3</sub> 中含氯原子的数目为 1.5Nₐ", "1.0 L 0.5 mol·L<sup>−1</sup> 的 K<sub>2</sub>S 溶液中，S<sup>2−</sup> 的数目为 0.5Nₐ", "2 mol N<sub>2</sub> 和 3 mol H<sub>2</sub> 充分反应，转移电子的数目为 6Nₐ"], "exp": "选项 A，44 g 丙烷的物质的量为 1 mol，1 个丙烷分子含 2 个 C—C 键、8 个 C—H 键，共 10 个共价键（均为 σ 键），故 1 mol 丙烷含 σ 键数目为 10Nₐ，正确。选项 B，标准状况下 CHCl<sub>3</sub> 为液体，不能用气体摩尔体积计算其物质的量，无法得出氯原子数目为 1.5Nₐ，错误。选项 C，K<sub>2</sub>S 是强碱弱酸盐，S<sup>2−</sup> 在水溶液中会发生水解，1.0 L 0.5 mol·L<sup>−1</sup> 的 K<sub>2</sub>S 溶液中 S<sup>2−</sup> 的数目小于 0.5Nₐ，错误。选项 D，合成氨反应 N<sub>2</sub>+3H<sub>2</sub> <span class=\"rxn\"><i>催化剂</i><em>⇌</em><i>高温高压</i></span> 2NH<sub>3</sub> 是可逆反应，反应物不能完全反应，3 mol H<sub>2</sub> 不能完全反应，该反应中 H 元素化合价由 0 升到 +1，转移电子数目小于 6Nₐ，错误。"}, {"id": 8, "src": "2023 浙江 6 月 7", "ans": "A", "stem": "Nₐ 为阿伏加德罗常数的值，下列说法正确的是", "opts": ["4.4 g C<sub>2</sub>H<sub>4</sub>O 中含有 σ 键数目最多为 0.7Nₐ", "1.7 g H<sub>2</sub>O<sub>2</sub> 中含有氧原子数为 0.2Nₐ", "向 1 L 0.1 mol·L<sup>−1</sup> CH<sub>3</sub>COOH 溶液通氨气至中性，铵根离子数为 0.1Nₐ", "标准状况下，11.2 L Cl<sub>2</sub> 通入水中，溶液中氯离子数为 0.5Nₐ"], "exp": "选项 A，分子式为 C<sub>2</sub>H<sub>4</sub>O 的物质为 CH<sub>3</sub>CHO（乙醛）或环氧乙烷，1 个 CH<sub>3</sub>CHO 中含 6 个 σ 键和 1 个 π 键，1 个环氧乙烷分子中含 7 个 σ 键。4.4 g C<sub>2</sub>H<sub>4</sub>O 物质的量为 0.1 mol，含 σ 键数目最多为 0.7Nₐ，正确。选项 B，1.7 g H<sub>2</sub>O<sub>2</sub> 的物质的量为 0.05 mol，含有氧原子数为 0.1Nₐ，错误。选项 C，向 1 L 0.1 mol·L<sup>−1</sup> CH<sub>3</sub>COOH 溶液通氨气至中性，由电荷守恒 c(CH<sub>3</sub>COO<sup>−</sup>)+c(OH<sup>−</sup>)=c(NH<sub>4</sub><sup>+</sup>)+c(H<sup>+</sup>)，中性时 c(OH<sup>−</sup>)=c(H<sup>+</sup>)，故 c(CH<sub>3</sub>COO<sup>−</sup>)=c(NH<sub>4</sub><sup>+</sup>)，由物料守恒 n(CH<sub>3</sub>COO<sup>−</sup>)+n(CH<sub>3</sub>COOH)=0.1 mol，故铵根离子数小于 0.1Nₐ，错误。选项 D，标准状况下 11.2 L Cl<sub>2</sub> 的物质的量为 0.5 mol，通入水中后部分 Cl<sub>2</sub> 与水反应生成 HCl 和 HClO，溶液中氯离子数小于 0.5Nₐ，错误。"}, {"id": 9, "src": "2022 浙江 1 月 12", "ans": "A", "stem": "设 Nₐ 为阿伏加德罗常数的值，下列说法正确的是", "opts": ["在 25 ℃时，1 L pH 为 12 的 Ba(OH)<sub>2</sub> 溶液中含有 OH<sup>−</sup> 数目为 0.01Nₐ", "1.8 g 重水(D<sub>2</sub>O)中所含质子数为 Nₐ", "足量的浓盐酸与 8.7 g MnO<sub>2</sub> 反应，转移电子的数目为 0.4Nₐ", "32 g 甲醇的分子中含有 C—H 键的数目为 4Nₐ"], "exp": "选项 A，25 ℃时 pH=12 的 Ba(OH)<sub>2</sub> 溶液中 c(OH<sup>−</sup>)=0.01 mol·L<sup>−1</sup>，1 L 溶液中 OH<sup>−</sup> 的物质的量为 0.01 mol，数目为 0.01Nₐ，正确。选项 B，1.8 g 重水(D<sub>2</sub>O)的物质的量为 0.09 mol，1 个 D<sub>2</sub>O 分子含 10 个质子，所含质子数为 0.9Nₐ，错误。选项 C，足量浓盐酸与 MnO<sub>2</sub> 反应为 MnO<sub>2</sub>+4HCl(浓) <span class=\"rxn\"><i>△</i><em>=</em></span> MnCl<sub>2</sub>+Cl<sub>2</sub>↑+2H<sub>2</sub>O，8.7 g MnO<sub>2</sub> 即 0.1 mol，反应中转移电子的数目为 0.2Nₐ，错误。选项 D，甲醇的结构简式为 CH<sub>3</sub>OH，32 g CH<sub>3</sub>OH 即 1 mol，分子中含 C—H 键的数目为 3Nₐ，错误。"}, {"id": 10, "src": "2024 河北 4", "ans": "A", "stem": "超氧化钾(KO<sub>2</sub>)可用作潜水或宇航装置的 CO<sub>2</sub> 吸收剂和供氧剂，反应为 4KO<sub>2</sub>+2CO<sub>2</sub>═2K<sub>2</sub>CO<sub>3</sub>+3O<sub>2</sub>，Nₐ 为阿伏加德罗常数的值。下列说法正确的是", "opts": ["44 g CO<sub>2</sub> 中 σ 键的数目为 2Nₐ", "KO<sub>2</sub> 晶体中离子的数目为 3Nₐ", "1 L 1 mol·L<sup>−1</sup> K<sub>2</sub>CO<sub>3</sub> 溶液中 CO<sub>3</sub><sup>2−</sup> 的数目为 Nₐ", "该反应中每转移 1 mol 电子生成 O<sub>2</sub> 的数目为 1.5Nₐ"], "exp": "选项 A，44 g CO<sub>2</sub> 即 1 mol CO<sub>2</sub>，CO<sub>2</sub> 的结构式为 O=C=O，1 mol CO<sub>2</sub> 中 σ 键的数目为 2Nₐ，正确。选项 B，KO<sub>2</sub> 由 K<sup>+</sup> 和 O<sub>2</sub><sup>−</sup> 构成，1 mol KO<sub>2</sub> 晶体中离子的数目为 2Nₐ，错误。选项 C，CO<sub>3</sub><sup>2−</sup> 在水溶液中会发生水解反应 CO<sub>3</sub><sup>2−</sup>+H<sub>2</sub>O ⇌ HCO<sub>3</sub><sup>−</sup>+OH<sup>−</sup>，1 L 1 mol·L<sup>−1</sup> K<sub>2</sub>CO<sub>3</sub> 溶液中 CO<sub>3</sub><sup>2−</sup> 的数目小于 Nₐ，错误。选项 D，4 mol KO<sub>2</sub> 参加反应生成 3 mol O<sub>2</sub>，转移 3 mol 电子，即每转移 1 mol 电子生成 O<sub>2</sub> 的数目为 Nₐ，错误。"}, {"id": 11, "src": "2023 全国甲卷 10", "ans": "A", "stem": "Nₐ 为阿伏加德罗常数的值。下列说法正确的是", "opts": ["0.5 mol 异丁烷分子中共价键的数目为 6.5Nₐ", "标准状况下，2.24 L SO<sub>3</sub> 中电子的数目为 4.00Nₐ", "1.0 L pH=2 的 H<sub>2</sub>SO<sub>4</sub> 溶液中 H<sup>+</sup> 的数目为 0.02Nₐ", "1.0 L 1.0 mol·L<sup>−1</sup> 的 Na<sub>2</sub>CO<sub>3</sub> 溶液中 CO<sub>3</sub><sup>2−</sup> 的数目为 1.0Nₐ"], "exp": "选项 A，异丁烷的结构为 (CH<sub>3</sub>)<sub>3</sub>CH，1 mol 异丁烷分子含 13 mol 共价键，则 0.5 mol 异丁烷分子中共价键数目为 6.5Nₐ，正确。选项 B，标准状况下 SO<sub>3</sub> 为固态，不能用气体摩尔体积 22.4 L·mol<sup>−1</sup> 计算 2.24 L SO<sub>3</sub> 的物质的量，无法求其电子数目，错误。选项 C，pH=2 的 H<sub>2</sub>SO<sub>4</sub> 溶液中 c(H<sup>+</sup>)=0.01 mol·L<sup>−1</sup>，1.0 L 溶液中 H<sup>+</sup> 数目为 0.01Nₐ，错误。选项 D，CO<sub>3</sub><sup>2−</sup> 在水溶液中会发生水解，1.0 L 1.0 mol·L<sup>−1</sup> 的 Na<sub>2</sub>CO<sub>3</sub> 溶液中 CO<sub>3</sub><sup>2−</sup> 的数目小于 1.0Nₐ，错误。"}, {"id": 12, "src": "2024 广州调研 11", "ans": "B", "stem": "设 Nₐ 为阿伏加德罗常数的值。氯碱工业涉及 NaCl、Cl<sub>2</sub>、H<sub>2</sub>、NaOH 等物质，下列说法正确的是", "opts": ["1.0 mol·L<sup>−1</sup> NaCl 溶液中 Cl<sup>−</sup> 数目为 Nₐ", "电解生成 1 mol Cl<sub>2</sub> 理论上转移电子数为 2Nₐ", "标准状况下 22.4 L H<sub>2</sub> 的质子数为 Nₐ", "40 g NaOH 固体中含有极性共价键的数目为 2Nₐ"], "exp": "选项 A，1 mol·L<sup>−1</sup> NaCl 溶液的体积不确定，无法计算 Cl<sup>−</sup> 数目，错误。选项 B，氯碱工业中电解饱和食盐水的反应为 2NaCl+2H<sub>2</sub>O <span class=\"rxn\"><i>电解</i><em>=</em></span> 2NaOH+H<sub>2</sub>↑+Cl<sub>2</sub>↑，则电解生成 1 mol Cl<sub>2</sub> 转移电子数为 2Nₐ，正确。选项 C，标准状况下 22.4 L H<sub>2</sub> 的物质的量是 1 mol，1 mol H<sub>2</sub> 的质子数为 2Nₐ，错误。选项 D，40 g NaOH 的物质的量是 1 mol，1 mol NaOH 中含有的极性共价键（O—H）数目为 Nₐ，错误。"}, {"id": 13, "src": "2024 广州一测 11", "ans": "D", "stem": "设 Nₐ 为阿伏加德罗常数的值。工业上制备硫酸涉及 S、SO<sub>2</sub>、SO<sub>3</sub>、H<sub>2</sub>SO<sub>4</sub> 等物质。下列说法正确的是", "opts": ["32 g S<sub>8</sub> 分子中含有的质子数为 2Nₐ", "2 mol SO<sub>2</sub> 和 1 mol O<sub>2</sub> 充分反应后分子总数为 2Nₐ", "标准状况下，2.24 L SO<sub>3</sub> 中分子的数目为 0.1Nₐ", "1.0 L pH=2 的 H<sub>2</sub>SO<sub>4</sub> 溶液中 H<sup>+</sup> 数目为 0.01Nₐ"], "exp": "选项 A，32 g S<sub>8</sub> 含有 1 mol S，1 mol S 中含 16 mol 质子，则质子数为 16Nₐ，错误。选项 B，SO<sub>2</sub> 与 O<sub>2</sub> 的反应是可逆反应，存在反应限度，2 mol SO<sub>2</sub> 和 1 mol O<sub>2</sub> 不能完全反应产生 2 mol SO<sub>3</sub>，故反应后分子总数大于 2Nₐ，错误。选项 C，标准状况下 SO<sub>3</sub> 是固体，不能用气体摩尔体积 22.4 L·mol<sup>−1</sup> 计算其物质的量，错误。选项 D，pH=2 的 H<sub>2</sub>SO<sub>4</sub> 溶液中 c(H<sup>+</sup>)=1×10<sup>−2</sup> mol·L<sup>−1</sup>，1.0 L 该溶液中 H<sup>+</sup> 的物质的量为 0.01 mol，H<sup>+</sup> 数目为 0.01Nₐ，正确。"}, {"id": 14, "src": "2024 广州二测 12", "ans": "B", "stem": "设 Nₐ 为阿伏加德罗常数的值。我国古代四大发明之一的黑火药由硫黄粉、硝酸钾和木炭混合而成，爆炸时生成硫化钾、氮气和二氧化碳。下列说法正确的是", "opts": ["28 g N<sub>2</sub> 中含有共用电子对数目为 2Nₐ", "0.1 mol K<sub>2</sub>S 晶体中含有 S<sup>2−</sup> 数目为 0.1Nₐ", "标准状况下，22.4 L CO<sub>2</sub> 含有的电子数目为 16Nₐ", "0.1 mol·L<sup>−1</sup> 的 KNO<sub>3</sub> 溶液中含离子总数目为 0.2 function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function fmt(s){s=Math.floor(s);return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2)}
/* ===== 小玉/小岩 立绘与语音（素材与模式复用自 walk 模块） ===== */
var FACE_VER='?v=20261117';
var YU_BASE='../assets/xiaoyu/xiaoyu_', YAN_BASE='../assets/xiaoyan/xiaoyan_';
var curAudio=null, faceTimers={};
function setFace(fid,base,name,hold){
  var img=$(fid);if(!img)return;
  img.src=base+name+'.webp'+FACE_VER;
  if(faceTimers[fid])clearTimeout(faceTimers[fid]);
  if(name!=='idle'){faceTimers[fid]=setTimeout(function(){setFace(fid,base,'idle')},hold||2600)}
}
function playVoice(src){
  try{if(curAudio){curAudio.pause();curAudio=null}}catch(e){}
  try{
    var a=new Audio(src);
    curAudio=a;
    a.onerror=function(){if(curAudio===a)curAudio=null};
    a.play().catch(function(){});
  }catch(e){}
}
function calc(){
  var ok=0;
  QS.forEach(function(q){if(st.a[q.id]===q.ans&&st.help[q.id]!=='rock')ok++});
  var done=Object.keys(st.a).length;
  return {done:done,ok:ok,score:ok*PER};
}
function renderStats(){
  var c=calc();
  $('sProg').textContent=c.done;$('sScore').textContent=c.score;$('sOk').textContent=c.ok;$('sTime').textContent=fmt(st.elapsed);

    $('rk'+q.id).onclick=function(){
      if(done||skipped)return;
      if(!confirm('看小岩详解后，本题将计 0 分（即使答对）。确定求助吗？'))return;
      st.help[q.id]='rock';delete st.fold[q.id];
      if(!st.started){st.started=true}
      $('rbx'+q.id).style.display='flex';
      $('rk'+q.id).style.opacity=.5;
      setFace('rf'+q.id,YAN_BASE,'write',2400);
      setTimeout(function(){if(st.help[q.id]==='rock')setFace('rf'+q.id,YAN_BASE,'think',2600)},2700);
      playVoice('../assets/xz/audio/xiaoyan_hi.mp3');
      renderStats();save();
    };
    $('jcx'+q.id).onclick=function(){st.fold[q.id]=1;$('jbx'+q.id).style.display='none';save()};
    $('rcx'+q.id).onclick=function(){
      st.fold[q.id]=1;save();
      $('rbx'+q.id).style.display='none';
      if(done){$('ex'+q.id).style.display='block'}
    };
    $('sk'+q.id).onclick=function(){
      if(done||skipped)return;
      skipped=true;st.skip[q.id]=1;
      if(!st.started){st.started=true}
      setSkip(q.id,true);save();
    };
    $('us'+q.id).onclick=function(){
      if(!skipped)return;
      skipped=false;delete st.skip[q.id];
      setSkip(q.id,false);save();
    };
    $('nx'+q.id).onclick=function(){
      if(i<N-1){var n=QS[i+1];var el=document.getElementById('qc'+n.id);el.scrollIntoView({behavior:'smooth',block:'start'})}
      else{window.scrollTo({top:0,behavior:'smooth'})}
    };
  });
}
function paintResult(q,ob,pick,ok){
  Array.prototype.forEach.call(ob.children,function(c,j){
    var L='ABCD'[j];c.disabled=true;
    if(L===q.ans)c.classList.add('rgt');
    else if(L===pick)c.classList.add('wrg');
  });
}
var timer=setInterval(function(){
  var c=calc();
  if(st.started&&c.done<N){st.elapsed++;renderStats();if(st.elapsed%5===0)save()}
},1000);
function pad(n){return ('0'+n).slice(-2)}
function showCard(){
  $('result').style.display='block';
  $('stuName').value=localStorage.getItem(NKEY)||'';
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
}
$('btnCard').onclick=function(){showCard()};
$('btnGen').onclick=function(){
  var name=$('stuName').value.trim()||'同学';
  try{localStorage.setItem(NKEY,name)}catch(e){}
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
};
$('btnClose').onclick=function(){
  $('result').style.display='none';
  var first=QS.find(function(q){return !st.a[q.id]&&!st.skip[q.id]});
  var el=first?document.getElementById('qc'+first.id):$('qlist');
  el.scrollIntoView({behavior:'smooth',block:'start'});
};
function drawCard(){
  var c=document.getElementById('canvas'),x=c.getContext('2d'),W=c.width,H=c.height;
  var g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0f172a');g.addColorStop(.55,'#152743');g.addColorStop(1,'#1b1140');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(34,211,238,.08)';x.beginPath();x.arc(W-60,60,150,0,7);x.fill();
  x.fillStyle='rgba(167,139,250,.08)';x.beginPath();x.arc(50,H-40,130,0,7);x.fill();
  x.fillStyle='#67e8f9';x.font='500 22px sans-serif';x.fillText('化学不难学 · 高考选择题训练',40,52);
  x.fillStyle='#8ea0b5';x.font='16px sans-serif';x.fillText('考点9 阿伏加德罗常数 · 每题 '+PER+' 分',40,84);
  var name=$('stuName').value.trim()||'同学';
  x.fillStyle='#e2e8f0';x.font='500 26px sans-serif';x.fillText(name,40,150);
  var cc=calc();
  x.fillStyle='#a78bfa';x.font='700 88px sans-serif';x.fillText(cc.score,40,250);
  x.fillStyle='#8ea0b5';x.font='18px sans-serif';x.fillText('分 / 满分 '+(N*PER)+' 分',40+String(cc.score).length*52+14,250);
  var acc=cc.done?Math.round(cc.ok/cc.done*100):0;
  var cells=[['正确率',acc+'%（'+cc.ok+'/'+cc.done+'）'],['完成度',cc.done+' / '+N+' 题'],['做题时长',fmt(st.elapsed)]];
  cells.forEach(function(cell,i){
    var cx=40+i*228;
    x.fillStyle='#1e293b';x.fillRect(cx,280,208,84);
    x.fillStyle='#67e8f9';x.font='14px sans-serif';x.fillText(cell[0],cx+18,310);
    x.fillStyle='#e2e8f0';x.font='500 20px sans-serif';x.fillText(cell[1],cx+18,346);
  });
  var d=new Date();
  var stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('提交时间 '+stamp,40,400);
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('已做题号（绿=自己对 蓝=问小玉 橙=问小岩0分 红=自己错）',40,432);
  var doneList=QS.filter(function(q){return !!st.a[q.id]});
  var jadeN=0,rockN=0;
  doneList.forEach(function(q,i){
    var col=i%14,row=Math.floor(i/14);
    var bx=40+col*48,by=450+row*46;
    var ok=st.a[q.id]===q.ans,h=st.help[q.id];
    var colr=h==='rock'?'#d97706':h==='jade'?'#3b82f6':(ok?'#16a34a':'#dc2626');
    if(h==='rock')rockN++;if(h==='jade')jadeN++;
    x.fillStyle=colr;x.fillRect(bx,by,38,36);
    x.fillStyle='#ffffff';x.font='500 16px sans-serif';x.fillText(String(q.id),bx+9,by+25);
  });
  x.fillStyle='#5b6b7f';x.font='13px sans-serif';
  x.fillText('答对 '+cc.ok+' · 答错 '+(cc.done-cc.ok)+' · 问小玉 '+jadeN+' · 问小岩 '+rockN+' · 未做 '+(N-cc.done)+' · 跳过 '+Object.keys(st.skip).length,40,H-22);
  window.__lastCard={time:stamp,done:cc.done,ok:cc.ok,score:cc.score,elapsed:fmt(st.elapsed),skip:Object.keys(st.skip).length,jade:jadeN,rock:rockN};
}
$('stuName').addEventListener('input',function(){try{localStorage.setItem(NKEY,this.value)}catch(e){}});
$('btnSave').onclick=function(){
  var a=document.createElement('a');
  a.download='选择题训练_考点9_'+(($('stuName').value.trim()||'成绩'))+'.png';
  a.href=$('canvas').toDataURL('image/png');a.click();
};
$('resetBtn').onclick=function(){
  var c=calc();
  if(c.done===0&&Object.keys(st.skip).length===0){alert('本讲还没有答题记录');return}
  if(confirm('确定清空本讲全部记录和成绩卡重新做吗？')){
    localStorage.removeItem(KEY);location.reload();
  }
};
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('themeBtn').textContent=t==='dark'?'☀':'🌙';
  try{localStorage.setItem(TKEY,t)}catch(e){}
}
$('themeBtn').onclick=function(){
  applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
};
applyTheme((function(){try{return localStorage.getItem(TKEY)||'dark'}catch(e){return 'dark'}})());
load();build();renderStats();
</script>
</body>
</html>

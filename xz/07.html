": "选项 A，若 a 在沸水中可生成 e，e 是碱，其中金属元素的化合价为 +2，则 a 为 Mg，f 为 Mg<sup>2+</sup>。a→f 的反应有多种，Mg+Cl<sub>2</sub> <span class=\"rxn\"><i>点燃</i><em>=</em></span> MgCl<sub>2</sub>，该反应属于化合反应；Mg+2HCl=MgCl<sub>2</sub>+H<sub>2</sub>↑，该反应属于置换反应，因此 a→f 的反应不一定是化合反应。选项 B，在 g→f→e→d 转化过程中，g 为 FeO，f 为 Fe<sup>2+</sup>，e 为白色沉淀 Fe(OH)<sub>2</sub>，d 为红褐色沉淀 Fe(OH)<sub>3</sub>，说明在 FeO→Fe<sup>2+</sup>→Fe(OH)<sub>2</sub>→Fe(OH)<sub>3</sub> 转化过程中，物质颜色的变化为黑色→浅绿色→白色沉淀→红褐色沉淀。选项 C，加热 c 的饱和溶液，c 为 Fe<sup>3+</sup> 或 Al<sup>3+</sup>，向沸水中逐滴加入 5～6 滴饱和 FeCl<sub>3</sub> 溶液，继续煮沸至液体呈红褐色，停止加热，可制得 Fe(OH)<sub>3</sub> 胶体，能产生丁达尔效应；若加热 Al<sup>3+</sup> 的饱和溶液，不会形成能产生丁达尔效应的红棕色分散系。选项 D，若 b 为 Al<sub>2</sub>O<sub>3</sub>，d 为 Al(OH)<sub>3</sub>，c 为铝盐，Al<sub>2</sub>O<sub>3</sub>、Al(OH)<sub>3</sub> 与稀盐酸反应均生成铝盐，组成 a 的元素为 Al，位于周期表 p 区；若 b 为 Fe<sub>2</sub>O<sub>3</sub>，d 为 Fe(OH)<sub>3</sub>，c 为铁盐，Fe<sub>2</sub>O<sub>3</sub>、Fe(OH)<sub>3</sub> 与稀盐酸反应均生成铁盐，组成 a 的元素为 Fe，位于周期表 d 区。"}, {"id": 4, "src": "2023 广东 10", "ans": "B", "figs": ["figs/k7/q4.png"], "stem": "部分含 Na 或含 Cu 物质的分类与相应化合价关系如图所示。下列推断不合理的是", "opts": ["可存在 c→d→e 的转化", "能与 H<sub>2</sub>O 反应生成 c 的物质只有 b", "新制的 d 可用于检验葡萄糖中的醛基", "若 b 能与 H<sub>2</sub>O 反应生成 O<sub>2</sub>，则 b 中含共价键"], "exp": "选项 A，若 c 为 NaOH，d 为 Cu(OH)<sub>2</sub>，e 为 CuO，NaOH 和 CuSO<sub>4</sub> 反应生成 Cu(OH)<sub>2</sub> 沉淀，Cu(OH)<sub>2</sub> 受热分解生成 CuO，所以存在 c→d→e 的转化。选项 B，Na、Na<sub>2</sub>O、Na<sub>2</sub>O<sub>2</sub> 都能与 H<sub>2</sub>O 反应生成 NaOH。选项 C，新制 Cu(OH)<sub>2</sub> 可用于检验葡萄糖中的醛基，现象是生成砖红色沉淀。选项 D，若 b 能与 H<sub>2</sub>O 反应生成 O<sub>2</sub>，则 b 为 Na<sub>2</sub>O<sub>2</sub>，发生的反应为 2Na<sub>2</sub>O<sub>2</sub>+2H<sub>2</sub>O=4NaOH+O<sub>2</sub>↑，Na<sub>2</sub>O<sub>2</sub> 中含离子键和共价键。"}, {"id": 5, "src": "2021 广东 10", "ans": "C", "figs": ["figs/k7/q5.png"], "stem": "部分含铁物质的分类与相应化合价关系如图所示。下列推断不合理的是", "opts": ["a 可与 e 反应生成 b", "b 既可被氧化，也可被还原", "可将 e 加入浓碱液中制得 d 的胶体", "可存在 b→c→d→e→b 的循环转化关系"], "exp": "选项 A，Fe 与 Fe<sup>3+</sup> 反应生成 Fe<sup>2+</sup>，发生反应 Fe+2FeCl<sub>3</sub>=3FeCl<sub>2</sub>。选项 B，Fe<sup>2+</sup> 为铁元素的中间价态，既有还原性也有氧化性，因此既可被氧化，也可被还原。选项 C，Fe(OH)<sub>3</sub> 胶体的制备方法为向沸水中逐滴加入 5～6 滴饱和 FeCl<sub>3</sub> 溶液，继续煮沸至液体呈红褐色，停止加热，可制得 Fe(OH)<sub>3</sub> 胶体；Fe<sup>3+</sup> 与浓碱液反应生成 Fe(OH)<sub>3</sub> 沉淀。选项 D，b→c→d→e→b 转化如下：FeCl<sub>2</sub> <span class=\"rxn\"><i>NaOH</i><em>→</em></span> Fe(OH)<sub>2</sub> <span class=\"rxn\"><i>O<sub>2</sub>、H<sub>2</sub>O</i><em>→</em></span> Fe(OH)<sub>3</sub> <span class=\"rxn\"><i>稀盐酸</i><em>→</em></span> FeCl<sub>3</sub> <span class=\"rxn\"><i>Fe</i><em>→</em></span> FeCl<sub>2</sub>，可存在 b→c→d→e→b 的循环转化关系。"}, {"id": 6, "src": "2021 广东适应性 10", "ans": "B", "figs": ["figs/k7/q6.png"], "stem": "部分含氮物质的分类与相应氮元素的化合价关系如图所示。下列说法错误的是", "opts": ["a 可经催化氧化生成 b", "b 为红棕色，可转化为 c", "密闭体系中，c 存在 2NO<sub>2</sub>⇌N<sub>2</sub>O<sub>4</sub>", "d 的溶液与 Cu 反应可生成 b 或 c"], "exp": "选项 A，NH<sub>3</sub> 经催化氧化生成 NO，发生反应为 4NH<sub>3</sub>+5O<sub>2</sub> <span class=\"rxn\"><i>催化剂</i><em>=</em><i>Δ</i></span> 4NO+6H<sub>2</sub>O。选项 B，b 为 NO，NO 为无色气体，b 可转化为 c，c 为 NO<sub>2</sub>，NO<sub>2</sub> 为红棕色气体。选项 C，NO<sub>2</sub> 在常温下即可转化为 N<sub>2</sub>O<sub>4</sub>，存在 2NO<sub>2</sub>⇌N<sub>2</sub>O<sub>4</sub>。选项 D，d 的溶液为 HNO<sub>3</sub> 溶液，若为稀硝酸，则与 Cu 反应生成 NO；若为浓硝酸，则与 Cu 反应生成 NO<sub>2</sub>。"}, {"id": 7, "src": "2026 广东 14", "ans": "C", "stem": "下列物质性质实验对应的反应方程式书写错误的是", "opts": ["Al<sub>2</sub>O<sub>3</sub> 溶于 NaOH 溶液：Al<sub>2</sub>O<sub>3</sub>+2OH<sup>−</sup>+3H<sub>2</sub>O=2[Al(OH)<sub>4</sub>]<sup>−</sup>", "铜丝插入热的浓硫酸中：Cu+2H<sub>2</sub>SO<sub>4</sub>(浓) <span class=\"rxn\"><i>Δ</i><em>=</em></span> CuSO<sub>4</sub>+2H<sub>2</sub>O+SO<sub>2</sub>↑", "6-羟基己酸的缩聚反应：nHOOC(CH<sub>2</sub>)<sub>5</sub>OH <span class=\"rxn\"><i>催化剂</i><em>⇌</em><i>Δ</i></span> HO[CO(CH<sub>2</sub>)<sub>5</sub>O]<sub>n</sub>H+nH<sub>2</sub>O", "乙醛被 Cu(OH)<sub>2</sub> 氧化：CH<sub>3</sub>CHO+2Cu(OH)<sub>2</sub>+OH<sup>−</sup> <span class=\"rxn\"><i>Δ</i><em>→</em></span> CH<sub>3</sub>COO<sup>−</sup>+Cu<sub>2</sub>O↓+3H<sub>2</sub>O"], "exp": "选项 A，Al<sub>2</sub>O<sub>3</sub> 为两性氧化物，可与 NaOH 溶液反应生成 Na[Al(OH)<sub>4</sub>]。选项 B，热的浓硫酸具有强氧化性，可氧化 Cu 生成 CuSO<sub>4</sub>、SO<sub>2</sub> 和水。选项 C，n 个 6-羟基己酸发生缩聚反应时，生成 1 分子高聚物，生成小分子的物质的量一般为 n−1，6-羟基己酸的缩聚反应为 nHOOC(CH<sub>2</sub>)<sub>5</sub>OH <span class=\"rxn\"><i>催化剂</i><em>⇌</em><i>Δ</i></span> HO[CO(CH<sub>2</sub>)<sub>5</sub>O]<sub>n</sub>H+(n−1)H<sub>2</sub>O。选项 D，乙醛可被新制 Cu(OH)<sub>2</sub> 等氧化剂氧化为乙酸盐，同时生成砖红色 Cu<sub>2</sub>O 沉淀。"}, {"id": 8, "src": "2022 广东 14", "ans": "B", "stem": "下列关于 Na 的化合物之间转化反应的离子方程式书写正确的是", "opts": ["碱转化为酸式盐：OH<sup>−</sup>+2H<sup>+</sup>+CO<sub>3</sub><sup>2−</sup>=HCO<sub>3</sub><sup>−</sup>+2H<sub>2</sub>O", "碱转化为两种盐：2OH<sup>−</sup>+Cl<sub>2</sub>=ClO<sup>−</sup>+Cl<sup>−</sup>+H<sub>2</sub>O", "过氧化物转化为碱：2O<sub>2</sub><sup>2−</sup>+2H<sub>2</sub>O=4OH<sup>−</sup>+O<sub>2</sub>↑", "盐转化为另一种盐：Na<sub>2</sub>SiO<sub>3</sub>+2H<sup>+</sup>=H<sub>2</sub>SiO<sub>3</sub>↓+2Na<sup>+</sup>"], "exp": "选项 A，碱转化为酸式盐，可以将碱与多元弱酸反应。例如，将 NaOH 转化为 NaHCO<sub>3</sub>，可以将 NaOH 溶液与 H<sub>2</sub>CO<sub>3</sub> 反应，题中 H<sub>2</sub>CO<sub>3</sub> 不可拆，同时也不满足原子守恒；若将碱转化为酸式盐，也可以在 NaOH 溶液中通入过量 CO<sub>2</sub>，NaOH 转化为 NaHCO<sub>3</sub>，离子方程式为 CO<sub>2</sub>+OH<sup>−</sup>=HCO<sub>3</sub><sup>−</sup>。选项 B，碱转化为两种盐，在 NaOH 溶液中通入 Cl<sub>2</sub> 反应生成 NaCl 和 NaClO 两种盐，离子方程式为 2OH<sup>−</sup>+Cl<sub>2</sub>=ClO<sup>−</sup>+Cl<sup>−</sup>+H<sub>2</sub>O。选项 C，过氧化物转化为碱，可以将 Na<sub>2</sub>O<sub>2</sub> 加入水中反应生成 NaOH 溶液，离子方程式为 2Na<sub>2</sub>O<sub>2</sub>+2H<sub>2</sub>O=4Na<sup>+</sup>+4OH<sup>−</sup>+O<sub>2</sub>↑。选项 D，盐转化为另一种盐，可利用强酸制弱酸，Na<sub>2</sub>SiO<sub>3</sub> 溶液和盐酸反应得到 NaCl 和 H<sub>2</sub>SiO<sub>3</sub>。Na<sub>2</sub>SiO<sub>3</sub> 是可溶性的强电解质，在水中完全电离成 Na<sup>+</sup> 和 SiO<sub>3</sub><sup>2−</sup>，Na<sub>2</sub>SiO<sub>3</sub> 溶液和盐酸反应的离子方程式为 SiO<sub>3</sub><sup>2−</sup>+2H<sup>+</sup>=H<sub>2</sub>SiO<sub>3</sub>↓。"}, {"id": 9, "src": "2021 广东 15", "ans": "D", "stem": "宏观辨识与微观探析是化学学科核心素养之一。下列物质性质实验对应的反应方程式书写正确的是", "opts": ["Na<sub>2</sub>O<sub>2</sub> 放入水中：Na<sub>2</sub>O<sub>2</sub>+H<sub>2</sub>O=2NaOH+O<sub>2</sub>↑", "H<sub>2</sub>O(g) 通过灼热铁粉：3H<sub>2</sub>O+2Fe=Fe<sub>2</sub>O<sub>3</sub>+3H<sub>2</sub>", "铜丝插入热的浓硫酸中：Cu+H<sub>2</sub>SO<sub>4</sub>=CuSO<sub>4</sub>+H<sub>2</sub>↑", "SO<sub>2</sub> 通入酸性 KMnO<sub>4</sub> 溶液中：5SO<sub>2</sub>+2H<sub>2</sub>O+2MnO<sub>4</sub><sup>−</sup>=5SO<sub>4</sub><sup>2−</sup>+4H<sup>+</sup>+2Mn<sup>2+</sup>"], "exp": "选项 A，化学方程式没有配平，应为 2Na<sub>2</sub>O<sub>2</sub>+2H<sub>2</sub>O=4NaOH+O<sub>2</sub>↑。选项 B，H<sub>2</sub>O(g) 通过灼热铁粉的产物应是 Fe<sub>3</sub>O<sub>4</sub>，化学方程式为 4H<sub>2</sub>O(g)+3Fe <span class=\"rxn\"><i>高温</i><em>=</em></span> Fe<sub>3</sub>O<sub>4</sub>+4H<sub>2</sub>。选项 C，浓硫酸体现强氧化性，铜丝插入热的浓硫酸中生成硫酸铜、SO<sub>2</sub> 和水，化学方程式为 Cu+2H<sub>2</sub>SO<sub>4</sub>(浓) <span class=\"rxn\"><i>Δ</i><em>=</em></span> CuSO<sub>4</sub>+SO<sub>2</sub>↑+2H<sub>2</sub>O。选项 D，产物正确、质量守恒、得失电子数守恒。"}, {"id": 10, "src": "2026 四川 5", "ans": "A", "stem": "下列实验中所涉及反应的离子方程式正确的是", "opts": ["碘化银浊液中滴入硫化钠溶液：2AgI(s)+S<sup>2−</sup>(aq)⇌Ag<sub>2</sub>S(s)+2I<sup>−</sup>(aq)", "碳酸氢钠溶液中滴入稀硫酸：CO<sub>3</sub><sup>2−</sup>+2H<sup>+</sup>=CO<sub>2</sub>↑+H<sub>2</sub>O", "铜粉中滴入稀硝酸：Cu+4H<sup>+</sup>+2NO<sub>3</sub><sup>−</sup>=Cu<sup>2+</sup>+2NO<sub>2</sub>↑+2H<sub>2</sub>O", "银氨溶液中滴入稀盐酸：[Ag(NH<sub>3</sub>)<sub>2</sub>]<sup>+</sup>+2H<sup>+</sup>=Ag<sup>+</sup>+2NH<sub>4</sub><sup>+</sup>"], "exp": "选项 A，AgI 属于难溶电解质，Ag<sub>2</sub>S 的溶解度小于 AgI 的，向碘化银浊液中滴入硫化钠溶液生成 Ag<sub>2</sub>S 沉淀，实现沉淀的转化，离子方程式正确。选项 B，HCO<sub>3</sub><sup>−</sup> 是弱酸的酸式酸根，不能拆分为 CO<sub>3</sub><sup>2−</sup>，离子方程式为 HCO<sub>3</sub><sup>−</sup>+H<sup>+</sup>=CO<sub>2</sub>↑+H<sub>2</sub>O。选项 C，铜与稀硝酸反应的还原产物为 NO，离子方程式为 3Cu+8H<sup>+</sup>+2NO<sub>3</sub><sup>−</sup>=3Cu<sup>2+</sup>+2NO↑+4H<sub>2</sub>O。选项 D，银氨溶液中滴入稀盐酸，[Ag(NH<sub>3</sub>)<sub>2</sub>]OH 解离出的 Ag<sup>+</sup> 会与 Cl<sup>−</sup> 结合生成 AgCl 沉淀，离子方程式为 [Ag(NH<sub>3</sub>)<sub>2</sub>]<sup>+</sup>+OH<sup>−</sup>+Cl<sup>−</sup>+3H<sup>+</sup>=AgCl↓+2NH<sub>4</sub><sup>+</sup>+H<sub>2</sub>O。"}, {"id": 11, "src": "2024 重庆 8", "ans": "C", "figs": ["figs/k7/q11.png"], "stem": "单质 M 的相关转化如图所示。下列说法错误的是", "opts": ["a 可使灼热的铜变黑", "b 可与红热的铁产生气体", "c 可使燃烧的镁条熄灭", "d 可使湿润的淀粉碘化钾试纸变蓝"], "exp": "碱溶液与单质 d 反应生成漂白液 NaClO，故单质 d 为 Cl<sub>2</sub>，碱溶液是 NaOH；碱溶液 NaOH 与氧化物 c（适量）反应得纯碱 Na<sub>2</sub>CO<sub>3</sub> 溶液，故氧化物 c 为 CO<sub>2</sub>；单质 M 与氧化物 b 反应得碱溶液，故单质 M 为 Na，氧化物 b 为 H<sub>2</sub>O；Na 与单质 a 反应得氧化物，单质 a 为 O<sub>2</sub>。选项 A，a 为 O<sub>2</sub>，O<sub>2</sub> 可与灼热的铜反应生成黑色的氧化铜。选项 B，b 为 H<sub>2</sub>O，水蒸气可与红热的铁在高温下反应生成 Fe<sub>3</sub>O<sub>4</sub> 和氢气。选项 C，c 为 CO<sub>2</sub>，镁条在 CO<sub>2</sub> 中燃烧生成氧化镁和碳，则 c 不可使燃烧的镁条熄灭。选项 D，d 为 Cl<sub>2</sub>，Cl<sub>2</sub> 可与 KI 反应生成碘单质，碘单质能使湿润的淀粉试纸变蓝。"}, {"id": 12, "src": "2024 广州调研 8", "ans": "C", "figs": ["figs/k7/q12.png"], "stem": "部分含氮物质的分类与相应化合价关系如图所示。下列推断不合理的是", "opts": ["a 可经催化氧化生成 c", "b 既可被氧化，也可被还原", "d 与水反应只生成 e", "“雷雨发庄稼”包括 b→c→d→e 的转化"], "exp": "选项 A，氨中氮元素的化合价为 −3，氨具有还原性，在加热和有催化剂的条件下，NH<sub>3</sub> 催化氧化生成 NO，反应为 4NH<sub>3</sub>+5O<sub>2</sub> <span class=\"rxn\"><i>催化剂</i><em>=</em><i>Δ</i></span> 4NO+6H<sub>2</sub>O。选项 B，b 的价态为 0，处于氮的中间价态，既可被氧化，也可被还原。选项 C，若 d 为 NO<sub>2</sub>，NO<sub>2</sub> 溶于水生成 HNO<sub>3</sub> 和 NO，反应为 3NO<sub>2</sub>+H<sub>2</sub>O=2HNO<sub>3</sub>+NO。选项 D，“雷雨发庄稼”包括 b→c→d→e 的转化，N<sub>2</sub> 在雷电作用下可生成 NO，NO 与空气中 O<sub>2</sub> 反应生成 NO<sub>2</sub>，NO<sub>2</sub> 与 H<sub>2</sub>O 反应生成 HNO<sub>3</sub>，最后在土壤中生成硝酸盐。"}, {"id": 13, "src": "2024 广州一测 6", "ans": "C", "figs": ["figs/k7/q13.png"], "stem": "部分含氯物质的分类与相应化合价关系如图所示。下列推断不合理的是", "opts": ["a 与强碱溶液反应可生成 c 和 d", "电解 c 的水溶液可生成 a", "e 在光照条件下可生成 a", "可存在 b→a→e→d 的转化关系"], "exp": "选项 A，a 的化学式为 Cl<sub>2</sub>，Cl<sub>2</sub> 可以与 NaOH 等强碱溶液发生反应，生成氯化物和次氯酸盐，反应为 Cl<sub>2</sub>+2NaOH=NaCl+NaClO+H<sub>2</sub>O。选项 B，电解 NaCl 水溶液可得到 NaOH、H<sub>2</sub> 和 Cl<sub>2</sub>，这是氯碱工业的反应。选项 C，HClO 在光照下易分解，分解得到 O<sub>2</sub> 和 HCl，不是得到 Cl<sub>2</sub>。选项 D，HCl 可以与 KMnO<sub>4</sub> 反应生成 Cl<sub>2</sub>，浓盐酸在加热条件下与 MnO<sub>2</sub> 反应也可以生成 Cl<sub>2</sub>，Cl<sub>2</sub> 可以与水反应生成 HClO，HClO 可与 NaOH 反应生成 NaClO，因此可存在 b→a→e→d 的转化关系。"}, {"id": 14, "src": "2024 广州二测 9", "ans": "D", "figs": ["figs/k7/q14.png"], "stem": "部分含硫物质的分类与相应化合价关系如图所示。下列推断不合理的是", "opts": ["a 与 b 反应可产生淡黄色固体", "c 既可被氧化，也可被还原", "加热时 d 的浓溶液与铜反应可生成 b", "酸雨的形成涉及 b→e→d→c 的转化"], "exp": "选项 A，a 与 b 的反应为 2H<sub>2</sub>S+SO<sub>2</sub>=3S↓+2H<sub>2</sub>O，S 是淡黄色固体。选项 B，H<sub>2</sub>SO<sub>3</sub> 中硫元素为 +4 价，中间价态既可被氧化，也可被还原。选项 C，加热时 d 的浓溶液与铜的反应为 Cu+2H<sub>2</sub>SO<sub>4</sub>(浓) <span class=\"rxn\"><i>Δ</i><em>=</em></span> CuSO<sub>4</sub>+SO<sub>2</sub>↑+2H<sub>2</sub>O。选项 D，二氧化硫、氮氧化物以及它们在大气中发生反应后的生成物溶于雨水会形成酸雨，SO<sub>2</sub> 转为 SO<sub>3</sub>，SO<sub>3</sub> 转为 H<sub>2</sub>SO<sub>4</sub>，但 H<sub>2</sub>SO<sub>4</sub> 不可能转化为 +4 价的 H<sub>2</sub>SO<sub>3</sub>。"}, {"id": 15, "src": "2025 广州调研 13", "ans": "A", "figs": ["figs/k7/q15.png"], "stem": "部分含氯物质的分类与相应化合价关系如图，c、d 均为钠盐。下列说法正确的是", "opts": ["将 a 通入 NaHCO<sub>3</sub> 溶液中能获得 e", "电解 c 的饱和溶液可制得 a 和钠单质", "e 在光照条件下可生成 a", "可通过复分解反应实现下列转化：b→a→e→d→c"], "exp": "选项 A，将 Cl<sub>2</sub> 通入水中发生反应 Cl<sub>2</sub>+H<sub>2</sub>O⇌HCl+HClO，其中生成的盐酸可与 HCO<sub>3</sub><sup>−</sup> 继续反应生成 CO<sub>2</sub> 和 H<sub>2</sub>O，使得 Cl<sub>2</sub> 和水的反应正向移动，由于 HClO 的酸性弱于 H<sub>2</sub>CO<sub>3</sub> 的，不能与 HCO<sub>3</sub><sup>−</sup> 发生反应，所以将 Cl<sub>2</sub> 通入 NaHCO<sub>3</sub> 溶液中能获得 HClO。选项 B，电解饱和 NaCl 溶液，可在阳极得到 Cl<sub>2</sub>，在阴极水电离出的 H<sup>+</sup> 先得电子变为 H<sub>2</sub>，无法得到钠单质。选项 C，HClO 在光照条件下分解为 O<sub>2</sub> 和 HCl。选项 D，HCl 转变为 Cl<sub>2</sub>、Cl<sub>2</sub> 转变为 HClO 的过程中氯元素的化合价均发生变化，因此不能通过复分解反应使 HCl 转变为 Cl<sub>2</sub>、Cl<sub>2</sub> 转变为 HClO。"}, {"id": 16, "src": "2025 广州一测 6", "ans": "C", "stem": "含氮物质种类繁多，在一定条件下可相互转化，下列说法不合理的是", "opts": ["N<sub>2</sub> 的氧化或还原均可实现氮的固定", "将装有 NO<sub>2</sub> 的密闭烧瓶浸入冰水，红棕色变浅", "过量的 NH<sub>3</sub> 通入 0.1 mol·L<sup>−1</sup> CuSO<sub>4</sub> 溶液最终产生蓝色沉淀", "工业生产硝酸存在 N<sub>2</sub>→NH<sub>3</sub>→NO→NO<sub>2</sub>→HNO<sub>3</sub> 的转化"], "exp": "选项 A，氮的固定是指将大气中游离态的氮气转化为含氮化合物的过程，N<sub>2</sub> 的氧化或还原均转化为含氮的化合物，均属于氮的固定。工业上通过高温、高压和催化剂使 N<sub>2</sub> 与 H<sub>2</sub> 反应生成 NH<sub>3</sub>，这是 N<sub>2</sub> 的还原反应；在自然环境中，闪电条件下可以将 N<sub>2</sub> 氧化为 NO，这是 N<sub>2</sub> 的氧化反应。选项 B，NO<sub>2</sub> 和 N<sub>2</sub>O<sub>4</sub> 之间存在如下可逆反应：2NO<sub>2</sub>(g)⇌N<sub>2</sub>O<sub>4</sub>(g)，该反应的正反应是放热反应，NO<sub>2</sub> 为红棕色，N<sub>2</sub>O<sub>4</sub> 为无色，将装有 NO<sub>2</sub> 的密闭烧瓶浸入冰水降低温度，平衡向正方向移动，红棕色变浅。选项 C，将 NH<sub>3</sub> 通入 CuSO<sub>4</sub> 溶液中，反应先生成 Cu(OH)<sub>2</sub> 蓝色沉淀，当 NH<sub>3</sub> 过量时，Cu(OH)<sub>2</sub> 继续与 NH<sub>3</sub> 反应，生成了深蓝色的可溶于水的 [Cu(NH<sub>3</sub>)<sub>4</sub>]SO<sub>4</sub>。选项 D，工业上制硝酸的主要方法是将 N<sub>2</sub> 与 H<sub>2</sub> 在高温、高压和催化剂作用下反应生成 NH<sub>3</sub>，NH<sub>3</sub> 再经催化氧化转化成 NO，NO 与 O<sub>2</sub> 反应转化为 NO<sub>2</sub>，用水吸收 NO<sub>2</sub> 转化成 HNO<sub>3</sub>。"}, {"id": 17, "src": "2025 广州二测 10", "ans": "C", "figs": ["figs/k7/q17.png"], "stem": "部分含 Na 或含 Al 物质的分类与相应化合价关系如图所示。下列推断合理的是", "opts": ["存在 a→b→c→d 的转化", "g→f 一定是化合反应", "存在 b+f→d 的反应", "电解 e 的水溶液可得到 a"], "exp": "选项 A，b、c、d 中金属阳离子的化合价为 +3，故该金属元素为 Al，则 a 为 Al，b 为 Al<sub>2</sub>O<sub>3</sub>，c 为 Al(OH)<sub>3</sub>，d 为铝盐或四羟基合铝酸盐。a→b 的转化为 4Al+3O<sub>2</sub>=2Al<sub>2</sub>O<sub>3</sub>，c→d 的转化为 Al(OH)<sub>3</sub>+3HCl=AlCl<sub>3</sub>+3H<sub>2</sub>O，但无法通过一步反应实现 Al<sub>2</sub>O<sub>3</sub>→Al(OH)<sub>3</sub> 的转化。选项 B，g 和 f 中金属阳离子的化合价为 +1，故该金属元素为 Na，则 g 为 Na<sub>2</sub>O 或 Na<sub>2</sub>O<sub>2</sub>，f 为 NaOH。g→f 的反应为 Na<sub>2</sub>O+H<sub>2</sub>O=2NaOH 或 2Na<sub>2</sub>O<sub>2</sub>+2H<sub>2</sub>O=4NaOH+O<sub>2</sub>↑，g→f 不一定是化合反应。选项 C，b+f→d 的反应为 Al<sub>2</sub>O<sub>3</sub>+2NaOH+3H<sub>2</sub>O=2Na[Al(OH)<sub>4</sub>]，Na[Al(OH)<sub>4</sub>] 属于 Al 元素 +3 价的盐，因此存在 b+f→d 的反应。选项 D，e 中金属阳离子的化合价为 +1，故该金属元素为 Na，a 为单质 Na，e 为钠盐。由于 Na 是非常活泼的金属，因此电解钠盐水溶液时，H<sub>2</sub>O 会优先得电子，阴极反应为 2H<sub>2</sub>O+2e<sup>−</sup>=2OH<sup>−</sup>+H<sub>2</sub>↑，无法通过电解钠盐水溶液获得金属 Na 单质。"}, {"id": 18, "src": "2026 广州调研 12", "ans": "C", "figs": ["figs/k7/q18.png"], "stem": "短周期活泼金属单质 M 的相关转化如图所示。下列说法正确的是", "opts": ["单质 M 可置换出 CuSO<sub>4</sub> 溶液中的 Cu", "氧化物 2 可与水反应生成碱和 H<sub>2</sub>", "氧化物 3 可与红热的铁反应生成一种新的氧化物", "向碱中通入少量或过量的 CO<sub>2</sub> 生成的盐相同"], "exp": "选项 A，金属钠加入硫酸铜溶液中，钠先与水发生反应 2Na+2H<sub>2</sub>O=2NaOH+H<sub>2</sub>↑，生成的 NaOH 与 CuSO<sub>4</sub> 溶液反应 2NaOH+CuSO<sub>4</sub>=Cu(OH)<sub>2</sub>↓+Na<sub>2</sub>SO<sub>4</sub>，无法置换出金属铜。选项 B，氧化物 2 为 Na<sub>2</sub>O<sub>2</sub>，Na<sub>2</sub>O<sub>2</sub> 与水反应为 2Na<sub>2</sub>O<sub>2</sub>+2H<sub>2</sub>O=4NaOH+O<sub>2</sub>↑，产生的气体是 O<sub>2</sub> 而不是 H<sub>2</sub>。选项 C，氧化物 3 为 H<sub>2</sub>O，与红热的铁发生化学反应为 3Fe+4H<sub>2</sub>O(g) <span class=\"rxn\"><i>高温</i><em>=</em></span> Fe<sub>3</sub>O<sub>4</sub>+4H<sub>2</sub>，生成了新的氧化物 Fe<sub>3</sub>O<sub>4</sub>。选项 D，碱为 NaOH，当通入少量 CO<sub>2</sub> 时，反应为 2NaOH+CO<sub>2</sub>=Na<sub>2</sub>CO<sub>3</sub>+H<sub>2</sub>O；当通入的 CO<sub>2</sub> 过量时，反应为 NaOH+CO<sub>2</sub>=NaHCO<sub>3</sub>，生成的盐不相同。"}, {"id": 19, "src": "2026 广州一测 11", "ans": "C", "figs": ["figs/k7/q19.png"], "stem": "能满足下列物质间直接转化关系，且推理成立的是", "opts": ["X 可为 C，氧化物 1 和氧化物 2 均为酸性氧化物", "X 可为 Si，氧化物 2 可与水反应生成硅酸", "X 可为 N<sub>2</sub>，简单氢化物可与 O<sub>2</sub> 反应生成氧化物 1", "X 可为 S，酸与 Cu 混合可生成 H<sub>2</sub>"], "exp": "选项 A，X 为 C，氧化物 1 和氧化物 2 分别为 CO 和 CO<sub>2</sub>，CO 不是酸性氧化物。选项 B，X 为 Si，Si 的氧化物只有 SiO<sub>2</sub>，且 SiO<sub>2</sub> 不能与水反应生成 H<sub>2</sub>SiO<sub>3</sub>。选项 C，X 为 N<sub>2</sub>，氧化物 1 和氧化物 2 分别为 NO 和 NO<sub>2</sub>，NO<sub>2</sub> 可以与水反应生成硝酸，N<sub>2</sub> 可以与 H<sub>2</sub> 反应生成简单氢化物 NH<sub>3</sub>，NH<sub>3</sub> 可以与 O<sub>2</sub> 在催化剂条件下生成 NO，反应为 N<sub>2</sub>+3H<sub>2</sub> <span class=\"rxn\"><i>高温高压</i><em>⇌</em><i>催化剂</i></span> 2NH<sub>3</sub>，N<sub>2</sub>+O<sub>2</sub> <span class=\"rxn\"><i>放电</i><em>=</em></span> 2NO，2NO+O<sub>2</sub>=2NO<sub>2</sub>，4NH<sub>3</sub>+5O<sub>2</sub> <span class=\"rxn\"><i>催化剂</i><em>=</em><i>Δ</i></span> 4NO+6H<sub>2</sub>O。选项 D，X 为 S，氧化物 1 和氧化物 2 分别为 SO<sub>2</sub> 和 SO<sub>3</sub>，SO<sub>3</sub> 与水可反应生成酸 H<sub>2</sub>SO<sub>4</sub>，但 Cu 不能与 H<sub>2</sub>SO<sub>4</sub> 反应生成 H<sub>2</sub>。"}, {"id": 20, "src": "2026 广州二测 6", "ans": "A", "figs": ["figs/k7/q20.png"], "stem": "M 元素在地壳中的含量居第四位，含 M 物质的相关转化关系如图，下列说法错误的是", "opts": ["单质 M 与高温水蒸气反应生成红棕色固体", "碱 1→碱 2 的转化存在物质颜色的变化", "将盐 2 的饱和溶液滴入沸水中，继续加热可得到胶体", "K<sub>3</sub>[Fe(CN)<sub>6</sub>] 溶液可用于鉴别盐 1 和盐 2"], "exp": "M 元素在地壳中的含量居第四位，说明单质 M 为 Fe，盐 1 为 FeCl<sub>2</sub>，碱 1 为 Fe(OH)<sub>2</sub>，碱 2 为 Fe(OH)<sub>3</sub>，盐 2 为 FeCl<sub>3</sub>。选项 A，Fe 与高温水蒸气反应生成 Fe<sub>3</sub>O<sub>4</sub> 和 H<sub>2</sub>，产物 Fe<sub>3</sub>O<sub>4</sub> 为黑色固体，不是红棕色 Fe<sub>2</sub>O<sub>3</sub> 固体。选项 B，Fe(OH)<sub>2</sub>→Fe(OH)<sub>3</sub> 的转化过程中，固体由白色迅速变为灰绿色，最终变为红褐色，存在物质颜色的变化。选项 C，将 FeCl<sub>3</sub> 的饱和溶液滴入沸水中，继续加热至溶液呈红褐色，可得到 Fe(OH)<sub>3</sub> 胶体。选项 D，Fe<sup>2+</sup> 与 K<sub>3</sub>[Fe(CN)<sub>6</sub>] 反应生成 KFe[Fe(CN)<sub>6</sub>] 蓝色沉淀，Fe<sup>3+</sup> 不与 K<sub>3</sub>[Fe(CN)<sub>6</sub>] 反应。"}];
var KEY = 'xz7_state', TKEY = 'xz_theme', NKEY = 'xz_name', LKEY = 'xz7_lock';
var N = QS.length, PER = 2;
var st = {a:{}, score:0, ok:0, elapsed:0, started:false};
function $(id){return document.getElementById(id)}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.a)st=s}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function fmt(s){return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
function renderStats(){$('sProg').textContent=Object.keys(st.a).length;$('sScore').textContent=st.score;$('sOk').textContent=st.ok;$('sTime').textContent=fmt(st.elapsed)}
function build(){
  var box=$('qlist');
  QS.forEach(function(q,i){
    var d=document.createElement('div');d.className='qcard';d.id='qc'+q.id;
    var h='<div class="qmeta"><span class="qno">第 '+(i+1)+' 题</span><span class="qpt">'+PER+' 分</span><span class="qsrc">'+q.src+'</span><span class="qmark" id="qm'+q.id+'"></span></div>';
    h+='<div class="stem">'+q.stem+'</div>';
    if(q.figs){q.figs.forEach(function(f){h+='<div class="qfig"><img src="'+f+'" alt="题图"></div>'})}
    h+='<div id="op'+q.id+'"></div>';
    h+='<button class="submit" id="sb'+q.id+'" disabled>提交本题</button>';
    h+='<div class="verdict" id="vd'+q.id+'"></div>';
    h+='<div class="exp" id="ex'+q.id+'"><div class="et">答案 '+q.ans+' · 题析</div><p>'+q.exp+'</p></div>';
    h+='<button class="next" id="nx'+q.id+'">'+(i<N-1?'下一题 →':'生成本讲成绩卡 →')+'</button>';
    d.innerHTML=h;box.appendChild(d);
    var picked=null,done=!!st.a[q.id];
    var ob=$('op'+q.id);
    q.opts.forEach(function(o,j){
      var L='ABCD'[j],b=document.createElement('button');
      b.className='opt';b.innerHTML='<span class="ol">'+L+'．</span><span>'+o+'</span>';
      b.onclick=function(){
        if(done)return;
        if(!st.started){st.started=true}
        picked=L;
        Array.prototype.forEach.call(ob.children,function(c){c.classList.remove('sel')});
        b.classList.add('sel');
        $('sb'+q.id).disabled=false;
      };
      ob.appendChild(b);
    });
    if(done){
      var pick=st.a[q.id],ok=pick===q.ans;
      paintResult(q,ob,pick,ok);
      $('ex'+q.id).style.display='block';
      $('sb'+q.id).style.display='none';
      $('nx'+q.id).style.display='block';
      $('qm'+q.id).textContent=ok?'✓':'✗';
      if(i===N-1)showResult();
    }
    $('sb'+q.id).onclick=function(){
      if(picked===null||done)return;
      done=true;
      var ok=picked===q.ans;
      st.a[q.id]=picked;
      if(ok){st.score+=PER;st.ok++}
      paintResult(q,ob,picked,ok);
      var v=$('vd'+q.id);
      v.style.display='block';
      v.style.background=ok?'var(--ok-bg)':'var(--bad-bg)';
      v.style.color=ok?'var(--ok-ink)':'var(--bad-ink)';
      v.textContent=ok?'回答正确 +'+PER+' 分':'回答错误 · 正确答案 '+q.ans;
      $('qm'+q.id).textContent=ok?'✓':'✗';
      $('qm'+q.id).style.color=ok?'var(--ok)':'var(--bad)';
      $('ex'+q.id).style.display='block';
      $('sb'+q.id).style.display='none';
      $('nx'+q.id).style.display='block';
      renderStats();save();
      if(Object.keys(st.a).length===N)showResult();
    };
    $('nx'+q.id).onclick=function(){
      if(i<N-1){var n=QS[i+1];var el=document.getElementById('qc'+n.id);el.scrollIntoView({behavior:'smooth',block:'start'})}
      else{$('result').scrollIntoView({behavior:'smooth',block:'center'})}
    };
  });
}
function paintResult(q,ob,pick,ok){
  Array.prototype.forEach.call(ob.children,function(c,j){
    var L='ABCD'[j];c.disabled=true;
    if(L===q.ans)c.classList.add('rgt');
    else if(L===pick)c.classList.add('wrg');
  });
}
var timer=setInterval(function(){
  if(st.started&&Object.keys(st.a).length<N){st.elapsed++;renderStats();if(st.elapsed%5===0)save()}
},1000);
function showResult(){
  $('result').style.display='block';
  var locked=localStorage.getItem(LKEY);
  if(locked){
    lockCard(locked);
  }else{
    $('stuName').value=localStorage.getItem(NKEY)||'';
    $('genZone').style.display='block';
  }
}
function lockCard(name){
  $('genZone').style.display='none';
  $('doneZone').style.display='flex';
  $('stuName').value=name;
  drawCard();
  $('canvas').style.display='block';
}
$('btnGen').onclick=function(){
  var name=$('stuName').value.trim();
  if(!name){alert('请先输入姓名');return}
  try{localStorage.setItem(LKEY,name);localStorage.setItem(NKEY,name)}catch(e){}
  lockCard(name);
};
function drawCard(){
  var c=$('canvas'),x=c.getContext('2d'),W=c.width,H=c.height;
  var g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0f172a');g.addColorStop(.55,'#152743');g.addColorStop(1,'#1b1140');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(34,211,238,.08)';x.beginPath();x.arc(W-60,60,150,0,7);x.fill();
  x.fillStyle='rgba(167,139,250,.08)';x.beginPath();x.arc(50,H-40,130,0,7);x.fill();
  x.fillStyle='#67e8f9';x.font='500 22px sans-serif';x.fillText('化学不难学 · 高考选择题训练',40,52);
  x.fillStyle='#8ea0b5';x.font='16px sans-serif';x.fillText('考点7 元素及其化合物 · 每题 '+PER+' 分',40,84);
  var name=$('stuName').value.trim()||'同学';
  x.fillStyle='#e2e8f0';x.font='500 26px sans-serif';x.fillText(name,40,150);
  x.fillStyle='#a78bfa';x.font='700 88px sans-serif';x.fillText(st.score,40,255);
  x.fillStyle='#8ea0b5';x.font='18px sans-serif';x.fillText('分 / 满分 '+(N*PER)+' 分',40+String(st.score).length*52+14,250);
  var acc=Math.round(st.ok/N*100);
  var cells=[['正确',st.ok+' / '+N+' 题'],['正确率',acc+'%'],['用时',fmt(st.elapsed)]];
  cells.forEach(function(cell,i){
    var cx=40+i*228;
    x.fillStyle='#1e293b';x.fillRect(cx,290,208,84);
    x.fillStyle='#67e8f9';x.font='14px sans-serif';x.fillText(cell[0],cx+18,320);
    x.fillStyle='#e2e8f0';x.font='500 24px sans-serif';x.fillText(cell[1],cx+18,356);
  });
  var d=new Date();
  x.fillStyle='#5b6b7f';x.font='14px sans-serif';
  x.fillText('日期 '+d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2),40,410);
}
$('stuName').addEventListener('input',function(){try{localStorage.setItem(NKEY,this.value)}catch(e){}});
$('btnSave').onclick=function(){
  var a=document.createElement('a');
  a.download='选择题训练_考点7_'+(($('stuName').value.trim()||'成绩'))+'.png';
  a.href=$('canvas').toDataURL('image/png');a.click();
};
$('btnRedo').onclick=function(){
  if(confirm('确定清空本讲答题记录和成绩卡重新刷吗？')){localStorage.removeItem(KEY);localStorage.removeItem(LKEY);location.reload()}
};
$('resetBtn').onclick=function(){
  var n=Object.keys(st.a).length;
  if(n===0){alert('本讲还没有答题记录');return}
  if(confirm('确定清空本讲 '+n+' 题记录重新做吗？')){
    localStorage.removeItem(KEY);localStorage.removeItem(LKEY);location.reload();
  }
};
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('themeBtn').textContent=t==='dark'?'☀':'🌙';
  try{localStorage.setItem(TKEY,t)}catch(e){}
}
$('themeBtn').onclick=function(){
  applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
};
applyTheme((function(){try{return localStorage.getItem(TKEY)||'dark'}catch(e){return 'dark'}})());
load();build();renderStats();
</script>
</body>
</html>

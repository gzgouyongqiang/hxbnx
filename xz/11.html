/sub>·H<sub>2</sub>O+2O<sub>2</sub>↑+KOH", "每生成 1 mol NH<sub>3</sub>·H<sub>2</sub>O，双极膜处有 9 mol 的 H<sub>2</sub>O 解离", "电解过程中，阳极室中 KOH 的物质的量不因反应而改变", "相比于平面结构双极膜，“卯榫”结构可提高氨生成速率"], "exp": "【题析】选项 A，该电化学装置是电解 KNO<sub>3</sub> 溶液制 NH<sub>3</sub>，工作时，当电路中转移 8 mol e<sup>−</sup>，双极膜界面处有 8 mol H<sup>+</sup> 进入阴极室，有 8 mol OH<sup>−</sup> 进入阳极室，由于氮元素化合价降低，发生还原反应，电极 a 为电解池阴极，阴极电极反应为 NO<sub>3</sub><sup>−</sup>+8e<sup>−</sup>+8H<sup>+</sup>═NH<sub>3</sub>·H<sub>2</sub>O+H<sub>2</sub>O+OH<sup>−</sup>，电极 b 为电解池阳极，阳极电极反应为 8OH<sup>−</sup>−8e<sup>−</sup>═2O<sub>2</sub>↑+4H<sub>2</sub>O。由阴、阳极电极反应相加可得，电解总反应为 KNO<sub>3</sub>+3H<sub>2</sub>O═NH<sub>3</sub>·H<sub>2</sub>O+2O<sub>2</sub>↑+KOH，正确。选项 B，工作时，H<sub>2</sub>O 在双极膜界面处被催化解离成 H<sup>+</sup> 和 OH<sup>−</sup>，“卯榫”结构双极膜中解离得到的 H<sup>+</sup> 移向阴极，OH<sup>−</sup> 移向阳极。每生成 1 mol NH<sub>3</sub>·H<sub>2</sub>O，电路中转移 8 mol e<sup>−</sup>，因此双极膜界面处有 8 mol H<sup>+</sup> 进入阴极室，有 8 mol OH<sup>−</sup> 进入阳极室，即有 8 mol 的 H<sub>2</sub>O 解离，错误。选项 C，根据闭合回路和电荷守恒，阳极电极反应为 4OH<sup>−</sup>−4e<sup>−</sup>═O<sub>2</sub>↑+2H<sub>2</sub>O，电解过程中阳极室每消耗 4 mol OH<sup>−</sup>，同时有 4 mol OH<sup>−</sup> 通过双极膜进入阳极室，因此阳极室中 KOH 的物质的量不因反应而改变，正确。选项 D，相比于平面结构双极膜，“卯榫”结构具有更大的接触面积，有利于 H<sub>2</sub>O 被催化解离成 H<sup>+</sup> 和 OH<sup>−</sup>，可提高氨生成速率，正确。"}, {"id": 5, "src": "2022 广东 16", "ans": "C", "figs": ["figs/k11/q5.png"], "stem": "科学家基于 Cl<sub>2</sub> 易溶于 CCl<sub>4</sub> 的性质，发展了一种无需离子交换膜的新型氯流电池，可作储能设备（如图）。充电时电极 a 的反应为 NaTi<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub>+2Na<sup>+</sup>+2e<sup>−</sup>═Na<sub>3</sub>Ti<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub>。下列说法正确的是", "opts": ["充电时电极 b 是阴极", "放电时 NaCl 溶液的 pH 减小", "放电时 NaCl 溶液的浓度增大", "每生成 1 mol Cl<sub>2</sub>，电极 a 质量理论上增加 23 g"], "exp": "【题析】选项 A，充电时，电极 a 的电极反应为 NaTi<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub>+2Na<sup>+</sup>+2e<sup>−</sup>═Na<sub>3</sub>Ti<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub>，电极 a 发生还原反应，为阴极；电极 b 为阳极，发生氧化反应，电极反应为 2Cl<sup>−</sup>−2e<sup>−</sup>═Cl<sub>2</sub>↑，错误。选项 B，充电过程中阳极产生的 Cl<sub>2</sub> 溶于 CCl<sub>4</sub> 后储存于容器中。放电时，电极 b 为正极，正极电极反应为 Cl<sub>2</sub>+2e<sup>−</sup>═2Cl<sup>−</sup>；电极 a 为负极，负极电极反应为 Na<sub>3</sub>Ti<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub>−2e<sup>−</sup>═NaTi<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub>+2Na<sup>+</sup>。放电时总反应为 Na<sub>3</sub>Ti<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub>+Cl<sub>2</sub>═NaTi<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub>+2NaCl，消耗溶解在 CCl<sub>4</sub> 中的 Cl<sub>2</sub>，生成 NaCl，NaCl 溶液的浓度增大，由于 NaCl 溶液呈中性，NaCl 溶液的 pH 不变，错误。选项 C，结合选项 B 的分析，放电时负极产生 Na<sup>+</sup>、正极产生 Cl<sup>−</sup>，则放电时 NaCl 溶液的浓度增大，正确。选项 D，充电时，阳极每生成 1 mol Cl<sub>2</sub>，转移 2 mol 电子，阴极理论上有 2 mol Na<sup>+</sup> 参与电极反应转化成 Na<sub>3</sub>Ti<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub> 固体进入电极 a 中，导致电极 a 质量增加 23 g·mol<sup>−1</sup>×2 mol=46 g，错误。"}, {"id": 6, "src": "2021 广东 16", "ans": "D", "figs": ["figs/k11/q6.png"], "stem": "钴（Co）的合金材料广泛应用于航空航天、机械制造等领域。下图为水溶液中电解制备金属钴的装置示意图。下列说法正确的是", "opts": ["工作时，Ⅰ室和Ⅱ室溶液的 pH 均增大", "生成 1 mol Co，Ⅰ室溶液质量理论上减少 16 g", "移除两交换膜后，石墨电极上发生的反应不变", "电解总反应：2Co<sup>2+</sup>+2H<sub>2</sub>O <span class=\"rxn\"><i>通电</i><em>=</em></span> 2Co+O<sub>2</sub>↑+4H<sup>+</sup>"], "exp": "【题析】选项 A，Ⅰ室是阳极室，石墨电极为阳极，阳极电极反应为 2H<sub>2</sub>O−4e<sup>−</sup>═O<sub>2</sub>↑+4H<sup>+</sup>，每生成 1 mol O<sub>2</sub> 的同时，有 4 mol H<sup>+</sup> 从Ⅰ室经阳离子交换膜进入Ⅱ室，因此电解池工作时，Ⅰ室中水放电，使 H<sub>2</sub>SO<sub>4</sub> 溶液浓度增大，Ⅰ室溶液的 pH 减小，Ⅱ室中生成盐酸，Ⅱ室溶液的 pH 减小，错误。选项 B，Ⅲ室是阴极室，Co 电极为阴极，电极反应为 Co<sup>2+</sup>+2e<sup>−</sup>═Co，每生成 1 mol Co，转移 2 mol 电子，即阳极有 1 mol H<sub>2</sub>O 参与电解，Ⅰ室有 0.5 mol O<sub>2</sub> 逸出，同时有 2 mol H<sup>+</sup> 从Ⅰ室经阳离子交换膜进入Ⅱ室，Ⅰ室溶液质量理论上减少 0.5 mol×32 g·mol<sup>−1</sup>+2 mol×1 g·mol<sup>−1</sup>=18 g，错误。选项 C，移除两交换膜后，石墨阳极上可放电的物质除了 H<sub>2</sub>O 还有 Cl<sup>−</sup>，石墨阳极电极反应为 2Cl<sup>−</sup>−2e<sup>−</sup>═Cl<sub>2</sub>↑，错误。选项 D，Ⅰ室是阳极室，电极反应为 2H<sub>2</sub>O−4e<sup>−</sup>═O<sub>2</sub>↑+4H<sup>+</sup>，Ⅲ室是阴极室，电极反应为 Co<sup>2+</sup>+2e<sup>−</sup>═Co，电解总反应为 2Co<sup>2+</sup>+2H<sub>2</sub>O <span class=\"rxn\"><i>通电</i><em>=</em></span> 2Co+O<sub>2</sub>↑+4H<sup>+</sup>，正确。"}, {"id": 7, "src": "2026 陕晋青宁 13", "ans": "D", "figs": ["figs/k11/q7.png"], "stem": "某科研团队利用 S 和 Cu<sub>2</sub>S 的相互转化设计了如图所示电池。工作时，两极上发生反应的 S 和 Cu<sub>2</sub>S 的物质的量相等。放电完成后，将一侧的电解液加热，产生的气体通入另一侧，可使电池重复工作。若性能显著衰减，经简单处理可恢复。下列说法正确的是", "opts": ["膜为阳离子交换膜", "当气体通入左室开始工作时，电极 a 为正极", "理论上，电路中通过的 e<sup>−</sup> 与消耗 NH<sub>3</sub>·H<sub>2</sub>O 的物质的量之比为 1∶4", "电池总反应为 Cu<sup>2+</sup>+4NH<sub>3</sub>═[Cu(NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup>"], "exp": "【题析】该电池工作时，S 和 Cu<sub>2</sub>S 相互转化，两极上发生反应的 S 和 Cu<sub>2</sub>S 的物质的量相等。放电时电极 a 上 S、Cu<sup>2+</sup> 发生还原反应，电极 a 为正极，正极电极反应为 S+2Cu<sup>2+</sup>+4e<sup>−</sup>═Cu<sub>2</sub>S，左室的 Cu<sup>2+</sup> 浓度逐渐减小，电极 a 上 S 转化为 Cu<sub>2</sub>S；放电时电极 b 上 Cu<sub>2</sub>S 发生氧化反应，电极 b 为负极，负极电极反应为 Cu<sub>2</sub>S−4e<sup>−</sup>+8NH<sub>3</sub>═2[Cu(NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup>+S，右室的 [Cu(NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup> 浓度逐渐增大。选项 A，放电时左室消耗 Cu<sup>2+</sup>，有多余的 SO<sub>4</sub><sup>2−</sup>，右室生成 [Cu(NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup>，为维持溶液电中性，需要 SO<sub>4</sub><sup>2−</sup> 从左室通过阴离子交换膜迁移到右室平衡电荷，因此膜为阴离子交换膜，错误。选项 B，放电完成后，加热右室电解液使 [Cu(NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup> 与 NH<sub>3</sub>·H<sub>2</sub>O 分解产生 NH<sub>3</sub>，NH<sub>3</sub> 通入左室，再次开始放电时电极 a、b 互换，电极 a 为负极，错误。选项 C，负极电极反应中转移 4 mol e<sup>−</sup>，消耗 8 mol NH<sub>3</sub>·H<sub>2</sub>O，理论上电路中通过的 e<sup>−</sup> 与消耗 NH<sub>3</sub>·H<sub>2</sub>O 的物质的量之比为 1∶2，错误。选项 D，该电池工作时正极电极反应为 S+2Cu<sup>2+</sup>+4e<sup>−</sup>═Cu<sub>2</sub>S，负极电极反应为 Cu<sub>2</sub>S−4e<sup>−</sup>+8NH<sub>3</sub>═2[Cu(NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup>+S，可知电池总反应为 Cu<sup>2+</sup>+4NH<sub>3</sub>═[Cu(NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup>，正确。"}, {"id": 8, "src": "2026 黑龙江 13", "ans": "D", "figs": ["figs/k11/q8.png"], "stem": "一种从废旧电池正极材料（LiFePO<sub>4</sub>）中回收锂元素的电化学装置如图。下列说法错误的是", "opts": ["a 电极反应：O<sub>2</sub>+2H<sub>2</sub>O+2e<sup>−</sup>═H<sub>2</sub>O<sub>2</sub>+2OH<sup>−</sup>", "电路中转移 2 mol 电子，理论上可回收 4 mol Li<sup>+</sup>", "b 电极连接电源正极", "I<sub>3</sub><sup>−</sup> 可转化为 I<sup>−</sup> 和 IO<sub>3</sub><sup>−</sup>，会降低锂的理论回收产率"], "exp": "【题析】选项 A，左侧池通入 O<sub>2</sub> 生成 H<sub>2</sub>O<sub>2</sub>，得到电子，发生还原反应，a 电极是阴极，连接电源的负极，阴极电极反应为 O<sub>2</sub>+2H<sub>2</sub>O+2e<sup>−</sup>═H<sub>2</sub>O<sub>2</sub>+2OH<sup>−</sup>，正确。右侧池 I<sup>−</sup> 转化为 I<sub>3</sub><sup>−</sup>，失去电子，发生氧化反应，b 电极是阳极，连接电源的正极，阳极电极反应为 3I<sup>−</sup>−2e<sup>−</sup>═I<sub>3</sub><sup>−</sup>。选项 B，双电极可同时回收 Li<sup>+</sup>，a 电极区生成的 H<sub>2</sub>O<sub>2</sub> 与 LiFePO<sub>4</sub> 发生回收 Li<sup>+</sup> 的反应为 2LiFePO<sub>4</sub>+H<sub>2</sub>O<sub>2</sub>+2H<sup>+</sup>═2Li<sup>+</sup>+2FePO<sub>4</sub>+2H<sub>2</sub>O，b 电极区生成的 I<sub>3</sub><sup>−</sup> 与 LiFePO<sub>4</sub> 发生回收 Li<sup>+</sup> 反应为 2LiFePO<sub>4</sub>+I<sub>3</sub><sup>−</sup>═2Li<sup>+</sup>+2FePO<sub>4</sub>+3I<sup>−</sup>，I<sup>−</sup> 又返回 b 电极处循环反应，从而实现锂元素的回收。电路中转移 2 mol 电子，整个体系总电子转移 2 mol，可生成 1 mol H<sub>2</sub>O<sub>2</sub> 和 1 mol I<sub>3</sub><sup>−</sup>，结合回收锂元素的方程式可得 2e<sup>−</sup>∼2LiFePO<sub>4</sub>∼2Li<sup>+</sup>，理论上两电极上 1 mol H<sub>2</sub>O<sub>2</sub> 和 1 mol I<sub>3</sub><sup>−</sup> 可回收 4 mol Li<sup>+</sup>，正确。选项 C，b 电极是阳极，连接电源的正极，正确。选项 D，理论上 1 mol I<sub>3</sub><sup>−</sup> 可回收 2 mol Li<sup>+</sup>，I<sub>3</sub><sup>−</sup> 可转化为 I<sup>−</sup> 和 IO<sub>3</sub><sup>−</sup> 的歧化反应为 3I<sub>3</sub><sup>−</sup>+3H<sub>2</sub>O═8I<sup>−</sup>+IO<sub>3</sub><sup>−</sup>+6H<sup>+</sup>，该歧化反应为碘自身氧化还原，得到的电子数不变，IO<sub>3</sub><sup>−</sup> 可氧化 LiFePO<sub>4</sub> 发生反应为 6LiFePO<sub>4</sub>+IO<sub>3</sub><sup>−</sup>+6H<sup>+</sup>═6Li<sup>+</sup>+6FePO<sub>4</sub>+I<sup>−</sup>+3H<sub>2</sub>O，存在的关系式为 3I<sub>3</sub><sup>−</sup>∼IO<sub>3</sub><sup>−</sup>∼6Li<sup>+</sup>，3 mol I<sub>3</sub><sup>−</sup> 可得到 6 mol 电子，歧化后 1 mol IO<sub>3</sub><sup>−</sup> 作为氧化剂可得到 6 mol 电子，总氧化能力不变，理论上脱出回收 Li<sup>+</sup> 的物质的量不变，因此不会降低锂的理论回收产率，错误。"}, {"id": 9, "src": "2025 全国新课标 4", "ans": "D", "figs": ["figs/k11/q9.png"], "stem": "某研究小组设计如下电解池，既可将中性废水中的硝酸盐转化为氨，又可将废塑料（PET）碱性水解液中的乙二醇转化为羟基乙酸盐，实现变废为宝。电解时，下列说法错误的是", "opts": ["阳极区 pH 下降", "OH<sup>−</sup> 从阴极区向阳极区迁移", "阴极发生反应 NO<sub>3</sub><sup>−</sup>+7H<sub>2</sub>O+8e<sup>−</sup>═NH<sub>3</sub>·H<sub>2</sub>O+9OH<sup>−</sup>", "阴极转化 1 mol NO<sub>3</sub><sup>−</sup>，阳极将生成 4 mol HOCH<sub>2</sub>COO<sup>−</sup>"], "exp": "【题析】电解时，左侧电极连接电源负极，为阴极区，发生还原反应，根据阴极区的反应物、产物和题干给出的中性条件，阴极电极反应式为 NO<sub>3</sub><sup>−</sup>+7H<sub>2</sub>O+8e<sup>−</sup>═NH<sub>3</sub>·H<sub>2</sub>O+9OH<sup>−</sup>。右侧电极连接电源正极，为阳极区，发生氧化反应，根据阳极区的反应物、产物和题干给出的碱性条件，阳极电极反应式为 HOCH<sub>2</sub>CH<sub>2</sub>OH−4e<sup>−</sup>+5OH<sup>−</sup>═HOCH<sub>2</sub>COO<sup>−</sup>+4H<sub>2</sub>O。选项 A，随着反应进行，阳极区 OH<sup>−</sup> 不断消耗，OH<sup>−</sup> 浓度不断减小，阳极区 pH 下降，正确。选项 B，阴极电极反应式为 NO<sub>3</sub><sup>−</sup>+7H<sub>2</sub>O+8e<sup>−</sup>═NH<sub>3</sub>·H<sub>2</sub>O+9OH<sup>−</sup>，阴极区生成了 OH<sup>−</sup>，阳极区消耗了 OH<sup>−</sup>，阴极区多出的阴离子 OH<sup>−</sup> 可通过阴离子交换膜从阴极区向阳极区迁移，正确。选项 C 正确。选项 D，阴极转化 1 mol NO<sub>3</sub><sup>−</sup>，转移 8 mol e<sup>−</sup>，根据阴阳极转移电子守恒列关系式：NO<sub>3</sub><sup>−</sup>∼8e<sup>−</sup>∼2HOCH<sub>2</sub>COO<sup>−</sup>，此时阳极将生成 2 mol HOCH<sub>2</sub>COO<sup>−</sup>，错误。"}, {"id": 10, "src": "2025 山东 12 改编", "ans": "C", "figs": ["figs/k11/q10.png"], "stem": "全铁液流电池工作原理如图所示，两电极分别为石墨电极和负载铁的石墨电极。下列说法正确的是", "opts": ["隔膜为阳离子交换膜", "放电时，b 极为负极", "充电时，隔膜两侧溶液 Fe<sup>2+</sup> 浓度均减小", "理论上，Fe<sup>3+</sup> 每减少 1 mol，Fe<sup>2+</sup> 总量相应增加 2 mol"], "exp": "【题析】工作原理图中 a 极区中的阳离子为 Fe<sup>2+</sup>，b 极区中的阳离子为 Fe<sup>2+</sup>、Fe<sup>3+</sup>，故 a 极为负载铁的石墨电极，为电池的负极，负极电极反应为 Fe−2e<sup>−</sup>═Fe<sup>2+</sup>；b 极为石墨电极，为电池的正极，正极电极反应为 Fe<sup>3+</sup>+e<sup>−</sup>═Fe<sup>2+</sup>。选项 A，因为 a 极区中的阳离子为 Fe<sup>2+</sup>，不含 Fe<sup>3+</sup>，为防止 Fe<sup>3+</sup> 进入 a 极区，隔膜为阴离子交换膜，错误。选项 B，放电时，a 极为电池的负极，b 极为电池的正极，错误。选项 C，充电时，a 为阴极，阴极电极反应为 Fe<sup>2+</sup>+2e<sup>−</sup>═Fe，b 为阳极，阳极电极反应为 2Fe<sup>2+</sup>−2e<sup>−</sup>═2Fe<sup>3+</sup>，故充电时隔膜两侧溶液 Fe<sup>2+</sup> 浓度均减小，正确。选项 D，放电时，a 极负极电极反应为 Fe−2e<sup>−</sup>═Fe<sup>2+</sup>，b 极正极电极反应为 Fe<sup>3+</sup>+e<sup>−</sup>═Fe<sup>2+</sup>，放电时电池总反应为 2Fe<sup>3+</sup>+Fe═3Fe<sup>2+</sup>，Fe<sup>3+</sup> 每减少 1 mol，转移电子 1 mol，同时 a 极区生成 0.5 mol Fe<sup>2+</sup>，b 极区生成 1 mol Fe<sup>2+</sup>，Fe<sup>2+</sup> 总量相应增加 1.5 mol，错误。"}, {"id": 11, "src": "2025 河南 12", "ans": "D", "figs": ["figs/k11/q11.png"], "stem": "一种液流电解池在工作时可以实现海水淡化，并以 LiCl 形式回收含锂废弃物中的锂元素，其工作原理如图所示。下列说法正确的是", "opts": ["Ⅱ为阳离子交换膜", "电极 a 附近溶液的 pH 减小", "电极 b 上发生的电极反应为 [Fe(CN)<sub>6</sub>]<sup>4−</sup>−e<sup>−</sup>═[Fe(CN)<sub>6</sub>]<sup>3−</sup>", "若海水用 NaCl 溶液模拟，则每脱除 58.5 g NaCl，理论上可回收 1 mol LiCl"], "exp": "【题析】选项 A，该装置为电解池，电极 a 外接电源负极，为阴极，发生还原反应，阴极电极反应为 O<sub>2</sub>+4e<sup>−</sup>+2H<sub>2</sub>O═4OH<sup>−</sup>；电极 b 为阳极，发生氧化反应，阳极电极反应为 Li<sub>3</sub>[Fe(CN)<sub>6</sub>]−e<sup>−</sup>═Li<sub>2</sub>[Fe(CN)<sub>6</sub>]+Li<sup>+</sup>。工作时以 LiCl 形式回收含锂废弃物中的锂元素，电解池中阴离子移向阳极，阳离子移向阴极，阳极有大量 Li<sup>+</sup>，所以 Li<sup>+</sup> 通过离子交换膜Ⅲ向左移动，Cl<sup>−</sup> 通过离子交换膜Ⅱ向右移动，在离子交换膜Ⅱ、Ⅲ之间得到 LiCl。要实现海水淡化，离子交换膜Ⅰ、Ⅱ之间加入海水，Na<sup>+</sup> 通过离子交换膜Ⅰ向左移动，离子交换膜Ⅰ、Ⅱ之间得到淡化海水，离子交换膜Ⅰ、Ⅱ、Ⅲ分别为阳离子交换膜、阴离子交换膜、阳离子交换膜，故Ⅱ为阴离子交换膜，错误。选项 B，电极 a 电极反应为 O<sub>2</sub>+4e<sup>−</sup>+2H<sub>2</sub>O═4OH<sup>−</sup>，电极 a 有 OH<sup>−</sup> 生成，附近溶液的 pH 增大，错误。选项 C，电极 b 电极反应为 Li<sub>3</sub>[Fe(CN)<sub>6</sub>]−e<sup>−</sup>═Li<sub>2</sub>[Fe(CN)<sub>6</sub>]+Li<sup>+</sup> 或 [Fe(CN)<sub>6</sub>]<sup>4−</sup>−e<sup>−</sup>═[Fe(CN)<sub>6</sub>]<sup>3−</sup>，正确。选项 D，每脱除 58.5 g NaCl，转移电子数为 1 mol，有 1 mol Li<sup>+</sup> 和 1 mol Cl<sup>−</sup> 分别通过离子交换膜Ⅲ、膜Ⅱ，可回收 1 mol LiCl，正确。"}, {"id": 12, "src": "2022 全国甲卷 10", "ans": "A", "figs": ["figs/k11/q12.png"], "stem": "一种水性电解液 Zn−MnO<sub>2</sub> 离子选择双隔膜电池如图所示[KOH 溶液中，Zn<sup>2+</sup> 以 Zn(OH)<sub>4</sub><sup>2−</sup> 存在]。电池放电时，下列叙述错误的是", "opts": ["Ⅱ区的 K<sup>+</sup> 通过隔膜向Ⅲ区迁移", "Ⅰ区的 SO<sub>4</sub><sup>2−</sup> 通过隔膜向Ⅱ区迁移", "MnO<sub>2</sub> 电极反应：MnO<sub>2</sub>+2e<sup>−</sup>+4H<sup>+</sup>═Mn<sup>2+</sup>+2H<sub>2</sub>O", "电池总反应：Zn+4OH<sup>−</sup>+MnO<sub>2</sub>+4H<sup>+</sup>═Zn(OH)<sub>4</sub><sup>2−</sup>+Mn<sup>2+</sup>+2H<sub>2</sub>O"], "exp": "【题析】选项 A，该装置为原电池，Ⅲ区 Zn 为电池负极，负极电极反应为 Zn−2e<sup>−</sup>+4OH<sup>−</sup>═Zn(OH)<sub>4</sub><sup>2−</sup>；Ⅰ区 MnO<sub>2</sub> 为电池正极，Ⅰ区为 H<sub>2</sub>SO<sub>4</sub> 溶液，正极电极反应为 MnO<sub>2</sub>+2e<sup>−</sup>+4H<sup>+</sup>═Mn<sup>2+</sup>+2H<sub>2</sub>O。电池放电时，电解质溶液中阴离子向负极移动，阳离子向正极移动。电池在工作过程中，Ⅲ区消耗 OH<sup>−</sup>，Ⅲ区负电荷减少，Ⅲ区的 K<sup>+</sup> 通过隔膜向Ⅱ区迁移，错误。选项 B，Ⅰ区消耗 H<sup>+</sup>，Ⅰ区正电荷减少，Ⅰ区的 SO<sub>4</sub><sup>2−</sup> 通过隔膜向Ⅱ区迁移。Ⅰ、Ⅱ区的隔膜为阴离子交换膜，Ⅱ、Ⅲ区的隔膜为阳离子交换膜，电池工作时，Ⅰ区的 SO<sub>4</sub><sup>2−</sup> 向Ⅱ区移动，Ⅲ区的 K<sup>+</sup> 向Ⅱ区移动，Ⅱ区的 K<sub>2</sub>SO<sub>4</sub> 溶液的浓度增大，正确。选项 C，正极 MnO<sub>2</sub> 电极反应为 MnO<sub>2</sub>+2e<sup>−</sup>+4H<sup>+</sup>═Mn<sup>2+</sup>+2H<sub>2</sub>O，正确。选项 D，由电池负极、正极电极反应可知：电池总反应为 Zn+4OH<sup>−</sup>+MnO<sub>2</sub>+4H<sup>+</sup>═Zn(OH)<sub>4</sub><sup>2−</sup>+Mn<sup>2+</sup>+2H<sub>2</sub>O，正确。"}, {"id": 13, "src": "2024 全国甲卷 10", "ans": "C", "figs": ["figs/k11/q13.png"], "stem": "科学家使用 δ−MnO<sub>2</sub> 研制了一种 MnO<sub>2</sub>−Zn 可充电电池（如图所示）。电池工作一段时间后，MnO<sub>2</sub> 电极上检测到 MnOOH 和少量 ZnMn<sub>2</sub>O<sub>4</sub>。下列叙述正确的是", "opts": ["充电时，Zn<sup>2+</sup> 向阳极方向迁移", "充电时，会发生反应 Zn+2MnO<sub>2</sub>═ZnMn<sub>2</sub>O<sub>4</sub>", "放电时，正极反应有 MnO<sub>2</sub>+H<sub>2</sub>O+e<sup>−</sup>═MnOOH+OH<sup>−</sup>", "放电时，Zn 电极质量减少 0.65 g，MnO<sub>2</sub> 电极生成了 0.020 mol MnOOH"], "exp": "【题析】选项 A，放电时，Zn 电极为原电池的负极，MnO<sub>2</sub> 电极为原电池的正极，充电时，MnO<sub>2</sub> 电极为电解池阳极，Zn 电极为电解池阴极。充电时该装置为电解池，电解池中阳离子向阴极迁移，即 Zn<sup>2+</sup> 向阴极方向迁移，错误。选项 B，放电时，负极反应为 Zn−2e<sup>−</sup>═Zn<sup>2+</sup>，充电时阴极反应为 Zn<sup>2+</sup>+2e<sup>−</sup>═Zn，充电时 Zn 元素化合价降低。充电时，MnO<sub>2</sub> 电极为电解池阳极，阳极反应为 MnOOH+OH<sup>−</sup>−e<sup>−</sup>═MnO<sub>2</sub>+H<sub>2</sub>O，放电时，MnO<sub>2</sub> 电极上检测到 MnOOH 和少量 ZnMn<sub>2</sub>O<sub>4</sub>，说明充电时阳极还发生的反应为 ZnMn<sub>2</sub>O<sub>4</sub>−2e<sup>−</sup>═2MnO<sub>2</sub>+Zn<sup>2+</sup>，结合阴极反应为 Zn<sup>2+</sup>+2e<sup>−</sup>═Zn，充电时，会发生总反应为 ZnMn<sub>2</sub>O<sub>4</sub>═2MnO<sub>2</sub>+Zn，错误。选项 C，放电时，MnO<sub>2</sub> 电极为原电池的正极，MnO<sub>2</sub> 电极上检测到 MnOOH 和少量 ZnMn<sub>2</sub>O<sub>4</sub>，MnO<sub>2</sub> 电极从外电路接收电子，正极发生还原反应有 MnO<sub>2</sub>+H<sub>2</sub>O+e<sup>−</sup>═MnOOH+OH<sup>−</sup>，正确。选项 D，放电时，Zn 电极质量减少 0.65 g，参与反应的 Zn 为 0.010 mol，放电时负极电极反应为 Zn−2e<sup>−</sup>═Zn<sup>2+</sup>，即电路中转移 0.020 mol 电子，由正极的主要反应 MnO<sub>2</sub>+H<sub>2</sub>O+e<sup>−</sup>═MnOOH+OH<sup>−</sup> 可知，若正极上只有 MnOOH 生成，生成 MnOOH 物质的量为 0.020 mol。MnO<sub>2</sub> 电极上检测到 MnOOH 和少量 ZnMn<sub>2</sub>O<sub>4</sub>，说明 MnO<sub>2</sub> 电极上会发生 2 个还原反应，分别为 MnO<sub>2</sub>+H<sub>2</sub>O+e<sup>−</sup>═MnOOH+OH<sup>−</sup> 和 2MnO<sub>2</sub>+Zn<sup>2+</sup>+2e<sup>−</sup>═ZnMn<sub>2</sub>O<sub>4</sub>，只要正极上还有少量 ZnMn<sub>2</sub>O<sub>4</sub> 生成，0.020 mol 电子不可能全部用于 MnOOH 的生成，因此生成的 MnOOH 的物质的量小于 0.020 mol，错误。"}, {"id": 14, "src": "2022 浙江 6月 21", "ans": "C", "figs": ["figs/k11/q14.png"], "stem": "通过电解废旧锂电池中的 LiMn<sub>2</sub>O<sub>4</sub> 可获得难溶性的 Li<sub>2</sub>CO<sub>3</sub> 和 MnO<sub>2</sub>，电解示意图如下（其中滤布的作用是阻挡固体颗粒，但离子可自由通过）。电解过程中溶液的体积变化忽略不计。下列说法不正确的是", "opts": ["电极 A 为阴极，发生还原反应", "电极 B 的电极反应：2H<sub>2</sub>O+Mn<sup>2+</sup>−2e<sup>−</sup>═MnO<sub>2</sub>+4H<sup>+</sup>", "电解一段时间后溶液中 Mn<sup>2+</sup> 浓度保持不变", "电解结束，可通过调节 pH 除去 Mn<sup>2+</sup>，再加入 Na<sub>2</sub>CO<sub>3</sub> 溶液以获得 Li<sub>2</sub>CO<sub>3</sub>"], "exp": "【题析】选项 A，由电解示意图可知，电极 B 上 Mn<sup>2+</sup> 转化为 MnO<sub>2</sub>，Mn 元素化合价升高，发生氧化反应，电极 B 为电解池阳极，电极 A 为阴极，发生还原反应，正确。选项 B，电极 B 为电解池阳极，阳极电极反应为 2H<sub>2</sub>O+Mn<sup>2+</sup>−2e<sup>−</sup>═MnO<sub>2</sub>+4H<sup>+</sup>，正确。选项 C，电极 A 为阴极，LiMn<sub>2</sub>O<sub>4</sub> 得电子转化为 Li<sup>+</sup>，阴极电极反应为 LiMn<sub>2</sub>O<sub>4</sub>+3e<sup>−</sup>+8H<sup>+</sup>═Li<sup>+</sup>+2Mn<sup>2+</sup>+4H<sub>2</sub>O，电解池总反应为 2LiMn<sub>2</sub>O<sub>4</sub>+4H<sup>+</sup>═2Li<sup>+</sup>+Mn<sup>2+</sup>+3MnO<sub>2</sub>+2H<sub>2</sub>O，电解一段时间后溶液中生成 Mn<sup>2+</sup>，Mn<sup>2+</sup> 浓度增大，错误。选项 D，电解结束，可通过调节 pH 将 Mn<sup>2+</sup> 转化为沉淀除去，然后再加入 Na<sub>2</sub>CO<sub>3</sub> 溶液，从而获得 Li<sub>2</sub>CO<sub>3</sub>，正确。"}, {"id": 15, "src": "2024 广州一模 16", "ans": "C", "figs": ["figs/k11/q15.png"], "stem": "一种简单钒液流电池的结构及工作原理示意图所示，下列说法不正确的是", "opts": ["放电时，H<sup>+</sup> 从 N 极区向 M 极区移动", "充电时，电极 M 是阳极", "每消耗 1 mol VO<sub>2</sub><sup>+</sup>，有 2 mol H<sup>+</sup> 通过质子交换膜", "充电时的总反应：VO<sup>2+</sup>+H<sub>2</sub>O+V<sup>3+</sup>═VO<sub>2</sub><sup>+</sup>+2H<sup>+</sup>+V<sup>2+</sup>"], "exp": "【题析】选项 A，钒液流电池中，酸性溶液中的钒通常以 V<sup>2+</sup>、V<sup>3+</sup>、VO<sup>2+</sup>、VO<sub>2</sub><sup>+</sup> 等形式存在，其中 VO<sup>2+</sup> 中 V 的化合价为+4，VO<sub>2</sub><sup>+</sup> 中 V 的化合价为+5。图中所示为放电过程，正极室（M 极区）中 VO<sub>2</sub><sup>+</sup> 转化为 VO<sup>2+</sup>，化合价降低，得到电子，发生还原反应；负极室（N 极区）V<sup>2+</sup> 转化为 V<sup>3+</sup>，化合价升高，失去电子，发生氧化反应。放电时，原电池中阳离子向正极移动，阳离子 H<sup>+</sup> 由负极区（N 极区）移向正极区（M 极区），正确。选项 B，充电时，VO<sup>2+</sup> 失去电子，被氧化为 VO<sub>2</sub><sup>+</sup>，电极 M 作为阳极，正确。选项 C，放电时，原电池正极反应为 VO<sub>2</sub><sup>+</sup>+2H<sup>+</sup>+e<sup>−</sup>═VO<sup>2+</sup>+H<sub>2</sub>O，每消耗 1 mol VO<sub>2</sub><sup>+</sup>，转移 1 mol 电子，电路中通过的电荷数相等，则有 1 mol H<sup>+</sup> 通过质子交换膜，错误。选项 D，充电时，阳极室（M 极区）VO<sup>2+</sup> 被氧化为 VO<sub>2</sub><sup>+</sup>，阳极电极反应为 VO<sup>2+</sup>−e<sup>−</sup>+H<sub>2</sub>O═VO<sub>2</sub><sup>+</sup>+2H<sup>+</sup>，阴极室（N 极区）V<sup>3+</sup> 被还原为 V<sup>2+</sup>，阴极电极反应为 V<sup>3+</sup>+e<sup>−</sup>═V<sup>2+</sup>，充电时的总反应为 VO<sup>2+</sup>+H<sub>2</sub>O+V<sup>3+</sup>═VO<sub>2</sub><sup>+</sup>+2H<sup>+</sup>+V<sup>2+</sup>，正确。"}, {"id": 16, "src": "2025 广州一模 16", "ans": "B", "figs": ["figs/k11/q16.png"], "stem": "一种基于硝酸盐还原和氨氧化的储能电池示意图如下，电极为金属 Zn 和选择性催化材料，放电时，含 NO<sub>3</sub><sup>−</sup> 的废水被转化为 NH<sub>3</sub>。下列说法不正确的是", "opts": ["放电时，正极区域的 pH 增大", "放电时，每消耗 1 mol NO<sub>3</sub><sup>−</sup>，负极室溶液质量增加 260 g", "充电时，Zn 连接外接电源的负极", "充电时，阳极反应：NH<sub>3</sub>+9OH<sup>−</sup>−8e<sup>−</sup>═NO<sub>3</sub><sup>−</sup>+6H<sub>2</sub>O"], "exp": "【题析】选项 A，放电时，含 NO<sub>3</sub><sup>−</sup> 的废水被转化为 NH<sub>3</sub>，N 元素化合价降低，发生还原反应，右侧电极为原电池正极，正极电极反应为 NO<sub>3</sub><sup>−</sup>+6H<sub>2</sub>O+8e<sup>−</sup>═NH<sub>3</sub>+9OH<sup>−</sup>；放电时，左侧电极处 Zn 转化为 Zn(OH)<sub>4</sub><sup>2−</sup>，发生氧化反应，左侧电极为原电池负极，负极电极反应为 Zn−2e<sup>−</sup>+4OH<sup>−</sup>═Zn(OH)<sub>4</sub><sup>2−</sup>。放电时，正极区每消耗 1 mol NO<sub>3</sub><sup>−</sup> 时，转移 8 mol e<sup>−</sup>，生成 9 mol OH<sup>−</sup>，同时正极区最多有 8 mol OH<sup>−</sup> 通过 OH<sup>−</sup> 离子交换膜进入负极区域，正极区域 pH 增大，正确。选项 B，放电时，负极电极反应为 Zn−2e<sup>−</sup>+4OH<sup>−</sup>═Zn(OH)<sub>4</sub><sup>2−</sup>，每消耗 1 mol NO<sub>3</sub><sup>−</sup> 时，转移 8 mol e<sup>−</sup>，有 4 mol Zn 转化成 Zn(OH)<sub>4</sub><sup>2−</sup> 进入负极室，同时正极区会有 8 mol OH<sup>−</sup> 通过阴离子交换膜进入负极区，故负极室溶液质量增加 4 mol×65 g·mol<sup>−1</sup>+8 mol×17 g·mol<sup>−1</sup>=396 g，错误。选项 C，充电时，Zn 极发生还原反应 Zn(OH)<sub>4</sub><sup>2−</sup>+2e<sup>−</sup>═Zn+4OH<sup>−</sup>，Zn 极为阴极，连接电源负极，正确。选项 D，充电时，阳极发生氧化反应，阳极电极反应为 NH<sub>3</sub>+9OH<sup>−</sup>−8e<sup>−</sup>═NO<sub>3</sub><sup>−</sup>+6H<sub>2</sub>O，正确。"}, {"id": 17, "src": "2025 广州二测 16", "ans": "C", "figs": ["figs/k11/q17.png"], "stem": "一种兼具合成功能的新型锂电池工作原理如图。电解质为含 Li<sup>+</sup> 有机溶液，放电过程中 Ni−Pt 电极首先发生反应 6Li<sup>+</sup>+N<sub>2</sub>+6e<sup>−</sup>═2Li<sub>3</sub>N，后产生 (CF<sub>3</sub>SO<sub>2</sub>)<sub>2</sub>NLi，充电过程中电解 LiCl 产生 Cl<sub>2</sub>。下列说法不正确的是", "opts": ["充电时，阳极产生 Cl<sub>2</sub>", "放电时，Li<sup>+</sup> 从 Li 电极向 Ni−Pt 电极迁移", "放电时，每消耗 6 mol Li，正极室增加 28 g", "放电时总反应：6Li+N<sub>2</sub>+4CF<sub>3</sub>SO<sub>2</sub>Cl═2(CF<sub>3</sub>SO<sub>2</sub>)<sub>2</sub>NLi+4LiCl"], "exp": "【题析】过程中 Ni−Pt 电极首先发生反应 6Li<sup>+</sup>+N<sub>2</sub>+6e<sup>−</sup>═2Li<sub>3</sub>N，后产生 (CF<sub>3</sub>SO<sub>2</sub>)<sub>2</sub>NLi，放电过程中 Ni−Pt 电极处发生还原反应，为正极，Li 电极为负极，负极电极反应为 Li−e<sup>−</sup>═Li<sup>+</sup>。充电过程中电解 LiCl 产生 Cl<sub>2</sub>，充电过程中 Ni−Pt 电极处发生氧化反应，为阳极，连接电源正极，Li 电极为阴极，连接电源负极。选项 A，充电时，阳极电极反应为 2Cl<sup>−</sup>−2e<sup>−</sup>═Cl<sub>2</sub>↑，因此阳极产生 Cl<sub>2</sub>，正确。选项 B，放电时，Ni−Pt 电极为正极，Li 电极为负极，放电时阳离子 Li<sup>+</sup> 由负极移向正极，故 Li<sup>+</sup> 从 Li 电极向 Ni−Pt 电极迁移，正确。选项 C，放电时，负极电极反应为 Li−e<sup>−</sup>═Li<sup>+</sup>，正极电极反应为 6Li<sup>+</sup>+N<sub>2</sub>+6e<sup>−</sup>═2Li<sub>3</sub>N，每消耗 6 mol Li，转移电子数为 6 mol，有 1 mol N<sub>2</sub>（28 g）发生反应进入正极室溶液中，同时有 6 mol Li<sup>+</sup>（6 mol×7 g·mol<sup>−1</sup>=42 g）通过阳离子交换膜从负极室进入正极室，因此正极室增加 70 g，错误。选项 D，放电过程中，正极电极反应为 6Li<sup>+</sup>+N<sub>2</sub>+6e<sup>−</sup>═2Li<sub>3</sub>N，后 Li<sub>3</sub>N 与 CF<sub>3</sub>SO<sub>2</sub>Cl 反应，生成 (CF<sub>3</sub>SO<sub>2</sub>)<sub>2</sub>NLi 和 LiCl，化学方程式为 Li<sub>3</sub>N+2CF<sub>3</sub>SO<sub>2</sub>Cl═(CF<sub>3</sub>SO<sub>2</sub>)<sub>2</sub>NLi+2LiCl；负极电极反应为 6Li−6e<sup>−</sup>═6Li<sup>+</sup>，因此电池的总反应为 6Li+N<sub>2</sub>+4CF<sub>3</sub>SO<sub>2</sub>Cl═2(CF<sub>3</sub>SO<sub>2</sub>)<sub>2</sub>NLi+4LiCl，正确。"}, {"id": 18, "src": "2026 广州调研 16", "ans": "D", "figs": ["figs/k11/q18.png"], "stem": "一种由 Ni−CuO 催化剂电极和金属铝电极组装的电池示意图如图，该电池可将污水中的 NO<sub>3</sub><sup>−</sup> 还原为 NH<sub>3</sub>。下列说法错误的是", "opts": ["放电时负极反应为 Al+4OH<sup>−</sup>−3e<sup>−</sup>═[Al(OH)<sub>4</sub>]<sup>−</sup>", "放电时正极区溶液的 pH 增大", "理论上每还原 1 mol NO<sub>3</sub><sup>−</sup>，电路中转移 8 mol e<sup>−</sup>", "理论上每还原 1 mol NO<sub>3</sub><sup>−</sup>，负极区溶液质量增加 225 g"], "exp": "【题析】根据电池示意图，放电时，含 NO<sub>3</sub><sup>−</sup> 的废水被转化为 NH<sub>3</sub>，即 N 元素在右侧电极处发生还原反应，Ni−CuO 催化剂电极为原电池的正极，左侧金属铝电极发生氧化反应，为原电池的负极。选项 A，放电时，负极发生氧化反应，电极反应为 Al−3e<sup>−</sup>+4OH<sup>−</sup>═[Al(OH)<sub>4</sub>]<sup>−</sup>，正确。选项 B，放电时，正极发生还原反应，电极反应为 NO<sub>3</sub><sup>−</sup>+6H<sub>2</sub>O+8e<sup>−</sup>═NH<sub>3</sub>+9OH<sup>−</sup>。正极区每消耗 1 mol NO<sub>3</sub><sup>−</sup> 时，转移 8 mol e<sup>−</sup>，生成 9 mol OH<sup>−</sup>，同时正极区域最多有 8 mol OH<sup>−</sup> 通过 OH<sup>−</sup> 离子交换膜进入负极区域，正极区域 pH 增大，正确。选项 C，NO<sub>3</sub><sup>−</sup> 参与的电极反应为 NO<sub>3</sub><sup>−</sup>+6H<sub>2</sub>O+8e<sup>−</sup>═NH<sub>3</sub>+9OH<sup>−</sup>，理论上每还原 1 mol NO<sub>3</sub><sup>−</sup> 时，转移 8 mol e<sup>−</sup>，正确。选项 D，当还原 1 mol NO<sub>3</sub><sup>−</sup> 时，电路中转移 8 mol e<sup>−</sup>，有 8/3 mol Al 转化成 [Al(OH)<sub>4</sub>]<sup>−</sup> 进入负极室，负极区质量增加 8/3 mol×27 g·mol<sup>−1</sup>=72 g，同时正极室有 8 mol OH<sup>−</sup> 穿过 OH<sup>−</sup> 离子交换膜进入负极区域，故负极室溶液质量增加 72 g+8 mol×17 g·mol<sup>−1</sup>=208 g，错误。"}, {"id": 19, "src": "2026 广州一模 14", "ans": "C", "figs": ["figs/k11/q19.png"], "stem": "一种以 Ni−CuO 作为电催化剂的 Al−NO<sub>3</sub><sup>−</sup> 新型电池如图所示，放电时可将污水中的 var KEY = 'xz11_state', TKEY = 'xz_theme', NKEY = 'xz_name';

function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

var curAudio=null, faceTimers={};
function setFace(fid,base,name,hold){
  var img=$(fid);if(!img)return;
  img.src=base+name+'.webp'+FACE_VER;
  if(faceTimers[fid])clearTimeout(faceTimers[fid]);
  if(name!=='idle'){faceTimers[fid]=setTimeout(function(){setFace(fid,base,'idle')},hold||2600)}
}
function playVoice(src){
  try{if(curAudio){curAudio.pause();curAudio=null}}catch(e){}
  try{
    var a=new Audio(src);
    curAudio=a;
    a.onerror=function(){if(curAudio===a)curAudio=null};
    a.play().catch(function(){});
  }catch(e){}
}
function toggleBox(bx){var el=$(bx);if(!el)return;el.style.display=(el.style.display==='flex')?'none':'flex'}
function calc(){
  var ok=0;
  QS.forEach(function(q){if(st.a[q.id]===q.ans&&st.help[q.id]!=='rock')ok++});
  var done=Object.keys(st.a).length;
  return {done:done,ok:ok,score:ok*PER};
}
function renderStats(){
  var c=calc();
  $('sProg').textContent=c.done;$('sScore').textContent=c.score;$('sOk').textContent=c.ok;$('sTime').textContent=fmt(st.elapsed);
}
function setSkip(id,on){
  var act=$('act'+id),tip=$('skd'+id),ob=$('op'+id);
  act.style.display=on?'none':'flex';
  $('hl'+id).style.display=on?'none':'flex';
  if(on){var jb=$('jbx'+id),rb=$('rbx'+id),jh=$('jht'+id),rh=$('rht'+id);if(jb)jb.style.display='none';if(rb)rb.style.display='none';if(jh)jh.style.display='none';if(rh)rh.style.display='none';}
  tip.style.display=on?'block':'none';
  Array.prototype.forEach.call(ob.children,function(b){b.disabled=on||!!st.a[id]});
  $('qc'+id).classList.toggle('skipped-card',on);
}

      v.style.color=rock?'#f59e0b':(ok?'var(--ok-ink)':'var(--bad-ink)');
      v.textContent=rock?'已求助小岩 · 本题计 0 分（正确答案 '+q.ans+'）':(ok?'回答正确 +'+PER+' 分':'回答错误 · 正确答案 '+q.ans);
      $('qm'+q.id).textContent=rock?'📖':(ok?'✓':'✗');
      $('qm'+q.id).style.color=rock?'#f59e0b':(ok?'var(--ok)':'var(--bad)');
      if(rock){$('rht'+q.id).style.display='block';$('rbx'+q.id).style.display='flex';$('hl'+q.id).style.display='none';}
      else{$('ex'+q.id).style.display='block';$('hl'+q.id).style.display='none';}
      $('act'+q.id).style.display='none';
      Array.prototype.forEach.call(ob.children,function(b){b.disabled=true});
      renderStats();save();
    };
    if($('jd'+q.id)){$('jd'+q.id).onclick=function(){
      if(done||skipped)return;
      st.help[q.id]='jade';
      if(!st.started){st.started=true}
      $('jht'+q.id).style.display='block';
      $('jbx'+q.id).style.display='flex';
      $('jd'+q.id).style.opacity=.5;
      setFace('jf'+q.id,YU_BASE,'think',2400);
      setTimeout(function(){if(st.help[q.id]==='jade')setFace('jf'+q.id,YU_BASE,'encourage',2600)},2700);
      playVoice('../assets/xz/audio/k11/h'+q.id+'.mp3');
      save();
    };}
    $('rk'+q.id).onclick=function(){
      if(done||skipped)return;
      if(!confirm('看小岩详解后，本题将计 0 分（即使答对）。确定求助吗？'))return;
      st.help[q.id]='rock';
      if(!st.started){st.started=true}
      $('rht'+q.id).style.display='block';
      $('rbx'+q.id).style.display='flex';
      $('rk'+q.id).style.opacity=.5;
      setFace('rf'+q.id,YAN_BASE,'write',2400);
      setTimeout(function(){if(st.help[q.id]==='rock')setFace('rf'+q.id,YAN_BASE,'think',2600)},2700);
      playVoice('../assets/xz/audio/xiaoyan_hi.mp3');
      renderStats();save();
    };
    $('sk'+q.id).onclick=function(){
      if(done||skipped)return;
      skipped=true;st.skip[q.id]=1;
      if(!st.started){st.started=true}
      setSkip(q.id,true);save();
    };
    $('us'+q.id).onclick=function(){
      if(!skipped)return;
      skipped=false;delete st.skip[q.id];
      setSkip(q.id,false);save();
    };
    $('nx'+q.id).onclick=function(){
      if(i<N-1){var n=QS[i+1];var el=document.getElementById('qc'+n.id);el.scrollIntoView({behavior:'smooth',block:'start'})}
      else{window.scrollTo({top:0,behavior:'smooth'})}
    };
    $('jht'+q.id).onclick=function(){toggleBox('jbx'+q.id)};
    $('rht'+q.id).onclick=function(){toggleBox('rbx'+q.id)};
  });
}
function paintResult(q,ob,pick,ok){
  Array.prototype.forEach.call(ob.children,function(c,j){
    var L='ABCD'[j];c.disabled=true;
    if(L===q.ans)c.classList.add('rgt');
    else if(L===pick)c.classList.add('wrg');
  });
}
var timer=setInterval(function(){
  var c=calc();
  if(st.started&&c.done<N){st.elapsed++;renderStats();if(st.elapsed%5===0)save()}
},1000);
function pad(n){return ('0'+n).slice(-2)}
function showCard(){
  $('result').style.display='block';
  $('stuName').value=localStorage.getItem(NKEY)||'';
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
}
$('btnCard').onclick=function(){showCard()};
$('btnGen').onclick=function(){
  var name=$('stuName').value.trim()||'同学';
  try{localStorage.setItem(NKEY,name)}catch(e){}
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
};
$('btnClose').onclick=function(){
  $('result').style.display='none';
  var first=QS.find(function(q){return !st.a[q.id]&&!st.skip[q.id]});
  var el=first?document.getElementById('qc'+first.id):$('qlist');
  el.scrollIntoView({behavior:'smooth',block:'start'});
};
function drawCard(){
  var c=document.getElementById('canvas'),x=c.getContext('2d'),W=c.width,H=c.height;
  var g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0f172a');g.addColorStop(.55,'#152743');g.addColorStop(1,'#1b1140');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(34,211,238,.08)';x.beginPath();x.arc(W-60,60,150,0,7);x.fill();
  x.fillStyle='rgba(167,139,250,.08)';x.beginPath();x.arc(50,H-40,130,0,7);x.fill();
  x.fillStyle='#67e8f9';x.font='500 22px sans-serif';x.fillText('化学不难学 · 高考选择题训练',40,52);
  x.fillStyle='#8ea0b5';x.font='16px sans-serif';x.fillText('考点11 化学电池 · 每题 '+PER+' 分',40,84);
  var name=$('stuName').value.trim()||'同学';
  x.fillStyle='#e2e8f0';x.font='500 26px sans-serif';x.fillText(name,40,150);
  var cc=calc();
  x.fillStyle='#a78bfa';x.font='700 88px sans-serif';x.fillText(cc.score,40,250);
  x.fillStyle='#8ea0b5';x.font='18px sans-serif';x.fillText('分 / 满分 '+(N*PER)+' 分',40+String(cc.score).length*52+14,250);
  var acc=cc.done?Math.round(cc.ok/cc.done*100):0;
  var cells=[['正确率',acc+'%（'+cc.ok+'/'+cc.done+'）'],['完成度',cc.done+' / '+N+' 题'],['做题时长',fmt(st.elapsed)]];
  cells.forEach(function(cell,i){
    var cx=40+i*228;
    x.fillStyle='#1e293b';x.fillRect(cx,280,208,84);
    x.fillStyle='#67e8f9';x.font='14px sans-serif';x.fillText(cell[0],cx+18,310);
    x.fillStyle='#e2e8f0';x.font='500 20px sans-serif';x.fillText(cell[1],cx+18,346);
  });
  var d=new Date();
  var stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('提交时间 '+stamp,40,400);
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('已做题号（绿=自己对 蓝=问小玉 橙=问小岩0分 红=自己错）',40,432);
  var doneList=QS.filter(function(q){return !!st.a[q.id]});
  var jadeN=0,rockN=0;
  doneList.forEach(function(q,i){
    var col=i%14,row=Math.floor(i/14);
    var bx=40+col*48,by=450+row*46;
    var ok=st.a[q.id]===q.ans,h=st.help[q.id];
    var colr=h==='rock'?'#d97706':h==='jade'?'#3b82f6':(ok?'#16a34a':'#dc2626');
    if(h==='rock')rockN++;if(h==='jade')jadeN++;
    x.fillStyle=colr;x.fillRect(bx,by,38,36);
    x.fillStyle='#ffffff';x.font='500 16px sans-serif';x.fillText(String(q.id),bx+9,by+25);
  });
  x.fillStyle='#5b6b7f';x.font='13px sans-serif';
  x.fillText('答对 '+cc.ok+' · 答错 '+(cc.done-cc.ok)+' · 问小玉 '+jadeN+' · 问小岩 '+rockN+' · 未做 '+(N-cc.done)+' · 跳过 '+Object.keys(st.skip).length,40,H-22);
  window.__lastCard={time:stamp,done:cc.done,ok:cc.ok,score:cc.score,elapsed:fmt(st.elapsed),skip:Object.keys(st.skip).length,jade:jadeN,rock:rockN};
}
$('stuName').addEventListener('input',function(){try{localStorage.setItem(NKEY,this.value)}catch(e){}});
$('btnSave').onclick=function(){
  var a=document.createElement('a');
  a.download='选择题训练_考点11_'+(($('stuName').value.trim()||'成绩'))+'.png';
  a.href=$('canvas').toDataURL('image/png');a.click();
};
$('resetBtn').onclick=function(){
  var c=calc();
  if(c.done===0&&Object.keys(st.skip).length===0){alert('本讲还没有答题记录');return}
  if(confirm('确定清空本讲全部记录和成绩卡重新做吗？')){
    localStorage.removeItem(KEY);location.reload();
  }
};
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('themeBtn').textContent=t==='dark'?'☀':'🌙';
  try{localStorage.setItem(TKEY,t)}catch(e){}
}
$('themeBtn').onclick=function(){
  applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
};
applyTheme((function(){try{return localStorage.getItem(TKEY)||'dark'}catch(e){return 'dark'}})());
load();build();renderStats();
</script>

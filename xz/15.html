var QS = [{"id": 1, "src": "2025 广东 12", "ans": "A", "stem": "CuCl 微溶于水，但在 Cl<sup>−</sup> 浓度较高的溶液中因形成 [CuCl<sub>2</sub>]<sup>−</sup> 和 [CuCl<sub>3</sub>]<sup>2−</sup> 而溶解。将适量 CuCl 完全溶于盐酸，得到含 [CuCl<sub>2</sub>]<sup>−</sup> 和 [CuCl<sub>3</sub>]<sup>2−</sup> 的溶液，下列叙述正确的是", "opts": ["加水稀释，[CuCl<sub>3</sub>]<sup>2−</sup> 浓度一定下降", "向溶液中加入少量 NaCl 固体，[CuCl<sub>2</sub>]<sup>−</sup> 浓度一定上升", "H[CuCl<sub>2</sub>] 的电离方程式为 H[CuCl<sub>2</sub>] ══ H<sup>+</sup>+Cu<sup>2+</sup>+2Cl<sup>−</sup>", "体系中，c(Cu<sup>+</sup>)+c(H<sup>+</sup>)=c(Cl<sup>−</sup>)+c([CuCl<sub>2</sub>]<sup>−</sup>)+c([CuCl<sub>3</sub>]<sup>2−</sup>)+c(OH<sup>−</sup>)"], "exp": "【题析】CuCl 完全溶于盐酸，得到含 [CuCl<sub>2</sub>]<sup>−</sup> 和 [CuCl<sub>3</sub>]<sup>2−</sup> 的溶液，存在三个平衡：CuCl+Cl<sup>−</sup>⇌[CuCl<sub>2</sub>]<sup>−</sup>，[CuCl<sub>2</sub>]<sup>−</sup>+Cl<sup>−</sup>⇌[CuCl<sub>3</sub>]<sup>2−</sup>，CuCl+2Cl<sup>−</sup>⇌[CuCl<sub>3</sub>]<sup>2−</sup>。选项 A，加水稀释，溶液体积增大，体积影响程度较大，[CuCl<sub>3</sub>]<sup>2−</sup> 浓度一定下降，正确。选项 B，加入少量 NaCl 固体后，溶液 Cl<sup>−</sup> 浓度增大，平衡均正向移动，可能促使 [CuCl<sub>2</sub>]<sup>−</sup> 转化为 [CuCl<sub>3</sub>]<sup>2−</sup>，[CuCl<sub>2</sub>]<sup>−</sup> 浓度不一定上升，错误。选项 C，H[CuCl<sub>2</sub>] 的电离方程式为 H[CuCl<sub>2</sub>] ══ H<sup>+</sup>+[CuCl<sub>2</sub>]<sup>−</sup>，错误。选项 D，体系中电荷守恒，c(Cu<sup>+</sup>)+c(H<sup>+</sup>)=c(Cl<sup>−</sup>)+c([CuCl<sub>2</sub>]<sup>−</sup>)+2c([CuCl<sub>3</sub>]<sup>2−</sup>)+c(OH<sup>−</sup>)，错误。"}, {"id": 2, "src": "2021 广东 8", "ans": "B", "stem": "鸟嘌呤（G）是一种有机弱碱，可与盐酸反应生成盐酸盐（用 GHCl 表示）。已知 GHCl 水溶液呈酸性，下列叙述正确的是", "opts": ["0.001 mol·L<sup>−1</sup> GHCl 水溶液的 pH=3", "0.001 mol·L<sup>−1</sup> GHCl 水溶液加水稀释，pH 升高", "GHCl 在水中的电离方程式为 GHCl ══ G+HCl", "GHCl 水溶液中：c(OH<sup>−</sup>)+c(Cl<sup>−</sup>)=c(H<sup>+</sup>)+c(G)"], "exp": "【题析】选项 A，GHCl 为强酸弱碱盐，电离出的 GH<sup>+</sup> 会发生水解生成 H<sup>+</sup>，GH<sup>+</sup> 水解反应为 GH<sup>+</sup>+H<sub>2</sub>O⇌G·H<sub>2</sub>O+H<sup>+</sup>，GH<sup>+</sup> 水解微弱，c(H<sup>+</sup>) 小于 0.001 mol·L<sup>−1</sup>，故 0.001 mol·L<sup>−1</sup> GHCl 水溶液的 pH>3，错误。选项 B，GHCl 为强酸弱碱盐，稀释 GHCl 溶液，GH<sup>+</sup> 水解程度将增大，溶液体积增大，c(H<sup>+</sup>) 减小，溶液 pH 升高，正确。选项 C，GHCl 为强酸弱碱盐，在水中的电离方程式为 GHCl ══ GH<sup>+</sup>+Cl<sup>−</sup>，错误。选项 D，根据电荷守恒，GHCl 溶液中 c(OH<sup>−</sup>)+c(Cl<sup>−</sup>)=c(H<sup>+</sup>)+c(GH<sup>+</sup>)，错误。"}, {"id": 3, "src": "2021 广东适应性 9", "ans": "B", "stem": "叠氮酸（HN<sub>3</sub>）与 NaOH 溶液反应生成 NaN<sub>3</sub>。已知 NaN<sub>3</sub> 溶液呈碱性，下列叙述正确的是", "opts": ["0.01 mol·L<sup>−1</sup> HN<sub>3</sub> 溶液的 pH=2", "HN<sub>3</sub> 溶液的 pH 随温度升高而减小", "NaN<sub>3</sub> 的电离方程式：NaN<sub>3</sub> ══ Na<sup>+</sup>+3N<sub>3</sub><sup>−</sup>", "0.01 mol·L<sup>−1</sup> NaN<sub>3</sub> 溶液中，c(H<sup>+</sup>)+c(Na<sup>+</sup>)=c(N<sub>3</sub><sup>−</sup>)+c(HN<sub>3</sub>)"], "exp": "【题析】选项 A，NaN<sub>3</sub> 溶液呈碱性，说明 HN<sub>3</sub> 是弱酸，在水溶液中部分电离，故 0.01 mol·L<sup>−1</sup> HN<sub>3</sub> 中 c(H<sup>+</sup>)<0.01 mol·L<sup>−1</sup>，溶液的 pH>2，错误。选项 B，HN<sub>3</sub> 是弱酸，属于弱电解质，温度升高，促进电离平衡 HN<sub>3</sub>⇌H<sup>+</sup>+N<sub>3</sub><sup>−</sup> 正向移动，故溶液中 c(H<sup>+</sup>) 增大，pH 减小，正确。选项 C，NaN<sub>3</sub> 是强电解质，完全电离，电离方程式为 NaN<sub>3</sub> ══ Na<sup>+</sup>+N<sub>3</sub><sup>−</sup>，错误。选项 D，NaN<sub>3</sub> 溶液中，根据电荷守恒 c(H<sup>+</sup>)+c(Na<sup>+</sup>)=c(N<sub>3</sub><sup>−</sup>)+c(OH<sup>−</sup>)，错误。"}, {"id": 4, "src": "2021 广东适应性 15", "ans": "D", "figs": ["figs/k15/q4.png"], "stem": "水体中重金属铅的污染问题备受关注。溶液中 Pb<sup>2+</sup> 及其与 OH<sup>−</sup> 形成的微粒的浓度分数 α 随溶液 pH 变化的关系如图所示。已知 NH<sub>3</sub>·H<sub>2</sub>O 的 K_b=1.74×10<sup>−5</sup>。向 Pb(NO<sub>3</sub>)<sub>2</sub> 溶液中滴加氨水，关于该过程的说法正确的是", "opts": ["Pb<sup>2+</sup> 的浓度分数先减小后增大", "c(NO<sub>3</sub><sup>−</sup>) 与 c(Pb<sup>2+</sup>) 的比值减小后增大，pH>10 后不变", "pH=7 时，存在的阳离子仅有 Pb<sup>2+</sup>、Pb(OH)<sup>+</sup> 和 H<sup>+</sup>", "溶液中 Pb<sup>2+</sup> 与 Pb(OH)<sub>2</sub> 浓度相等时，氨主要以 NH<sub>4</sub><sup>+</sup> 的形式存在"], "exp": "【题析】选项 A，向 Pb(NO<sub>3</sub>)<sub>2</sub> 溶液中滴加氨水，随着 OH<sup>−</sup> 的加入，溶液 pH 增大，含 Pb 微粒的形态和浓度分数不断变化为 Pb<sup>2+</sup>→Pb(OH)<sup>+</sup>→Pb(OH)<sub>2</sub>→Pb(OH)<sub>3</sub><sup>−</sup>→Pb(OH)<sub>4</sub><sup>2−</sup>。由图可知，Pb<sup>2+</sup> 的浓度分数一直减小，不是先减小后增大，错误。选项 B，向 Pb(NO<sub>3</sub>)<sub>2</sub> 溶液中滴加氨水，溶液体积增大，导致 c(NO<sub>3</sub><sup>−</sup>) 与 c(Pb<sup>2+</sup>) 都减小，忽略溶液体积变化的影响，可将 c(NO<sub>3</sub><sup>−</sup>) 与 c(Pb<sup>2+</sup>) 的比值转化为 n(NO<sub>3</sub><sup>−</sup>) 与 n(Pb<sup>2+</sup>) 的比值来分析，由于 Pb<sup>2+</sup> 和氨水反应生成 Pb(OH)<sup>+</sup>，随着 pH 增大，n(Pb<sup>2+</sup>) 逐渐减小，而 n(NO<sub>3</sub><sup>−</sup>) 保持不变，故 n(NO<sub>3</sub><sup>−</sup>) 与 n(Pb<sup>2+</sup>) 的比值增大。由图可知，随着 pH 增大，c(Pb<sup>2+</sup>) 一直减小，当 pH>10 后，c(Pb<sup>2+</sup>) 无限趋近于 0，但不等于 0，即 n(Pb<sup>2+</sup>) 无限趋近于 0，但不趋于 0，则 n(NO<sub>3</sub><sup>−</sup>) 与 n(Pb<sup>2+</sup>) 的比值一直增大，趋近于无穷大，错误。选项 C，pH=7 时，从图中看出 Pb 微粒的主要存在形式是 Pb<sup>2+</sup> 和 Pb(OH)<sup>+</sup>，根据元素守恒分析可知，Pb<sup>2+</sup> 与 NH<sub>3</sub>·H<sub>2</sub>O 反应会生成 Pb(OH)<sup>+</sup> 和 NH<sub>4</sub><sup>+</sup>，因此溶液中存在的阳离子不仅有 Pb<sup>2+</sup>、Pb(OH)<sup>+</sup> 和 H<sup>+</sup>，还有 NH<sub>4</sub><sup>+</sup>，错误。选项 D，当溶液中 Pb<sup>2+</sup> 与 Pb(OH)<sub>2</sub> 浓度相等时，从图中可找到 Pb<sup>2+</sup> 与 Pb(OH)<sub>2</sub> 浓度分数曲线的交点，此时溶液 pH=8，则 c(OH<sup>−</sup>)=1×10<sup>−6</sup> mol·L<sup>−1</sup>，根据氨水的电离平衡常数可知 K_b=c(NH<sub>4</sub><sup>+</sup>)·c(OH<sup>−</sup>)/c(NH<sub>3</sub>·H<sub>2</sub>O)=1.74×10<sup>−5</sup>，即 c(NH<sub>4</sub><sup>+</sup>)/c(NH<sub>3</sub>·H<sub>2</sub>O)=17.4，可知 c(NH<sub>4</sub><sup>+</sup>)>c(NH<sub>3</sub>·H<sub>2</sub>O)，因此氨在溶液中的主要存在形式为 NH<sub>4</sub><sup>+</sup>，正确。"}, {"id": 5, "src": "2020 海南 12", "ans": "B", "figs": ["figs/k15/q5.png"], "stem": "某弱酸 HA 溶液中主要成分的分布分数随 pH 的变化如图所示。下列说法错误的是", "opts": ["该酸 −lg K_a≈4.7", "NaA 的水解平衡常数 K_h=1/K_a", "当该溶液的 pH=7.0 时，c(HA)<c(A<sup>−</sup>)", "某 c(HA) : c(A<sup>−</sup>)=4 : 1 的缓冲溶液，pH≈4"], "exp": "【题析】选项 A，弱酸 HA 的电离方程式为 HA⇌H<sup>+</sup>+A<sup>−</sup>，电离平衡常数 K_a=c(H<sup>+</sup>)·c(A<sup>−</sup>)/c(HA)，根据图像可知，c(HA)=c(A<sup>−</sup>) 时，pH=4.7，即 c(H<sup>+</sup>)=10<sup>−4</sup>·<sup>7</sup> mol·L<sup>−1</sup>，K_a=c(H<sup>+</sup>)·c(A<sup>−</sup>)/c(HA)=c(H<sup>+</sup>)=10<sup>−4</sup>·<sup>7</sup> mol·L<sup>−1</sup>，故该酸 −lg K_a≈4.7，正确。选项 B，NaA 的水解平衡方程式为 A<sup>−</sup>+H<sub>2</sub>O⇌HA+OH<sup>−</sup>，NaA 的水解平衡常数 K_h=c(HA)·c(OH<sup>−</sup>)/c(A<sup>−</sup>)=c(HA)·c(OH<sup>−</sup>)·c(H<sup>+</sup>)/[c(A<sup>−</sup>)·c(H<sup>+</sup>)]=K_w/K_a，错误。选项 C，由图像可知，当该溶液的 pH=7.0 时，c(HA)<c(A<sup>−</sup>)，正确。选项 D，当 HA 的分布分数为 0.8、A<sup>−</sup> 的分布分数为 0.2 时，pH 约为 4，故某 c(HA) : c(A<sup>−</sup>)=4 : 1 的缓冲溶液，pH≈4，正确。"}, {"id": 6, "src": "2025 全国新课标 7", "ans": "B", "figs": ["figs/k15/q6.png"], "stem": "HF 总浓度 c总(HF) 为 0.100 0 mol·L<sup>−1</sup> 的水溶液中存在平衡：HF⇌H<sup>+</sup>+F<sup>−</sup>、HF+F<sup>−</sup>⇌HF<sub>2</sub><sup>−</sup>。溶液中 c(HF)、c(HF<sub>2</sub><sup>−</sup>)、c(F<sup>−</sup>) 与 pH 关系如下图所示。下列叙述正确的是", "opts": ["M、N 分别为 c(HF)~pH、c(HF<sub>2</sub><sup>−</sup>)~pH 关系曲线", "K<sub>1</sub>=c(H<sup>+</sup>)·c(F<sup>−</sup>)/c(HF)≈7×10<sup>−4</sup>，K<sub>2</sub>=c(HF<sub>2</sub><sup>−</sup>)/[c(HF)·c(F<sup>−</sup>)]≈5", "溶液中 c总(HF)=c(F<sup>−</sup>)+c(HF)+c(HF<sub>2</sub><sup>−</sup>)", "pH=1 的溶液中 c(H<sup>+</sup>)=c(F<sup>−</sup>)+c(HF<sub>2</sub><sup>−</sup>)+c(OH<sup>−</sup>)"], "exp": "【题析】选项 A，HF 的电离平衡为 HF⇌H<sup>+</sup>+F<sup>−</sup>，电离平衡常数 K_a=c(H<sup>+</sup>)·c(F<sup>−</sup>)/c(HF)，随着 pH 增大，即 c(H<sup>+</sup>) 降低，平衡向右移动，c(F<sup>−</sup>) 增大、c(HF) 减小，故 c(F<sup>−</sup>)~pH 关系是图中 N 曲线，c(HF)~pH 关系是图中 M 曲线。题中增加一个结合平衡 HF+F<sup>−</sup>⇌HF<sub>2</sub><sup>−</sup>，随着 pH 增大，c(F<sup>−</sup>) 增大、c(HF) 减小，使 K<sub>2</sub>=c(HF<sub>2</sub><sup>−</sup>)/[c(HF)·c(F<sup>−</sup>)] 方程中的 c(HF) 可能不会持续增大或减小，故 c(HF<sub>2</sub><sup>−</sup>)~pH 关系是图中 P 曲线，错误。选项 B，利用图中 pH=4 时对应的数据计算 K<sub>1</sub> 和 K<sub>2</sub> 的数值。当 pH=4 时，c(H<sup>+</sup>)=0.000 1 mol·L<sup>−1</sup>，c(F<sup>−</sup>)=0.011 0 mol·L<sup>−1</sup>，c(HF<sub>2</sub><sup>−</sup>)=0.080 0 mol·L<sup>−1</sup>，c(HF)=0.004 5 mol·L<sup>−1</sup>，电离平衡常数 K<sub>1</sub>=c(H<sup>+</sup>)·c(F<sup>−</sup>)/c(HF)=0.000 1×0.080 0/0.011 0≈7×10<sup>−4</sup>，K<sub>2</sub>=c(HF<sub>2</sub><sup>−</sup>)/[c(HF)·c(F<sup>−</sup>)]=0.004 5/(0.011 0×0.080 0)≈5，正确。选项 C，根据元素质量守恒，c总(HF)=所有含氟物种所含的氟原子的浓度，溶液中 HF 的存在形式有 HF、HF<sub>2</sub><sup>−</sup>、F<sup>−</sup> 三种，由于每个 HF<sub>2</sub><sup>−</sup> 贡献 2 个 F，故 c总(HF)=c(F<sup>−</sup>)+c(HF)+2c(HF<sub>2</sub><sup>−</sup>)，错误。选项 D，HF 不是强酸，故 HF 总浓度 c总(HF) 为 0.100 0 mol·L<sup>−1</sup> 的水溶液，其 pH>1，在题设的 pH=1 的溶液中，应在 HF 溶液中加入其他酸调节 pH，守恒关系式中缺少外加酸中阴离子对应的电荷项，根据电荷守恒，c(H<sup>+</sup>)≠c(F<sup>−</sup>)+c(HF<sub>2</sub><sup>−</sup>)+c(OH<sup>−</sup>)，也可结合图中数据进行判断，在 pH=1 条件下，c(H<sup>+</sup>)=0.100 0 mol·L<sup>−1</sup>，则 c(F<sup>−</sup>)+c(HF<sub>2</sub><sup>−</sup>)+c(OH<sup>−</sup>)<c(H<sup>+</sup>)=0.100 0 mol·L<sup>−1</sup>，错误。"}, {"id": 7, "src": "2024 全国新课标 7", "ans": "D", "figs": ["figs/k15/q7.png"], "stem": "常温下 CH<sub>2</sub>ClCOOH 和 CHCl<sub>2</sub>COOH 的两种溶液中，分布系数 δ 与 pH 的变化关系如图所示。[比如：δ(CH<sub>2</sub>ClCOO<sup>−</sup>)=c(CH<sub>2</sub>ClCOO<sup>−</sup>)/[c(CH<sub>2</sub>ClCOOH)+c(CH<sub>2</sub>ClCOO<sup>−</sup>)]]下列叙述正确的是", "opts": ["曲线 M 表示 δ(CHCl<sub>2</sub>COO<sup>−</sup>)~pH 的变化关系", "若酸的初始浓度为 0.10 mol·L<sup>−1</sup>，则 a 点对应的溶液中有 c(H<sup>+</sup>)=c(CHCl<sub>2</sub>COO<sup>−</sup>)+c(OH<sup>−</sup>)", "CH<sub>2</sub>ClCOOH 的电离常数 K_a=10<sup>−1</sup>·<sup>3</sup>", "pH=2.08 时，电离度 α(CH<sub>2</sub>ClCOOH)/α(CHCl<sub>2</sub>COOH)=0.15/0.85"], "exp": "【题析】选项 A，Cl 的电负性大于 H 的电负性，CHCl<sub>2</sub><sup>−</sup> 的极性大于 CH<sub>2</sub>Cl<sup>−</sup> 的极性，导致 CHCl<sub>2</sub>COOH 羧基中羟基的极性更大，更易电离出 H<sup>+</sup>，故 CHCl<sub>2</sub>COOH 的酸性大于 CH<sub>2</sub>ClCOOH 的，即 K_a(CHCl<sub>2</sub>COOH)>K_a(CH<sub>2</sub>ClCOOH)。随着 pH 增大，CH<sub>2</sub>ClCOOH 和 CHCl<sub>2</sub>COOH 浓度减小，CH<sub>2</sub>ClCOO<sup>−</sup>、CHCl<sub>2</sub>COO<sup>−</sup> 浓度增大，δ(酸分子)=δ(酸根)=0.5 时，pH 分别约为 1.3、2.8，两种酸的电离平衡常数分别为 K_a(CHCl<sub>2</sub>COOH)=10<sup>−1</sup>·<sup>3</sup>，K_a(CH<sub>2</sub>ClCOOH)=10<sup>−2</sup>·<sup>8</sup>。根据以上分析，曲线 M 表示 δ(CH<sub>2</sub>ClCOO<sup>−</sup>)~pH 的变化关系，错误。选项 B，CH<sub>2</sub>ClCOOH 是弱酸，c<sub>0</sub> 均为 0.10 mol·L<sup>−1</sup> 时，pH>1，而 a 点时，pH 约为 1.3，故溶液中需加入酸性更强的酸，使 pH 减小，守恒关系式中缺少外加酸中阴离子对应的电荷项，即 c(H<sup>+</sup>)≠c(CHCl<sub>2</sub>COO<sup>−</sup>)+c(OH<sup>−</sup>)，错误。选项 C，根据上面的分析可知，CH<sub>2</sub>ClCOOH 电离常数 K_a(CH<sub>2</sub>ClCOOH)=10<sup>−2</sup>·<sup>8</sup>，K_a(CHCl<sub>2</sub>COOH)=10<sup>−1</sup>·<sup>3</sup>，错误。选项 D，分布系数 δ 的表达式就是电离度，某酸的电离度可以直接看作对应酸根离子的分布系数，当 pH=2.08 时，δ(CH<sub>2</sub>ClCOO<sup>−</sup>)=0.15，δ(CHCl<sub>2</sub>COO<sup>−</sup>)=0.85，两种酸 CH<sub>2</sub>ClCOOH 与 CHCl<sub>2</sub>COOH 的电离度之比为 0.15:0.85，正确。"}, {"id": 8, "src": "2020 全国 I 卷 13", "ans": "C", "figs": ["figs/k15/q8.png"], "stem": "以酚酞为指示剂，用 0.100 0 mol·L<sup>−1</sup> 的 NaOH 溶液滴定 20.00 mL 未知浓度的二元酸 H<sub>2</sub>A 溶液。溶液中 pH、分布系数 δ 随滴加 NaOH 溶液体积 V_NaOH 的变化关系如图所示。[比如 A<sup>2−</sup> 的分布系数：δ(A<sup>2−</sup>)=c(A<sup>2−</sup>)/[c(H<sub>2</sub>A)+c(HA<sup>−</sup>)+c(A<sup>2−</sup>)]]下列叙述正确的是", "opts": ["曲线①代表 δ(H<sub>2</sub>A)，曲线②代表 δ(HA<sup>−</sup>)", "H<sub>2</sub>A 溶液的浓度为 0.200 0 mol·L<sup>−1</sup>", "HA<sup>−</sup> 的电离平衡常数 K_a=1.0×10<sup>−2</sup>", "滴定终点时，溶液中 c(Na<sup>+</sup>)<2c(A<sup>2−</sup>)+c(HA<sup>−</sup>)"], "exp": "【题析】选项 A，用 NaOH 溶液滴定未知浓度的二元酸 H<sub>2</sub>A 溶液。当加入 40 mL NaOH 溶液时，溶液的 pH 发生突变并达到滴定终点，发生反应为 2NaOH+H<sub>2</sub>A ══ Na<sub>2</sub>A+2H<sub>2</sub>O，可计算 c(H<sub>2</sub>A)=0.100 0 mol·L<sup>−1</sup>×40 mL/(2×20.00 mL)=0.100 0 mol·L<sup>−1</sup>。根据 pH 曲线的起点可知 0.100 0 mol·L<sup>−1</sup> H<sub>2</sub>A 的 pH=1，说明 H<sub>2</sub>A 第一步完全电离，第二步部分电离，H<sub>2</sub>A ══ H<sup>+</sup>+HA<sup>−</sup>，HA<sup>−</sup>⇌H<sup>+</sup>+A<sup>2−</sup>。随着 NaOH 溶液滴加，c(HA<sup>−</sup>) 减小，c(A<sup>2−</sup>) 增大。根据图像，曲线①代表粒子的分布系数随着 NaOH 的滴加逐渐减小，则曲线①代表 δ(HA<sup>−</sup>)；曲线②代表粒子的分布系数随着 NaOH 的滴加逐渐增大，则曲线②代表 δ(A<sup>2−</sup>)，错误。选项 B，加入 40 mL NaOH 溶液时达到滴定终点，c(H<sub>2</sub>A)=0.100 0 mol·L<sup>−1</sup>×40 mL/(2×20.00 mL)=0.100 0 mol·L<sup>−1</sup>，错误。选项 C，HA<sup>−</sup>⇌H<sup>+</sup>+A<sup>2−</sup>，HA<sup>−</sup> 的电离平衡常数 K_a=c(H<sup>+</sup>)·c(A<sup>2−</sup>)/c(HA<sup>−</sup>)，当 δ(HA<sup>−</sup>)=δ(A<sup>2−</sup>)，V_NaOH=25 mL 时，对应曲线③是滴定曲线；V_NaOH=25 mL 时，溶液的 pH=2，溶液中 c(H<sup>+</sup>)=1×10<sup>−2</sup>，故 HA<sup>−</sup> 的电离平衡常数 K_a=1.0×10<sup>−2</sup>，正确。选项 D，用酚酞作指示剂，酚酞变色的 pH 范围为 8.2~10，终点时溶质为 Na<sub>2</sub>A，溶液呈碱性，c(OH<sup>−</sup>)>c(H<sup>+</sup>)，溶液中电荷守恒为 c(Na<sup>+</sup>)+c(H<sup>+</sup>)=2c(A<sup>2−</sup>)+c(HA<sup>−</sup>)+c(OH<sup>−</sup>)，滴定终点时，溶液中 c(Na<sup>+</sup>)>2c(A<sup>2−</sup>)+c(HA<sup>−</sup>)，错误。"}, {"id": 9, "src": "2022 全国乙卷 13", "ans": "B", "figs": ["figs/k15/q9.png"], "stem": "常温下，一元酸 HA 的 K_a(HA)=1.0×10<sup>−3</sup>。在某体系中，H<sup>+</sup> 与 A<sup>−</sup> 离子不能穿过隔膜，未电离的 HA 可自由穿过该膜（如图所示）。设溶液中 c总(HA)=c(HA)+c(A<sup>−</sup>)，当达到平衡时，下列叙述正确的是", "opts": ["溶液Ⅰ中 c(H<sup>+</sup>)=c(OH<sup>−</sup>)+c(A<sup>−</sup>)", "溶液Ⅱ中的 HA 的电离度 c(A<sup>−</sup>)/c总(HA) 为 1/101", "溶液Ⅰ和Ⅱ中的 c(HA) 不相等", "溶液Ⅰ和Ⅱ中的 c总(HA) 之比为 10<sup>−4</sup>"], "exp": "【题析】选项 A，常温下溶液Ⅰ的 pH=7.0，则溶液Ⅰ中 c(H<sup>+</sup>)=c(OH<sup>−</sup>)=1×10<sup>−7</sup> mol·L<sup>−1</sup>，c(H<sup>+</sup>)<c(OH<sup>−</sup>)+c(A<sup>−</sup>)，错误。选项 B，常温下溶液Ⅱ的 pH=1.0，则溶液中 c(H<sup>+</sup>)=0.1 mol·L<sup>−1</sup>，电离平衡常数 K_a=c(H<sup>+</sup>)·c(A<sup>−</sup>)/c(HA)=1.0×10<sup>−3</sup>，已知溶液中 c总(HA)=c(HA)+c(A<sup>−</sup>)，代入 K_a=0.1c(A<sup>−</sup>)/[c总(HA)−c(A<sup>−</sup>)]=1.0×10<sup>−3</sup>，溶液Ⅱ中的 HA 的电离度 c(A<sup>−</sup>)/c总(HA)=1/101，正确。选项 C，根据题意，未电离的 HA 可自由穿过隔膜，故溶液Ⅰ和Ⅱ中的 c(HA) 相等，错误。选项 D，溶液Ⅰ的 pH=7.0，K_a=c(H<sup>+</sup>)·c(A<sup>−</sup>)/c(HA)=1.0×10<sup>−3</sup>，c总(HA)=c(HA)+c(A<sup>−</sup>)，10<sup>−7</sup>[c总(HA)−c(HA)]/c(HA)=1.0×10<sup>−3</sup>，故溶液Ⅰ中 c总(HA)=(10<sup>4</sup>+1)c(HA)；溶液Ⅱ的 pH=1.0，则溶液中 c(H<sup>+</sup>)=0.1 mol·L<sup>−1</sup>，K_a=c(H<sup>+</sup>)·c(A<sup>−</sup>)/c(HA)=1.0×10<sup>−3</sup>，c总(HA)=c(HA)+c(A<sup>−</sup>)，0.1[c总(HA)−c(HA)]/c(HA)=1.0×10<sup>−3</sup>，故溶液Ⅱ中 c总(HA)=1.01c(HA)。未电离的 HA 可自由穿过隔膜，故溶液Ⅰ和Ⅱ中的 c(HA) 相等，故溶液Ⅰ和Ⅱ中的 c总(HA) 之比为 [(10<sup>4</sup>+1)c(HA)] : [1.01c(HA)]=(10<sup>4</sup>+1):1.01≈10<sup>4</sup>，错误。"}, {"id": 10, "src": "2021 湖南 9", "ans": "C", "figs": ["figs/k15/q10.png"], "stem": "常温下，用 0.100 0 mol·L<sup>−1</sup> 的盐酸分别滴定 20.00 mL 浓度均为 0.100 0 mol·L<sup>−1</sup> 三种一元弱酸的钠盐（NaX、NaY、NaZ）溶液，滴定曲线如图所示。下列判断错误的是", "opts": ["该 NaX 溶液中：c(Na<sup>+</sup>)>c(X<sup>−</sup>)>c(OH<sup>−</sup>)>c(H<sup>+</sup>)", "三种一元弱酸的电离常数：K_a(HX)>K_a(HY)>K_a(HZ)", "当 pH=7 时，三种溶液中：c(X<sup>−</sup>)=c(Y<sup>−</sup>)=c(Z<sup>−</sup>)", "分别滴加 20.00 mL 盐酸后，再将三种溶液混合：c(X<sup>−</sup>)+c(Y<sup>−</sup>)+c(Z<sup>−</sup>)=c(H<sup>+</sup>)−c(OH<sup>−</sup>)"], "exp": "【题析】选项 A，NaX 为强碱弱酸盐，NaX 在溶液中水解，溶液呈碱性，则溶液中离子浓度的大小顺序为 c(Na<sup>+</sup>)>c(X<sup>−</sup>)>c(OH<sup>−</sup>)>c(H<sup>+</sup>)，正确。选项 B，由图可知，滴定前 NaX、NaY、NaZ 溶液的 pH 依次增大，则 HX、HY、HZ 三种一元弱酸的酸性依次减弱，弱酸的酸性越弱，电离常数越小，HX、HY、HZ 三种一元弱酸的电离常数的大小顺序为 K_a(HX)>K_a(HY)>K_a(HZ)，正确。选项 C，当 pH=7 时，三种溶液中 c(H<sup>+</sup>)=c(OH<sup>−</sup>)，根据电荷守恒，酸根离子的浓度越小，对应弱酸的酸性越弱，向钠盐溶液中加入盐酸越容易，酸根离子的浓度越小，三种溶液中 c(X<sup>−</sup>)>c(Y<sup>−</sup>)>c(Z<sup>−</sup>)，错误。选项 D，向三种盐溶液中分别滴加 20.00 mL 盐酸，三种盐都完全反应，溶液 c(Na<sup>+</sup>)=c(Cl<sup>−</sup>)，三种溶液混合后溶液中存在电荷守恒关系 c(Na<sup>+</sup>)+c(H<sup>+</sup>)=c(X<sup>−</sup>)+c(Y<sup>−</sup>)+c(Z<sup>−</sup>)+c(Cl<sup>−</sup>)+c(OH<sup>−</sup>)，则 c(X<sup>−</sup>)+c(Y<sup>−</sup>)+c(Z<sup>−</sup>)=c(H<sup>+</sup>)−c(OH<sup>−</sup>)，正确。"}, {"id": 11, "src": "2022 浙江 1 月 17", "ans": "B", "stem": "已知 25 ℃ 时二元酸 H<sub>2</sub>A 的 K_a1=1.3×10<sup>−7</sup>，K_a2=7.1×10<sup>−15</sup>。下列说法正确的是", "opts": ["在等浓度的 Na<sub>2</sub>A、NaHA 溶液中，水的电离程度前者小于后者", "向 0.1 mol·L<sup>−1</sup> 的 H<sub>2</sub>A 溶液中通入 HCl 气体（忽略溶液体积的变化）至 pH=3，则 H<sub>2</sub>A 的电离度为 0.013%", "向 H<sub>2</sub>A 溶液中加入 NaOH 溶液至 pH=11，则 c(A<sup>2−</sup>)>c(HA<sup>−</sup>)", "取 pH=a 的 H<sub>2</sub>A 溶液 10 mL，加蒸馏水稀释至 100 mL，则该溶液 pH=a+1"], "exp": "【题析】选项 A，在等浓度的 Na<sub>2</sub>A、NaHA 溶液中，A<sup>2−</sup> 的水解程度大于 HA<sup>−</sup> 的，故水的电离程度前者大于后者，错误。选项 B，溶液中 c(H<sup>+</sup>)=1×10<sup>−3</sup> mol·L<sup>−1</sup>，c(H<sub>2</sub>A)≈0.1 mol·L<sup>−1</sup>，K_a1=10<sup>−3</sup>×c(HA<sup>−</sup>)/c(H<sub>2</sub>A)=1.3×10<sup>−7</sup>，c(HA<sup>−</sup>)=1.3×10<sup>−5</sup> mol·L<sup>−1</sup>，c(HA<sup>−</sup>)≈c(H<sub>2</sub>A) 电离的，H<sub>2</sub>A 的电离度=c(HA<sup>−</sup>)/c(H<sub>2</sub>A)×100%=1.3×10<sup>−4</sup>×100%=0.013%，正确。选项 C，向 H<sub>2</sub>A 溶液中加入 NaOH 溶液至 pH=11，K_a2=10<sup>−11</sup>×c(A<sup>2−</sup>)/c(HA<sup>−</sup>)=7.1×10<sup>−15</sup>，则 c(A<sup>2−</sup>)<c(HA<sup>−</sup>)，错误。选项 D，H<sub>2</sub>A 是弱酸，取 pH=a 的 H<sub>2</sub>A 溶液 10 mL，加蒸馏水稀释至 100 mL，H<sub>2</sub>A 的电离平衡正向移动，则该溶液 pH<a+1，错误。"}, {"id": 12, "src": "2022 浙江 6 月 17", "ans": "C", "stem": "25 ℃ 时，苯酚（C<sub>6</sub>H<sub>5</sub>OH）的 K_a=1.0×10<sup>−10</sup>，下列说法正确的是", "opts": ["相同温度下，等 pH 的 C<sub>6</sub>H<sub>5</sub>ONa 和 CH<sub>3</sub>COONa 溶液中，c(C<sub>6</sub>H<sub>5</sub>O<sup>−</sup>)>c(CH<sub>3</sub>COO<sup>−</sup>)", "将浓度均为 0.01 mol·L<sup>−1</sup> 的 C<sub>6</sub>H<sub>5</sub>ONa 和 NaOH 溶液加热，两种溶液的 pH 均变大", "25 ℃ 时，C<sub>6</sub>H<sub>5</sub>OH 溶液与 NaOH 溶液混合，测得 pH=10.00，则此时溶液中 c(C<sub>6</sub>H<sub>5</sub>O<sup>−</sup>)=c(C<sub>6</sub>H<sub>5</sub>OH)", "25 ℃ 时，0.01 mol·L<sup>−1</sup> 的 C<sub>6</sub>H<sub>5</sub>OH 溶液中加少量 C<sub>6</sub>H<sub>5</sub>ONa 固体，水的电离程度变小"], "exp": "【题析】选项 A，醋酸的酸性大于苯酚的，则醋酸钠的水解程度弱于苯酚钠的。相同温度下，等 pH 的 C<sub>6</sub>H<sub>5</sub>ONa 和 CH<sub>3</sub>COONa 溶液中，c(C<sub>6</sub>H<sub>5</sub>O<sup>−</sup>)<c(CH<sub>3</sub>COO<sup>−</sup>)，错误。选项 B，加热促进 C<sub>6</sub>H<sub>5</sub>ONa 溶液水解，碱性增强，pH 增大，NaOH 溶液存在 H<sub>2</sub>O 的电离平衡，加热 NaOH 溶液使 K_w 增大，c(H<sup>+</sup>) 增大，pH 减小，错误。选项 C，C<sub>6</sub>H<sub>5</sub>OH 溶液和 NaOH 溶液混合后溶液 pH=10.00，c(H<sup>+</sup>)=1×10<sup>−10</sup> mol·L<sup>−1</sup>，C<sub>6</sub>H<sub>5</sub>OH 电离平衡常数 K_a=c(H<sup>+</sup>)·c(C<sub>6</sub>H<sub>5</sub>O<sup>−</sup>)/c(C<sub>6</sub>H<sub>5</sub>OH)=1.0×10<sup>−10</sup>，故 c(C<sub>6</sub>H<sub>5</sub>O<sup>−</sup>)=c(C<sub>6</sub>H<sub>5</sub>OH)，正确。选项 D，C<sub>6</sub>H<sub>5</sub>ONa 会抑制 C<sub>6</sub>H<sub>5</sub>OH 的电离，使 C<sub>6</sub>H<sub>5</sub>OH 电离出的 c(H<sup>+</sup>) 减小，对水的电离抑制程度减小；C<sub>6</sub>H<sub>5</sub>ONa 中的 C<sub>6</sub>H<sub>5</sub>O<sup>−</sup> 还可以水解，会促进水的电离，即水的电离程度增大，错误。"}, {"id": 13, "src": "2024 安徽 13", "ans": "B", "stem": "环境保护工程师研究利用 Na<sub>2</sub>S、FeS 和 H<sub>2</sub>S 处理水样中的 Cd<sup>2+</sup>。已知 25 ℃ 时，H<sub>2</sub>S 饱和溶液浓度约为 0.1 mol·L<sup>     setFace('jf'+id,YU_BASE,'idle');
  };

    a.play().catch(function(){});
  }catch(e){}
}
function openRock(id){
  var bx=$('rbx'+id);if(!bx)return;
  bx.style.display='flex';
  var cd=$('rct'+id);
  if(rockTimers[id]){clearInterval(rockTimers[id]);rockTimers[id]=null}
  var left=Math.round(ROCK_MS/1000);
  if(cd)cd.textContent=left+'s 后自动收起';
  rockTimers[id]=setInterval(function(){
    left--;

      if(rockTimers[id]){clearInterval(rockTimers[id]);rockTimers[id]=null}

      $('jd'+q.id).style.opacity=.5;
      setFace('jf'+q.id,YU_BASE,'think',2400);
      setTimeout(function(){if(st.help[q.id]==='jade')setFace('jf'+q.id,YU_BASE,'encourage',2600)},2700);
      openJade(q.id,q.hint||'');
      save();
    };}
    $('rk'+q.id).onclick=function(){
      if(done||skipped)return;
      if(!st.help[q.id]){
        if(!confirm('看小岩详解后，本题将计 0 分（即使答对）。确定求助吗？'))return;
        st.help[q.id]='rock';
        $('rk'+q.id).style.opacity=.5;
        playVoice('../assets/xz/audio/xiaoyan_hi.mp3');
        renderStats();
      }
      setFace('rf'+q.id,YAN_BASE,'write',2400);
      setTimeout(function(){if(st.help[q.id]==='rock')setFace('rf'+q.id,YAN_BASE,'think',2600)},2700);
      openRock(q.id);
      save();
    };
    $('sk'+q.id).onclick=function(){
      if(done||skipped)return;
      skipped=true;st.skip[q.id]=1;
      setSkip(q.id,true);save();
    };
    $('us'+q.id).onclick=function(){
      if(!skipped)return;
      skipped=false;delete st.skip[q.id];
      setSkip(q.id,false);save();
    };
    $('nx'+q.id).onclick=function(){
      if(i<N-1){var n=QS[i+1];var el=document.getElementById('qc'+n.id);el.scrollIntoView({behavior:'smooth',block:'start'})}
      else{window.scrollTo({top:0,behavior:'smooth'})}
    };
  });
}
function paintResult(q,ob,pick,ok){
  Array.prototype.forEach.call(ob.children,function(c,j){
    var L='ABCD'[j];c.disabled=true;
    if(L===q.ans)c.classList.add('rgt');
    else if(L===pick)c.classList.add('wrg');
  });
}
var timer=setInterval(function(){
  var c=calc();
  if(st.started&&c.done<N){st.elapsed++;renderStats();if(st.elapsed%5===0)save()}
},1000);
function pad(n){return ('0'+n).slice(-2)}
function showCard(){
  $('result').style.display='block';
  $('stuName').value=localStorage.getItem(NKEY)||'';
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
}
$('btnCard').onclick=function(){showCard()};
$('btnGen').onclick=function(){
  var name=$('stuName').value.trim()||'同学';
  try{localStorage.setItem(NKEY,name)}catch(e){}
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
};
$('btnClose').onclick=function(){
  $('result').style.display='none';
  var first=QS.find(function(q){return !st.a[q.id]&&!st.skip[q.id]});
  var el=first?document.getElementById('qc'+first.id):$('qlist');
  el.scrollIntoView({behavior:'smooth',block:'start'});
};
function drawCard(){
  var c=document.getElementById('canvas'),x=c.getContext('2d'),W=c.width,H=c.height;
  var g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0f172a');g.addColorStop(.55,'#152743');g.addColorStop(1,'#1b1140');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(34,211,238,.08)';x.beginPath();x.arc(W-60,60,150,0,7);x.fill();
  x.fillStyle='rgba(167,139,250,.08)';x.beginPath();x.arc(50,H-40,130,0,7);x.fill();
  x.fillStyle='#67e8f9';x.font='500 22px sans-serif';x.fillText('化学不难学 · 高考选择题训练',40,52);
  x.fillStyle='#8ea0b5';x.font='16px sans-serif';x.fillText('考点15 水溶液中的离子反应与平衡 · 每题 '+PER+' 分',40,84);
  var name=$('stuName').value.trim()||'同学';
  x.fillStyle='#e2e8f0';x.font='500 26px sans-serif';x.fillText(name,40,150);
  var cc=calc();
  x.fillStyle='#a78bfa';x.font='700 88px sans-serif';x.fillText(cc.score,40,250);
  x.fillStyle='#8ea0b5';x.font='18px sans-serif';x.fillText('分 / 满分 '+(N*PER)+' 分',40+String(cc.score).length*52+14,250);
  var acc=cc.done?Math.round(cc.ok/cc.done*100):0;
  var cells=[['正确率',acc+'%（'+cc.ok+'/'+cc.done+'）'],['完成度',cc.done+' / '+N+' 题'],['做题时长',fmt(st.elapsed)]];
  cells.forEach(function(cell,i){
    var cx=40+i*228;
    x.fillStyle='#1e293b';x.fillRect(cx,280,208,84);
    x.fillStyle='#67e8f9';x.font='14px sans-serif';x.fillText(cell[0],cx+18,310);
    x.fillStyle='#e2e8f0';x.font='500 20px sans-serif';x.fillText(cell[1],cx+18,346);
  });
  var d=new Date();
  var stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('提交时间 '+stamp,40,400);
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('已做题号（绿=自己对 蓝=问小玉 橙=问小岩0分 红=自己错）',40,432);
  var doneList=QS.filter(function(q){return !!st.a[q.id]});
  var jadeN=0,rockN=0;
  doneList.forEach(function(q,i){
    var col=i%14,row=Math.floor(i/14);
    var bx=40+col*48,by=450+row*46;
    var ok=st.a[q.id]===q.ans,h=st.help[q.id];
    var colr=h==='rock'?'#d97706':h==='jade'?'#3b82f6':(ok?'#16a34a':'#dc2626');
    if(h==='rock')rockN++;if(h==='jade')jadeN++;
    x.fillStyle=colr;x.fillRect(bx,by,38,36);
    x.fillStyle='#ffffff';x.font='500 16px sans-serif';x.fillText(String(q.id),bx+9,by+25);
  });
  x.fillStyle='#5b6b7f';x.font='13px sans-serif';
  x.fillText('答对 '+cc.ok+' · 答错 '+(cc.done-cc.ok)+' · 问小玉 '+jadeN+' · 问小岩 '+rockN+' · 未做 '+(N-cc.done)+' · 跳过 '+Object.keys(st.skip).length,40,H-22);
  window.__lastCard={time:stamp,done:cc.done,ok:cc.ok,score:cc.score,elapsed:fmt(st.elapsed),skip:Object.keys(st.skip).length,jade:jadeN,rock:rockN};
}
$('stuName').addEventListener('input',function(){try{localStorage.setItem(NKEY,this.value)}catch(e){}});
$('btnSave').onclick=function(){
  var a=document.createElement('a');
  a.download='选择题训练_考点15_'+(($('stuName').value.trim()||'成绩'))+'.png';
  a.href=$('canvas').toDataURL('image/png');a.click();
};
$('resetBtn').onclick=function(){
  var c=calc();
  if(c.done===0&&Object.keys(st.skip).length===0&&Object.keys(st.help).length===0){alert('本讲还没有答题记录');return}
  if(confirm('确定清空本讲全部记录和成绩卡重新做吗？')){
    localStorage.removeItem(KEY);location.reload();
  }
};
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('themeBtn').textContent=t==='dark'?'☀':'🌙';
  try{localStorage.setItem(TKEY,t)}catch(e){}
}
$('themeBtn').onclick=function(){
  applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
};
applyTheme((function(){try{return localStorage.getItem(TKEY)||'dark'}catch(e){return 'dark'}})());
load();build();renderStats();
</script>
</body>

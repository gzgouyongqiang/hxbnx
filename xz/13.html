<style>
:root{--bg:#0b1220;--card:#1e293b;--panel:#0f172a;--text:#e2e8f0;--muted:#8ea0b5;--faint:#5b6b7f;
--accent:#22d3ee;--accent-ink:#083344;--accent-soft:#164e63;--accent-border:#155e75;
--ok:#34d399;--ok-bg:#022c22;--ok-ink:#6ee7b7;--bad:#fb7185;--bad-bg:#4c0519;--bad-ink:#fda4af;
--border:#334155;--opt-bg:#0f172a;--score:#a78bfa;--shadow:none}
html[data-theme="light"]{--bg:#f6f7fb;--card:#ffffff;--panel:#f8fafc;--text:#1e293b;--muted:#64748b;--faint:#94a3b8;
--accent:#4f46e5;--accent-ink:#ffffff;--accent-soft:#eef2ff;--accent-border:#c7d2fe;
--ok:#16a34a;--ok-bg:#f0fdf4;--ok-ink:#15803d;--bad:#dc2626;--bad-bg:#fef2f2;--bad-ink:#b91c1c;
--border:#e2e5ec;--opt-bg:#f8fafc;--score:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7;padding-bottom:90px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border)}
.hd-in{max-width:680px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.hd-back{color:var(--accent);text-decoration:none;font-size:13px;flex-shrink:0}
.hd-title{font-size:15px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-theme{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-border);border-radius:999px;width:34px;height:34px;font-size:16px;cursor:pointer;flex-shrink:0}
.stats{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:var(--card);border-radius:10px;padding:8px 10px;text-align:center;border:1px solid var(--border)}
.stat small{display:block;font-size:11px;color:var(--muted)}
.stat b{font-size:16px;font-weight:500}
.stat.s-score b{color:var(--score)}.stat.s-ok b{color:var(--ok)}
.cardbar{width:100%;background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:14px}
.qcard{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--border)}
.qcard.skipped-card{opacity:.55}
.qmeta{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qno{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 10px;font-size:12px;font-weight:500}
.qpt{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;font-size:11px}
.qsrc{font-size:11px;color:var(--faint)}
.qmark{margin-left:auto;font-size:16px}
.stem{font-size:14.5px;margin-bottom:12px}
.opt{display:flex;gap:8px;width:100%;text-align:left;background:var(--opt-bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;color:var(--text);cursor:pointer;line-height:1.6}
.opt .ol{font-weight:500;flex-shrink:0;color:var(--accent)}
.opt.sel{border-color:var(--accent);border-width:1.5px;background:var(--accent-soft)}
.opt.rgt{border-color:var(--ok);border-width:1.5px;background:var(--ok-bg)}
.opt.wrg{border-color:var(--bad);border-width:1.5px;background:var(--bad-bg)}
.opt:disabled{cursor:default}
.btn-row{display:flex;gap:8px}
.btn-row button{flex:1}
.submit{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:11px;font-size:13.5px;font-weight:500;cursor:pointer}
.submit:disabled{opacity:.35;cursor:default}
.skipbtn{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:11px;font-size:13.5px;cursor:pointer}
.skipped-tip{margin-top:8px;font-size:12.5px;color:var(--muted);background:var(--panel);border-radius:8px;padding:8px 10px;display:none}
.undoskip{background:transparent;color:var(--accent);border:1px solid var(--accent-border);border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer;margin-left:8px}
.verdict{margin-top:10px;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:500;display:none}
.exp{margin-top:10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;display:none}
.exp .et{font-size:12px;color:var(--accent);font-weight:500;margin-bottom:6px}
.exp p{font-size:12.5px;color:var(--muted)}
.next{display:none;width:100%;margin-top:10px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-border);border-radius:10px;padding:10px;font-size:14px;font-weight:500;cursor:pointer}
.qfig{background:#fff;border-radius:10px;padding:8px;margin-bottom:12px;text-align:center}
.qfig img{max-width:100%;height:auto;display:inline-block}
.lesson-nav{display:flex;gap:8px;margin:18px 0 6px}
.lesson-nav a,.lesson-nav span{flex:1;text-align:center;border-radius:10px;padding:10px 6px;font-size:12.5px;font-weight:500;text-decoration:none;border:1px solid var(--accent-border)}
.lesson-nav a{background:var(--accent-soft);color:var(--accent)}
.lesson-nav span{background:var(--panel);color:var(--faint);border-color:var(--border);opacity:.6}
footer{text-align:center;padding:24px 0 10px;color:var(--faint);font-size:12px}
.result{display:none;background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--border);margin-bottom:16px;text-align:center}
.result h3{font-size:16px;font-weight:500;margin-bottom:12px}
#canvas{max-width:100%;border-radius:12px;margin:12px 0;display:none}
.btn-gen{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:500;cursor:pointer}
.name-row{display:flex;gap:8px;margin-bottom:8px}
.name-row input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text)}
.hint{font-size:11.5px;color:var(--faint);margin:0 0 10px}
.btn-row2{display:flex;gap:10px}
.btn-row2 button{flex:1;border-radius:10px;padding:11px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--accent-border)}
.btn-save{background:var(--accent);color:var(--accent-ink)}
.btn-close{background:transparent;color:var(--accent)}
sub,sup{font-size:.72em}
.rxn{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 2px}
.rxn i{font-style:normal;font-size:.62em;line-height:1.15;white-space:nowrap}
.rxn em{font-style:normal;line-height:1;font-size:.95em}
.helprow{display:flex;gap:8px;margin-top:8px}
.helprow button{flex:1;border-radius:10px;padding:9px 6px;font-size:12.5px;cursor:pointer;background:transparent;line-height:1.4}
.jade{color:var(--accent);border:1px solid var(--accent-border)}
.rock{color:#f59e0b;border:1px dashed #b45309}
.helpbox{margin-top:10px;border-radius:10px;padding:12px;display:none}
.jadebox{background:var(--accent-soft);border:1px solid var(--accent-border)}
.rockbox{background:rgba(245,158,11,.09);border:1px solid #b45309}
.helpbox .ht{font-size:12px;font-weight:500;margin-bottom:6px}
.jadebox .ht{color:var(--accent)}
.rockbox .ht{color:#f59e0b}
.helpbox p{font-size:12.5px;color:var(--muted)}
</style>

var QS = [{"id": 1, "src": "2026 广东 9", "ans": "D", "figs": ["figs/k13/q1.png"], "stem": "用如图装置进行实验，反应一段时间，关闭活塞和止水夹，熄灭酒精灯，冷却后提起铁丝，注入稀硫酸。下列说法错误的是", "opts": ["KI 溶液变棕黄色，体现 I<sup>−</sup> 的还原性", "浓硫酸的作用是吸收水分，干燥 Cl<sub>2</sub>", "U 形管中溶液遇 KSCN 溶液变红，说明有 Fe<sup>3+</sup> 存在", "烧杯溶液中最终存在：c(Na<sup>+</sup>)+c(H<sup>+</sup>)=c(Cl<sup>−</sup>)+c(ClO<sup>−</sup>)"], "exp": "【题析】选项 A，Ca(ClO)<sub>2</sub> 与盐酸混合反应生成 Cl<sub>2</sub>：Ca(ClO)<sub>2</sub>+4HCl=CaCl<sub>2</sub>+2Cl<sub>2</sub>↑+2H<sub>2</sub>O，Cl<sub>2</sub> 与 KI 溶液反应：Cl<sub>2</sub>+2I<sup>−</sup>=2Cl<sup>−</sup>+I<sub>2</sub>，溶液变棕黄色，I<sup>−</sup> 被氧化，体现 I<sup>−</sup> 的还原性，正确。选项 B，制备的 Cl<sub>2</sub> 中混有 HCl 和水蒸气，通过饱和食盐水洗气瓶除去 HCl，再通过浓硫酸吸收水蒸气、干燥 Cl<sub>2</sub>，防止后续加热时水蒸气影响反应，正确。选项 C，U 形管中铁丝在 Cl<sub>2</sub> 中剧烈燃烧生成 FeCl<sub>3</sub>，产生棕褐色的烟，冷却后提起铁丝、注入稀硫酸，FeCl<sub>3</sub> 溶于稀硫酸得到含 Fe<sup>3+</sup> 的溶液，遇 KSCN 变红，说明有 Fe<sup>3+</sup> 存在，正确。选项 D，Cl<sub>2</sub> 与烧杯中 NaOH 溶液反应：Cl<sub>2</sub>+2NaOH=NaCl+NaClO+H<sub>2</sub>O，烧杯中溶液含 NaOH、NaCl、NaClO，根据电荷守恒，正确的关系式为 c(Na<sup>+</sup>)+c(H<sup>+</sup>)=c(Cl<sup>−</sup>)+c(ClO<sup>−</sup>)+c(OH<sup>−</sup>)，选项漏写 c(OH<sup>−</sup>)，错误。"}, {"id": 2, "src": "2026 广东 12", "ans": "D", "stem": "用如图装置探究卤代烃的性质。用表格中的物质分别进行实验，对应的叙述正确的是", "opts": ["物质 a：2-溴丁烷　溶剂 b：乙醇　——Ⅰ中发生消去反应；Ⅳ中溶液褪色，发生取代反应", "物质 a：2-溴丁烷　溶剂 b：水　　——Ⅰ中生成 2-丁醇，Ⅲ中石棉棉和Ⅳ中溶液均褪色", "物质 a：溴乙烷　　溶剂 b：水　　——Ⅱ中注入少量 K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub> 溶液后，溶液颜色无明显变化", "物质 a：溴乙烷　　溶剂 b：乙醇　——冷却后向烧瓶中加过量稀硝酸，再加 AgNO<sub>3</sub> 溶液，生成沉淀"], "exp": "【题析】选项 A，2-溴丁烷在 NaOH 的乙醇溶液中加热发生消去反应生成烯烃（1-丁烯或 2-丁烯），Ⅳ中的 CCl<sub>4</sub> 溶液褪色是因为烯烃与溴发生加成反应，不是取代反应，错误。选项 B，2-溴丁烷在 NaOH 的水溶液中加热发生水解反应生成 2-丁醇，2-丁醇能使酸性 KMnO<sub>4</sub> 溶液褪色，但不能使溴的 CCl<sub>4</sub> 溶液褪色，Ⅲ中石英棉不褪色，错误。选项 C，溴乙烷在 NaOH 的水溶液中加热水解生成乙醇，乙醇能与酸性 K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub> 溶液发生氧化还原反应使其颜色变化，错误。选项 D，溴乙烷在 NaOH 的乙醇溶液中加热发生消去反应生成乙烯和 NaBr，烧瓶溶液中含 Br<sup>−</sup>，冷却后加过量稀硝酸中和过量 NaOH（排除 OH<sup>−</sup> 干扰），再加 AgNO<sub>3</sub> 溶液生成 AgBr 淡黄色沉淀，正确。"}, {"id": 3, "src": "2025 广东 11", "ans": "D", "figs": ["figs/k13/q3.png"], "stem": "利用如图装置进行实验：打开 K<sub>1</sub>、K<sub>2</sub>，一定时间后，a 中溶液变蓝；关闭 K<sub>1</sub>，打开 K<sub>3</sub>，点燃酒精灯加热数分钟后，滴入无水乙醇。下列说法错误的是", "opts": ["a 中现象体现了 I<sup>−</sup> 的还原性", "b 中 H<sub>2</sub>O<sub>2</sub> 既作氧化剂也作还原剂", "乙醇滴加过程中，c 中的铜丝由黑变红，说明乙醇被氧化", "d 中有银镜反应发生，说明 c 中产物有乙酸"], "exp": "【题析】选项 A，打开 K<sub>1</sub>、K<sub>2</sub>，b 中 H<sub>2</sub>O<sub>2</sub> 在 MnO<sub>2</sub> 催化下生成 O<sub>2</sub>，进入 a 中氧化 I<sup>−</sup> 生成 I<sub>2</sub>，使淀粉-KI 溶液变蓝，体现 I<sup>−</sup> 的还原性，正确。选项 B，b 中 H<sub>2</sub>O<sub>2</sub> 在 MnO<sub>2</sub> 催化下分解：2H<sub>2</sub>O<sub>2</sub>=2H<sub>2</sub>O+O<sub>2</sub>↑，H<sub>2</sub>O<sub>2</sub> 中氧元素由 −1 价既升高到 0 价（O<sub>2</sub>）又降低到 −2 价（H<sub>2</sub>O），H<sub>2</sub>O<sub>2</sub> 既作氧化剂也作还原剂，正确。选项 C，关闭 K<sub>1</sub>、打开 K<sub>3</sub>，无水乙醇在铜丝催化下与 O<sub>2</sub> 发生氧化反应生成乙醛：2CH<sub>3</sub>CH<sub>2</sub>OH+O<sub>2</sub>→(催化剂,Δ)2CH<sub>3</sub>CHO+2H<sub>2</sub>O，过程中铜丝先与氧气反应生成黑色的氧化铜，氧化铜再被乙醇还原为红色的铜单质，乙醇被氧化为乙醛，正确。选项 D，银镜反应需要水浴加热，d 中未加热，不能发生银镜反应；若 d 中有银镜反应发生，只能说明 c 中产物有乙醛，而不是乙酸，错误。"}, {"id": 4, "src": "2025 广东 15", "ans": "C", "figs": ["figs/k13/q4.png"], "stem": "按如图组装装置并进行实验：将铜丝插入溶液中，当 c 中红色褪去时，将铜丝拔离液面。下列叙述错误的是", "opts": ["a 中有化合反应发生，并有颜色变化", "b 中气体变红棕色时，所含氮氧化物至少有两种", "c 中溶液红色刚好褪去时，HCO<sub>3</sub><sup>−</sup> 恰好完全反应", "若将 a 中稀硝酸换为浓硫酸并加热，则 c 中溶液颜色会褪去"], "exp": "【题析】选项 A，铜和稀硝酸反应：3Cu+8HNO<sub>3</sub>=3Cu(NO<sub>3</sub>)<sub>2</sub>+2NO↑+4H<sub>2</sub>O，NO 为无色气体，与装置 a 中少量氧气化合生成红棕色的 NO<sub>2</sub>：2NO+O<sub>2</sub>=2NO<sub>2</sub>，a 中生成 Cu<sup>2+</sup> 为蓝色，有颜色变化，正确。选项 B，a 中生成的 NO 进入 b 中使气体变红棕色，说明有 NO<sub>2</sub> 存在，且存在 2NO<sub>2</sub>⇌N<sub>2</sub>O<sub>4</sub> 的转化，故所含氮氧化物至少有 NO、NO<sub>2</sub>（还有 N<sub>2</sub>O<sub>4</sub>）两种，正确。选项 C，酚酞变色范围为 8.2~10.0，c 中溶液红色刚好褪去时溶液可能仍呈弱碱性（pH 略低于 8.2），此时不能判断 HCO<sub>3</sub><sup>−</sup> 是否恰好完全反应，错误。选项 D，若将 a 中稀硝酸换为浓硫酸并加热：Cu+2H<sub>2</sub>SO<sub>4</sub>(浓)→(Δ)CuSO<sub>4</sub>+SO<sub>2</sub>↑+2H<sub>2</sub>O，过量 SO<sub>2</sub> 通入 NaHCO<sub>3</sub> 溶液可生成 NaHSO<sub>3</sub>：SO<sub>2</sub>+NaHCO<sub>3</sub>=NaHSO<sub>3</sub>+CO<sub>2</sub>，使溶液显酸性，c 中溶液颜色褪去，正确。"}, {"id": 5, "src": "2024 广东 11", "ans": "B", "figs": ["figs/k13/q5.png"], "stem": "按下图装置进行实验。搅拌一段时间后，滴加浓盐酸。不同反应阶段的预期现象及其相应推理均合理的是", "opts": ["烧瓶壁会变冷，说明存在 ΔH<0 的反应", "试纸会变蓝，说明有 NH<sub>3</sub> 生成，产氨过程熵增", "滴加浓盐酸后，有白烟产生，说明有 NH<sub>4</sub>Cl 升华", "实验过程中，气球会一直变大，说明体系压强增大"], "exp": "【题析】选项 A，NH<sub>4</sub>Cl 和 Ba(OH)<sub>2</sub>·8H<sub>2</sub>O 的反应是吸热反应，反应一段时间烧瓶壁变冷，说明吸热反应的 ΔH>0，错误。选项 B，湿润的红色石蕊试纸变蓝，说明有碱性气体 NH<sub>3</sub> 生成：2NH<sub>4</sub>Cl+Ba(OH)<sub>2</sub>·8H<sub>2</sub>O=BaCl<sub>2</sub>+2NH<sub>3</sub>↑+10H<sub>2</sub>O。该反应是吸热反应（ΔH>0）但能自发进行，反应物都是固体、生成物中有气体且气体物质的量增大，故熵变 ΔS>0（产氨过程熵增），正确。选项 C，滴加浓盐酸后，浓盐酸挥发出的 HCl 气体与 NH<sub>3</sub> 反应生成 NH<sub>4</sub>Cl 固体小颗粒：NH<sub>3</sub>+HCl=NH<sub>4</sub>Cl，产生白烟，与 NH<sub>4</sub>Cl 升华无关，错误。选项 D，实验过程中，产生 NH<sub>3</sub> 使体系压强增大、气球变大；滴加浓盐酸后，HCl 与 NH<sub>3</sub> 反应生成 NH<sub>4</sub>Cl 固体，体系压强减小，气球变小，故气球不会一直变大，错误。"}, {"id": 6, "src": "2023 广东 13", "ans": "D", "figs": ["figs/k13/q6.png"], "stem": "利用活性石墨电极电解饱和食盐水，进行如图所示实验。闭合 K<sub>1</sub>，一段时间后", "opts": ["U 形管两侧均有气泡冒出，分别是 Cl<sub>2</sub> 和 O<sub>2</sub>", "a 处布条褪色，说明 Cl<sub>2</sub> 具有漂白性", "b 处出现蓝色，说明还原性：Cl<sup>−</sup>>I<sup>−</sup>", "断开 K<sub>1</sub>，立刻闭合 K<sub>2</sub>，电流表发生偏转"], "exp": "【题析】选项 A，闭合 K<sub>1</sub> 电解饱和食盐水，左侧为阳极，电极反应 2Cl<sup>−</sup>−2e<sup>−</sup>=Cl<sub>2</sub>↑，右侧为阴极，电极反应 2H<sub>2</sub>O+2e<sup>−</sup>=H<sub>2</sub>↑+2OH<sup>−</sup>，U 形管两侧气体分别是 Cl<sub>2</sub> 和 H<sub>2</sub>，总反应 2NaCl+2H<sub>2</sub>O→(电解)2NaOH+H<sub>2</sub>↑+Cl<sub>2</sub>↑，错误。选项 B，左侧生成 Cl<sub>2</sub>，a 处布条褪色是因为 Cl<sub>2</sub> 遇水生成 HClO：Cl<sub>2</sub>+H<sub>2</sub>O=HCl+HClO，HClO 具有漂白性，而干燥的 Cl<sub>2</sub> 没有漂白性，错误。选项 C，b 处出现蓝色，发生反应 Cl<sub>2</sub>+2I<sup>−</sup>=I<sub>2</sub>+2Cl<sup>−</sup>，说明还原性 I<sup>−</sup>>Cl<sup>−</sup>，错误。选项 D，断开 K<sub>1</sub>、立刻闭合 K<sub>2</sub>，此时构成 H<sub>2</sub> 和 Cl<sub>2</sub> 的燃料电池，左侧电极为正极、右侧电极为负极，形成电流，电流表发生偏转，正确。"}, {"id": 7, "src": "2025 河南 8", "ans": "D", "figs": ["figs/k13/q7.png"], "stem": "某同学设计以下实验，探究简单配合物的形成和转化。（流程：CuSO<sub>4</sub> 溶液①→加氨水得蓝色沉淀②→过量氨水得深蓝色溶液③→加乙醇得深蓝色沉淀④→过滤洗涤得深蓝色固体⑤→过量浓盐酸得黄绿色溶液⑥）下列说法错误的是", "opts": ["②中沉淀与④中沉淀不是同一种物质", "③中现象说明配体与 Cu<sup>2+</sup> 的结合能力：NH<sub>3</sub>>H<sub>2</sub>O", "④中深蓝色物质在乙醇中的溶解度比在水中的小", "若向⑤中加入稀硫酸，同样可以得到黄绿色溶液"], "exp": "【题析】实验过程中 CuSO<sub>4</sub> 与氨水先生成蓝色沉淀 Cu(OH)<sub>2</sub>，继续加氨水，Cu(OH)<sub>2</sub> 与氨水反应得到深蓝色溶液 [Cu(NH<sub>3</sub>)<sub>4</sub>]SO<sub>4</sub>，[Cu(NH<sub>3</sub>)<sub>4</sub>]SO<sub>4</sub> 在乙醇中溶解度小，加乙醇得到 [Cu(NH<sub>3</sub>)<sub>4</sub>]SO<sub>4</sub>·H<sub>2</sub>O 深蓝色沉淀，过滤洗涤后加过量浓盐酸得到含 [CuCl<sub>4</sub>]<sup>2−</sup> 的黄绿色溶液。选项 A，②中沉淀为 Cu(OH)<sub>2</sub>，④中沉淀为 [Cu(NH<sub>3</sub>)<sub>4</sub>]SO<sub>4</sub>·H<sub>2</sub>O，不是同一种物质，正确。选项 B，③中由 Cu(OH)<sub>2</sub> 转化为 [Cu(NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup>，说明配体与 Cu<sup>2+</sup> 的结合能力 NH<sub>3</sub>>H<sub>2</sub>O，正确。选项 C，[Cu(NH<sub>3</sub>)<sub>4</sub>]SO<sub>4</sub> 在乙醇中析出深蓝色沉淀，说明其在乙醇中的溶解度比在水中的小，正确。选项 D，⑥中溶液呈黄绿色是由于生成 [CuCl<sub>4</sub>]<sup>2−</sup>，向⑤[Cu(NH<sub>3</sub>)<sub>4</sub>]SO<sub>4</sub>·H<sub>2</sub>O 中加稀硫酸只能得到 CuSO<sub>4</sub> 和 (NH<sub>4</sub>)<sub>2</sub>SO<sub>4</sub> 的蓝色溶液，不能得到黄绿色溶液，错误。"}, {"id": 8, "src": "2025 北京 12", "ans": "D", "figs": ["figs/k13/q8.png"], "stem": "为研究三价铁配合物性质进行如下实验（忽略溶液体积变化）：向 0.1 mol·L<sup>−1</sup> FeCl<sub>3</sub> 溶液①中滴加数滴浓盐酸得溶液②（黄色加深）→滴加 1 滴 KSCN 溶液得溶液③（红色）→加 NaF 固体得溶液④（红色褪去变为无色）→滴加 KI 溶液、淀粉溶液（无明显变化）。已知：[FeCl<sub>4</sub>]<sup>−</sup> 为黄色、[Fe(SCN)]<sup>2+</sup> 为红色、[FeF<sub>6</sub>]<sup>3−</sup> 为无色。下列说法不正确的是", "opts": ["①中浓盐酸促进 Fe<sup>3+</sup>+4Cl<sup>−</sup>⇌[FeCl<sub>4</sub>]<sup>−</sup> 平衡正向移动", "由①到②，生成 [Fe(SCN)]<sup>2+</sup> 并消耗 [FeCl<sub>4</sub>]<sup>−</sup>", "②、③对比，说明 c(Fe<sup>3+</sup>)：②>③", "由①→④推断，若向①深黄色溶液中加入 KI、淀粉溶液，溶液也无明显变化"], "exp": "【题析】选项 A，向 FeCl<sub>3</sub> 溶液中滴加浓盐酸，c(Cl<sup>−</sup>) 增大，Fe<sup>3+</sup>+4Cl<sup>−</sup>⇌[FeCl<sub>4</sub>]<sup>−</sup> 平衡正向移动，生成更多黄色的 [FeCl<sub>4</sub>]<sup>−</sup>，溶液黄色加深，正确。选项 B，由②到③（题析按实验顺序应为向含 [FeCl<sub>4</sub>]<sup>−</sup> 的溶液中滴加 KSCN），[FeCl<sub>4</sub>]<sup>−</sup> 转化为 [Fe(SCN)]<sup>2+</sup>，生成 [Fe(SCN)]<sup>2+</sup> 的同时消耗 [FeCl<sub>4</sub>]<sup>−</sup>，溶液变红；同时存在 Fe<sup>3+</sup>+4Cl<sup>−</sup>⇌[FeCl<sub>4</sub>]<sup>−</sup> 平衡逆向移动，即生成 [Fe(SCN)]<sup>2+</sup> 并消耗 [FeCl<sub>4</sub>]<sup>−</sup>，正确。选项 C，②、③溶液中均存在平衡 Fe<sup>3+</sup>+SCN<sup>−</sup>⇌[Fe(SCN)]<sup>2+</sup>，③溶液为红色、④溶液变为无色说明加 NaF 后 Fe<sup>3+</sup>+6F<sup>−</sup>⇌[FeF<sub>6</sub>]<sup>3−</sup> 使 c(Fe<sup>3+</sup>) 减小，②、③对比可知 c(Fe<sup>3+</sup>)：②>③，正确。选项 D，由①→④推断，④中 c(Fe<sup>3+</sup>) 已大幅减小（生成 [FeF<sub>6</sub>]<sup>3−</sup>），故滴加 KI、淀粉无明显变化；但①中 Fe<sup>3+</sup> 含量较大，Fe<sup>3+</sup> 能氧化 I<sup>−</sup>：2Fe<sup>3+</sup>+2I<sup>−</sup>=2Fe<sup>2+</sup>+I<sub>2</sub>，加入 KI、淀粉溶液会变蓝色，错误。"}, {"id": 9, "src": "2026 河南 9", "ans": "B", "figs": ["figs/k13/q9.png"], "stem": "某同学设计以下实验，探究铁的化合物的性质（忽略②~⑤试管中溶液体积变化）：水合硫酸铁加水得黄色溶液②→加 1 滴稀硫酸得浅黄色溶液③→加 1 滴 KSCN 溶液得红色溶液④→加 K<sub>2</sub>C<sub>2</sub>O<sub>4</sub>·H<sub>2</sub>O 固体得绿色溶液⑤→加适量稀硫酸又变红。已知：Fe<sup>3+</sup> 在水溶液中由于水解与 OH<sup>−</sup> 配位而显黄色，[Fe(C<sub>2</sub>O<sub>4</sub>)<sub>3</sub>]<sup>3−</sup> 显绿色。下列说法错误的是", "opts": ["②到③说明加入稀硫酸能抑制 Fe<sup>3+</sup> 的水解", "④与⑤中 c(SCN<sup>−</sup>)：④>⑤", "④与⑥中呈现红色均是由于 Fe<sup>3+</sup> 与 SCN<sup>−</sup> 结合所致", "若向③中依次加入适量维生素 C、K<sub>3</sub>[Fe(CN)<sub>6</sub>] 溶液，会出现蓝色沉淀"], "exp": "【题析】选项 A，Fe<sup>3+</sup> 在水溶液中水解显黄色，加入稀硫酸后 c(H<sup>+</sup>) 增大、水解平衡逆向移动，抑制 Fe<sup>3+</sup> 水解，溶液黄色变浅，正确。选项 B，④中 Fe<sup>3+</sup> 与 SCN<sup>−</sup> 结合生成红色 Fe(SCN)<sub>3</sub>；加入 K<sub>2</sub>C<sub>2</sub>O<sub>4</sub> 后，C<sub>2</sub>O<sub>4</sub><sup>2−</sup> 与 Fe<sup>3+</sup> 的配位能力比 SCN<sup>−</sup> 更强，生成更稳定的绿色 [Fe(C<sub>2</sub>O<sub>4</sub>)<sub>3</sub>]<sup>3−</sup>，释放出 SCN<sup>−</sup>，故 c(SCN<sup>−</sup>)：④<⑤，错误。选项 C，④中红色是 Fe<sup>3+</sup> 与 SCN<sup>−</sup> 结合生成 Fe(SCN)<sub>3</sub>，⑥中加稀硫酸后 C<sub>2</sub>O<sub>4</sub><sup>2−</sup> 与 H<sup>+</sup> 结合生成弱电解质 H<sub>2</sub>C<sub>2</sub>O<sub>4</sub>，[Fe(C<sub>2</sub>O<sub>4</sub>)<sub>3</sub>]<sup>3−</sup> 解离出的 Fe<sup>3+</sup> 又与 SCN<sup>−</sup> 结合使溶液变回红色，两者均因 Fe<sup>3+</sup> 与 SCN<sup>−</sup> 结合所致，正确。选项 D，维生素 C 具有还原性，可将 Fe<sup>3+</sup> 还原为 Fe<sup>2+</sup>，再加入 K<sub>3</sub>[Fe(CN)<sub>6</sub>] 溶液，Fe<sup>2+</sup> 与 K<sub>3</sub>[Fe(CN)<sub>6</sub>] 生成 KFe[Fe(CN)<sub>6</sub>] 蓝色沉淀，正确。"}, {"id": 10, "src": "2023 广州一测 8", "ans": "B", "figs": ["figs/k13/q10.png"], "stem": "将铜丝插入浓硝酸中进行如图所示的实验，下列说法正确的是", "opts": ["装置 a 中出现红棕色气体，只体现 HNO<sub>3</sub> 的酸性", "一段时间后抽出铜丝，向装置 b 注入水，b 中气体红棕色变浅", "注入水后装置 b 中铜片表面产生气泡，说明 Cu 与硝酸生成 H<sub>2</sub>", "装置 c 用 NaOH 吸收尾气，说明 NO 和 NO<sub>2</sub> 均是酸性氧化物"], "exp": "【题析】选项 A，装置 a 中 Cu 与浓硝酸反应：Cu+4HNO<sub>3</sub>(浓)=Cu(NO<sub>3</sub>)<sub>2</sub>+2NO<sub>2</sub>↑+2H<sub>2</sub>O，出现红棕色 NO<sub>2</sub> 气体，N 元素化合价由 +5 降为 +4，体现 HNO<sub>3</sub> 的强氧化性；生成 Cu(NO<sub>3</sub>)<sub>2</sub> 体现酸性，故既体现酸性又体现氧化性，错误。选项 B，一段时间后抽出铜丝，向装置 b 注入水，NO<sub>2</sub> 溶于水并与水反应：3NO<sub>2</sub>+H<sub>2</sub>O=2HNO<sub>3</sub>+NO，红棕色 NO<sub>2</sub> 转化为无色 NO，气体红棕色变浅，正确。选项 C，注入水后 NO<sub>2</sub> 与水反应生成 HNO<sub>3</sub>，b 中铜片与生成的稀硝酸反应产生 NO 气体：3Cu+8HNO<sub>3</sub>(稀)=3Cu(NO<sub>3</sub>)<sub>2</sub>+2NO↑+4H<sub>2</sub>O，Cu 与硝酸反应不生成 H<sub>2</sub>，错误。选项 D，酸性氧化物指能与碱反应只生成盐和水的氧化物，NO 是不成盐氧化物，NO<sub>2</sub> 与 NaOH 反应除生成盐和水外还发生氧化还原反应，二者均不是酸性氧化物，错误。"}, {"id": 11, "src": "2024 广州调研 10", "ans": "C", "figs": ["figs/k13/q11.png"], "stem": "将铜丝浸在浓硫酸中加热，按如图装置进行含硫物质的实验。下列说法不正确的是", "opts": ["Cu 与浓硫酸反应，体现 H<sub>2</sub>SO<sub>4</sub> 的酸性和氧化性", "蓝色石蕊试纸变红，说明 SO<sub>2</sub> 是酸性氧化物", "品红试纸和酸性 KMnO<sub>4</sub> 溶液均褪色，体现 SO<sub>2</sub> 的还原性", "Na<sub>2</sub>S 溶液中出现淡黄色浑浊，体现 SO<sub>2</sub> 的氧化性"], "exp": "【题析】选项 A，铜丝与浓硫酸加热反应：Cu+2H<sub>2</sub>SO<sub>4</sub>(浓)→(Δ)CuSO<sub>4</sub>+SO<sub>2</sub>↑+2H<sub>2</sub>O，生成 CuSO<sub>4</sub> 体现 H<sub>2</sub>SO<sub>4</sub> 的酸性，S 由 +6 降为 +4 生成 SO<sub>2</sub> 体现氧化性，正确。选项 B，SO<sub>2</sub> 溶于水生成 H<sub>2</sub>SO<sub>3</sub> 使湿润的蓝色石蕊试纸变红，说明 SO<sub>2</sub> 是酸性氧化物，正确。选项 C，SO<sub>2</sub> 使品红试纸褪色是因为 SO<sub>2</sub> 与有色物质化合生成不稳定的无色物质，体现 SO<sub>2</sub> 的漂白性（不是还原性）；SO<sub>2</sub> 使酸性 KMnO<sub>4</sub> 溶液褪色才体现还原性，故该说法错误。选项 D，SO<sub>2</sub> 与 Na<sub>2</sub>S 溶液反应生成单质硫：SO<sub>2</sub>+2S<sup>2−</sup>+4H<sup>+</sup>=3S↓+2H<sub>2</sub>O（或 SO<sub>2</sub>+2H<sub>2</sub>S=3S↓+2H<sub>2</sub>O），出现淡黄色浑浊，SO<sub>2</sub> 中 S 由 +4 降为 0，体现 SO<sub>2</sub> 的氧化性，正确。"}, {"id": 12, "src": "2024 广州二测 11", "ans": "B", "figs": ["figs/k13/q12.png"], "stem": "将浓盐酸加到 KMnO<sub>4</sub> 中进行如图所示的探究实验，一段时间后，下列分析正确的是", "opts": ["a 处布条褪色，说明 Cl<sub>2</sub> 具有漂白性", "b 处出现蓝色，说明还原性：I<sup>−</sup>>Cl<sup>−</sup>", "c 处红色逐渐变浅，说明 Cl<sub>2</sub> 具有还原性", "将 KMnO<sub>4</sub> 换成 MnO<sub>2</sub> 重做实验，a 处布条褪色更快"], "exp": "【题析】浓盐酸与 KMnO<sub>4</sub> 反应：2KMnO<sub>4</sub>+16HCl(浓)=2KCl+2MnCl<sub>2</sub>+5Cl<sub>2</sub>↑+8H<sub>2</sub>O。选项 A，a 处湿润的红布条褪色是因为 Cl<sub>2</sub> 与水反应生成 HClO，HClO 具有漂白性，干燥的 Cl<sub>2</sub> 无漂白性，错误。选项 B，b 处淀粉-KI 溶液变蓝，发生 Cl<sub>2</sub>+2I<sup>−</sup>=2Cl<sup>−</sup>+I<sub>2</sub>，还原剂 I<sup>−</sup> 的还原性强于还原产物 Cl<sup>−</sup>，即还原性 I<sup>−</sup>>Cl<sup>−</sup>，正确。选项 C，c 处红色（酚酞-NaOH）逐渐变浅是因为挥发出的 Cl<sub>2</sub> 与 NaOH 反应消耗了 NaOH，同时 HCl 也中和 NaOH，说明 Cl<sub>2</sub> 能与碱反应，不能说明 Cl<sub>2</sub> 具有还原性（该反应中 Cl<sub>2</sub> 表现氧化性），错误。选项 D，KMnO<sub>4</sub> 与浓盐酸常温即可快速反应产生 Cl<sub>2</sub>，而 MnO<sub>2</sub> 与浓盐酸需要加热才能较快产生 Cl<sub>2</sub>，换成 MnO<sub>2</sub> 后 a 处布条褪色更慢，错误。"}, {"id": 13, "src": "2025 广州一测 11", "ans": "D", "figs": ["figs/k13/q13.png"], "stem": "按下图装置进行实验，闭合开关一段时间后，下列说法正确的是", "opts": ["滴加铁氰化钾溶液，产生大量蓝色沉淀", "U 形管两侧均有气泡冒出，分别是 Cl<sub>2</sub> 和 O<sub>2</sub>", "a 处红布条褪色，说明 Cl<sub>2</sub> 具有漂白性", "b 处出现蓝色，说明还原性：I<sup>−</sup>>Cl<sup>−</sup>"], "exp": "【题析】该装置为电解 NaCl 溶液的电解池，Fe 电极为阴极（与电源负极相连），石墨电极为阳极。选项 A，Fe 极为阴极，电极反应 2H<sub>2</sub>O+2e<sup>−</sup>=H<sub>2</sub>↑+2OH<sup>−</sup>，Fe 电极被保护，不生成 Fe<sup>2+</sup>，滴加铁氰化钾溶液不会产生大量蓝色沉淀，错误。选项 B，阳极（石墨）反应 2Cl<sup>−</sup>−2e<sup>−</sup>=Cl<sub>2</sub>↑，阴极产生 H<sub>2</sub>，两侧气体分别是 Cl<sub>2</sub> 和 H<sub>2</sub>，不是 O<sub>2</sub>，错误。选项 C，a 处湿润红布条褪色是因为 Cl<sub>2</sub> 与水生成的 HClO 具有漂白性，Cl<sub>2</sub> 本身无漂白性，错误。选项 D，b 处淀粉-KI 溶液变蓝，发生 Cl<sub>2</sub>+2I<sup>−</sup>=I<sub>2</sub>+2Cl<sup>−</sup>，I<sup>−</sup> 被氧化为 I<sub>2</sub>、Cl<sub>2</sub> 被还原为 Cl<sup>−</sup>，该反应中 I<sup>−</sup> 为还原剂、Cl<sup>−</sup> 为还原产物，故还原性 I<sup>−</sup>>Cl<sup>−</sup>，正确。"}, {"id": 14, "src": "2025 广州二测 11", "ans": "D", "figs": ["figs/k13/q14.png"], "stem": "按下图装置进行实验，将两张湿润的试纸贴于广口瓶内壁，先注入浓氨水，一段时间后再注入浓盐酸，对实验现象的分析合理的是", "opts": ["注入浓氨水，气球膨胀，说明 NH<sub>3</sub>·H<sub>2</sub>O 分解放热", "注入浓氨水，红色石蕊试纸变蓝，说明 NH<sub>3</sub> 是电解质", "注入浓盐酸，淀粉-KI 试纸变蓝后褪色，说明氯气具有漂白性", "注入浓盐酸，出现大量白烟，说明氨气具有还原性"], "exp": "【题析】选项 A，浓氨水中存在 NH<sub>3</sub>+H<sub>2</sub>O⇌NH<sub>3</sub>·H<sub>2</sub>O⇌NH<sub>4</sub><sup>+</sup>+OH<sup>−</sup> 平衡，NaOH 固体溶解放热且电离产生大量 OH<sup>−</sup>，促进平衡逆向移动，同时放热使 NH<sub>3</sub> 逸出，气球膨胀不一定说明 NH<sub>3</sub>·H<sub>2</sub>O 分解放热（可能是生成 NH<sub>3</sub> 使瓶内气压增大），错误。选项 B，红色石蕊试纸变蓝是因为 NH<sub>3</sub> 溶于水生成的 NH<sub>3</sub>·H<sub>2</sub>O 电离出 OH<sup>−</sup>，NH<sub>3</sub> 本身不能电离，是非电解质，错误。选项 C，KMnO<sub>4</sub> 与浓盐酸反应生成 Cl<sub>2</sub>：2KMnO<sub>4</sub>+16HCl(浓)=2KCl+2MnCl<sub>2</sub>+5Cl<sub>2</sub>↑+8H<sub>2</sub>O，Cl<sub>2</sub> 氧化 I<sup>−</sup> 生成 I<sub>2</sub> 使淀粉-KI 试纸变蓝：Cl<sub>2</sub>+2I<sup>−</sup>=2Cl<sup>−</sup>+I<sub>2</sub>，Cl<sub>2</sub> 还能将 I<sub>2</sub> 进一步氧化为无色的 HIO<sub>3</sub>：5Cl<sub>2</sub>+I<sub>2</sub>+6H<sub>2</sub>O=2HIO<sub>3</sub>+10HCl，蓝色消失体现 Cl<sub>2</sub> 的氧化性，不是漂白性，错误。选项 D，注入浓盐酸后，挥发出的 HCl 与瓶内大量 NH<sub>3</sub> 反应生成 NH<sub>4</sub>Cl 固体小颗粒：8NH<sub>3</sub>+3Cl<sub>2</sub>=6NH<sub>4</sub>Cl+N<sub>2</sub>，出现大量白烟，反应中 Cl<sub>2</sub> 被 NH<sub>3</sub> 还原，体现 NH<sub>3</sub> 的还原性，正确。"}, {"id": 15, "src": "2026 广州调研 11", "ans": "C", "figs": ["figs/k13/q15.png"], "stem": "按如图装置进行浓硫酸与蔗糖反应的实验，烧杯中的蔗糖滴有少量水，将注射器中的浓硫酸注入其中，下列说法正确的是", "opts": ["蔗糖变黑，说明浓硫酸具有吸水性", "a 处试纸褪色，说明 SO<sub>2</sub> 具有氧化性", "b 处滤纸褪色，说明 SO<sub>2</sub> 具有还原性", "c 中溶液变浑浊，说明反应有 CO<sub>2</sub> 生成"], "exp": "【题析】选项 A，浓硫酸使蔗糖脱水（按水分子中氢、氧原子个数比 2∶1 脱去蔗糖中的氢、氧元素），蔗糖炭化变黑，体现浓硫酸的脱水性，不是吸水性，错误。选项 B，SO<sub>2</sub> 使湿润的品红试纸褪色是因为 SO<sub>2</sub> 与品红结合生成不稳定的无色物质，体现 SO<sub>2</sub> 的漂白性，不是氧化性，错误。选项 C，SO<sub>2</sub> 与酸性 KMnO<sub>4</sub> 溶液反应：5SO<sub>2</sub>+2MnO<sub>4</sub><sup>−</sup>+2H<sub>2</sub>O=5SO<sub>4</sub><sup>2−</sup>+2Mn<sup>2+</sup>+4H<sup>+</sup>，使 KMnO<sub>4</sub> 滤纸褪色，SO<sub>2</sub> 中 S 由 +4 升为 +6，体现 SO<sub>2</sub> 的还原性，正确。选项 D，SO<sub>2</sub> 和 CO<sub>2</sub> 都是酸性氧化物，均能与澄清石灰水反应生成白色沉淀（CaCO<sub>3</sub>、CaSO<sub>3</sub>），c 中溶液变浑浊不能说明一定有 CO<sub>2</sub> 生成，错误。"}, {"id": 16, "src": "2026 广州调研 15", "ans": "B", "figs": ["figs/k13/q16.png"], "stem": "利用如图装置进行实验：打开 K<sub>1</sub>、K<sub>2</sub>，将铜丝插入溶液中，当 c 中红色褪去时，将铜丝抽离液面；关闭 K<sub>1</sub>、K<sub>2</sub>，点燃酒精灯加热片刻后，推动注射器注入氨气（保持温度不变）。已知 NH<sub>4</sub>NO<sub>2</sub> 溶液呈酸性，下列叙述错误的是", "opts": ["a 中有大量红棕色气体生成，说明浓硝酸具有氧化性", "c 中溶液红色刚好褪去时，氨水恰好完全反应", "b 中气体受热后颜色变深，说明 NO<sub>2</sub> 转化为 N<sub>2</sub>O<sub>4</sub> 时放热", "注入氨气后，b 中气体颜色变浅，说明 NH<sub>3</sub> 具有还原性"], "exp": "【题析】选项 A，Cu 与浓硝酸反应：Cu+4HNO<sub>3</sub>(浓)=Cu(NO<sub>3</sub>)<sub>2</sub>+2NO<sub>2</sub>↑+2H<sub>2</sub>O，生成红棕色 NO<sub>2</sub>，N 由 +5 降为 +4，说明浓硝酸具有强氧化性，正确。选项 B，NO<sub>2</sub> 通入氨水中发生反应：2NO<sub>2</sub>+2NH<sub>3</sub>·H<sub>2</sub>O=NH<sub>4</sub>NO<sub>3</sub>+NH<sub>4</sub>NO<sub>2</sub>+H<sub>2</sub>O，已知 NH<sub>4</sub>NO<sub>2</sub> 溶液呈酸性，当 c 中溶液红色刚好褪去（pH≈8.2）时，溶液中还有 NH<sub>3</sub>·H<sub>2</sub>O 剩余（因产物 NH<sub>4</sub>NO<sub>2</sub> 显酸性），氨水并未恰好完全反应，错误。选项 C，NO<sub>2</sub> 为红棕色、N<sub>2</sub>O<sub>4</sub> 为无色，b 中气体受热颜色变深，说明升温使 2NO<sub>2</sub>(g)⇌N<sub>2</sub>O<sub>4</sub>(g) 平衡逆向移动，即 NO<sub>2</sub> 转化为 N<sub>2</sub>O<sub>4</sub> 的正反应为放热反应，正确。选项 D，注入氨气后，NH<sub>3</sub> 与 NO<sub>2</sub> 发生反应：6NO<sub>2</sub>+8NH<sub>3</sub>→(催化剂,Δ)7N<sub>2</sub>+12H<sub>2</sub>O，红棕色气体颜色变浅，NH<sub>3</sub> 中 N 由 −3 升为 0，体现 NH<sub>3</sub> 的还原性，正确。"}, {"id": 17, "src": "2026 广州一测 13", "ans": "B", "figs": ["figs/k13/q17.png"], "stem": "利用如图装置进行实验，持续通入 CO<sub>2</sub>。下列说法错误的是", "opts": ["a 中溶液变浑浊，说明苯酚是弱酸", "b 中固体逐渐变白，说明 CO<sub>2</sub> 被氧化", "c 中析出白色固体，说明生成了 NaHCO<sub>3</sub>", "d 中溶液变红，体现 Fe<sup>2+</sup> 的还原性"], "exp": "【题析】选项 A，CO<sub>2</sub> 通入苯酚钠溶液：CO<sub>2</sub>+H<sub>2</sub>O+C<sub>6</sub>H<sub>5</sub>ONa→C<sub>6</sub>H<sub>5</sub>OH+NaHCO<sub>3</sub>，苯酚在水中溶解度较小使溶液变浑浊，说明酸性 H<sub>2</sub>CO<sub>3</sub>>苯酚，苯酚为弱酸，正确。选项 B，b 中 Na<sub>2</sub>O<sub>2</sub> 与 CO<sub>2</sub> 反应：2Na<sub>2</sub>O<sub>2</sub>+2CO<sub>2</sub>=2Na<sub>2</sub>CO<sub>3</sub>+O<sub>2</sub>，固体由淡黄色变白；该反应中 Na<sub>2</sub>O<sub>2</sub> 既是氧化剂又是还原剂，CO<sub>2</sub> 中 C 为 +4 价未变，CO<sub>2</sub> 没有被氧化，错误。选项 C，CO<sub>2</sub> 通入饱和 Na<sub>2</sub>CO<sub>3</sub> 溶液：Na<sub>2</sub>CO<sub>3</sub>+CO<sub>2</sub>+H<sub>2</sub>O=2NaHCO<sub>3</sub>，由于 NaHCO<sub>3</sub> 溶解度远小于 Na<sub>2</sub>CO<sub>3</sub>，析出白色 NaHCO<sub>3</sub> 晶体，正确。选项 D，b 中生成的 O<sub>2</sub> 进入 d 中，将 Fe<sup>2+</sup> 氧化为 Fe<sup>3+</sup>：4Fe<sup>2+</sup>+O<sub>2</sub>+4H<sup>+</sup>=4Fe<sup>3+</sup>+2H<sub>2</sub>O，Fe<sup>3+</sup> 与 SCN<sup>−</sup> 结合生成红色 Fe(SCN)<sub>3</sub>，溶液变红，说明 Fe<sup>2+</sup> 被氧化、体现 Fe<sup>2+</sup> 的还原性，正确。"}, {"id": 18, "src": "2026 广州一测 15", "ans": "C", "figs": ["figs/k13/q18.png"], "stem": "利用如图装置进行实验，打开分液漏斗活塞，点燃酒精灯加热数分钟后，熄灭酒精灯，观察到铜丝有黑红交替的现象，下列说法错误的是", "opts": ["a 中的 MnO<sub>2</sub> 和 d 中的铜丝在反应中都起降低活化能的作用", "d 中的铜丝由黑变红，说明乙醇被氧化", "e 中试管内液体能使酸性 KMnO<sub>4</sub> 溶液褪色，说明产物含有乙醛", "熄灭酒精灯后 d 中反应持续进行，说明 d 中有放热反应发生"], "exp": "【题析】a 装置为 O<sub>2</sub> 的发生装置（H<sub>2</sub>O<sub>2</sub> 在 MnO<sub>2</sub> 催化下分解），b 为浓硫酸干燥装置，c 中无水乙醇在热水浴下转化为乙醇蒸气，乙醇蒸气与 O<sub>2</sub> 进入 d 装置发生催化氧化。选项 A，MnO<sub>2</sub> 催化 H<sub>2</sub>O<sub>2</sub> 分解、铜丝催化乙醇氧化，催化剂通过降低反应活化能实现催化作用，正确。选项 B，d 中铜丝先被 O<sub>2</sub> 氧化为黑色 CuO：2Cu+O<sub>2</sub>→(Δ)2CuO，CuO 又被乙醇还原为红色 Cu：CH<sub>3</sub>CH<sub>2</sub>OH+CuO→(Δ)CH<sub>3</sub>CHO+Cu+H<sub>2</sub>O，铜丝由黑变红说明乙醇被氧化，正确。选项 C，未充分反应的乙醇蒸气也会随产物一起进入 e 试管，乙醇也能使酸性 KMnO<sub>4</sub> 溶液褪色，因此不能仅凭 KMnO<sub>4</sub> 褪色说明产物含乙醛，错误。选项 D，熄灭酒精灯后 d 中反应仍能持续进行，说明该反应放热、放出的热量提供了反应所需能量，正确。"}, {"id": 19, "src": "2026 广州二测 11", "ans": "D", "figs": ["figs/k13/q19.png"], "stem": "利用如图装置进行实验，反应一段时间后，往 d 中注入 H<sub>2</sub>O<sub>2</sub> 溶液。下列说法错误的是", "opts": ["a 中溶液变为绿色，说明浓硝酸具有氧化性", "b 中试纸变蓝，体现了 I<sup>−</sup> 的还原性", "c 中液面上方气体变红棕色时，所含氮氧化物至少有两种", "若 c 中不加铜片，往 d 中注入 H<sub>2</sub>O<sub>2</sub> 后气体颜色无明显变化"], "exp": "【题析】选项 A，Cu 与浓硝酸反应：Cu+4HNO<sub>3</sub>(浓)=Cu(NO<sub>3</sub>)<sub>2</sub>+2NO<sub>2</sub>↑+2H<sub>2</sub>O，Cu 被氧化为 Cu<sup> var KEY = 'xz13_state', TKEY = 'xz_theme', NKEY = 'xz_name';
var N = QS.length, PER = 2;
var st = {a:{}, skip:{}, help:{}, elapsed:0, started:false};
function $(id){return document.getElementById(id)}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s){st.a=s.a||{};st.skip=s.skip||{};st.help=s.help||{};st.elapsed=s.elapsed||0;st.started=!!s.started}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function fmt(s){s=Math.floor(s);return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2)}
function calc(){
  var ok=0;
  QS.forEach(function(q){if(st.a[q.id]===q.ans&&st.help[q.id]!=='rock')ok++});
  var done=Object.keys(st.a).length;
  return {done:done,ok:ok,score:ok*PER};
}
function renderStats(){
  var c=calc();
  $('sProg').textContent=c.done;$('sScore').textContent=c.score;$('sOk').textContent=c.ok;$('sTime').textContent=fmt(st.elapsed);
}
function setSkip(id,on){
  var act=$('act'+id),tip=$('skd'+id),ob=$('op'+id);
  act.style.display=on?'none':'flex';
  $('hl'+id).style.display=on?'none':'flex';
  if(on){var jb=$('jbx'+id),rb=$('rbx'+id);if(jb)jb.style.display='none';if(rb)rb.style.display='none';}
  tip.style.display=on?'block':'none';
  Array.prototype.forEach.call(ob.children,function(b){b.disabled=on||!!st.a[id]});
  $('qc'+id).classList.toggle('skipped-card',on);
}
function build(){
  var box=$('qlist');
  QS.forEach(function(q,i){
    var d=document.createElement('div');d.className='qcard';d.id='qc'+q.id;
    var h='<div class="qmeta"><span class="qno">第 '+(i+1)+' 题</span><span class="qpt">'+PER+' 分</span><span class="qsrc">'+q.src+'</span><span class="qmark" id="qm'+q.id+'"></span></div>';
    h+='<div class="stem">'+q.stem+'</div>';
    if(q.figs){q.figs.forEach(function(f){h+='<div class="qfig"><img src="'+f+'" alt="题图"></div>'})}
    h+='<div id="op'+q.id+'"></div>';
    h+='<div class="btn-row" id="act'+q.id+'"><button class="submit" id="sb'+q.id+'" disabled>提交本题</button><button class="skipbtn" id="sk'+q.id+'">跳过此题</button></div>';
    h+='<div class="helprow" id="hl'+q.id+'">';
    if(q.hint){h+='<button class="jade" id="jd'+q.id+'">🙋 求助小玉 · 思路点拨</button>';}
    h+='<button class="rock" id="rk'+q.id+'">📖 求助小岩 · 看详解本题计0分</button></div>';
    h+='<div class="helpbox jadebox" id="jbx'+q.id+'"><div class="ht">🙋 小玉点拨 · 不扣分，自己接着想</div><p>'+(q.hint||'')+'</p></div>';
    h+='<div class="helpbox rockbox" id="rbx'+q.id+'"><div class="ht">📖 小岩详解 · 本题已计 0 分</div><p>'+q.exp+'</p></div>';
    h+='<div class="skipped-tip" id="skd'+q.id+'">已跳过（不计入统计）<button class="undoskip" id="us'+q.id+'">撤销跳过</button></div>';
    h+='<div class="verdict" id="vd'+q.id+'"></div>';
    h+='<div class="exp" id="ex'+q.id+'"><div class="et">答案 '+q.ans+' · 题析</div><p>'+q.exp+'</p></div>';
    h+='<button class="next" id="nx'+q.id+'">'+(i<N-1?'下一题 →':'返回顶部生成成绩卡')+'</button>';
    d.innerHTML=h;box.appendChild(d);
    var picked=null,done=!!st.a[q.id],skipped=!!st.skip[q.id];
    var ob=$('op'+q.id);
    q.opts.forEach(function(o,j){
      var L='ABCD'[j],b=document.createElement('button');
      b.className='opt';b.innerHTML='<span class="ol">'+L+'．</span><span>'+o+'</span>';
      b.onclick=function(){
        if(done||skipped)return;
        if(!st.started){st.started=true}
        picked=L;
        Array.prototype.forEach.call(ob.children,function(c){c.classList.remove('sel')});
        b.classList.add('sel');
        $('sb'+q.id).disabled=false;
      };
      ob.appendChild(b);
    });
    if(done){
      var pick=st.a[q.id],ok=pick===q.ans;
      paintResult(q,ob,pick,ok);
      if(st.help[q.id]==='rock'){
        $('rbx'+q.id).style.display='block';
        $('hl'+q.id).style.display='none';
        $('qm'+q.id).textContent='📖';
        $('qm'+q.id).style.color='#f59e0b';
      }else{
        $('ex'+q.id).style.display='block';
        $('hl'+q.id).style.display='none';
        $('qm'+q.id).textContent=ok?'✓':'✗';
        $('qm'+q.id).style.color=ok?'var(--ok)':'var(--bad)';
      }
      $('act'+q.id).style.display='none';
    }else if(skipped){
      setSkip(q.id,true);
    }else if(st.help[q.id]){
      $(st.help[q.id]==='rock'?'rbx'+q.id:'jbx'+q.id).style.display='block';
      var hb=$(st.help[q.id]==='rock'?'rk'+q.id:'jd'+q.id);
      if(hb)hb.style.opacity=.5;
    }
    $('sb'+q.id).onclick=function(){
      if(picked===null||done||skipped)return;
      done=true;
      var ok=picked===q.ans;
      var rock=st.help[q.id]==='rock';
      st.a[q.id]=picked;
      paintResult(q,ob,picked,ok);
      var v=$('vd'+q.id);
      v.style.display='block';
      v.style.background=rock?'rgba(245,158,11,.09)':(ok?'var(--ok-bg)':'var(--bad-bg)');
      v.style.color=rock?'#f59e0b':(ok?'var(--ok-ink)':'var(--bad-ink)');
      v.textContent=rock?'已求助小岩 · 本题计 0 分（正确答案 '+q.ans+'）':(ok?'回答正确 +'+PER+' 分':'回答错误 · 正确答案 '+q.ans);
      $('qm'+q.id).textContent=rock?'📖':(ok?'✓':'✗');
      $('qm'+q.id).style.color=rock?'#f59e0b':(ok?'var(--ok)':'var(--bad)');
      if(rock){$('rbx'+q.id).style.display='block';$('hl'+q.id).style.display='none';}
      else{$('ex'+q.id).style.display='block';$('hl'+q.id).style.display='none';}
      $('act'+q.id).style.display='none';
      Array.prototype.forEach.call(ob.children,function(b){b.disabled=true});
      renderStats();save();
    };
    if($('jd'+q.id)){$('jd'+q.id).onclick=function(){
      if(done||skipped)return;
      st.help[q.id]='jade';
      if(!st.started){st.started=true}
      $('jbx'+q.id).style.display='block';
      $('jd'+q.id).style.opacity=.5;
      save();
    };}
    $('rk'+q.id).onclick=function(){
      if(done||skipped)return;
      if(!confirm('看小岩详解后，本题将计 0 分（即使答对）。确定求助吗？'))return;
      st.help[q.id]='rock';
      if(!st.started){st.started=true}
      $('rbx'+q.id).style.display='block';
      $('rk'+q.id).style.opacity=.5;
      renderStats();save();
    };
    $('sk'+q.id).onclick=function(){
      if(done||skipped)return;
      skipped=true;st.skip[q.id]=1;
      if(!st.started){st.started=true}
      setSkip(q.id,true);save();
    };
    $('us'+q.id).onclick=function(){
      if(!skipped)return;
      skipped=false;delete st.skip[q.id];
      setSkip(q.id,false);save();
    };
    $('nx'+q.id).onclick=function(){
      if(i<N-1){var n=QS[i+1];var el=document.getElementById('qc'+n.id);el.scrollIntoView({behavior:'smooth',block:'start'})}
      else{window.scrollTo({top:0,behavior:'smooth'})}
    };
  });
}
function paintResult(q,ob,pick,ok){
  Array.prototype.forEach.call(ob.children,function(c,j){
    var L='ABCD'[j];c.disabled=true;
    if(L===q.ans)c.classList.add('rgt');
    else if(L===pick)c.classList.add('wrg');
  });
}
var timer=setInterval(function(){
  var c=calc();
  if(st.started&&c.done<N){st.elapsed++;renderStats();if(st.elapsed%5===0)save()}
},1000);
function pad(n){return ('0'+n).slice(-2)}

  $('stuName').value=localStorage.getItem(NKEY)||'';
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
}
$('btnCard').onclick=function(){showCard()};
$('btnGen').onclick=function(){
  var name=$('stuName').value.trim()||'同学';
  try{localStorage.setItem(NKEY,name)}catch(e){}
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
};
$('btnClose').onclick=function(){
  $('result').style.display='none';
  var first=QS.find(function(q){return !st.a[q.id]&&!st.skip[q.id]});
  var el=first?document.getElementById('qc'+first.id):$('qlist');
  el.scrollIntoView({behavior:'smooth',block:'start'});
};
function drawCard(){
  var c=document.getElementById('canvas'),x=c.getContext('2d'),W=c.width,H=c.height;
  var g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0f172a');g.addColorStop(.55,'#152743');g.addColorStop(1,'#1b1140');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(34,211,238,.08)';x.beginPath();x.arc(W-60,60,150,0,7);x.fill();
  x.fillStyle='rgba(167,139,250,.08)';x.beginPath();x.arc(50,H-40,130,0,7);x.fill();
  x.fillStyle='#67e8f9';x.font='500 22px sans-serif';x.fillText('化学不难学 · 高考选择题训练',40,52);
  x.fillStyle='#8ea0b5';x.font='16px sans-serif';x.fillText('考点13 综合实验设计 · 每题 '+PER+' 分',40,84);
  var name=$('stuName').value.trim()||'同学';
  x.fillStyle='#e2e8f0';x.font='500 26px sans-serif';x.fillText(name,40,150);
  var cc=calc();
  x.fillStyle='#a78bfa';x.font='700 88px sans-serif';x.fillText(cc.score,40,250);
  x.fillStyle='#8ea0b5';x.font='18px sans-serif';x.fillText('分 / 满分 '+(N*PER)+' 分',40+String(cc.score).length*52+14,250);
  var acc=cc.done?Math.round(cc.ok/cc.done*100):0;
  var cells=[['正确率',acc+'%（'+cc.ok+'/'+cc.done+'）'],['完成度',cc.done+' / '+N+' 题'],['做题时长',fmt(st.elapsed)]];
  cells.forEach(function(cell,i){
    var cx=40+i*228;
    x.fillStyle='#1e293b';x.fillRect(cx,280,208,84);
    x.fillStyle='#67e8f9';x.font='14px sans-serif';x.fillText(cell[0],cx+18,310);
    x.fillStyle='#e2e8f0';x.font='500 20px sans-serif';x.fillText(cell[1],cx+18,346);
  });
  var d=new Date();
  var stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('提交时间 '+stamp,40,400);
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('已做题号（绿=自己对 蓝=问小玉 橙=问小岩0分 红=自己错）',40,432);
  var doneList=QS.filter(function(q){return !!st.a[q.id]});
  var jadeN=0,rockN=0;
  doneList.forEach(function(q,i){
    var col=i%14,row=Math.floor(i/14);
    var bx=40+col*48,by=450+row*46;
    var ok=st.a[q.id]===q.ans,h=st.help[q.id];
    var colr=h==='rock'?'#d97706':h==='jade'?'#3b82f6':(ok?'#16a34a':'#dc2626');
    if(h==='rock')rockN++;if(h==='jade')jadeN++;
    x.fillStyle=colr;x.fillRect(bx,by,38,36);
    x.fillStyle='#ffffff';x.font='500 16px sans-serif';x.fillText(String(q.id),bx+9,by+25);
  });
  x.fillStyle='#5b6b7f';x.font='13px sans-serif';
  x.fillText('答对 '+cc.ok+' · 答错 '+(cc.done-cc.ok)+' · 问小玉 '+jadeN+' · 问小岩 '+rockN+' · 未做 '+(N-cc.done)+' · 跳过 '+Object.keys(st.skip).length,40,H-22);
  window.__lastCard={time:stamp,done:cc.done,ok:cc.ok,score:cc.score,elapsed:fmt(st.elapsed),skip:Object.keys(st.skip).length,jade:jadeN,rock:rockN};
}
$('stuName').addEventListener('input',function(){try{localStorage.setItem(NKEY,this.value)}catch(e){}});
$('btnSave').onclick=function(){
  var a=document.createElement('a');
  a.download='选择题训练_考点13_'+(($('stuName').value.trim()||'成绩'))+'.png';
  a.href=$('canvas').toDataURL('image/png');a.click();
};
$('resetBtn').onclick=function(){
  var c=calc();
  if(c.done===0&&Object.keys(st.skip).length===0){alert('本讲还没有答题记录');return}
  if(confirm('确定清空本讲全部记录和成绩卡重新做吗？')){
    localStorage.removeItem(KEY);location.reload();
  }
};
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('themeBtn').textContent=t==='dark'?'☀':'🌙';
  try{localStorage.setItem(TKEY,t)}catch(e){}
}
$('themeBtn').onclick=function(){
  applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
};
applyTheme((function(){try{return localStorage.getItem(TKEY)||'dark'}catch(e){return 'dark'}})());
load();build();renderStats();
</script>
</body>
</html>

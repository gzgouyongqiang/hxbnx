<script>
var QS = [{"id": 1, "src": "2025 广东 4", "ans": "A", "stem": "劳动创造美好生活。下列对劳动项目涉及的相关化学知识表述错误的是", "opts": ["向燃煤中加入生石灰以脱硫减排——CaSO<sub>4</sub>+CO<sub>3</sub><sup>2−</sup>⇌CaCO<sub>3</sub>+SO<sub>4</sub><sup>2−</sup>", "用 BaCl<sub>2</sub> 和盐酸检验粗盐中是否含 SO<sub>4</sub><sup>2−</sup>——Ba<sup>2+</sup>+SO<sub>4</sub><sup>2−</sup>=BaSO<sub>4</sub>↓", "使用 MgCl<sub>2</sub> 溶液点卤制豆腐——MgCl<sub>2</sub> 使蛋白质盐析", "用铁粉、活性炭、食盐等制暖贴——使用时铁粉被氧化，反应放热"], "exp": "选项 A，燃煤中的 SO<sub>2</sub> 与生石灰（CaO）反应生成 CaSO<sub>3</sub>，CaSO<sub>3</sub> 和氧气反应生成 CaSO<sub>4</sub>，达到脱硫减排的目的，不存在沉淀溶解平衡的转化。选项 B，检验 SO<sub>4</sub><sup>2−</sup> 需先加盐酸酸化排除干扰离子，再加 BaCl<sub>2</sub> 生成 BaSO<sub>4</sub> 沉淀。选项 C，MgCl<sub>2</sub> 点卤使蛋白质胶体沉降，产生固体，点卤制豆腐发生蛋白质的盐析。选项 D，暖贴中铁粉、活性炭、食盐与空气中的水蒸气形成原电池，铁作负极发生氧化反应，铁粉氧化生成 Fe<sub>2</sub>O<sub>3</sub> 或 Fe(OH)<sub>3</sub>，反应放出热量。"}, {"id": 2, "src": "2024 广东 7", "ans": "D", "stem": "“光荣属于劳动者，幸福属于劳动者。”下列劳动项目与所述化学知识没有关联的是", "opts": ["水质检验员：用滴定法测水中 Cl<sup>−</sup> 含量——Ag<sup>+</sup>+Cl<sup>−</sup>=AgCl↓", "化学实验员：检验 Na<sub>2</sub>O<sub>2</sub> 是否失效——2Na<sub>2</sub>O<sub>2</sub>+2H<sub>2</sub>O=4NaOH+O<sub>2</sub>↑", "化工工程师：进行顺丁橡胶硫化——碳碳双键可打开与硫形成二硫键", "考古研究员：通过 <sup>14</sup>C 测定化石年代——C<sub>60</sub> 与石墨烯互为同素异形体"], "exp": "选项 A，用滴定法测水中 Cl<sup>−</sup> 含量利用了 Ag<sup>+</sup> 和 Cl<sup>−</sup> 生成 AgCl 沉淀，通过测 AgCl 沉淀的量从而测定水中 Cl<sup>−</sup> 的含量。选项 B，Na<sub>2</sub>O<sub>2</sub> 失效会生成 Na<sub>2</sub>CO<sub>3</sub>，利用 Na<sub>2</sub>O<sub>2</sub> 和水生成 NaOH 和 O<sub>2</sub> 的反应可以检验 Na<sub>2</sub>O<sub>2</sub> 是否失效，Na<sub>2</sub>CO<sub>3</sub> 加水不会产生氧气。选项 C，顺丁橡胶硫化就是 1,3-丁二烯中的碳碳双键打开与硫形成二硫键（-S-S-），得到既有弹性又有强度的顺丁橡胶。选项 D，通过 <sup>14</sup>C 测定化石年代是利用同位素的放射性，通过半衰期计算化石年代，这和 C<sub>60</sub> 与石墨烯互为同素异形体无关。"}, {"id": 3, "src": "2023 广东 7", "ans": "C", "stem": "劳动有利于“知行合一”。下列劳动项目与所述的化学知识没有关联的是", "opts": ["帮厨活动：帮食堂师傅煎鸡蛋准备午餐——加热使蛋白质变性", "环保行动：宣传使用聚乳酸制造的包装材料——聚乳酸在自然界可生物降解", "家务劳动：擦干已洗净的铁锅，以防生锈——铁丝在 O<sub>2</sub> 中燃烧生成 Fe<sub>3</sub>O<sub>4</sub>", "学农活动：利用秸秆、厨余垃圾等生产沼气——沼气中含有的 CH<sub>4</sub> 可作燃料"], "exp": "选项 A，鸡蛋主要成分是蛋白质，帮食堂师傅煎鸡蛋准备午餐，加热使蛋白质变性，有关联。选项 B，聚乳酸属于可降解的高分子有机物，在自然界可生物降解，减少污染，利于环保。选项 C，擦干已洗净的铁锅，以防生锈生成氧化铁，铁丝在 O<sub>2</sub> 中燃烧生成 Fe<sub>3</sub>O<sub>4</sub>，两者没有关联。选项 D，利用秸秆、厨余垃圾等在一定条件下发酵生成沼气，沼气主要成分是 CH<sub>4</sub>，CH<sub>4</sub> 用作燃料。"}, {"id": 4, "src": "2022 广东 6", "ans": "A", "stem": "劳动开创未来。下列劳动项目与所述的化学知识没有关联的是", "opts": ["面包师用小苏打作发泡剂烘焙面包——Na<sub>2</sub>CO<sub>3</sub> 可与酸反应", "环保工程师用熟石灰处理酸性废水——熟石灰具有碱性", "工人将模具干燥后再注入熔融钢水——铁与 H<sub>2</sub>O 高温下会反应", "技术人员开发高端耐腐蚀镀铝钢板——铝能形成致密氧化膜"], "exp": "选项 A，小苏打的主要成分是 NaHCO<sub>3</sub>，NaHCO<sub>3</sub> 既可与膨松剂中的酸反应，又可受热分解生成 CO<sub>2</sub>，与 Na<sub>2</sub>CO<sub>3</sub> 可与酸反应没有关联。选项 B，用熟石灰处理酸性废水，是因为熟石灰具有碱性，可与酸反应。选项 C，熔融钢水是高温下的液态铁，模具在注入熔融钢水前需要干燥，是为了防止铁与 H<sub>2</sub>O 在高温下发生反应 3Fe+4H<sub>2</sub>O(g)=Fe<sub>3</sub>O<sub>4</sub>+4H<sub>2</sub>（高温）。选项 D，镀铝钢板耐腐蚀，是因为铝的表面能形成致密氧化铝薄膜，将钢板与空气中的 H<sub>2</sub>O、O<sub>2</sub>、CO<sub>2</sub> 等物质隔绝开，阻止化学腐蚀和电化学腐蚀的发生；若镀层破损，镀层铝与钢板在潮湿空气中构成原电池，铝为负极，仍能防止钢板腐蚀（牺牲阳极法）。"}, {"id": 5, "src": "2021 广东 4", "ans": "B", "stem": "化学创造美好生活。下列生产活动中，没有运用相应化学原理的是", "opts": ["利用海水制取溴和镁单质——Br<sup>−</sup> 可被氧化、Mg<sup>2+</sup> 可被还原", "用聚乙烯塑料制作食品保鲜膜——聚乙烯燃烧生成 CO<sub>2</sub> 和 H<sub>2</sub>O", "利用氢氟酸刻蚀石英制作艺术品——氢氟酸可与 SiO<sub>2</sub> 反应", "公园的钢铁护栏涂刷多彩防锈漆——钢铁与潮湿空气隔绝可防止腐蚀"], "exp": "选项 A，从海水提溴是用氯气氧化海水中 Br<sup>−</sup>，使 Br<sup>−</sup> 氧化成 Br<sub>2</sub>，然后用空气或水蒸气吹出；从海水提镁时，将海水抽入反应槽，加入石灰乳，使海水中的 Mg<sup>2+</sup> 转变成氢氧化镁，进一步加盐酸转化为 MgCl<sub>2</sub> 溶液，电解熔融 MgCl<sub>2</sub> 得到 Mg，Mg<sup>2+</sup> 被还原为 Mg。选项 B，用聚乙烯塑料制作食品保鲜膜是因为其性质稳定且无毒，能延长食品的保鲜期，与聚乙烯燃烧生成 CO<sub>2</sub> 和 H<sub>2</sub>O 无关。选项 C，氢氟酸是一种弱酸，具有极强的腐蚀性，能腐蚀金属、玻璃、石英，氢氟酸可与 SiO<sub>2</sub> 发生反应 4HF+SiO<sub>2</sub>=SiF<sub>4</sub>↑+2H<sub>2</sub>O。选项 D，在潮湿的空气里，钢铁表面会形成一层薄水膜，空气中的 CO<sub>2</sub>、SO<sub>2</sub> 等物质溶解在其中形成电解质溶液，并与钢铁中的铁和少量单质碳构成原电池，发生电化学腐蚀，涂刷多彩防锈漆隔绝空气可防止钢铁发生电化学腐蚀。"}, {"id": 6, "src": "2021 广东适应性 7", "ans": "B", "stem": "“人世间一切幸福都需要靠辛勤的劳动来创造”。下列劳动项目与所涉及的化学知识不相符的是", "opts": ["使用草木灰对蔬菜施肥——草木灰属于钾肥", "使用 84 消毒液对衣物消毒——NaClO 具有漂白性", "实验后，清洗仪器、处理废液、打扫卫生——废液随意排放会造成污染", "将浓硫酸放入分类储存、专人保管的安全柜中——浓硫酸具有强腐蚀性"], "exp": "选项 A，草木灰主要成分为 K<sub>2</sub>CO<sub>3</sub>，是一种常见肥料，含有钾元素，因此属于钾肥。选项 B，84 消毒液是一种常见的杀菌消毒剂，有效成分为 NaClO，其消毒原理是 NaClO 水解生成的 HClO 具有强氧化性，而不是漂白性。选项 C，实验后为了防止实验中产生的三废（废气、废液、废渣）对环境的污染，应清洗实验仪器，将废液进行专门回收处理。选项 D，浓硫酸属于强腐蚀药品，化学性质活泼，应该分类储存并专人保管。"}, {"id": 7, "src": "2025 安徽 3", "ans": "B", "stem": "用下列化学知识解释对应劳动项目不合理的是", "opts": ["用大米制麦芽糖——淀粉水解生成麦芽糖", "用次氯酸钠溶液消毒——次氯酸钠溶液呈碱性", "给小麦施氮肥——氮是小麦合成蛋白质的必需元素", "用肥皂洗涤油污——肥皂中的高级脂肪酸钠含有亲水基和疏水基"], "exp": "选项 A，淀粉在酸性或酶催化下水解生成麦芽糖，用大米制麦芽糖符合该过程。选项 B，次氯酸钠的消毒原理是 NaClO 水解生成的 HClO 具有强氧化性，与溶液呈碱性无关。选项 C，氮元素是植物合成蛋白质、叶绿素等的必需元素，故给小麦施氮肥。选项 D，肥皂中的高级脂肪酸钠含亲水基（羧酸根）和疏水基（长链烷基），当肥皂与油污接触，疏水基的一端溶入油污中，亲水基的一端溶入水中，油滴颗粒被一层亲水基团包围而不能彼此结合，发生乳化作用，达到去污作用。"}, {"id": 8, "src": "2024 贵州 3", "ans": "A", "stem": "厨房中处处有化学。下列说法错误的是", "opts": ["清洗餐具时用洗洁精去除油污——洗洁精中的表面活性剂可使油污水解为水溶性物质", "炒菜时不宜将油加热至冒烟——油脂在高温下容易生成对身体有害的稠环化合物", "长期暴露在空气中的食盐变成了糊状——食盐中常含有容易潮解的 MgCl<sub>2</sub>", "久煮的鸡蛋蛋黄表面常呈灰绿色——蛋白中硫元素与蛋黄中铁元素生成的 FeS 和蛋黄混合呈灰绿色"], "exp": "选项 A，洗洁精中的表面活性剂是分子中既有亲水基又有亲油基的化合物，当表面活性剂接触油污时，亲油基与油脂相互作用，发生乳化作用，达到去污作用，洗洁精去除油污不是使油污水解成为水溶性物质。选项 B，炒菜时不宜将油加热至冒烟，主要是油脂在高温下容易生成对身体有害的稠环化合物。选项 C，长期暴露在空气中的食盐变成了糊状，因为食盐中常含有容易潮解的 MgCl<sub>2</sub>。选项 D，久煮的鸡蛋蛋黄表面常呈灰绿色，是由于蛋白中硫元素与蛋黄中铁元素生成的 FeS 和蛋黄混合呈灰绿色。"}, {"id": 9, "src": "2024 安徽 3", "ans": "A", "stem": "青少年帮厨既可培养劳动习惯，也能将化学知识应用于实践。下列有关解释合理的是", "opts": ["清洗铁锅后及时擦干，能减缓铁锅因发生吸氧腐蚀而生锈", "烹煮食物的后期加入食盐，能避免 NaCl 长时间受热而分解", "将白糖熬制成焦糖汁，利用蔗糖高温下充分炭化为食物增色", "制作面点时加入食用纯碱，利用 NaHCO<sub>3</sub> 中和发酵过程产生的酸"], "exp": "选项 A，铁发生吸氧腐蚀时，正极上 O<sub>2</sub> 得电子结合水生成 OH<sup>−</sup>，清洗铁锅后及时擦干，除去了铁锅表面的水分，没有电解质溶液，无法形成原电池，可以减缓铁锅因发生吸氧腐蚀而生锈。选项 B，食盐中含有 KIO<sub>3</sub>，KIO<sub>3</sub> 受热易分解，因此烹煮食物时应在后期加入食盐，与 NaCl 无关。选项 C，将白糖熬制成焦糖汁，是蔗糖经过复杂的分解、脱水等过程得到的，蔗糖在高温下并未炭化。选项 D，食用纯碱主要成分为 Na<sub>2</sub>CO<sub>3</sub>，制作面点时加入食用纯碱，利用 Na<sub>2</sub>CO<sub>3</sub> 中和发酵过程产生的酸。"}, {"id": 10, "src": "2024 黑吉辽蒙 5", "ans": "B", "stem": "家务劳动中蕴含着丰富的化学知识。下列相关解释错误的是", "opts": ["用过碳酸钠漂白衣物：Na<sub>2</sub>CO<sub>4</sub> 具有较强氧化性", "酿米酒需晾凉米饭后加酒曲：乙醇受热易挥发", "用柠檬酸去除水垢：柠檬酸酸性强于碳酸的", "用碱液清洗厨房油污：油脂可碱性水解"], "exp": "选项 A，过氧碳酸钠中过氧键有较强氧化性，可以漂白衣物。选项 B，酒曲中含大量酵母菌等微生物酶，酶将米饭中的淀粉分解成葡萄糖，葡萄糖进一步转化为乙醇（酒精）；若米饭不晾凉，高温会使酵母菌失去活性，与乙醇受热易挥发无关。选项 C，柠檬酸酸性强于碳酸的，可以将水垢中的碳酸钙分解为可溶性的钙离子，用于除水垢。选项 D，油脂可以在碱性条件下水解成易溶于水的甘油和高级脂肪酸盐，用碱液可清洗厨房油污。"}, {"id": 11, "src": "2023 广州二测 3", "ans": "A", "stem": "劳动开创未来。下列劳动项目与所述的化学知识没有关联的是", "opts": ["利用工业合成氨实现人工固氮——N<sub>2</sub> 具有还原性", "用石灰乳除去烟气中的 SO<sub>2</sub>——SO<sub>2</sub> 是酸性氧化物", "将锌块镶嵌在轮船底部防腐——锌的金属性比铁的强", "用 HNO<sub>3</sub> 除去试管中的银镜——HNO<sub>3</sub> 具有强氧化性"], "exp": "选项 A，工业合成氨是用 N<sub>2</sub> 和 H<sub>2</sub> 反应生成 NH<sub>3</sub>，N 元素化合价降低，体现了 N<sub>2</sub> 的氧化性，与 N<sub>2</sub> 具有还原性没有关联。选项 B，石灰乳是 Ca(OH)<sub>2</sub> 的悬浊液，用石灰乳除去烟气中的 SO<sub>2</sub>，SO<sub>2</sub> 与碱 Ca(OH)<sub>2</sub> 反应生成盐 CaSO<sub>3</sub> 和水，体现 SO<sub>2</sub> 是酸性氧化物的性质。选项 C，将锌块镶嵌在轮船底部，锌、铁在海水中构成原电池，锌比铁更活泼，锌作负极被腐蚀，铁作正极，腐蚀速率减慢，铁被保护，属于牺牲阳极保护法，与锌的金属性比铁的强有关联。选项 D，用 HNO<sub>3</sub> 除去试管中的 Ag，发生反应 3Ag+4HNO<sub>3</sub>=3AgNO<sub>3</sub>+NO↑+2H<sub>2</sub>O，体现了 HNO<sub>3</sub> 的强氧化性。"}, {"id": 12, "src": "2024 广州调研 6", "ans": "A", "stem": "下列劳动项目与所述的化学知识没有关联的是", "opts": ["焙制蛋糕加入小苏打作膨松剂——Na<sub>2</sub>CO<sub>3</sub> 可与酸反应", "用 84 消毒液清洁家居用品——含氯消毒剂具有氧化性", "用聚乳酸吸管代替传统塑料吸管——聚乳酸在自然界易降解", "喷洒波尔多液防治农作物病害——重金属离子可使蛋白质变性"], "exp": "选项 A，小苏打（NaHCO<sub>3</sub>）加热放出 CO<sub>2</sub>，能使蛋糕变得疏松，故小苏打能用来制作蛋糕，与 Na<sub>2</sub>CO<sub>3</sub> 可与酸反应没有关联。选项 B，84 消毒液中的 NaClO 具有氧化性，能对家居用品进行消毒。选项 C，聚乳酸在自然界可生物降解，传统塑料吸管不可降解，用聚乳酸吸管代替传统塑料吸管，能起到保护环境的作用。选项 D，波尔多液主要成分为石灰乳和 CuSO<sub>4</sub> 溶液，Cu<sup>2+</sup> 可使蛋白质变性。"}, {"id": 13, "src": "2024 广州一测 10", "ans": "C", "stem": "下列劳动项目与所述的化学知识没有关联的是", "opts": ["用硫酸亚铁处理污水——Fe(OH)<sub>3</sub> 胶体具有吸附性", "用干燥的模具盛装熔融钢水——铁与 H<sub>2</sub>O 高温下会反应", "用 FeCl<sub>3</sub> 溶液刻蚀铜质电路板——Fe 能从含 Cu<sup>2+</sup> 的溶液中置换出铜", "用防锈漆涂刷钢铁护栏——钢铁与潮湿空气隔绝可防止发生电化学腐蚀"], "exp": "选项 A，FeSO<sub>4</sub> 溶于水后，Fe<sup>2+</sup> 被氧化为 Fe<sup>3+</sup>，Fe<sup>3+</sup> 发生水解反应形成 Fe(OH)<sub>3</sub> 胶体，能吸附水中的悬浮杂质使之沉降。选项 B，铁高温下与水蒸气反应为 3Fe+4H<sub>2</sub>O(g)=Fe<sub>3</sub>O<sub>4</sub>+4H<sub>2</sub>（高温），因此熔融钢水要用干燥的模具盛装。选项 C，FeCl<sub>3</sub> 溶液可刻蚀铜电路板是因为 Fe<sup>3+</sup> 与 Cu 发生氧化还原反应 2Fe<sup>3+</sup>+Cu=2Fe<sup>2+</sup>+Cu<sup>2+</sup>，该反应说明 Fe<sup>3+</sup> 的氧化性强于 Cu<sup>2+</sup> 的，这与 Fe 能从含 Cu<sup>2+</sup> 溶液中置换出铜无关。选项 D，在潮湿的空气里，钢铁的表面会形成薄层水膜，空气中的 CO<sub>2</sub>、SO<sub>2</sub> 等物质溶解在其中形成电解质溶液，并与钢铁中的铁和少量单质碳构成原电池，发生电化学腐蚀；用防锈漆涂刷钢铁护栏隔绝空气可防止钢铁发生电化学腐蚀。"}, {"id": 14, "src": "2024 广州二测 4", "ans": "A", "stem": "下列劳动项目与所述的化学知识没有关联的是", "opts": ["用氢氟酸刻蚀玻璃器皿——氢氟酸是弱酸", "用草木灰对农作物施肥——草木灰含有钾元素", "利用铝热反应焊接钢轨——高温下铝能还原氧化铁", "将锌块镶嵌在轮船底部防腐——锌的金属性比铁的强"], "exp": "选项 A，氢氟酸刻蚀玻璃时发生反应 4HF+SiO<sub>2</sub>=SiF<sub>4</sub>↑+2H<sub>2</sub>O，与 HF 是弱酸无关。选项 B，草木灰的主要成分是碳酸钾，含有钾元素。选项 C，焊接钢轨时发生反应 4Al+2Fe<sub>2</sub>O<sub>3</sub>=4Fe+2Al<sub>2</sub>O<sub>3</sub>（高温），利用 Al 的还原性。选项 D，锌块与轮船底部的钢铁以及海水构成原电池，锌的活泼性强于铁的，锌作负极被消耗，从而保护铁不被氧化，达到防腐蚀的效果。"}, {"id": 15, "src": "2025 广州调研 8", "ans": "B", "stem": "下列劳动项目与所述化学知识没有关联的是", "opts": ["用浓溴水测定废水中苯酚含量——苯酚与 Br<sub>2</sub> 能发生取代反应", "用覆铜板和 FeCl<sub>3</sub> 溶液制作印刷电路板——FeCl<sub>3</sub> 水解呈酸性", "使用聚乳酸制造的包装材料——聚乳酸在自然界可生物降解", "将活性炭用于废水脱色剂——活性炭具有吸附性"], "exp": "选项 A，苯酚能与浓溴水发生取代反应，生成白色沉淀 2,4,6-三溴苯酚，苯酚与溴的反应很灵敏，可用于苯酚的定性检验和定量测定。选项 B，用覆铜板和 FeCl<sub>3</sub> 溶液制作印刷电路板，FeCl<sub>3</sub> 溶液作腐蚀液，发生反应为 2Fe<sup>3+</sup>+Cu=2Fe<sup>2+</sup>+Cu<sup>2+</sup>，该反应为氧化还原反应，FeCl<sub>3</sub> 是氧化剂，与 FeCl<sub>3</sub> 水解呈酸性无关。选项 C，聚乳酸是微生物可降解的高分子材料，利用聚乳酸制作包装材料，使用后可被降解，有利于保护环境。选项 D，活性炭具有吸附性，可以吸附色素分子，用于脱去废水颜色。"}, {"id": 16, "src": "2025 广州一测 4", "ans": "A", "stem": "下列劳动项目与所述的化学知识有关联的是", "opts": ["用硫酸铝处理污水——Al(OH)<sub>3</sub> 胶体具有吸附性", "用油脂为原料制肥皂——甘油具有水溶性", "用小苏打作发泡剂烘焙面包——碳酸氢钠溶于水吸热", "用乳酸制作聚乳酸可降解塑料——聚乳酸燃烧生成 CO<sub>2</sub> 和 H<sub>2</sub>O"], "exp": "选项 A，硫酸铝溶于水后电离出 Al<sup>3+</sup>，Al<sup>3+</sup> 水解生成 Al(OH)<sub>3</sub> 胶体，胶体表面积较大，具有吸附性，能吸附水中细小的悬浮物等，将其聚集成较大的颗粒并沉降，从而达到净水的目的。选项 B，工业上用油脂与 NaOH 溶液共热水解成肥皂和甘油，油脂的主要成分是高级脂肪酸甘油酯，肥皂的主要成分是高级脂肪酸钠，加入食盐使肥皂析出，与甘油分离，与甘油具有水溶性无关。选项 C，小苏打是 NaHCO<sub>3</sub>，在面包烘焙过程中 NaHCO<sub>3</sub> 受热分解产生 CO<sub>2</sub>，NaHCO<sub>3</sub> 也会与面包发酵产生的酸性物质反应释放 CO<sub>2</sub>，从而使面包变得蓬松，与碳酸氢钠溶于水吸热无关。选项 D，乳酸分子中含有羟基和羧基，能发生缩聚反应生成聚乳酸，聚乳酸中含有酯基，能在催化剂作用下水解生成小分子，从而达到降解的目的，因此聚乳酸属于可降解塑料，与聚乳酸燃烧生成 CO<sub>2</sub> 和 H<sub>2</sub>O 无关。"}, {"id": 17, "src": "2025 广州二测 6", "ans": "A", "stem": "“光荣属于劳动者，幸福属于劳动者。”下列劳动项目与所述化学知识没有关联的是", "opts": ["用 Na<sub>2</sub>S 除去废水中 Hg<sup>2+</sup>——Na<sub>2</sub>S 具有还原性", "将模具干燥后再注入熔融钢水——铁与水高温下会反应", "喷洒波尔多液防治农作物病虫害——Cu<sup>2+</sup> 可使蛋白质变性", "船舶外壳安装锌块防锈蚀——锌的金属性比铁的强"], "exp": "选项 A，工厂废水、实验室废液中的汞必须处理，否则会污染河流。Na<sub>2</sub>S 与废水中的 Hg<sup>2+</sup> 形成难溶于水的黑色固体 HgS，发生反应为 Hg<sup>2+</sup>+S<sup>2−</sup>=HgS↓，HgS 几乎不溶于水，从而达到除去废水中 Hg<sup>2+</sup> 的目的，这与 Na<sub>2</sub>S 具有还原性无关。选项 B，将模具干燥后再注入熔融钢水的主要原因为水遇红热的铁会迅速气化为水蒸气，反应为 3Fe+4H<sub>2</sub>O(g)=Fe<sub>3</sub>O<sub>4</sub>+4H<sub>2</sub>（高温）。选项 C，在农业上使用 CuSO<sub>4</sub> 溶液、生石灰和水配制波尔多液来防治农作物病虫害，Cu<sup>2+</sup> 会使细菌、病毒等的蛋白质发生变性，失去生理活性。选项 D，船舶（钢铁制品）在河水或海水中发生吸氧腐蚀，在船舶的外壳安装锌块后，锌比铁活泼，锌块会成为新构成的原电池中的负极，不断遭受腐蚀，作为正极的钢铁船舶就被保护起来。"}, {"id": 18, "src": "2026 广州调研 5", "ans": "D", "stem": "劳动创造美好生活。下列对劳动项目涉及的相关化学知识表述错误的是", "opts": ["用覆铜板和 FeCl<sub>3</sub> 溶液制作印刷电路板——氧化性：Fe<sup>3+</sup>＞Cu<sup>2+</sup>", "用滴定法测定自来水中 Cl<sup>−</sup> 含量——Ag<sup>+</sup>+Cl<sup>−</sup>=AgCl↓", "用明矾处理浑浊的河水——Al(OH)<sub>3</sub> 胶体具有吸附性", "用乙二醇生产汽车防冻液——乙二醇燃烧生成 CO<sub>2</sub> 和 H<sub>2</sub>O"], "exp": "选项 A，FeCl<sub>3</sub> 溶液可刻蚀铜电路板是因为 Fe<sup>3+</sup> 与 Cu 发生氧化还原反应，化学方程式为 2Fe<sup>3+</sup>+Cu=2Fe<sup>2+</sup>+Cu<sup>2+</sup>，反应可以说明 Fe<sup>3+</sup> 的氧化性强于 Cu<sup>2+</sup> 的。选项 B，用滴定法测水中 Cl<sup>−</sup> 含量利用了 Ag<sup>+</sup> 和 Cl<sup>−</sup> 生成 AgCl 沉淀，通过测 AgCl 沉淀的量从而测定水中 Cl<sup>−</sup> 的含量。选项 C，使用明矾处理浑浊的河水是因为 Al<sup>3+</sup> 发生水解反应生成 Al(OH)<sub>3</sub> 胶体，Al(OH)<sub>3</sub> 胶体具有较大的表面积，能吸附水中的悬浮杂质使之沉降。选项 D，乙二醇的防冻作用源于其高沸点和低冰点，与水的混合液能降低凝固点，与其可燃性无关。"}, {"id": 19, "src": "2026 广州一测 4", "ans": "A", "stem": "劳动创造美好生活。下列对劳动项目涉及的相关化学知识表述错误的是", "opts": ["用氢氧化铝生产抗胃酸药——2Al(OH)<sub>3</sub>=Al<sub>2</sub>O<sub>3</sub>+3H<sub>2</sub>O（加热）", "用次氯酸钠溶液对衣物消毒——含氯消毒剂具有氧化性", "用淀粉生产葡萄糖——淀粉水解可得到葡萄糖", "用油脂和 NaOH 溶液制备肥皂——油脂在碱性条件下发生水解反应"], "exp": "选项 A，用氢氧化铝生产抗胃酸药是因为氢氧化铝和人体胃液中含有的盐酸反应，反应的化学方程式为 Al(OH)<sub>3</sub>+3HCl=AlCl<sub>3</sub>+3H<sub>2</sub>O，与受热分解无关。选项 B，用次氯酸钠溶液对衣物消毒，次氯酸钠在作用过程中可产生次氯酸，具有强氧化性，可杀菌消毒。选项 C，用淀粉生产葡萄糖，淀粉完全水解可生成葡萄糖。选项 D，油脂在碱性条件下的水解反应也称为皂化反应，用于制肥皂。"}, {"id": 20, "src": "2026 广州二测 4", "ans": "C", "stem": "劳动创造美好生活。下列劳动项目与所述化学知识没有关联的是", "opts": ["用大米酿食醋——酿醋过程存在转化关系：乙醇→乙酸", "用聚丙烯酸钠生产高吸水性树脂——聚丙烯酸钠含有强亲水基团", "用小苏打作糕点的膨松剂——Na<sub>2</sub>CO<sub>3</sub>+CO<sub>2</sub>+H<sub>2</sub>O=2NaHCO<sub>3</sub>", "用 FeS 除去废水中的 Hg<sup>2+</sup>——FeS(s)+Hg<sup>2+</sup>(aq)⇌HgS(s)+Fe<sup>2+</sup>(aq)"], "exp": "选项 A，用大米酿食醋的过程主要涉及：大米的主要成分淀粉在淀粉酶的作用下发生水解反应，水解的最终产物是葡萄糖，葡萄糖又在催化剂作用下分解得到乙醇和 CO<sub>2</sub>，乙醇再经氧化得乙酸。选项 B，丙烯酸钠在一定条件下发生聚合，可得到聚丙烯酸钠高吸水性树脂，聚丙烯酸钠具有高吸水性，是因为其分子中含有强亲水基 -COONa。选项 C，小苏打的主要成分是 NaHCO<sub>3</sub>，小苏打用作制作糕点的膨松剂是因为 NaHCO<sub>3</sub> 受热易分解生成 CO<sub>2</sub>，NaHCO<sub>3</sub> 还能与糕点发酵生成的酸性物质反应生成 CO<sub>2</sub>，从而起到膨松剂的作用，用小苏打作糕点的膨松剂与反应 Na<sub>2</sub>CO<sub>3</sub>+CO<sub>2</sub>+H<sub>2</sub>O=2NaHCO<sub>3</sub> 没有关联。选项 D，由于 HgS 的溶度积远小于 FeS 的，易发生沉淀的转化，因此可用 FeS 除去废水中的 Hg<sup>2+</sup>，发生反应的离子方程式为 FeS(s)+Hg<sup>2+</sup>(aq)⇌HgS(s)+Fe<sup>2+</sup>(aq)。"}];
var KEY = 'xz6_state', TKEY = 'xz_theme', NKEY = 'xz_name';
var N = QS.length, PER = 2;
var st = {a:{}, skip:{}, help:{}, fold:{}, elapsed:0, started:false};
function $(id){return document.getElementById(id)}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s){st.a=s.a||{};st.skip=s.skip||{};st.help=s.help||{};st.fold=s.fold||{};st.elapsed=s.elapsed||0;st.started=!!s.started}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function fmt(s){s=Math.floor(s);return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2)}
/* ===== 小玉/小岩 立绘与语音（素材与模式复用自 walk 模块） ===== */
var FACE_VER='?v=20261117';
var YU_BASE='../assets/xiaoyu/xiaoyu_', YAN_BASE='../assets/xiaoyan/xiaoyan_';
var curAudio=null, faceTimers={};
function setFace(fid,base,name,hold){
  var img=$(fid);if(!img)return;
  img.src=base+name+'.webp'+FACE_VER;
  if(faceTimers[fid])clearTimeout(faceTimers[fid]);
  if(name!=='idle'){faceTimers[fid]=setTimeout(function(){setFace(fid,base,'idle')},hold||2600)}
}
function playVoice(src){
  try{if(curAudio){curAudio.pause();curAudio=null}}catch(e){}
  try{
    var a=new Audio(src);
    curAudio=a;
    a.onerror=function(){if(curAudio===a)curAudio=null};
    a.play().catch(function(){});
  }catch(e){}
}
function calc(){
  var ok=0;
  QS.forEach(function(q){if(st.a[q.id]===q.ans&&st.help[q.id]!=='rock')ok++});
  var done=Object.keys(st.a).length;
  return {done:done,ok:ok,score:ok*PER};
}
function renderStats(){
  var c=calc();
  $('sProg').textContent=c.done;$('sScore').textContent=c.score;$('sOk').textContent=c.ok;$('sTime').textContent=fmt(st.elapsed);
}
function setSkip(id,on){
  var act=$('act'+id),tip=$('skd'+id),ob=$('op'+id);
  act.style.display=on?'none':'flex';
  $('hl'+id).style.display=on?'none':'flex';
  if(on){var jb=$('jbx'+id),rb=$('rbx'+id);if(jb)jb.style.display='none';if(rb)rb.style.display='none';}
  tip.style.display=on?'block':'none';
  Array.prototype.forEach.call(ob.children,function(b){b.disabled=on||!!st.a[id]});
  $('qc'+id).classList.toggle('skipped-card',on);
}
function build(){
  var box=$('qlist');
  QS.forEach(function(q,i){
    var d=document.createElement('div');d.className='qcard';d.id='qc'+q.id;
    var h='<div class="qmeta"><span class="qno">第 '+(i+1)+' 题</span><span class="qpt">'+PER+' 分</span><span class="qsrc">'+q.src+'</span><span class="qmark" id="qm'+q.id+'"></span></div>';
    h+='<div class="stem">'+q.stem+'</div>';
    if(q.figs){q.figs.forEach(function(f){h+='<div class="qfig"><img src="'+f+'" alt="题图"></div>'})}
    h+='<div id="op'+q.id+'"></div>';
    h+='<div class="btn-row" id="act'+q.id+'"><button class="submit" id="sb'+q.id+'" disabled>提交本题</button><button class="skipbtn" id="sk'+q.id+'">跳过此题</button></div>';
    h+='<div class="helprow" id="hl'+q.id+'">';
    if(q.hint){h+='<button class="jade" id="jd'+q.id+'">🙋 求助小玉 · 思路点拨</button>';}
    h+='<button class="rock" id="rk'+q.id+'">📖 求助小岩 · 看详解本题计0分</button></div>';
    h+='<div class="helpbox jadebox" id="jbx'+q.id+'"><div class="hb-face"><img id="jf'+q.id+'" src="../assets/xiaoyu/xiaoyu_idle.webp'+FACE_VER+'" alt="小玉"><div class="hn">小玉</div></div><div class="hb-main"><div class="ht"><span>🙋 小玉点拨 · 不扣分，自己接着想</span><button class="hb-close" id="jcx'+q.id+'">收起 ▲</button></div><p>'+(q.hint||'')+'</p></div></div>';
    h+='<div class="helpbox rockbox" id="rbx'+q.id+'"><div class="hb-face"><img id="rf'+q.id+'" src="../assets/xiaoyan/xiaoyan_idle.webp'+FACE_VER+'" alt="小岩"><div class="hn">小岩</div></div><div class="hb-main"><div class="ht"><span>📖 小岩详解 · 本题已计 0 分</span><button class="hb-close" id="rcx'+q.id+'">收起 ▲</button></div><p>'+q.exp+'</p></div></div>';
    h+='<div class="skipped-tip" id="skd'+q.id+'">已跳过（不计入统计）<button class="undoskip" id="us'+q.id+'">撤销跳过</button></div>';
    h+='<div class="verdict" id="vd'+q.id+'"></div>';
    h+='<div class="exp" id="ex'+q.id+'"><div class="et">答案 '+q.ans+' · 题析</div><p>'+q.exp+'</p></div>';
    h+='<button class="next" id="nx'+q.id+'">'+(i<N-1?'下一题 →':'返回顶部生成成绩卡')+'</button>';
    d.innerHTML=h;box.appendChild(d);
    var picked=null,done=!!st.a[q.id],skipped=!!st.skip[q.id];
    var ob=$('op'+q.id);
    q.opts.forEach(function(o,j){
      var L='ABCD'[j],b=document.createElement('button');
      b.className='opt';b.innerHTML='<span class="ol">'+L+'．</span><span>'+o+'</span>';
      b.onclick=function(){
        if(done||skipped)return;
        if(!st.started){st.started=true}
        picked=L;
        Array.prototype.forEach.call(ob.children,function(c){c.classList.remove('sel')});
        b.classList.add('sel');
        $('sb'+q.id).disabled=false;
      };
      ob.appendChild(b);
    });
    if(done){
      var pick=st.a[q.id],ok=pick===q.ans;
      paintResult(q,ob,pick,ok);
      if(st.help[q.id]==='rock'&&!st.fold[q.id]){
        $('rbx'+q.id).style.display='flex';
        $('hl'+q.id).style.display='none';
        $('qm'+q.id).textContent='📖';
        $('qm'+q.id).style.color='#f59e0b';
      }else{
        $('ex'+q.id).style.display='block';
        $('hl'+q.id).style.display='none';
        $('qm'+q.id).textContent=(st.help[q.id]==='rock')?'📖':(ok?'✓':'✗');
        $('qm'+q.id).style.color=(st.help[q.id]==='rock')?'#f59e0b':(ok?'var(--ok)':'var(--bad)');
      }
      $('act'+q.id).style.display='none';
    }else if(skipped){
      setSkip(q.id,true);
    }else if(st.help[q.id]&&!st.fold[q.id]){
      $(st.help[q.id]==='rock'?'rbx'+q.id:'jbx'+q.id).style.display='flex';
      var hb=$(st.help[q.id]==='rock'?'rk'+q.id:'jd'+q.id);
      if(hb)hb.style.opacity=.5;
    }
    $('sb'+q.id).onclick=function(){
      if(picked===null||done||skipped)return;
      done=true;
      var ok=picked===q.ans;
      var rock=st.help[q.id]==='rock';
      st.a[q.id]=picked;
      paintResult(q,ob,picked,ok);
      var v=$('vd'+q.id);
      v.style.display='block';
      v.style.background=rock?'rgba(245,158,11,.09)':(ok?'var(--ok-bg)':'var(--bad-bg)');
      v.style.color=rock?'#f59e0b':(ok?'var(--ok-ink)':'var(--bad-ink)');
      v.textContent=rock?'已求助小岩 · 本题计 0 分（正确答案 '+q.ans+'）':(ok?'回答正确 +'+PER+' 分':'回答错误 · 正确答案 '+q.ans);
      $('qm'+q.id).textContent=rock?'📖':(ok?'✓':'✗');
      $('qm'+q.id).style.color=rock?'#f59e0b':(ok?'var(--ok)':'var(--bad)');
      if(rock){$('rbx'+q.id).style.display='flex';$('hl'+q.id).style.display='none';}
      else{$('ex'+q.id).style.display='block';$('hl'+q.id).style.display='none';}
      $('act'+q.id).style.display='none';
      Array.prototype.forEach.call(ob.children,function(b){b.disabled=true});
      renderStats();save();
    };
    if($('jd'+q.id)){$('jd'+q.id).onclick=function(){
      if(done||skipped)return;
      st.help[q.id]='jade';delete st.fold[q.id];
      if(!st.started){st.started=true}
      $('jbx'+q.id).style.display='flex';
      $('jd'+q.id).style.opacity=.5;
      setFace('jf'+q.id,YU_BASE,'think',2400);
      setTimeout(function(){if(st.help[q.id]==='jade')setFace('jf'+q.id,YU_BASE,'encourage',2600)},2700);
      playVoice('../assets/xz/audio/k6/h'+q.id+'.mp3');
      save();
    };}
    $('rk'+q.id).onclick=function(){
      if(done||skipped)return;
      if(!confirm('看小岩详解后，本题将计 0 分（即使答对）。确定求助吗？'))return;
      st.help[q.id]='rock';delete st.fold[q.id];
      if(!st.started){st.started=true}
      $('rbx'+q.id).style.display='flex';
      $('rk'+q.id).style.opacity=.5;
      setFace('rf'+q.id,YAN_BASE,'write',2400);
      setTimeout(function(){if(st.help[q.id]==='rock')setFace('rf'+q.id,YAN_BASE,'think',2600)},2700);
      playVoice('../assets/xz/audio/xiaoyan_hi.mp3');
      renderStats();save();
    };
    $('jcx'+q.id).onclick=function(){st.fold[q.id]=1;$('jbx'+q.id).style.display='none';save()};
    $('rcx'+q.id).onclick=function(){
      st.fold[q.id]=1;save();
      $('rbx'+q.id).style.display='none';
      if(done){$('ex'+q.id).style.display='block'}
    };
    $('sk'+q.id).onclick=function(){
      if(done||skipped)return;
      skipped=true;st.skip[q.id]=1;
      if(!st.started){st.started=true}
      setSkip(q.id,true);save();
    };
    $('us'+q.id).onclick=function(){
      if(!skipped)return;
      skipped=false;delete st.skip[q.id];
      setSkip(q.id,false);save();
    };
    $('nx'+q.id).onclick=function(){
      if(i<N-1){var n=QS[i+1];var el=document.getElementById('qc'+n.id);el.scrollIntoView({behavior:'smooth',block:'start'})}
      else{window.scrollTo({top:0,behavior:'smooth'})}
    };
  });
}
function paintResult(q,ob,pick,ok){
  Array.prototype.forEach.call(ob.children,function(c,j){
    var L='ABCD'[j];c.disabled=true;
    if(L===q.ans)c.classList.add('rgt');
    else if(L===pick)c.classList.add('wrg');
  });
}
var timer=setInterval(function(){
  var c=calc();
  if(st.started&&c.done<N){st.elapsed++;renderStats();if(st.elapsed%5===0)save()}
},1000);
function pad(n){return ('0'+n).slice(-2)}
function showCard(){
  $('result').style.display='block';
  $('stuName').value=localStorage.getItem(NKEY)||'';
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
}
$('btnCard').onclick=function(){showCard()};
$('btnGen').onclick=function(){
  var name=$('stuName').value.trim()||'同学';
  try{localStorage.setItem(NKEY,name)}catch(e){}
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
};
$('btnClose').onclick=function(){
  $('result').style.display='none';
  var first=QS.find(function(q){return !st.a[q.id]&&!st.skip[q.id]});
  var el=first?document.getElementById('qc'+first.id):$('qlist');
  el.scrollIntoView({behavior:'smooth',block:'start'});
};
function drawCard(){
  var c=document.getElementById('canvas'),x=c.getContext('2d'),W=c.width,H=c.height;
  var g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0f172a');g.addColorStop(.55,'#152743');g.addColorStop(1,'#1b1140');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(34,211,238,.08)';x.beginPath();x.arc(W-60,60,150,0,7);x.fill();
  x.fillStyle='rgba(167,139,250,.08)';x.beginPath();x.arc(50,H-40,130,0,7);x.fill();
  x.fillStyle='#67e8f9';x.font='500 22px sans-serif';x.fillText('化学不难学 · 高考选择题训练',40,52);
  x.fillStyle='#8ea0b5';x.font='16px sans-serif';x.fillText('考点6 劳动项目与化学知识 · 每题 '+PER+' 分',40,84);
  var name=$('stuName').value.trim()||'同学';
  x.fillStyle='#e2e8f0';x.font='500 26px sans-serif';x.fillText(name,40,150);
  var cc=calc();
  x.fillStyle='#a78bfa';x.font='700 88px sans-serif';x.fillText(cc.score,40,250);
  x.fillStyle='#8ea0b5';x.font='18px sans-serif';x.fillText('分 / 满分 '+(N*PER)+' 分',40+String(cc.score).length*52+14,250);
  var acc=cc.done?Math.round(cc.ok/cc.done*100):0;
  var cells=[['正确率',acc+'%（'+cc.ok+'/'+cc.done+'）'],['完成度',cc.done+' / '+N+' 题'],['做题时长',fmt(st.elapsed)]];
  cells.forEach(function(cell,i){
    var cx=40+i*228;
    x.fillStyle='#1e293b';x.fillRect(cx,280,208,84);
    x.fillStyle='#67e8f9';x.font='14px sans-serif';x.fillText(cell[0],cx+18,310);
    x.fillStyle='#e2e8f0';x.font='500 20px sans-serif';x.fillText(cell[1],cx+18,346);
  });
  var d=new Date();
  var stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('提交时间 '+stamp,40,400);
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('已做题号（绿=自己对 蓝=问小玉 橙=问小岩0分 红=自己错）',40,432);
  var doneList=QS.filter(function(q){return !!st.a[q.id]});
  var jadeN=0,rockN=0;
  doneList.forEach(function(q,i){
    var col=i%14,row=Math.floor(i/14);
    var bx=40+col*48,by=450+row*46;
    var ok=st.a[q.id]===q.ans,h=st.help[q.id];
    var colr=h==='rock'?'#d97706':h==='jade'?'#3b82f6':(ok?'#16a34a':'#dc2626');
    if(h==='rock')rockN++;if(h==='jade')jadeN++;
    x.fillStyle=colr;x.fillRect(bx,by,38,36);
    x.fillStyle='#ffffff';x.font='500 16px sans-serif';x.fillText(String(q.id),bx+9,by+25);
  });
  x.fillStyle='#5b6b7f';x.font='13px sans-serif';
  x.fillText('答对 '+cc.ok+' · 答错 '+(cc.done-cc.ok)+' · 问小玉 '+jadeN+' · 问小岩 '+rockN+' · 未做 '+(N-cc.done)+' · 跳过 '+Object.keys(st.skip).length,40,H-22);
  window.__lastCard={time:stamp,done:cc.done,ok:cc.ok,score:cc.score,elapsed:fmt(st.elapsed),skip:Object.keys(st.skip).length,jade:jadeN,rock:rockN};
}
$('stuName').addEventListener('input',function(){try{localStorage.setItem(NKEY,this.value)}catch(e){}});
$('btnSave').onclick=function(){
  var a=document.createElement('a');
  a.download='选择题训练_考点6_'+(($('stuName').value.trim()||'成绩'))+'.png';
  a.href=$('canvas').toDataURL('image/png');a.click();
};
$('resetBtn').onclick=function(){
  var c=calc();
  if(c.done===0&&Object.keys(st.skip).length===0){alert('本讲还没有答题记录');return}
  if(confirm('确定清空本讲全部记录和成绩卡重新做吗？')){
    localStorage.removeItem(KEY);location.reload();
  }
};
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('themeBtn').textContent=t==='dark'?'☀':'🌙';
  try{localStorage.setItem(TKEY,t)}catch(e){}
}
$('themeBtn').onclick=function(){
  applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
};
applyTheme((function(){try{return localStorage.getItem(TKEY)||'dark'}catch(e){return 'dark'}})());
load();build();renderStats();
</script>
</body>
</html>

<script>
var QS = [{"id": 1, "src": "2026 广东 5", "ans": "C", "heads": ["陈述Ⅰ", "陈述Ⅱ"], "stem": "化学之美在于发现。陈述Ⅰ和陈述Ⅱ均正确但两者间没有关联的是", "opts": ["<b>Ⅰ：</b>光束通过 Fe(OH)<sub>3</sub> 胶体，产生明亮通路<br><b>Ⅱ：</b>胶体粒子对光线有散射作用", "<b>Ⅰ：</b>天然水晶呈现规则外形<br><b>Ⅱ：</b>晶体中原子呈周期性有序排列", "<b>Ⅰ：</b>烟花绽放，焰色五彩缤纷<br><b>Ⅱ：</b>碱金属原子容易失去最外层电子", "<b>Ⅰ：</b>铜丝浸入 AgNO<sub>3</sub> 溶液中可形成美丽银树<br><b>Ⅱ：</b>Cu 的还原性比 Ag 的强"], "exp": "【题析】选项 A，光束通过胶体产生明亮通路是丁达尔效应，其本质原因正是胶体粒子对光线发生散射，陈述Ⅰ和陈述Ⅱ均正确且存在关联。选项 B，天然水晶具有规则几何外形，根本原因是晶体内部微粒呈周期性有序排列，陈述Ⅰ和陈述Ⅱ均正确且存在关联。选项 C，烟花焰色是电子从较高能量的激发态跃迁到较低能量的激发态时释放能量，光是电子跃迁释放能量的重要形式；碱金属原子容易失去最外层电子与焰色无关，两个陈述均正确但无关联。选项 D，Cu 能置换出 AgNO<sub>3</sub> 中的 Ag，说明还原剂的还原性强于还原产物的，即 Cu 的还原性比 Ag 的强，陈述Ⅰ和陈述Ⅱ均正确且存在关联。"}, {"id": 2, "src": "2025 广东 8", "ans": "B", "heads": ["陈述Ⅰ", "陈述Ⅱ"], "stem": "下列陈述Ⅰ与陈述Ⅱ均正确，且两者间具有因果关系的是", "opts": ["<b>Ⅰ：</b>浓硝酸保存在棕色试剂瓶中<br><b>Ⅱ：</b>浓硝酸具有强氧化性", "<b>Ⅰ：</b>向蔗糖中加适量浓硫酸，蔗糖变黑<br><b>Ⅱ：</b>浓硫酸具有脱水性", "<b>Ⅰ：</b>Fe<sup>2+</sup> 与 K<sub>3</sub>[Fe(CN)<sub>6</sub>] 可生成蓝色物质<br><b>Ⅱ：</b>KSCN 溶液可用于检验 Fe<sup>3+</sup>", "<b>Ⅰ：</b>MnO<sub>2</sub> 与浓盐酸共热，生成黄绿色气体<br><b>Ⅱ：</b>Cl<sub>2</sub>+SO<sub>2</sub>+2H<sub>2</sub>O═H<sub>2</sub>SO<sub>4</sub>+2HCl"], "exp": "【题析】选项 A，浓硝酸见光易分解，需保存在棕色试剂瓶中，与浓硝酸具有强氧化性无关，陈述Ⅰ与陈述Ⅱ均正确但不具有因果关系。选项 B，向蔗糖中加适量浓硫酸，蔗糖脱水炭化变黑，体现浓硫酸具有脱水性，陈述Ⅰ和陈述Ⅱ均正确且存在因果关系。选项 C，Fe<sup>2+</sup> 与 K<sub>3</sub>[Fe(CN)<sub>6</sub>] 可生成蓝色沉淀，故可用 K<sub>3</sub>[Fe(CN)<sub>6</sub>] 溶液检验 Fe<sup>2+</sup>，与 KSCN 溶液可用于检验 Fe<sup>3+</sup> 无关，陈述Ⅰ与陈述Ⅱ均正确但不具有因果关系。选项 D，MnO<sub>2</sub> 与浓盐酸共热生成黄绿色气体 Cl<sub>2</sub>，与 Cl<sub>2</sub> 和 SO<sub>2</sub> 的反应无因果关系。"}, {"id": 3, "src": "2024 广东 13", "ans": "B", "heads": ["陈述Ⅰ", "陈述Ⅱ"], "stem": "下列陈述Ⅰ与陈述Ⅱ均正确，且具有因果关系的是", "opts": ["<b>Ⅰ：</b>酸性：CF<sub>3</sub>COOH<CCl<sub>3</sub>COOH<br><b>Ⅱ：</b>电负性：F>Cl", "<b>Ⅰ：</b>某冠醚与 Li<sup>+</sup> 能形成超分子，与 K<sup>+</sup> 则不能<br><b>Ⅱ：</b>Li<sup>+</sup> 与 K<sup>+</sup> 的离子半径不同", "<b>Ⅰ：</b>由氨制硝酸：NH<sub>3</sub>→NO→NO<sub>2</sub>→HNO<sub>3</sub><br><b>Ⅱ：</b>NH<sub>3</sub> 和 NO<sub>2</sub> 均具有氧化性", "<b>Ⅰ：</b>苯酚与甲醛反应，可合成酚醛树脂<br><b>Ⅱ：</b>合成酚醛树脂的反应是加聚反应"], "exp": "【题析】选项 A，电负性为 F>Cl，F 的吸电子能力大于 Cl，则 F—C 的极性大于 Cl—C 的极性，使 F<sub>3</sub>C—C 的极性大于 Cl<sub>3</sub>C—C 的极性，导致 CF<sub>3</sub>COOH 的羧基中羟基的极性更大，更容易电离出 H<sup>+</sup>，酸性为 CF<sub>3</sub>COOH>CCl<sub>3</sub>COOH，故陈述Ⅰ不正确。选项 B，不同冠醚分子有不同大小的空腔适配不同大小的碱金属离子，由于 Li<sup>+</sup> 与 K<sup>+</sup> 的离子半径不同，则某冠醚与 Li<sup>+</sup> 能形成超分子，与 K<sup>+</sup> 则不能，陈述Ⅰ与陈述Ⅱ均正确，且具有因果关系。选项 C，由氨制硝酸过程中，存在 NH<sub>3</sub>→NO→NO<sub>2</sub>→HNO<sub>3</sub>，NH<sub>3</sub> 中氮元素化合价升高，体现还原性，陈述Ⅱ不正确。选项 D，苯酚与甲醛反应可合成酚醛树脂，该反应是缩聚反应，故陈述Ⅱ不正确。"}, {"id": 4, "src": "2023 广东 12", "ans": "A", "heads": ["陈述Ⅰ", "陈述Ⅱ"], "stem": "下列陈述Ⅰ与陈述Ⅱ均正确，且具有因果关系的是", "opts": ["<b>Ⅰ：</b>将浓硫酸加入蔗糖中形成多孔炭<br><b>Ⅱ：</b>浓硫酸具有氧化性和脱水性", "<b>Ⅰ：</b>装有 NO<sub>2</sub> 的密闭烧瓶冷却后颜色变浅<br><b>Ⅱ：</b>NO<sub>2</sub> 转化为 N<sub>2</sub>O<sub>4</sub> 的反应吸热", "<b>Ⅰ：</b>久置空气中的漂白粉遇盐酸产生 CO<sub>2</sub><br><b>Ⅱ：</b>漂白粉的有效成分是 CaCO<sub>3</sub>", "<b>Ⅰ：</b>1 mol·L<sup>−1</sup> NaCl 溶液导电性比同浓度醋酸的强<br><b>Ⅱ：</b>NaCl 溶液的 pH 比醋酸的高"], "exp": "【题析】选项 A，将浓硫酸加入蔗糖中，蔗糖脱水炭化变黑，体现浓硫酸的脱水性；随着脱水反应进行，浓硫酸吸水放热、温度升高，C 与浓硫酸反应生成 CO<sub>2</sub> 和 SO<sub>2</sub>，生成的气体使炭变膨松多孔，该反应体现浓硫酸的氧化性，陈述Ⅰ与陈述Ⅱ均正确，且具有因果关系。选项 B，装有 NO<sub>2</sub> 的密闭烧瓶中存在平衡 2NO<sub>2</sub>(g)⇌N<sub>2</sub>O<sub>4</sub>(g)　ΔH<0，NO<sub>2</sub> 为红棕色气体，N<sub>2</sub>O<sub>4</sub> 为无色气体，冷却降低温度，化学平衡向正反应方向移动，气体颜色变浅，陈述Ⅰ正确；NO<sub>2</sub> 转化为 N<sub>2</sub>O<sub>4</sub> 的反应为放热反应，陈述Ⅱ不正确。选项 C，久置空气中的漂白粉会发生反应 Ca(ClO)<sub>2</sub>+CO<sub>2</sub>+H<sub>2</sub>O═CaCO<sub>3</sub>+2HClO，生成的 CaCO<sub>3</sub> 遇盐酸产生 CO<sub>2</sub>，陈述Ⅰ正确；漂白粉的有效成分是 Ca(ClO)<sub>2</sub>，陈述Ⅱ不正确。选项 D，1 mol·L<sup>−1</sup> NaCl 溶液导电性比同浓度醋酸的强，陈述Ⅰ正确；NaCl 溶液呈中性 pH=7，醋酸是弱酸 pH<7，陈述Ⅱ正确，但陈述Ⅰ与陈述Ⅱ无因果关系，溶液的导电性主要与离子浓度有关，NaCl 是强电解质、醋酸是弱电解质，NaCl 溶液中离子浓度大于醋酸的。"}, {"id": 5, "src": "2022 广东 12", "ans": "A", "heads": ["陈述Ⅰ", "陈述Ⅱ"], "stem": "陈述Ⅰ和Ⅱ均正确但不具有因果关系的是", "opts": ["<b>Ⅰ：</b>用焦炭和石英砂制取粗硅<br><b>Ⅱ：</b>SiO<sub>2</sub> 可制作光导纤维", "<b>Ⅰ：</b>利用海水制取溴和镁单质<br><b>Ⅱ：</b>Br<sup>−</sup> 可被氧化，Mg<sup>2+</sup> 可被还原", "<b>Ⅰ：</b>石油裂解气能使溴的 CCl<sub>4</sub> 溶液褪色<br><b>Ⅱ：</b>石油裂解可得到乙烯等不饱和烃", "<b>Ⅰ：</b>FeCl<sub>3</sub> 水解可生成 Fe(OH)<sub>3</sub> 胶体<br><b>Ⅱ：</b>FeCl<sub>3</sub> 可用作净水剂"], "exp": "【题析】选项 A，工业上用焦炭还原石英砂（主要成分为 SiO<sub>2</sub>）可制取粗硅；SiO<sub>2</sub> 可制作光导纤维是利用其对光的全反射，陈述Ⅰ和Ⅱ均正确但不具有因果关系。选项 B，海水中存在 Br<sup>−</sup>、Mg<sup>2+</sup>，Br<sup>−</sup> 可通过氧化（常用 Cl<sub>2</sub> 将其氧化为单质），再经过吹出、吸收、蒸馏等环节富集提取溴单质；海水中提取 Mg<sup>2+</sup> 的方法是加入石灰乳生成 Mg(OH)<sub>2</sub> 沉淀，再经过溶解、浓缩结晶等操作获得无水 MgCl<sub>2</sub>，最后利用电解法将 Mg<sup>2+</sup> 还原为镁单质，陈述Ⅰ和Ⅱ均正确且具有因果关系。选项 C，石油在催化剂加热条件下进行裂解可得到乙烯等不饱和烃，从而使溴的 CCl<sub>4</sub> 溶液褪色，具有因果关系。选项 D，FeCl<sub>3</sub> 溶液中 Fe<sup>3+</sup> 可发生水解，生成具有吸附性的 Fe(OH)<sub>3</sub> 胶体，FeCl<sub>3</sub> 可用作净水剂，具有因果关系。"}, {"id": 6, "src": "2021 广东适应性 12", "ans": "C", "heads": ["陈述Ⅰ", "陈述Ⅱ"], "stem": "陈述Ⅰ和Ⅱ均正确且具有因果关系的是", "opts": ["<b>Ⅰ：</b>Na 可与水反应产生 O<sub>2</sub><br><b>Ⅱ：</b>Na 着火不能用水扑灭", "<b>Ⅰ：</b>可用铝罐运输浓硝酸<br><b>Ⅱ：</b>浓硝酸与 Al 不反应", "<b>Ⅰ：</b>硅胶用作干燥剂<br><b>Ⅱ：</b>硅胶具有很强的吸水性", "<b>Ⅰ：</b>Fe 的金属性比 Cu 的强<br><b>Ⅱ：</b>不锈钢水龙头上的铜部件易发生电化学腐蚀"], "exp": "【题析】选项 A，金属 Na 与水反应放出 H<sub>2</sub>，陈述Ⅰ错误；Na 着火不能用水扑灭，Na 着火需要用干燥的沙土来灭火。选项 B，常温下铝遇浓硝酸、浓硫酸在金属铝表面形成致密氧化膜，该氧化膜阻止了铝与浓硝酸的进一步反应，浓硝酸与 Al 能反应，陈述Ⅱ错误。选项 C，硅胶是常用的食品干燥剂，原因是其有强吸水性，陈述Ⅰ和Ⅱ均正确且具有因果关系。选项 D，铁比铜活泼，在潮湿的环境中铁与铜相接构成原电池而发生电化学腐蚀，铁被腐蚀，铁被腐蚀与铁的金属性比铜强有关，陈述Ⅰ和Ⅱ均正确且具有因果关系。"}, {"id": 7, "src": "2026 广东 8", "ans": "C", "heads": ["事实", "解释"], "stem": "结构决定性质。下列事实对应的解释错误的是", "opts": ["<b>事实：</b>热稳定性：HCl>HI<br><b>解释：</b>键能：H—Cl>H—I", "<b>事实：</b>酸性：乙酸>丙酸<br><b>解释：</b>推电子效应：—CH<sub>3</sub><—CH<sub>2</sub>CH<sub>3</sub>", "<b>事实：</b>沸点：邻羟基苯甲醛>水<br><b>解释：</b>邻羟基苯甲醛可形成分子内氢键", "<b>事实：</b>在 CCl<sub>4</sub> 中的溶解度：苯>NH<sub>3</sub><br><b>解释：</b>苯和 CCl<sub>4</sub> 为非极性分子，NH<sub>3</sub> 为极性分子"], "exp": "【题析】选项 A，化学键的键长与键能相关，键长越小，键能越大，共价键更稳定，H—Cl 键长短短、键能大于 H—I，HCl 热稳定性强于 HI 的，正确。选项 B，烷基是推电子基团，烷基越长推电子效应越大，使羧基中的羟基的极性越小，羧基的酸性越弱。乙基推电子能力强于甲基的，使丙酸羧基电离出 H<sup>+</sup> 能力弱于乙酸，因此乙酸的酸性大于丙酸的，正确。选项 C，邻羟基苯甲醛形成分子内氢键会减弱分子间作用力，使分子的沸点降低，邻羟基苯甲醛沸点大于水的原因是邻羟基苯甲醛相对分子质量大于水的，范德华力更强，解释错误。选项 D，根据相似相溶规律，非极性物质易溶于非极性溶剂，苯和 CCl<sub>4</sub> 均为非极性分子，NH<sub>3</sub> 为极性分子，因此苯在 CCl<sub>4</sub> 中溶解度大于 NH<sub>3</sub> 的，正确。"}, {"id": 8, "src": "2025 广东 13", "ans": "A", "heads": ["结构", "性质"], "stem": "由结构不能推测出对应性质的是", "opts": ["<b>结构：</b>SO<sub>3</sub> 的 VSEPR 模型为平面三角形<br><b>性质：</b>SO<sub>3</sub> 具有氧化性", "<b>结构：</b>钾和钠的原子结构不同，电子跃迁时能量变化不同<br><b>性质：</b>钾和钠的焰色不同", "<b>结构：</b>乙烯和乙炔分子均含有 π 键<br><b>性质：</b>两者均可发生加聚反应", "<b>结构：</b>石墨层中未参与杂化的 p 轨道中的电子，可在整个碳原子平面中运动<br><b>性质：</b>石墨具有类似金属的导电性"], "exp": "【题析】选项 A，SO<sub>3</sub> 的中心 S 原子孤电子对数为 1/2×(6−3×2)=0，中心原子上的价层电子对数为 3，S 原子的杂化轨道属于 sp<sup>2</sup> 杂化，SO<sub>3</sub> 的 VSEPR 模型为平面三角形，反映其分子结构；SO<sub>3</sub> 具有氧化性是由硫的化合价为 +6、处于较高价态决定，与结构无直接关联，不能由结构推测。选项 B，钾和钠的原子结构不同，电子跃迁时能量变化不同，光是电子跃迁释放能量的重要形式，不同能量对应不同焰色，故钾和钠的焰色不同，由结构推测出对应性质。选项 C，乙烯分子含有碳碳双键、乙炔分子含有碳碳三键，碳碳双键和碳碳三键均含有 π 键，π 键不稳定易断裂，可发生加聚反应，由结构推测出对应性质。选项 D，石墨层中未参与杂化的 p 轨道中的电子可在整个碳原子平面中运动，未参与杂化的 p 轨道中的电子使其导电，故石墨具有类似金属的导电性，由结构推测出对应性质。"}, {"id": 9, "src": "2026 湖南 5", "ans": "C", "heads": ["性质", "解释"], "stem": "下列对性质解释正确的是", "opts": ["<b>性质：</b>酸性：HCl>HF<br><b>解释：</b>非金属性：F>Cl", "<b>性质：</b>沸点：H<sub>2</sub>O>HF<br><b>解释：</b>氢键键能：HF>H<sub>2</sub>O", "<b>性质：</b>沸点：正戊烷>新戊烷<br><b>解释：</b>分子间作用力：正戊烷>戊烷", "<b>性质：</b>硬度：金刚石>石墨<br><b>解释：</b>碳碳键的键能：石墨>金刚石"], "exp": "【题析】选项 A，氢化物水溶液酸性与非金属性无关，HF 酸性弱于 HCl 是因为 H—F 键的键长短短、键能更大，在水溶液中更难电离，而 F 的非金属性强于 Cl 的，解释错误。选项 B，氢键键能为 HF>H<sub>2</sub>O，H<sub>2</sub>O 和 HF 均为分子晶体，沸点高低与分子之间作用力大小有关，两者分子间均存在氢键，但每个 H<sub>2</sub>O 分子能形成更多分子间氢键，每个 HF 分子仅能形成 1 个分子间氢键，H<sub>2</sub>O 分子间氢键总作用更强，故沸点为 H<sub>2</sub>O>HF，解释错误。选项 C，烷烃同分异构体中支链越多，分子间空间位阻越大，分子间作用力越弱，沸点越低。正戊烷为直链结构，分子间接触面积大，分子间作用力大于带多支链的新戊烷，故沸点更高，解释对应性质，正确。选项 D，金刚石为空间网状原子晶体，硬度大，石墨为层状混合晶体，层间为较弱的范德华力，易滑动，故硬度小，石墨碳碳键的键能更大与二者硬度差异无关，解释错误。"}, {"id": 10, "src": "2024 浙江 6 月 7", "ans": "B", "heads": ["结构或性质", "用途"], "stem": "物质微观结构决定宏观性质，进而影响用途。下列结构或性质不能解释其用途的是", "opts": ["<b>结构或性质：</b>石墨呈层状结构，层间以范德华力结合<br><b>用途：</b>石墨可用作润滑剂", "<b>结构或性质：</b>SO<sub>2</sub> 具有氧化性<br><b>用途：</b>SO<sub>2</sub> 可用作漂白剂", "<b>结构或性质：</b>聚丙烯酸钠 <img src=\"figs/k12/q10.png\" alt=\"结构\" style=\"height:3em;vertical-align:middle\"> 中含有亲水基团<br><b>用途：</b>聚丙烯酸钠可用于制备高吸水性树脂", "<b>结构或性质：</b>冠醚 18-冠-6 空腔直径（260~320 pm）与 K<sup>+</sup> 直径（276 pm）接近<br><b>用途：</b>冠醚 18-冠-6 可识别 K<sup>+</sup>，能增大 KMnO<sub>4</sub> 在有机溶剂中的溶解度"], "exp": "【题析】选项 A，石墨呈层状结构，层间以范德华力结合，而范德华力是一种较弱的分子间作用力，层与层之间容易滑动，故石墨可用作润滑剂，能解释。选项 B，SO<sub>2</sub> 的漂白原理是其可以与有色物质结合形成不稳定的无色物质，SO<sub>2</sub> 可用作漂白剂与 SO<sub>2</sub> 具有氧化性无关，不能解释。选项 C，聚丙烯酸钠中含有亲水基团—COONa，故聚丙烯酸钠可用于制备高吸水性树脂，能解释。选项 D，冠醚 18-冠-6 空腔直径（260~320 pm）与 K<sup>+</sup> 直径（276 pm）接近，可识别 K<sup>+</sup>，且冠醚 18-冠-6 与 K<sup>+</sup> 形成超分子，使 K<sup>+</sup> 存在于其空腔中，能增大 KMnO<sub>4</sub> 在有机溶剂中的溶解度，能解释。"}, {"id": 11, "src": "2025 河北 8", "ans": "D", "heads": ["宏观现象", "微观解释"], "stem": "化学研究应当注重宏观与微观相结合。下列宏观现象与微观解释不符的是", "opts": ["<b>宏观现象：</b>氮气稳定存在于自然界中<br><b>微观解释：</b>氮分子中存在氮氮三键，断开该共价键需要较多的能量", "<b>宏观现象：</b>苯不能使溴的 CCl<sub>4</sub> 溶液褪色<br><b>微观解释：</b>苯分子中碳原子形成了稳定的大 π 键", "<b>宏观现象：</b>天然水晶呈现多面体外形<br><b>微观解释：</b>原子在三维空间里呈周期性有序排列", "<b>宏观现象：</b>氯化钠晶体熔点高于氯化铝晶体的<br><b>微观解释：</b>离子晶体中离子所带电荷数越少，离子半径越大，离子晶体熔点越低"], "exp": "【题析】选项 A，氮分子中存在氮氮三键，键能大，较难断裂，故氮气稳定存在于自然界中，相符。选项 B，苯分子中碳原子形成了稳定的大 π 键，通常情况下不易与 Br<sub>2</sub> 发生加成反应，故苯不能使溴的 CCl<sub>4</sub> 溶液褪色，相符。选项 C，天然水晶呈现多面体外形是因为其主要成分是 SiO<sub>2</sub>，SiO<sub>2</sub> 为共价晶体，Si 原子和 O 原子通过共价键连接，原子在三维空间里呈周期性有序排列，相符。选项 D，氯化钠是离子晶体，氯化铝为分子晶体，氯化钠熔点高于氯化铝的，不能用\"离子所带电荷数越少、离子半径越大、离子晶体熔点越低\"来解释，不符。"}, {"id": 12, "src": "2025 陕晋青宁 6", "ans": "C", "heads": ["物质性质", "解释"], "stem": "下列对物质性质的解释错误的是", "opts": ["<b>物质性质：</b>氯化钠熔点高于氯化铯的<br><b>解释：</b>氯化钠离子键强于氯化铯的", "<b>物质性质：</b>碘易溶于四氯化碳<br><b>解释：</b>碘和四氯化碳都是非极性分子", "<b>物质性质：</b>草酸氢钠溶液显酸性<br><b>解释：</b>草酸氢根离子水解程度大于电离程度", "<b>物质性质：</b>离子液体导电性良好<br><b>解释：</b>离子液体中有可移动的阴、阳离子"], "exp": "【题析】选项 A，氯化钠、氯化铯均是离子晶体，氯化钠、氯化铯的离子所带电荷数相同，离子半径为 Na<sup>+</sup><Cs<sup>+</sup>，所以氯化钠离子键比氯化铯的强，因此氯化钠熔点高于氯化铯的，正确。选项 B，碘和四氯化碳均为非极性分子，根据\"相似相溶\"的规律，碘易溶于四氯化碳，正确。选项 C，草酸氢根离子（HC<sub>2</sub>O<sub>4</sub><sup>−</sup>）能电离出 H<sup>+</sup>，也可以水解生成 OH<sup>−</sup>，由于草酸氢根离子的电离程度大于水解程度，草酸氢钠（NaHC<sub>2</sub>O<sub>4</sub>）溶液显酸性，解释错误。选项 D，离子液体中有可自由移动的阴、阳离子，使离子液体具有较好的导电性，正确。"}, {"id": 13, "src": "2025 广州一模 12", "ans": "A", "heads": ["陈述Ⅰ", "陈述Ⅱ"], "stem": "下列陈述Ⅰ和陈述Ⅱ均正确但不具有因果关系的是", "opts": ["<b>Ⅰ：</b>卤素单质沸点：Cl<sub>2</sub><Br<sub>2</sub><I<sub>2</sub><br><b>Ⅱ：</b>键能：Cl—Cl>Br—Br>I—I", "<b>Ⅰ：</b>CO<sub>2</sub> 通入苯酚钠溶液中出现浑浊<br><b>Ⅱ：</b>碳酸酸性强于苯酚的", "<b>Ⅰ：</b>石墨可用作润滑剂<br><b>Ⅱ：</b>石墨呈层状结构，层间以范德华力结合", "<b>Ⅰ：</b>医疗上常用 BaSO<sub>4</sub> 做\"钡餐\"<br><b>Ⅱ：</b>BaSO<sub>4</sub> 不溶于水和酸，不易被 X 射线透过"], "exp": "【题析】选项 A，卤素单质均为分子晶体，相对分子质量越大，范德华力越大，沸点越高，故卤素单质沸点为 Cl<sub>2</sub><Br<sub>2</sub><I<sub>2</sub>，陈述Ⅰ正确；卤素单质 X<sub>2</sub> 中原子半径越小，X—X 键的键长越短，键能越大，故键能为 Cl—Cl>Br—Br>I—I，陈述Ⅱ正确。卤素单质沸腾时只需要克服分子间作用力，不需要断裂化学键，陈述Ⅰ和陈述Ⅱ不具有因果关系。选项 B，碳酸酸性强于苯酚的，故能观察到溶液变浑浊，陈述Ⅰ和陈述Ⅱ均正确，且具有因果关系。选项 C，石墨属于混合晶体，其层状结构间通过范德华力相结合，易被破坏，石墨层之间可以发生相对滑动，硬度较小，故石墨可用作润滑剂，具有因果关系。选项 D，胃液中含有盐酸，由于 BaSO<sub>4</sub> 不溶于水和酸，且不易被 X 射线透过，医疗上常用 BaSO<sub>4</sub> 做\"钡餐\"，具有因果关系。"}, {"id": 14, "src": "2025 广州二测 12", "ans": "B", "heads": ["陈述Ⅰ", "陈述Ⅱ"], "stem": "下列陈述Ⅰ与陈述Ⅱ均正确，且具有因果关系的是", "opts": ["<b>Ⅰ：</b>同浓度溶液的碱性：C<sub>6</sub>H<sub>5</sub>ONa>Na<sub>2</sub>CO<sub>3</sub><br><b>Ⅱ：</b>同浓度溶液的酸性：C<sub>6</sub>H<sub>5</sub>OH<H<sub>2</sub>CO<sub>3</sub>", "<b>Ⅰ：</b>酸性：CH<sub>3</sub>ClCOOH>CH<sub>3</sub>COOH<br><b>Ⅱ：</b>电负性：Cl>H", "<b>Ⅰ：</b>以 1,3-丁二烯为原料合成顺丁橡胶<br><b>Ⅱ：</b>合成顺丁橡胶的反应是缩聚反应", "<b>Ⅰ：</b>由硫制硫酸：S→SO<sub>2</sub>→SO<sub>3</sub>→H<sub>2</sub>SO<sub>4</sub><br><b>Ⅱ：</b>SO<sub>2</sub> 和 SO<sub>3</sub> 均具有氧化性"], "exp": "【题析】选项 A，C<sub>6</sub>H<sub>5</sub>ONa 与 Na<sub>2</sub>CO<sub>3</sub> 在水中完全电离，C<sub>6</sub>H<sub>5</sub>O<sup>−</sup> 和 CO<sub>3</sub><sup>2−</sup> 的水解显碱性。由于 Ka<sub>1</sub>(H<sub>2</sub>CO<sub>3</sub>)>Ka(C<sub>6</sub>H<sub>5</sub>OH)>Ka<sub>2</sub>(H<sub>2</sub>CO<sub>3</sub>)，酸性 H<sub>2</sub>CO<sub>3</sub>>C<sub>6</sub>H<sub>5</sub>OH>HCO<sub>3</sub><sup>−</sup>，故相同温度、相同浓度下，盐的水解程度 Kh(CO<sub>3</sub><sup>2−</sup>)>Kh(C<sub>6</sub>H<sub>5</sub>O<sup>−</sup>)，溶液碱性为 C<sub>6</sub>H<sub>5</sub>ONa<Na<sub>2</sub>CO<sub>3</sub>，陈述Ⅰ不正确。选项 B，酸性为 H<sub>2</sub>CO<sub>3</sub>>C<sub>6</sub>H<sub>5</sub>OH，陈述Ⅱ正确；一氯乙酸（CH<sub>3</sub>ClCOOH）的酸性大于乙酸（CH<sub>3</sub>COOH）是因为电负性为 Cl>H，Cl—C 键的极性大于 H—C 键的极性，使 CH<sub>3</sub>Cl— 的极性大于 CH<sub>3</sub>— 的极性，导致一氯乙酸中的羟基的极性更大，更易电离出 H<sup>+</sup>，陈述Ⅰ与陈述Ⅱ均正确，且具有因果关系。选项 C，顺丁橡胶是以 1,3-丁二烯为原料，在催化剂作用下发生加聚反应得到的，陈述Ⅱ不正确。选项 D，以硫制硫酸的过程中 SO<sub>2</sub> 被氧化为 SO<sub>3</sub>，体现 SO<sub>2</sub> 的还原性，陈述Ⅱ与过程不符。"}, {"id": 15, "src": "2026 广州调研 7", "ans": "B", "heads": ["陈述Ⅰ", "陈述Ⅱ"], "stem": "下列陈述Ⅰ与陈述Ⅱ均正确，且两者间具有因果关系的是", "opts": ["<b>Ⅰ：</b>次氯酸钠溶液久置会变质<br><b>Ⅱ：</b>次氯酸钠有漂白性", "<b>Ⅰ：</b>牺牲船体上镶嵌的锌块避免船体遭受腐蚀<br><b>Ⅱ：</b>Zn 的金属性比 Fe 的强", "<b>Ⅰ：</b>用 Na<sub>2</sub>S 除去工业废水中的 Cu<sup>2+</sup><br><b>Ⅱ：</b>Na<sub>2</sub>S 具有还原性", "<b>Ⅰ：</b>用焦炭和石英砂制取粗硅<br><b>Ⅱ：</b>SiO<sub>2</sub> 可制作光导纤维"], "exp": "【题析】选项 A，次氯酸钠溶液在空气中与 CO<sub>2</sub> 发生反应 NaClO+CO<sub>2</sub>+H<sub>2</sub>O═HClO+NaHCO<sub>3</sub>，久置会变质是因为 HClO 光照易分解；次氯酸钠溶液有漂白性是因为其具有强氧化性，两者不具有因果关系。选项 B，船体上镶嵌的锌块可与船体在水溶液中构成原电池，因为 Zn 的金属性比 Fe 的强，Zn 为负极、Fe 为正极，采用牺牲阳极法保护船体不被腐蚀，两者具有因果关系。选项 C，用 Na<sub>2</sub>S 除去工业废水中的 Cu<sup>2+</sup> 是利用 Cu<sup>2+</sup> 的 Ksp 非常小，可除去废水中的 Cu<sup>2+</sup>，发生反应 Cu<sup>2+</sup>+S<sup>2−</sup>═CuS↓，该反应为非氧化还原反应，与 Na<sub>2</sub>S 具有还原性无关。选项 D，焦炭和石英砂反应制取粗硅利用焦炭的还原性，SiO<sub>2</sub> 可制作光导纤维利用的是其特殊的光学性质，两者不具有因果关系。"}, {"id": 16, "src": "2026 广州一测 7", "ans": "D", "heads": ["陈述Ⅰ", "陈述Ⅱ"], "stem": "下列陈述Ⅰ与陈述Ⅱ均正确但不具有因果关系的是", "opts": ["<b>Ⅰ：</b>SO<sub>2</sub> 能使品红溶液褪色<br><b>Ⅱ：</b>SO<sub>2</sub> 具有漂白性", "<b>Ⅰ：</b>装有 NO<sub>2</sub> 的密闭烧瓶受热后颜色变深<br><b>Ⅱ：</b>NO<sub>2</sub> 转化为 N<sub>2</sub>O<sub>4</sub> 的反应放热", "<b>Ⅰ：</b>MnO<sub>2</sub> 与浓盐酸共热生成黄绿色气体<br><b>Ⅱ：</b>MnO<sub>2</sub>+4HCl（浓）═MnCl<sub>2</sub>+2H<sub>2</sub>O+Cl<sub>2</sub>↑", "<b>Ⅰ：</b>1 mol·L<sup>−1</sup> 醋酸钠溶液的导电性比同浓度醋酸的强<br><b>Ⅱ：</b>醋酸钠溶液的 pH 比醋酸的大"], "exp": "【题析】选项 A，SO<sub>2</sub> 能使品红溶液褪色，具有漂白性，两者具有因果关系。选项 B，存在平衡 2NO<sub>2</sub>（红棕色）⇌N<sub>2</sub>O<sub>4</sub>（无色），该反应为放热反应，受热后反应向逆反应方向进行，颜色变深，两者具有因果关系。选项 C，MnO<sub>2</sub> 与浓盐酸共热生成黄绿色气体 Cl<sub>2</sub>，化学方程式为 MnO<sub>2</sub>+4HCl（浓）═MnCl<sub>2</sub>+2H<sub>2</sub>O+Cl<sub>2</sub>↑，两者具有因果关系。选项 D，醋酸钠是强电解质，可完全电离，醋酸是弱电解质，只能部分电离，故 1 mol·L<sup>−1</sup> 醋酸钠溶液的导电性比同浓度醋酸的强；同浓度下，醋酸钠溶液由于醋酸根离子水解产生 OH<sup>−</sup>，显碱性，而醋酸是弱酸，电离显酸性，故醋酸钠溶液的 pH 比醋酸的大，但两种溶液的导电性和 pH 并无关系。"}, {"id": 17, "src": "2026 广州二测 7", "ans": "B", "heads": ["陈述Ⅰ", "陈述Ⅱ"], "stem": "下列陈述Ⅰ与陈述Ⅱ均正确，且具有因果关系的是", "opts": ["<b>Ⅰ：</b>Na<sub>2</sub>O<sub>2</sub> 与 CO<sub>2</sub> 反应生成 O<sub>2</sub><br><b>Ⅱ：</b>Na<sub>2</sub>O<sub>2</sub> 能氧化 CO<sub>2</sub>", "<b>Ⅰ：</b>0.5 mol·L<sup>−1</sup> CuCl<sub>2</sub> 溶液受热变为黄绿色<br><b>Ⅱ：</b>[Cu(H<sub>2</sub>O)<sub>4</sub>]<sup>2+</sup>+4Cl<sup>−</sup>⇌[CuCl<sub>4</sub>]<sup>2−</sup>+4H<sub>2</sub>O　ΔH>0", "<b>Ⅰ：</b>将浓氨水加入碱石灰中制备 NH<sub>3</sub><br><b>Ⅱ：</b>铵盐受热易分解", "<b>Ⅰ：</b>向 AlCl<sub>3</sub> 溶液中滴加氨水产生白色沉淀<br><b>Ⅱ：</b>Al(OH)<sub>3</sub> 与盐酸反应生成 AlCl<sub>3</sub>"], "exp": "【题析】选项 A，Na<sub>2</sub>O<sub>2</sub> 与 CO<sub>2</sub> 反应的化学方程式为 2Na<sub>2</sub>O<sub>2</sub>+2CO<sub>2</sub>═2Na<sub>2</sub>CO<sub>3</sub>+O<sub>2</sub>，反应中 Na<sub>2</sub>O<sub>2</sub> 既是氧化剂，又是还原剂，陈述Ⅰ正确；Na<sub>2</sub>O<sub>2</sub> 不能氧化 CO<sub>2</sub>，陈述Ⅱ错误。选项 B，CuCl<sub>2</sub> 溶液中存在平衡 [Cu(H<sub>2</sub>O)<sub>4</sub>]<sup>2+</sup>+4Cl<sup>−</sup>⇌[CuCl<sub>4</sub>]<sup>2−</sup>+4H<sub>2</sub>O　ΔH>0，加热时平衡正向移动，溶液由蓝色变为黄绿色，陈述Ⅰ、陈述Ⅱ均正确，且具有因果关系。选项 C，碱石灰由 CaO 和 NaOH 组成，具有吸水性，将浓氨水加入碱石灰中可制得 NH<sub>3</sub>，陈述Ⅰ正确；铵盐受热易分解，如 NH<sub>4</sub>Cl 受热分解，陈述Ⅱ正确；陈述Ⅰ和陈述Ⅱ不具有因果关系。选项 D，向 AlCl<sub>3</sub> 溶液中滴加氨水反应的离子方程式为 Al<sup>3+</sup>+3NH<sub>3</sub>·H<sub>2</sub>O═Al(OH)<sub>3</sub>↓+3NH<sub>4</sub><sup>+</sup>，陈述Ⅰ正确；Al(OH)<sub>3</sub> 与盐酸反应生成 AlCl<sub>3</sub>，反应的离子方程式为 Al(OH)<sub>3</sub>+3H<sup>+</sup>═Al<sup>3+</sup>+3H<sub>2</sub>O，陈述Ⅱ正确；陈述Ⅰ和陈述Ⅱ不具有因果关系。"}, {"id": 18, "src": "2026 广州调研 10", "ans": "A", "heads": ["结构", "性质"], "stem": "由结构不能推测出对应性质的是", "opts": ["<b>结构：</b>氨气分子间存在范德华力<br><b>性质：</b>氨气易液化", "<b>结构：</b>氯化钠的离子键强于氯化铯的离子键<br><b>性质：</b>氯化钠的熔点高于氯化铯的熔点", "<b>结构：</b>NH<sub>3</sub> 分子中 N 原子含有孤电子对<br><b>性质：</b>NH<sub>3</sub> 可作为配体", "<b>结构：</b>I<sub>2</sub> 和 CCl<sub>4</sub> 都是非极性分子<br><b>性质：</b>I<sub>2</sub> 易溶于 CCl<sub>4</sub>"], "exp": "【题析】选项 A，氨气易液化是因为氨分子间容易形成氢键，不是范德华力，不能由所述结构推测。选项 B，氯化钠和氯化铯均为离子晶体，其熔点受到离子键强弱的影响，氯化钠的离子键强于氯化铯的离子键，故氯化钠的熔点高于氯化铯的熔点，能推测。选项 C，在配合物中，配体中配位原子提供孤对电子，中心原子或离子提供空轨道，两者结合形成配位键。NH<sub>3</sub> 分子中 N 原子含有孤电子对，可作配体，能推测。选项 D，物质的溶解度受到结构的影响，根据相似相溶原理，I<sub>2</sub> 和 CCl<sub>4</sub> 都是非极性分子，故 I<sub>2</sub> 易溶于 CCl<sub>4</sub>，能推测。"}, {"id": 19, "src": "2026 广州一模 9", "ans": "A", "heads": ["事实", "解释"], "stem": "下列事实与解释不相符的是", "opts": ["<b>事实：</b>石墨具有良好的导电性<br><b>解释：</b>石墨层间以范德华力结合", "<b>事实：</b>酸性：甲酸>乙酸<br><b>解释：</b>羟基的极性：甲酸>乙酸", "<b>事实：</b>键角：NH<sub>3</sub>>H<sub>2</sub>O<br><b>解释：</b>中心原子孤电子对数：H<sub>2</sub>O>NH<sub>3</sub>", "<b>事实：</b>碘易溶于四氯化碳，难溶于水<br><b>解释：</b>碘和四氯化碳是非极性分子，水是极性分子"], "exp": "【题析】选项 A，石墨具有良好的导电性是因为石墨的碳原子呈 sp<sup>2</sup> 杂化，形成平面六元并环结构。因此，石墨晶体是层状结构的，层间没有化学键相连，是靠范德华力维系的。石墨的二维结构内，每个碳原子的配位数为 3，有 1 个未参与杂化的 2p 电子，它的原子轨道垂直于碳原子平面，由于所有的 p 轨道相互平行而且相互重叠，使 p 轨道中的电子可在整个碳原子平面中运动，因此石墨有类似金属晶体的导电性。层间范德华力与导电性无关，事实与解释不相符。选项 B，烷基为推电子基团，可降低羧基中 O—H 的极性，使羧基中 O—H 键极性为甲酸>乙酸，酸性为甲酸>乙酸，相符。选项 C，NH<sub>3</sub> 和 H<sub>2</sub>O 都是 sp<sup>3</sup> 杂化，孤电子对数分别是 1 和 2，孤电子对有较大斥力，孤电子对数越多，键角越小，键角大小为 NH<sub>3</sub>>H<sub>2</sub>O，相符。选项 D，碘单质和四氯化碳都是非极性分子，水是极性分子，根据相似相溶原理，碘易溶于四氯化碳，难溶于水，相符。"}, {"id": 20, "src": "2026 广州二测 9", "ans": "C", "heads": ["事实", "解释"], "stem": "下列事实与解释不相符的是", "opts": ["<b>事实：</b>石墨可用作润滑剂<br><b>解释：</b>石墨呈层状结构，层间以范德华力结合", "<b>事实：</b>酸性：CH<sub>3</sub>COOH<CH<sub>2</sub>ClCOOH<br><b>解释：</b>电负性：H<Cl", "<b>事实：</b>卤素单质的沸点：Cl<sub>2</sub><Br<sub>2</sub><I<sub>2</sub><br><b>解释：</b>键长：Cl—Cl<Br—Br<I—I", "<b>事实：</b>同浓度溶液的碱性：C<sub>6</sub>H<sub>5</sub>ONa<Na<sub>2</sub>CO<sub>3</sub><br><b>解释：</b>电离常数：Ka<sub>2</sub>(H<sub>2</sub>CO<sub>3</sub>)<Ka(C<sub>6</sub>H<sub>5</sub>OH)"], "exp": "【题析】选项 A，石墨属于混合型晶体，碳原子以 sp<sup>2</sup> 杂化后形成平面六元并环结构。因此，石墨晶体是层状结构的，层间没有化学键相连，是靠范德华力维系的。石墨片层间易发生相对滑动，可用作润滑剂。事实与解释相符。选项 B，由于电负性 Cl>H，使 Cl—C 键的极性大于 H—C 键的极性，使羧基中的羟基的极性更大，更易电离出 H<sup>+</sup>，酸性 CH<sub>2</sub>ClCOOH>CH<sub>3</sub>COOH。事实与解释相符。选项 C，卤素单质均属于分子晶体，沸点随相对分子质量增大、范德华力增大而升高，与化学键的键长、键能大小无关。事实与解释不相符。选项 D，Na<sub>2</sub>CO<sub>3</sub> 水解的离子方程为 CO<sub>3</sub><sup>2−</sup>+H<sub>2</sub>O⇌HCO<sub>3</sub><sup>−</sup>+OH<sup>−</sup>，因此 CO<sub>3</sub><sup>2−</sup> 的水解程度大小与 HCO<sub>3</sub><sup>−</sup> 的电离程度［即 Ka<sub>2</sub>(H<sub>2</sub>CO<sub>3</sub>)］有关。电离常数 Ka<sub>2</sub>(H<sub>2</sub>CO<sub>3</sub>)<Ka(C<sub>6</sub>H<sub>5</sub>OH)，说明 CO<sub>3</sub><sup>2−</sup> 的水解程度大于 C<sub>6</sub>H<sub>5</sub>O<sup>−</sup> 的水解程度，因此同浓度溶液的碱性为 C<sub>6</sub>H<sub>5</sub>ONa<Na<sub>2</sub>CO<sub>3</sub>。事实与解释相符。"}];

var ROCK_MS=30000, jadeTimers={}, rockTimers={};
function openJade(id,hint){
  var bx=$('jbx'+id);if(!bx)return;
  bx.style.display='flex';
  if(jadeTimers[id]){clearTimeout(jadeTimers[id]);jadeTimers[id]=null}
  try{if(curAudio){curAudio.pause();curAudio=null}}catch(e){}
  var foldIt=function(){
    bx.style.display='none';
    if(jadeTimers[id]){clearTimeout(jadeTimers[id]);jadeTimers[id]=null}
    setFace('jf'+id,YU_BASE,'idle');
  };

  try{
    var a=new Audio('../assets/xz/audio/k12/h'+id+'.mp3');
    curAudio=a;
    a.onended=function(){setTimeout(foldIt,900)};
    a.onerror=function(){if(curAudio===a)curAudio=null};
    a.play().catch(function(){});
  }catch(e){}
}
function openRock(id){
  var bx=$('rbx'+id);if(!bx)return;
  bx.style.display='flex';
  var cd=$('rct'+id);
  if(rockTimers[id]){clearInterval(rockTimers[id]);rockTimers[id]=null}
  var left=Math.round(ROCK_MS/1000);
  if(cd)cd.textContent=left+'s 后自动收起';
  rockTimers[id]=setInterval(function(){
    left--;
    if(left<=0){
      if(rockTimers[id]){clearInterval(rockTimers[id]);rockTimers[id]=null}
      bx.style.display='none';
      setFace('rf'+id,YAN_BASE,'idle');
    }else if(cd){cd.textContent=left+'s 后自动收起'}
  },1000);
}

    h+='<div class="helpbox jadebox" id="jbx'+q.id+'"><div class="hb-face"><img id="jf'+q.id+'" src="../assets/xiaoyu/xiaoyu_idle.webp'+FACE_VER+'" alt="小玉"><div class="hn">小玉</div></div><div class="hb-main"><div class="ht"><span>🙋 小玉点拨 · 不扣分，自己接着想</span></div><p>'+(q.hint||'')+'</p></div></div>';
    h+='<div class="helpbox rockbox" id="rbx'+q.id+'"><div class="hb-face"><img id="rf'+q.id+'" src="../assets/xiaoyan/xiaoyan_idle.webp'+FACE_VER+'" alt="小岩"><div class="hn">小岩</div></div><div class="hb-main"><div class="ht"><span>📖 小岩详解 · 本题已计 0 分</span><span class="rct" id="rct'+q.id+'"></span></div><p>'+q.exp+'</p></div></div>';
    h+='<div class="skipped-tip" id="skd'+q.id+'">已跳过（不计入统计）<button class="undoskip" id="us'+q.id+'">撤销跳过</button></div>';
    h+='<div class="verdict" id="vd'+q.id+'"></div>';
    h+='<div class="exp" id="ex'+q.id+'"><div class="et">答案 '+q.ans+' · 题析</div><p>'+q.exp+'</p></div>';
    h+='<button class="next" id="nx'+q.id+'">'+(i<N-1?'下一题 →':'返回顶部生成成绩卡')+'</button>';
    d.innerHTML=h;box.appendChild(d);
    var picked=null,done=!!st.a[q.id],skipped=!!st.skip[q.id];
    var ob=$('op'+q.id);
    q.opts.forEach(function(o,j){
      var L='ABCD'[j],b=document.createElement('button');
      b.className='opt';b.innerHTML='<span class="ol">'+L+'．</span><span>'+o+'</span>';
      b.onclick=function(){
        if(done||skipped)return;
        picked=L;
        Array.prototype.forEach.call(ob.children,function(c){c.classList.remove('sel')});
        b.classList.add('sel');
        $('sb'+q.id).disabled=false;
      };
      ob.appendChild(b);
    });
    if(done){
      var pick=st.a[q.id],ok=pick===q.ans;
      paintResult(q,ob,pick,ok);
      $('hl'+q.id).style.display='none';
      if(st.help[q.id]==='rock'){
        $('qm'+q.id).textContent='📖';
        $('qm'+q.id).style.color='#f59e0b';
      }else{
        $('ex'+q.id).style.display='block';
        $('qm'+q.id).textContent=ok?'✓':'✗';
        $('qm'+q.id).style.color=ok?'var(--ok)':'var(--bad)';
      }
      $('act'+q.id).style.display='none';
    }else if(skipped){
      setSkip(q.id,true);
    }else if(st.help[q.id]){
      var hb=$(st.help[q.id]==='rock'?'rk'+q.id:'jd'+q.id);
      if(hb)hb.style.opacity=.5;
    }
    $('sb'+q.id).onclick=function(){
      if(picked===null||done||skipped)return;
      done=true;
      if(!st.started){st.started=true}
      var ok=picked===q.ans;
      var rock=st.help[q.id]==='rock';
      st.a[q.id]=picked;
      paintResult(q,ob,picked,ok);
      var v=$('vd'+q.id);
      v.style.display='block';
      v.style.background=rock?'rgba(245,158,11,.09)':(ok?'var(--ok-bg)':'var(--bad-bg)');
      v.style.color=rock?'#f59e0b':(ok?'var(--ok-ink)':'var(--bad-ink)');
      v.textContent=rock?'已求助小岩 · 本题计 0 分（正确答案 '+q.ans+'）':(ok?'回答正确 +'+PER+' 分':'回答错误 · 正确答案 '+q.ans);
      $('qm'+q.id).textContent=rock?'📖':(ok?'✓':'✗');
      $('qm'+q.id).style.color=rock?'#f59e0b':(ok?'var(--ok)':'var(--bad)');
      if(rock){$('rbx'+q.id).style.display='flex';$('hl'+q.id).style.display='none';}
      else{$('ex'+q.id).style.display='block';$('hl'+q.id).style.display='none';}
      $('act'+q.id).style.display='none';
      Array.prototype.forEach.call(ob.children,function(b){b.disabled=true});
      renderStats();save();
    };
    if($('jd'+q.id)){$('jd'+q.id).onclick=function(){
      if(done||skipped)return;
      st.help[q.id]='jade';
      $('jd'+q.id).style.opacity=.5;
      setFace('jf'+q.id,YU_BASE,'think',2400);
      setTimeout(function(){if(st.help[q.id]==='jade')setFace('jf'+q.id,YU_BASE,'encourage',2600)},2700);
      openJade(q.id,q.hint||'');
      save();
    };}
    $('rk'+q.id).onclick=function(){
      if(done||skipped)return;
      if(!st.help[q.id]){
        if(!confirm('看小岩详解后，本题将计 0 分（即使答对）。确定求助吗？'))return;
        st.help[q.id]='rock';
        $('rk'+q.id).style.opacity=.5;
        playVoice('../assets/xz/audio/xiaoyan_hi.mp3');
        renderStats();
      }
      setFace('rf'+q.id,YAN_BASE,'write',2400);
      setTimeout(function(){if(st.help[q.id]==='rock')setFace('rf'+q.id,YAN_BASE,'think',2600)},2700);
      openRock(q.id);
      save();
    };
    $('sk'+q.id).onclick=function(){
      if(done||skipped)return;
      skipped=true;st.skip[q.id]=1;
      setSkip(q.id,true);save();
    };
    $('us'+q.id).onclick=function(){
      if(!skipped)return;
      skipped=false;delete st.skip[q.id];
      setSkip(q.id,false);save();
    };
    $('nx'+q.id).onclick=function(){
      if(i<N-1){var n=QS[i+1];var el=document.getElementById('qc'+n.id);el.scrollIntoView({behavior:'smooth',block:'start'})}
      else{window.scrollTo({top:0,behavior:'smooth'})}
    };
  });
}
function paintResult(q,ob,pick,ok){
  Array.prototype.forEach.call(ob.children,function(c,j){
    var L='ABCD'[j];c.disabled=true;
    if(L===q.ans)c.classList.add('rgt');
    else if(L===pick)c.classList.add('wrg');
  });
}
var timer=setInterval(function(){
  var c=calc();
  if(st.started&&c.done<N){st.elapsed++;renderStats();if(st.elapsed%5===0)save()}
},1000);
function pad(n){return ('0'+n).slice(-2)}
function showCard(){
  $('result').style.display='block';
  $('stuName').value=localStorage.getItem(NKEY)||'';
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
}
$('btnCard').onclick=function(){showCard()};
$('btnGen').onclick=function(){
  var name=$('stuName').value.trim()||'同学';
  try{localStorage.setItem(NKEY,name)}catch(e){}
  drawCard();
  $('canvas').style.display='block';
  $('doneZone').style.display='flex';
};
$('btnClose').onclick=function(){
  $('result').style.display='none';
  var first=QS.find(function(q){return !st.a[q.id]&&!st.skip[q.id]});
  var el=first?document.getElementById('qc'+first.id):$('qlist');
  el.scrollIntoView({behavior:'smooth',block:'start'});
};
function drawCard(){
  var c=document.getElementById('canvas'),x=c.getContext('2d'),W=c.width,H=c.height;
  var g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0f172a');g.addColorStop(.55,'#152743');g.addColorStop(1,'#1b1140');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(34,211,238,.08)';x.beginPath();x.arc(W-60,60,150,0,7);x.fill();
  x.fillStyle='rgba(167,139,250,.08)';x.beginPath();x.arc(50,H-40,130,0,7);x.fill();
  x.fillStyle='#67e8f9';x.font='500 22px sans-serif';x.fillText('化学不难学 · 高考选择题训练',40,52);
  x.fillStyle='#8ea0b5';x.font='16px sans-serif';x.fillText('考点12 反应变化与规律 物质结构与性质 · 每题 '+PER+' 分',40,84);
  var name=$('stuName').value.trim()||'同学';
  x.fillStyle='#e2e8f0';x.font='500 26px sans-serif';x.fillText(name,40,150);
  var cc=calc();
  x.fillStyle='#a78bfa';x.font='700 88px sans-serif';x.fillText(cc.score,40,250);
  x.fillStyle='#8ea0b5';x.font='18px sans-serif';x.fillText('分 / 满分 '+(N*PER)+' 分',40+String(cc.score).length*52+14,250);
  var acc=cc.done?Math.round(cc.ok/cc.done*100):0;
  var cells=[['正确率',acc+'%（'+cc.ok+'/'+cc.done+'）'],['完成度',cc.done+' / '+N+' 题'],['做题时长',fmt(st.elapsed)]];
  cells.forEach(function(cell,i){
    var cx=40+i*228;
    x.fillStyle='#1e293b';x.fillRect(cx,280,208,84);
    x.fillStyle='#67e8f9';x.font='14px sans-serif';x.fillText(cell[0],cx+18,310);
    x.fillStyle='#e2e8f0';x.font='500 20px sans-serif';x.fillText(cell[1],cx+18,346);
  });
  var d=new Date();
  var stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('提交时间 '+stamp,40,400);
  x.fillStyle='#8ea0b5';x.font='15px sans-serif';x.fillText('已做题号（绿=自己对 蓝=问小玉 橙=问小岩0分 红=自己错）',40,432);
  var doneList=QS.filter(function(q){return !!st.a[q.id]});
  var jadeN=0,rockN=0;
  doneList.forEach(function(q,i){
    var col=i%14,row=Math.floor(i/14);
    var bx=40+col*48,by=450+row*46;
    var ok=st.a[q.id]===q.ans,h=st.help[q.id];
    var colr=h==='rock'?'#d97706':h==='jade'?'#3b82f6':(ok?'#16a34a':'#dc2626');
    if(h==='rock')rockN++;if(h==='jade')jadeN++;
    x.fillStyle=colr;x.fillRect(bx,by,38,36);
    x.fillStyle='#ffffff';x.font='500 16px sans-serif';x.fillText(String(q.id),bx+9,by+25);
  });
  x.fillStyle='#5b6b7f';x.font='13px sans-serif';
  x.fillText('答对 '+cc.ok+' · 答错 '+(cc.done-cc.ok)+' · 问小玉 '+jadeN+' · 问小岩 '+rockN+' · 未做 '+(N-cc.done)+' · 跳过 '+Object.keys(st.skip).length,40,H-22);
  window.__lastCard={time:stamp,done:cc.done,ok:cc.ok,score:cc.score,elapsed:fmt(st.elapsed),skip:Object.keys(st.skip).length,jade:jadeN,rock:rockN};
}
$('stuName').addEventListener('input',function(){try{localStorage.setItem(NKEY,this.value)}catch(e){}});
$('btnSave').onclick=function(){
  var a=document.createElement('a');
  a.download='选择题训练_考点12_'+(($('stuName').value.trim()||'成绩'))+'.png';
  a.href=$('canvas').toDataURL('image/png');a.click();
};
$('resetBtn').onclick=function(){
  var c=calc();
  if(c.done===0&&Object.keys(st.skip).length===0&&Object.keys(st.help).length===0){alert('本讲还没有答题记录');return}
  if(confirm('确定清空本讲全部记录和成绩卡重新做吗？')){
    localStorage.removeItem(KEY);location.reload();
  }
};
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('themeBtn').textContent=t==='dark'?'☀':'🌙';
  try{localStorage.setItem(TKEY,t)}catch(e){}
}
$('themeBtn').onclick=function(){
  applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
};
applyTheme((function(){try{return localStorage.getItem(TKEY)||'dark'}catch(e){return 'dark'}})());
load();build();renderStats();
</script>
</body>
</html>

<svg viewBox="0 0 680 1180" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>侯氏派对入场指南</title>
  <desc>侯氏制碱法先通氨气后通二氧化碳的趣味条漫</desc>
  <style>
    text { font-family: "PingFang SC","Microsoft YaHei",sans-serif; fill:#2C2C2A; }
    .bd { stroke:#2C2C2A; stroke-width:2; }
    .bub { fill:#FFFFFF; stroke:#2C2C2A; stroke-width:1.5; }
    .say { font-size:14px; }
    .note { font-size:12px; fill:#633806; }
    .ttl { font-size:18px; font-weight:500; }
  </style>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#712B13" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="340" y="52" text-anchor="middle" class="ttl" font-weight="600">侯氏派对入场指南</text>
  <text x="340" y="76" text-anchor="middle" font-size="12" fill="#854F0B">饱和食盐水泳池派对 · 入场顺序决定成败</text>

  <!-- P1 CO2高冷不敢进 -->
  <g>
    <rect x="40" y="96" width="600" height="200" rx="12" fill="#B5D4F4" class="bd"/>
    <text x="70" y="124" font-size="13" font-weight="500" fill="#0C447C">第1幕：先请 CO₂？——它扭头就走</text>
    <!-- 泳池 -->
    <path d="M80 230 Q120 218 160 230 T240 230 T320 230" fill="none" stroke="#2F7D5B" stroke-width="2"/>
    <path d="M80 244 Q120 232 160 244 T240 244 T320 244" fill="none" stroke="#2F7D5B" stroke-width="2"/>
    <rect x="60" y="212" width="290" height="60" rx="10" fill="#8FC7EA" opacity="0.7"/>
    <rect x="88" y="150" width="150" height="34" rx="8" fill="#FAEEDA" stroke="#633806" stroke-width="2"/>
    <text x="163" y="172" text-anchor="middle" font-size="12" fill="#712B13">NaCl泳池派对</text>
    <!-- CO2 高冷 -->
    <circle cx="500" cy="196" r="30" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <circle cx="489" cy="190" r="3.2" fill="#0C447C"/>
    <circle cx="511" cy="190" r="3.2" fill="#0C447C"/>
    <path d="M491 206 Q500 202 509 206" fill="none" stroke="#0C447C" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M480 172 L478 160 M500 168 L500 156 M520 172 L522 160" stroke="#0C447C" stroke-width="2" stroke-linecap="round"/>
    <rect x="420" y="240" width="180" height="40" rx="14" class="bub"/>
    <text x="432" y="258" font-size="13">不熟的水我不进，</text>
    <text x="432" y="274" font-size="13">就溶一丢丢意思一下。</text>
    <rect x="60" y="252" width="330" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="225" y="269" text-anchor="middle" class="note">CO₂溶解度小（约1:1），先通它=请了个社恐</text>
  </g>

  <!-- P2 NH3社牛跳水 -->
  <g>
    <rect x="40" y="308" width="600" height="200" rx="12" fill="#F7C1C1" class="bd"/>
    <text x="70" y="336" font-size="13" font-weight="500" fill="#712B13">第2幕：改请 NH₃——社牛1:700</text>
    <!-- NH3 扑通跳水 -->
    <circle cx="230" cy="392" r="26" fill="#F5A9A9" stroke="#712B13" stroke-width="2"/>
    <circle cx="220" cy="386" r="3" fill="#712B13"/>
    <circle cx="240" cy="386" r="3" fill="#712B13"/>
    <path d="M221 402 Q230 408 239 402" fill="none" stroke="#712B13" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M230 418 L222 444 M230 418 L238 444" stroke="#712B13" stroke-width="2" stroke-linecap="round"/>
    <path d="M180 452 Q230 440 280 452" fill="none" stroke="#2F7D5B" stroke-width="2"/>
    <path d="M196 466 Q230 456 264 466" fill="none" stroke="#2F7D5B" stroke-width="2"/>
    <!-- 水花 -->
    <path d="M196 448 L188 432 M206 444 L202 426 M254 448 L262 432 M264 444 L268 426" stroke="#2F7D5B" stroke-width="2" stroke-linecap="round"/>
    <text x="150" y="368" font-size="12" fill="#712B13">扑通——！</text>
    <rect x="300" y="356" width="170" height="52" rx="14" class="bub"/>
    <text x="312" y="376" class="say">我来啦我来啦！</text>
    <text x="312" y="398" class="say">1:700全部住下！</text>
    <rect x="440" y="356" width="180" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="530" y="373" text-anchor="middle" class="note">NH₃极易溶于水（1:700）</text>
    <rect x="300" y="418" width="320" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="460" y="435" text-anchor="middle" class="note">先通氨气：泳池瞬间变碱性·热情好客</text>
    <rect x="60" y="418" width="220" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="170" y="435" text-anchor="middle" class="note">氛围组到位，就等主宾</text>
  </g>

  <!-- P3 CO2被热情感染 -->
  <g>
    <rect x="40" y="520" width="600" height="200" rx="12" fill="#E1F5EE" class="bd"/>
    <text x="70" y="548" font-size="13" font-weight="500" fill="#2F5D46">第3幕：CO₂看到氛围，排队入场</text>
    <!-- 碱性泳池变绿热情 -->
    <rect x="60" y="620" width="250" height="60" rx="10" fill="#7FCBA4" opacity="0.8"/>
    <path d="M80 634 Q120 622 160 634 T240 634 T300 634" fill="none" stroke="#1F5C3C" stroke-width="2"/>
    <text x="185" y="662" text-anchor="middle" font-size="12" fill="#1F5C3C">碱性泳池 · 包容万物</text>
    <!-- CO2一串入场 -->
    <circle cx="430" cy="596" r="14" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <circle cx="470" cy="580" r="12" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <circle cx="505" cy="598" r="13" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <circle cx="540" cy="580" r="11" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
    <path d="M418 608 Q360 632 316 640" fill="none" stroke="#B33B2E" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aw)"/>
    <path d="M458 592 Q380 616 316 632" fill="none" stroke="#B33B2E" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aw)"/>
    <text x="440" y="566" font-size="12" fill="#0C447C">成群结队往里跳</text>
    <rect x="300" y="650" width="320" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="460" y="667" text-anchor="middle" class="note">碱性环境狂吸CO₂ → 生成大量HCO₃⁻</text>
    <rect x="60" y="650" width="220" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="170" y="667" text-anchor="middle" class="note">NH₃+CO₂+H₂O→NH₄HCO₃</text>
    <text x="340" y="704" text-anchor="middle" font-size="12" fill="#412402">顺序反了：CO₂稀稀拉拉，啥也析不出来！</text>
  </g>

  <!-- P4 NaHCO3胖墩析出 -->
  <g>
    <rect x="40" y="732" width="600" height="200" rx="12" fill="#CECBF6" class="bd"/>
    <text x="70" y="760" font-size="13" font-weight="500" fill="#412402">第4幕：吃得最多的小苏打，先躺下</text>
    <!-- 泳池里胖墩坐底 -->
    <rect x="60" y="850" width="250" height="60" rx="10" fill="#8FC7EA" opacity="0.8"/>
    <path d="M90 880 Q120 872 150 880 T210 880" fill="none" stroke="#2F7D5B" stroke-width="2"/>
    <circle cx="140" cy="888" r="22" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/>
    <circle cx="132" cy="884" r="2.8" fill="#2C2C2A"/>
    <circle cx="148" cy="884" r="2.8" fill="#2C2C2A"/>
    <path d="M133 896 Q140 900 147 896" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round"/>
    <text x="88" y="838" font-size="12" fill="#0C447C">NaHCO₃：我溶解度最小</text>
    <rect x="98" y="916" width="90" height="18" rx="9" fill="#2F7D5B"/>
    <text x="143" y="929" text-anchor="middle" font-size="11" fill="#FFFFFF">↓ 析出！</text>
    <!-- NH4Cl被请出去 -->
    <circle cx="500" cy="856" r="24" fill="#F1EFE8" stroke="#888780" stroke-width="2"/>
    <circle cx="492" cy="851" r="2.8" fill="#5F5E5A"/>
    <circle cx="508" cy="851" r="2.8" fill="#5F5E5A"/>
    <path d="M493 864 Q500 868 507 864" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="466" y="820" width="70" height="18" rx="9" fill="#534AB7"/>
    <text x="501" y="833" text-anchor="middle" font-size="11" fill="#FFFFFF">NH₄Cl</text>
    <path d="M530 850 Q560 842 596 848" fill="none" stroke="#B33B2E" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aw)"/>
    <rect x="330" y="888" width="290" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="475" y="905" text-anchor="middle" class="note">母液加细NaCl、通NH₃、降温→NH₄Cl析出</text>
    <rect x="330" y="822" width="128" height="24" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="394" y="838" text-anchor="middle" class="note">氨被"请"回厂再就业</text>
  </g>

  <!-- P5 结尾黑底 -->
  <g>
    <rect x="40" y="944" width="600" height="216" rx="12" fill="#2C2C2A"/>
    <text x="340" y="982" text-anchor="middle" font-size="15" style="fill:#e8d48f;" font-weight="600">侯氏制碱法 · 结案陈词：</text>
    <text x="340" y="1016" text-anchor="middle" font-size="14" style="fill:#e8d48f;">NaCl + NH₃ + CO₂ + H₂O = NaHCO₃↓ + NH₄Cl</text>
    <text x="340" y="1052" text-anchor="middle" font-size="14" style="fill:#9ccb8c;" font-weight="500">口诀：先氨后碳——氨是社牛，碳是高冷</text>
    <text x="340" y="1084" text-anchor="middle" font-size="12" style="fill:#B8B6AC;">NH₃循环利用 · CO₂来自合成氨厂 · 副产品NH₄Cl可做氮肥</text>
    <text x="340" y="1114" text-anchor="middle" font-size="11" style="fill:#8A8880;">—— 记住：让社牛先下场暖场，高冷才肯进门</text>
  </g>
</svg>

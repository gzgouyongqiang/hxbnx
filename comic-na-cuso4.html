  <div class="paper">
<svg viewBox="0 0 680 1430" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>钠抢铜失败记</title>
  <desc>钠与硫酸铜溶液反应的趣味条漫：钠先与水反应生成NaOH，再与CuSO4生成蓝色沉淀，铜全程没上场</desc>
  <style>
    text { font-family: "PingFang SC","Microsoft YaHei",sans-serif; fill:#2C2C2A; }
    .bd { stroke:#2C2C2A; stroke-width:2; }
    .bub { fill:#FFFFFF; stroke:#2C2C2A; stroke-width:1.5; }
    .say { font-size:13px; }
    .note { font-size:12px; fill:#633806; }
    .ttl { font-size:18px; font-weight:500; }
  </style>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#712B13" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="340" y="46" text-anchor="middle" class="ttl" font-weight="600">钠抢铜失败记</text>
  <text x="340" y="72" text-anchor="middle" font-size="12" fill="#854F0B">顺序表说我能赢 · 现场保安说不让进</text>

  <!-- P1 椭圆擂台：踢馆宣言 -->
  <ellipse cx="340" cy="210" rx="290" ry="120" fill="#FBE8D5" class="bd"/>
  <text x="340" y="122" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">第1幕：踢馆宣言</text>
  <!-- 铜王座 -->
  <rect x="490" y="252" width="90" height="14" rx="5" fill="#8A5A2B"/>
  <rect x="500" y="266" width="12" height="30" fill="#8A5A2B"/>
  <rect x="558" y="266" width="12" height="30" fill="#8A5A2B"/>
  <circle cx="535" cy="222" r="26" fill="#C87533" stroke="#6E3D14" stroke-width="2"/>
  <path d="M517 202 L521 190 L528 198 L535 186 L542 198 L549 190 L553 202 Z" fill="#F7C948" stroke="#A8720A" stroke-width="1.5"/>
  <circle cx="527" cy="218" r="2.6" fill="#4A2410"/>
  <circle cx="543" cy="218" r="2.6" fill="#4A2410"/>
  <path d="M528 232 Q535 235 542 232" fill="none" stroke="#4A2410" stroke-width="1.6" stroke-linecap="round"/>
  <text x="535" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#6E3D14">Cu王</text>
  <path d="M563 206 L569 200 M566 212 L574 210" stroke="#888780" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 钠冲入 -->
  <circle cx="165" cy="235" r="28" fill="#F7C948" stroke="#A8720A" stroke-width="2"/>
  <path d="M146 218 Q165 208 184 218" fill="none" stroke="#B33B2E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="156" cy="231" r="2.8" fill="#5C3D00"/>
  <circle cx="174" cy="231" r="2.8" fill="#5C3D00"/>
  <path d="M155 245 Q165 250 175 245" fill="none" stroke="#5C3D00" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M120 226 L104 218 M122 240 L104 240 M120 254 L106 262" stroke="#A8720A" stroke-width="2" stroke-linecap="round"/>
  <rect x="228" y="150" width="188" height="52" rx="14" class="bub"/>
  <path d="M242 202 L228 220 L262 202 Z" class="bub"/>
  <text x="240" y="172" class="say">活动性顺序表我排你前面——</text>
  <text x="240" y="194" class="say">铜王座，我要了！！</text>
  <rect x="70" y="345" width="540" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="362" text-anchor="middle" class="note">金属活动性：Na ＞ Cu，理论上"能"置换——但在盐溶液里，剧本不这么演</text>

  <!-- P2 斜切格：水保安截胡 -->
  <polygon points="70,402 610,390 594,572 86,584" fill="#D6EDFB" class="bd"/>
  <text x="102" y="428" font-size="13" font-weight="500" fill="#0C447C">第2幕：水保安半路截胡</text>
  <!-- 水保安 -->
  <circle cx="488" cy="480" r="34" fill="#5FA8E0" stroke="#0C447C" stroke-width="2"/>
  <rect x="470" y="438" width="36" height="12" rx="6" fill="#0C447C"/>
  <circle cx="478" cy="474" r="3" fill="#082E52"/>
  <circle cx="498" cy="474" r="3" fill="#082E52"/>
  <path d="M478 492 Q488 487 498 492" fill="none" stroke="#082E52" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M452 470 L424 458" stroke="#0C447C" stroke-width="4" stroke-linecap="round"/>
  <rect x="300" y="418" width="176" height="40" rx="14" class="bub"/>
  <text x="312" y="436" class="say">新人进盐溶液，</text>
  <text x="312" y="452" class="say">我保安先接待！</text>
  <!-- 钠与水扭打 -->
  <ellipse cx="180" cy="520" rx="120" ry="42" fill="#8FC7EA" opacity="0.85"/>
  <path d="M96 512 Q120 500 144 512 T192 512 T240 512" fill="none" stroke="#2F7D5B" stroke-width="2"/>
  <circle cx="180" cy="512" r="22" fill="#F7C948" stroke="#A8720A" stroke-width="2"/>
  <path d="M166 500 Q180 493 194 500" fill="none" stroke="#2F7D5B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="172" cy="510" r="2.4" fill="#5C3D00"/>
  <circle cx="188" cy="510" r="2.4" fill="#5C3D00"/>
  <circle cx="176" cy="519" r="1.8" fill="#5C3D00"/>
  <path d="M150 490 L144 478 M180 486 L180 474 M210 490 L216 478" stroke="#F7C948" stroke-width="2" stroke-linecap="round"/>
  <text x="140" y="468" font-size="12" fill="#712B13">滋滋滋！！</text>
  <circle cx="248" cy="462" r="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.5"/>
  <circle cx="262" cy="444" r="5" fill="#FFFFFF" stroke="#888780" stroke-width="1.5"/>
  <circle cx="252" cy="428" r="4.5" fill="#FFFFFF" stroke="#888780" stroke-width="1.5"/>
  <text x="272" y="418" font-size="11" fill="#5F5E5A">H₂↑先溜</text>
  <rect x="86" y="548" width="380" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="276" y="565" text-anchor="middle" class="note">2Na + 2H₂O = 2NaOH + H₂↑（熟悉的浮熔游响套餐）</text>
  <rect x="70" y="600" width="540" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="617" text-anchor="middle" class="note">K、Ca、Na三兄弟进盐溶液都这待遇——想碰盐？先跟水打过招</text>

  <!-- P3 菱形：蓝色暴雪 -->
  <polygon points="340,652 612,762 340,872 68,762" fill="#E7F1FB" class="bd"/>
  <text x="340" y="700" text-anchor="middle" font-size="13" font-weight="500" fill="#14538C">第3幕：蓝色暴雪预警</text>
  <!-- NaOH扔雪 -->
  <circle cx="205" cy="762" r="24" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/>
  <rect x="188" y="740" width="34" height="15" rx="7" fill="#534AB7"/>
  <text x="205" y="751" text-anchor="middle" font-size="9.5" fill="#FFFFFF">OH⁻</text>
  <circle cx="198" cy="766" r="2.2" fill="#2C2C2A"/>
  <circle cx="212" cy="766" r="2.2" fill="#2C2C2A"/>
  <path d="M199 774 Q205 770 211 774" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M232 748 Q258 728 284 726" fill="none" stroke="#534AB7" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aw)"/>
  <text x="150" y="716" font-size="11.5" fill="#534AB7">新生NaOH上岗</text>
  <!-- 暴雪 -->
  <circle cx="330" cy="742" r="4" fill="#7FB3E8"/>
  <circle cx="360" cy="730" r="3.5" fill="#7FB3E8"/>
  <circle cx="392" cy="748" r="4.5" fill="#7FB3E8"/>
  <circle cx="422" cy="732" r="3" fill="#7FB3E8"/>
  <circle cx="352" cy="762" r="5" fill="#7FB3E8"/>
  <circle cx="398" cy="768" r="3.5" fill="#7FB3E8"/>
  <circle cx="440" cy="756" r="4" fill="#7FB3E8"/>
  <!-- CuSO4 -->
  <circle cx="486" cy="742" r="24" fill="#B5D4F4" stroke="#0C447C" stroke-width="2"/>
  <circle cx="478" cy="738" r="2.2" fill="#0C447C"/>
  <circle cx="494" cy="738" r="2.2" fill="#0C447C"/>
  <ellipse cx="486" cy="748" rx="5" ry="3.5" fill="none" stroke="#0C447C" stroke-width="1.5"/>
  <text x="486" y="712" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0C447C">CuSO₄</text>
  <!-- 蓝色沉淀堆积 -->
  <path d="M250 838 Q280 816 320 834 Q350 816 390 834 Q420 814 450 836 Q430 852 350 852 Q270 852 250 838 Z" fill="#5B9BD5" stroke="#2E6DA4" stroke-width="1.5"/>
  <text x="350" y="845" text-anchor="middle" font-size="10.5" fill="#FFFFFF">Cu(OH)₂ 蓝色絮状沉淀</text>
  <rect x="70" y="888" width="540" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="905" text-anchor="middle" class="note">NaOH转身找CuSO₄算账：CuSO₄ + 2NaOH = Cu(OH)₂↓ + Na₂SO₄</text>

  <!-- P4 双圆对话：铜的懵圈 + 规则卡 -->
  <circle cx="205" cy="1030" r="108" fill="#FBE8D5" class="bd"/>
  <text x="205" y="962" text-anchor="middle" font-size="12.5" font-weight="500" fill="#712B13">铜的懵圈时间</text>
  <circle cx="205" cy="1016" r="24" fill="#C87533" stroke="#6E3D14" stroke-width="2"/>
  <path d="M190 1000 L193 990 L199 996 L205 988 L211 996 L217 990 L220 1000 Z" fill="#F7C948" stroke="#A8720A" stroke-width="1.5"/>
  <circle cx="198" cy="1013" r="2.2" fill="#4A2410"/>
  <circle cx="212" cy="1013" r="2.2" fill="#4A2410"/>
  <circle cx="203" cy="1022" r="3" fill="none" stroke="#4A2410" stroke-width="1.5"/>
  <text x="205" y="1064" text-anchor="middle" font-size="12">说好的抢王座呢？</text>
  <text x="205" y="1084" text-anchor="middle" font-size="12">我连出场费都没领！</text>
  <text x="120" y="978" font-size="14" fill="#888780">?</text>
  <text x="292" y="970" font-size="11" fill="#888780">?</text>
  <circle cx="478" cy="1020" r="112" fill="#E8F5E4" class="bd"/>
  <text x="478" y="952" text-anchor="middle" font-size="12.5" font-weight="500" fill="#2F5D46">现场规则卡</text>
  <text x="478" y="984" text-anchor="middle" font-size="12.5" font-weight="500" fill="#2F5D46">K、Ca、Na 进盐溶液：</text>
  <text x="478" y="1010" text-anchor="middle" font-size="12.5">① 先跟水打一套浮熔游响</text>
  <text x="478" y="1034" text-anchor="middle" font-size="12.5">② 生成碱再去找盐算账</text>
  <text x="478" y="1058" text-anchor="middle" font-size="12.5" fill="#2F7D5B">③ 金属铜？没有的事！</text>
  <text x="478" y="1090" text-anchor="middle" font-size="11" fill="#633806">想看红色铜析出？锌铁才够格</text>
  <rect x="70" y="1150" width="540" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="1167" text-anchor="middle" class="note">实验现象：钠浮熔游响 + 蓝色沉淀——就是没有红色的铜</text>

  <!-- P5 黑金结尾 -->
  <rect x="40" y="1196" width="600" height="210" rx="14" fill="#2C2C2A"/>
  <text x="340" y="1234" text-anchor="middle" font-size="15" style="fill:#e8d48f;" font-weight="600">钠 vs 硫酸铜溶液 · 终审：</text>
  <text x="340" y="1268" text-anchor="middle" font-size="14" style="fill:#F7C948;">2Na + 2H₂O = 2NaOH + H₂↑</text>
  <text x="340" y="1296" text-anchor="middle" font-size="14" style="fill:#F7C948;">CuSO₄ + 2NaOH = Cu(OH)₂↓ + Na₂SO₄</text>
  <text x="340" y="1332" text-anchor="middle" font-size="14" style="fill:#9ccb8c;" font-weight="500">口诀：先水后盐——想抢铜？先问过水保安！</text>
  <text x="340" y="1362" text-anchor="middle" font-size="12" style="fill:#B8B6AC;">蓝色沉淀不是铜 · 极活泼金属(K Ca Na)入盐溶液一律先打水</text>
  <text x="340" y="1390" text-anchor="middle" font-size="11" style="fill:#8A8880;">—— 铜王：谢谢水保安，保住我王位</text>
</svg>

<svg viewBox="0 0 680 1450" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>焰色灯光大赛</title>
  <desc>钠钾焰色试验的趣味条漫：钠黄抢镜，钾紫被淹没，蓝色钴玻璃是防抢镜墨镜</desc>
  <style>
    text { font-family: "PingFang SC","Microsoft YaHei",sans-serif; fill:#2C2C2A; }
    .bd { stroke:#2C2C2A; stroke-width:2; }
    .bub { fill:#FFFFFF; stroke:#2C2C2A; stroke-width:1.5; }
    .say { font-size:13px; }
    .note { font-size:12px; fill:#633806; }
    .ttl { font-size:18px; font-weight:500; }
  </style>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#712B13" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="cP1"><circle cx="340" cy="255" r="148"/></clipPath>
  </defs>

  <!-- 标题 -->
  <text x="340" y="46" text-anchor="middle" class="ttl" font-weight="600">焰色灯光大赛</text>
  <text x="340" y="72" text-anchor="middle" font-size="12" fill="#854F0B">钠黄抢镜 · 钾紫隐身 · 一副墨镜定乾坤</text>

  <!-- P1 圆形聚光：钠灯球开场 -->
  <text x="340" y="100" text-anchor="middle" font-size="13" font-weight="500">第1幕：元素灯光大赛 · 开灯！</text>
  <circle cx="340" cy="255" r="148" fill="#2C2C2A" class="bd"/>
  <g clip-path="url(#cP1)">
    <path d="M295 108 L385 108 L400 245 L280 245 Z" fill="#F7C948" opacity="0.3"/>
    <g stroke="#F7C948" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <path d="M340 205 L340 190"/><path d="M288 222 L276 212"/><path d="M392 222 L404 212"/>
      <path d="M270 260 L255 260"/><path d="M410 260 L425 260"/>
      <path d="M295 300 L283 310"/><path d="M385 300 L397 310"/>
    </g>
    <text x="248" y="150" font-size="11" style="fill:#B8B6AC;">全场灯灭——</text>
  </g>
  <circle cx="340" cy="252" r="36" fill="#F7C948" stroke="#A8720A" stroke-width="2.5"/>
  <circle cx="328" cy="245" r="3.2" fill="#5C3D00"/>
  <circle cx="352" cy="245" r="3.2" fill="#5C3D00"/>
  <path d="M326 262 Q340 272 354 262" fill="none" stroke="#5C3D00" stroke-width="2" stroke-linecap="round"/>
  <text x="340" y="215" text-anchor="middle" font-size="13" font-weight="600" style="fill:#F7C948;">Na</text>
  <text x="340" y="330" text-anchor="middle" font-size="14" style="fill:#e8d48f;" font-weight="500">看我金黄战衣！</text>
  <text x="340" y="352" text-anchor="middle" font-size="14" style="fill:#e8d48f;" font-weight="500">全场我最闪！！</text>
  <rect x="70" y="416" width="540" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="433" text-anchor="middle" class="note">焰色试验本质：电子跃迁发光——物理变化，没有新物质生成</text>

  <!-- P2 斜切平行四边形：钾被黄光淹没 -->
  <polygon points="70,478 610,463 592,642 86,658" fill="#EFE3FA" class="bd"/>
  <text x="100" y="500" font-size="13" font-weight="500" fill="#5D3A8E">第2幕：钾的紫光，消失在黄色海洋里</text>
  <!-- 黄光洪流 -->
  <ellipse cx="200" cy="575" rx="120" ry="52" fill="#F7C948" opacity="0.55"/>
  <ellipse cx="300" cy="595" rx="100" ry="40" fill="#F7C948" opacity="0.4"/>
  <ellipse cx="380" cy="575" rx="70" ry="30" fill="#F7C948" opacity="0.25"/>
  <circle cx="150" cy="565" r="26" fill="#F7C948" stroke="#A8720A" stroke-width="2"/>
  <circle cx="141" cy="559" r="2.6" fill="#5C3D00"/>
  <circle cx="159" cy="559" r="2.6" fill="#5C3D00"/>
  <path d="M140 573 Q150 579 160 573" fill="none" stroke="#5C3D00" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="72" y="608" width="185" height="38" rx="12" class="bub"/>
  <text x="84" y="624" class="say">哈哈哈哈！黄色海洋，</text>
  <text x="84" y="640" class="say">都是我的主场！</text>
  <!-- 钾怯生生 -->
  <circle cx="520" cy="570" r="30" fill="#8F6BC4" stroke="#4A2E73" stroke-width="2"/>
  <circle cx="510" cy="563" r="2.8" fill="#2E1B4E"/>
  <circle cx="530" cy="563" r="2.8" fill="#2E1B4E"/>
  <path d="M512 581 Q520 578 528 581" fill="none" stroke="#2E1B4E" stroke-width="1.6" stroke-linecap="round"/>
  <text x="520" y="536" text-anchor="middle" font-size="12" font-weight="600" fill="#4A2E73">K</text>
  <path d="M488 552 Q478 540 470 534 M552 552 Q562 540 570 534" stroke="#4A2E73" stroke-width="2" fill="none" stroke-linecap="round"/>
  <rect x="428" y="612" width="165" height="38" rx="12" class="bub"/>
  <text x="440" y="628" class="say">那个……我也有紫光，</text>
  <text x="440" y="644" class="say">你们看得见吗？</text>
  <rect x="70" y="670" width="540" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="687" text-anchor="middle" class="note">焰色口诀前置：钠黄钾紫。钠黄光太强，钾的紫光直接被淹没</text>

  <!-- P3 六边形：钴玻璃墨镜侠 -->
  <polygon points="190,810 265,705 415,705 490,810 415,915 265,915" fill="#CFE6F7" class="bd"/>
  <text x="340" y="738" text-anchor="middle" font-size="13" font-weight="500" fill="#14538C">第3幕：钴玻璃墨镜侠登场</text>
  <!-- 墨镜 -->
  <rect x="272" y="766" width="58" height="36" rx="11" fill="#1F6FB2" stroke="#0C3B63" stroke-width="2"/>
  <rect x="350" y="766" width="58" height="36" rx="11" fill="#1F6FB2" stroke="#0C3B63" stroke-width="2"/>
  <path d="M330 782 Q340 776 350 782" fill="none" stroke="#0C3B63" stroke-width="2.5"/>
  <path d="M272 778 L252 772 M408 778 L428 772" stroke="#0C3B63" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 左镜片：黄光被拦 -->
  <circle cx="301" cy="784" r="10" fill="#F7C948" opacity="0.85"/>
  <path d="M291 774 L311 794" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="301" y="822" text-anchor="middle" font-size="10" fill="#0C3B63">黄光？没收</text>
  <!-- 右镜片：紫光放行 -->
  <path d="M379 794 Q373 784 379 776 Q385 784 379 794 Z" fill="#8F6BC4"/>
  <path d="M386 796 Q382 788 386 782 Q390 788 386 796 Z" fill="#B79BE0"/>
  <text x="379" y="822" text-anchor="middle" font-size="10" fill="#0C3B63">紫光？请进</text>
  <text x="340" y="858" text-anchor="middle" font-size="14" fill="#14538C" font-weight="500">一副墨镜定乾坤：</text>
  <text x="340" y="882" text-anchor="middle" font-size="14" fill="#14538C" font-weight="500">滤掉黄光，紫光显形！</text>
  <rect x="70" y="932" width="540" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="949" text-anchor="middle" class="note">观察钾：必须隔着蓝色钴玻璃——专治钠黄光抢镜</text>

  <!-- P4 蜿蜒路径：铂丝先生四步仪式 -->
  <text x="340" y="995" text-anchor="middle" font-size="13" font-weight="500">第4幕：铂丝先生的四步仪式</text>
  <ellipse cx="340" cy="1090" rx="300" ry="80" fill="#FDF3D8" stroke="#C9A94E" stroke-width="1.5" stroke-dasharray="7 5"/>
  <path d="M120 1065 C 210 1015, 250 1160, 340 1090 S 470 1015, 555 1095" fill="none" stroke="#B33B2E" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aw)"/>
  <!-- 站1 盐酸洗浴 -->
  <circle cx="120" cy="1065" r="42" fill="#FFFFFF" class="bd"/>
  <rect x="104" y="1048" width="18" height="26" rx="4" fill="#8FC7EA" stroke="#2C2C2A" stroke-width="1.5"/>
  <path d="M126 1052 L138 1044" stroke="#2C2C2A" stroke-width="1.5"/>
  <text x="120" y="1094" text-anchor="middle" font-size="11" fill="#2F7D5B">①</text>
  <text x="120" y="1126" text-anchor="middle" font-size="11.5">盐酸洗浴</text>
  <!-- 站2 灼烧到无色 -->
  <circle cx="265" cy="1120" r="42" fill="#FFFFFF" class="bd"/>
  <path d="M265 1100 Q252 1116 258 1128 Q262 1136 265 1136 Q268 1136 272 1128 Q278 1116 265 1100 Z" fill="#EF9F27" stroke="#A85B0A" stroke-width="1.5"/>
  <path d="M265 1116 Q260 1123 263 1129 Q265 1132 267 1129 Q270 1123 265 1116 Z" fill="#F7C948"/>
  <text x="265" y="1156" text-anchor="middle" font-size="11" fill="#2F7D5B">②</text>
  <text x="265" y="1176" text-anchor="middle" font-size="11.5">烧到无色才算净</text>
  <!-- 站3 蘸样再烧 -->
  <circle cx="420" cy="1060" r="42" fill="#FFFFFF" class="bd"/>
  <path d="M414 1046 Q404 1058 408 1067 Q411 1073 414 1073 Q417 1073 420 1067 Q424 1058 414 1046 Z" fill="#EF9F27" stroke="#A85B0A" stroke-width="1.5"/>
  <circle cx="428" cy="1044" r="4" fill="#8F6BC4" stroke="#4A2E73" stroke-width="1"/>
  <text x="420" y="1096" text-anchor="middle" font-size="11" fill="#2F7D5B">③</text>
  <text x="420" y="1122" text-anchor="middle" font-size="11.5">蘸样品再烧</text>
  <!-- 站4 戴墨镜观察 -->
  <circle cx="555" cy="1098" r="42" fill="#FFFFFF" class="bd"/>
  <rect x="533" y="1082" width="18" height="12" rx="4" fill="#1F6FB2" stroke="#0C3B63" stroke-width="1.5"/>
  <rect x="559" y="1082" width="18" height="12" rx="4" fill="#1F6FB2" stroke="#0C3B63" stroke-width="1.5"/>
  <path d="M551 1087 L559 1087 M533 1086 L528 1083 M577 1086 L582 1083" stroke="#0C3B63" stroke-width="1.5"/>
  <path d="M548 1106 Q555 1110 562 1106" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="546" cy="1094" r="1.6" fill="#2C2C2A"/><circle cx="564" cy="1094" r="1.6" fill="#2C2C2A"/>
  <text x="555" y="1134" text-anchor="middle" font-size="11" fill="#2F7D5B">④</text>
  <text x="555" y="1160" text-anchor="middle" font-size="11.5">戴墨镜看钾</text>
  <rect x="70" y="1188" width="540" height="26" rx="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="1205" text-anchor="middle" class="note">洗丝必须用盐酸——硫酸盐难挥发，残留会"串色"假报幕</text>

  <!-- P5 黑金星爆结尾 -->
  <rect x="40" y="1230" width="600" height="196" rx="14" fill="#2C2C2A"/>
  <path d="M340 1248 L352 1281 L386 1281 L358 1301 L369 1334 L340 1314 L311 1334 L322 1301 L294 1281 L328 1281 Z" fill="none" stroke="#e8d48f" stroke-width="1.5" opacity="0.5"/>
  <text x="340" y="1272" text-anchor="middle" font-size="15" style="fill:#e8d48f;" font-weight="600">焰色试验 · 颁奖词：</text>
  <text x="340" y="1306" text-anchor="middle" font-size="14" style="fill:#F7C948;">Na → 金黄　　K → 紫色（隔蓝色钴玻璃看）</text>
  <text x="340" y="1342" text-anchor="middle" font-size="14" style="fill:#9ccb8c;" font-weight="500">口诀：钠黄钾紫——看钾，先给钠戴上防抢镜墨镜</text>
  <text x="340" y="1374" text-anchor="middle" font-size="12" style="fill:#B8B6AC;">盐酸洗丝 · 物理变化 · 最佳灯光师：铂丝先生</text>
  <text x="340" y="1404" text-anchor="middle" font-size="11" style="fill:#8A8880;">—— 钠：对不起，光芒这种事我收不住</text>
</svg>
